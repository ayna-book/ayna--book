<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AYNA BOOK — Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050505;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #111111;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.12);
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid #d4af37;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #f7c948;
      font-weight: 800;
      font-size: 22px;
      margin-bottom: 12px;
    }
    h1 {
      color: #f7c948;
      font-size: 22px;
      letter-spacing: 2px;
    }
    .subtitle {
      color: #9e9e9e;
      font-size: 13px;
      margin-top: 6px;
    }
    .field { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 13px;
      color: #cccccc;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #2c2c2c;
      background: #090909;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #d4af37; }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #d4af37, #f7c948);
      color: #050505;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-outline {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid #d4af37;
      background: transparent;
      color: #f7c948;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
    }
    .msg {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      color: #f7c948;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="badge">AB</div>
      <h1>AYNA BOOK</h1>
      <p class="subtitle">Secure Access Portal</p>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input id="email" type="email" placeholder="you@example.com" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" />
    </div>

    <button id="loginBtn" class="btn" type="button">Sign In</button>
    <button id="registerBtn" class="btn-outline" type="button">Create New Account</button>

    <p id="statusMsg" class="msg"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      getDatabase,
      ref,
      set,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "ayna-book.firebaseapp.com",
      databaseURL: "https://ayna-book-default-rtdb.firebaseio.com",
      projectId: "ayna-book",
      storageBucket: "ayna-book.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const emailEl = document.getElementById("email");
    const passEl = document.getElementById("password");
    const msgEl = document.getElementById("statusMsg");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.replace("home.html");
      }
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      msgEl.textContent = "Signing in...";
      try {
        await signInWithEmailAndPassword(auth, emailEl.value.trim(), passEl.value);
        window.location.replace("home.html");
      } catch (err) {
        msgEl.textContent = err.message;
      }
    });

    document.getElementById("registerBtn").addEventListener("click", async () => {
      msgEl.textContent = "Creating AYNA ID...";
      try {
        const cred = await createUserWithEmailAndPassword(
          auth,
          emailEl.value.trim(),
          passEl.value
        );
        const aynaId = "2026-----" + Math.floor(10000000 + Math.random() * 90000000);
        await set(ref(db, `users/${cred.user.uid}`), {
          email: cred.user.email,
          aynaId,
          createdAt: serverTimestamp()
        });
        window.location.replace("home.html");
      } catch (err) {
        msgEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
