
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AYNA MESSENGER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b49;color:white;font-family:Arial}
header{padding:18px;background:#142d5d;border-bottom:2px solid #ffd700}
h1{color:#ffd700;margin:0}
main{max-width:700px;margin:auto;padding:15px}
#messages{height:65vh;overflow-y:auto;background:#102653;border:1px solid #ffd700;border-radius:14px;padding:12px}
.msg{background:#203c70;border-radius:10px;padding:12px;margin:9px 0;overflow-wrap:anywhere}
.msg b{color:#ffd700}
.msg small{display:block;color:#cbd8ed;margin-top:5px}
form{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;padding:15px;border:0;border-radius:10px}
button{padding:14px;background:#ffd700;color:#071b49;border:0;border-radius:10px;font-weight:bold}
#status{color:#ffe58a}
a{color:#ffd700}
</style>
</head>
<body>
<header><h1>👁 AYNA MESSENGER</h1></header>
<main>
<p id="status">Firebase সংযোগ পরীক্ষা হচ্ছে...</p>
<div id="messages"></div>
<form id="sendForm">
<input id="messageInput" maxlength="1000" placeholder="আপনার মেসেজ লিখুন..." required>
<button type="submit">পাঠান</button>
</form>
<p><a href="index.html">← AYNA BOOK হোম</a></p>
</main>
<script type="module">
import{initializeApp,getApps}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
import{getDatabase,ref,push,onValue,query,limitToLast,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

const config={
 apiKey:"AIzaSyAIW4FK9Il2yct-tOSCKuSodso8KN2UsTA",
 authDomain:"ayna-book.firebaseapp.com",
 databaseURL:"https://ayna-book-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"ayna-book",
 storageBucket:"ayna-book.firebasestorage.app",
 messagingSenderId:"805601138500",
 appId:"1:805601138500:web:81a9adacbedbc5f3626911"
};
const app=getApps().length?getApps()[0]:initializeApp(config);
const auth=getAuth(app);
const db=getDatabase(app);
const chatRef=ref(db,"publicChat");
let user=null;

onAuthStateChanged(auth,u=>{
 user=u;
 status.textContent=u?"লগইন সফল — মেসেজ পাঠাতে পারবেন।":"আগে AYNA BOOK-এ লগইন করুন।";
});

onValue(query(chatRef,limitToLast(100)),snapshot=>{
 messages.replaceChildren();
 snapshot.forEach(child=>{
  const m=child.val();
  const box=document.createElement("div");
  box.className="msg";
  const sender=document.createElement("b");
  sender.textContent=m.name||"AYNA User";
  const body=document.createElement("div");
  body.textContent=m.text||"";
  const time=document.createElement("small");
  time.textContent=m.time||"";
  box.append(sender,body,time);
  messages.appendChild(box);
 });
 messages.scrollTop=messages.scrollHeight;
},error=>{
 status.textContent="মেসেজ লোড হয়নি: "+error.message;
});

sendForm.addEventListener("submit",async e=>{
 e.preventDefault();
 if(!user){status.textContent="মেসেজ পাঠাতে আগে লগইন করুন।";return}
 const text=messageInput.value.trim();
 if(!text)return;
 const button=sendForm.querySelector("button");
 button.disabled=true;
 try{
  await push(chatRef,{
   uid:user.uid,
   name:user.displayName||user.email||"AYNA User",
   text:text,
   time:new Date().toLocaleString("bn-BD"),
   createdAt:Date.now()
  });
  messageInput.value="";
  status.textContent="মেসেজ পাঠানো হয়েছে।";
 }catch(error){
  status.textContent="মেসেজ পাঠানো যায়নি: "+error.message;
 }finally{button.disabled=false}
});
</script>
</body>
</html>
