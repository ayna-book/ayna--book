
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b49">
  <title>AYNA BOOK Messenger</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    body { background:#071b49; color:white; }
    .chat-wrap { max-width:650px; margin:auto; padding:16px; }
    .chat-box { background:#102657; border-radius:18px; padding:16px; }
    .messages { min-height:250px; max-height:45vh; overflow:auto; }
    .bubble { background:#263d70; padding:12px; border-radius:14px;
      margin:10px 0; overflow-wrap:anywhere; }
    .mine { background:#8b5cf6; margin-left:12%; }
    .chat-input { width:100%; box-sizing:border-box; padding:13px;
      border-radius:12px; margin:7px 0; }
    .send { background:#ff4fa3; color:white; border:0;
      border-radius:12px; padding:13px 20px; font-weight:bold; }
    .note { color:#c6d5f7; font-size:13px; }
  </style>
</head>
<body>
  <main class="chat-wrap">
    <h1>🪞 AYNA BOOK</h1>
    <h2>💬 Messenger</h2>

    <div class="chat-box">
      <label for="contact">কথোপকথনের নাম</label>
      <select id="contact" class="chat-input">
        <option value="friend">বন্ধু</option>
        <option value="family">পরিবার</option>
        <option value="creator">ক্রিয়েটর</option>
      </select>

      <div id="messages" class="messages" aria-live="polite"></div>

      <form id="chatForm">
        <label for="message">আপনার মেসেজ</label>
        <textarea id="message" class="chat-input" rows="3"
          maxlength="2000" placeholder="এখানে লিখুন..."
          required></textarea>
        <button class="send" type="submit">➤ মেসেজ পাঠান</button>
      </form>

      <button id="translate" class="send" type="button"
        style="margin-top:12px;background:#00cfd5;color:#071b49;">
        🌐 অনুবাদ সহায়তা
      </button>
      <p id="translationResult" aria-live="polite"></p>
      <p class="note">
        এটি প্রাথমিক ডেমো। মেসেজ এই ব্রাউজারেই সংরক্ষিত হবে।
        অন্য ব্যক্তির কাছে পাঠাতে পরে সার্ভার যুক্ত করতে হবে।
      </p>
    </div>

    <p><a href="./index.html" style="color:#00cfd5;">← AYNA BOOK হোমে ফিরুন</a></p>
  </main>
  <script src="./chat.js"></script>
</body>
</html>
