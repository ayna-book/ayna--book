<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYNA MESSENGER - চ্যাট</title>
    <link rel="stylesheet" href="styles.css">[span_5](start_span)[span_5](end_span)
    <style>
        body { background: #090a0f; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { padding: 12px; background: #111; border-bottom: 2px solid #ffd700; text-align: center; color: #ffd700; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: rgba(255,215,0,0.1); border: 1px solid #b8860b; padding: 10px; border-radius: 8px; max-width: 75%; }
        .chat-input-area { display: flex; padding: 10px; background: #111; border-top: 1px solid #333; }
        input { flex: 1; padding: 10px; background: #222; border: 1px solid #ffd700; color: #fff; border-radius: 6px; }
        button { padding: 10px 20px; background: #ffd700; border: none; font-weight: bold; border-radius: 6px; margin-left: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <header><h3>AYNA MESSENGER</h3></header>
    <div id="chat-messages"></div>
    <div class="chat-input-area">
        <input type="text" id="msg-input" placeholder="আপনার মেসেজ লিখুন...">
        <button id="send-btn">পাঠান</button>
    </div>

    <script type="module">
        import { sendMessage, listenMessages } from './chat.js';

        const msgContainer = document.getElementById('chat-messages');

        // মেসেজ রেন্ডার করা
        listenMessages((msgs) => {
            msgContainer.innerHTML = '';
            msgs.forEach(m => {
                const div = document.createElement('div');
                div.className = 'msg';
                div.innerHTML = `<strong>${m.sender}:</strong> <p>${m.text}</p>`;
                msgContainer.appendChild(div);
            });
            msgContainer.scrollTop = msgContainer.scrollHeight;
        });

        // মেসেজ পাঠানো
        document.getElementById('send-btn').addEventListener('click', () => {
            const input = document.getElementById('msg-input');
            if (input.value.trim()) {
                sendMessage(input.value);
                input.value = '';
            }
        });
    </script>
</body>
</html>
