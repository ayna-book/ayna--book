<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b49">

  <title>AYNA BOOK Messenger</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071b49;
      color: white;
    }

    .header {
      padding: 20px 15px;
      text-align: center;
      background: linear-gradient(120deg, #ec4899, #7c3aed, #06b6d4);
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin-bottom: 0;
    }

    .chat-wrap {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      padding: 15px;
    }

    .card {
      background: #102657;
      border: 1px solid #344b7d;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 15px;
    }

    #status {
      font-size: 14px;
      color: #fbbf24;
    }

    #messages {
      height: 48vh;
      min-height: 280px;
      overflow-y: auto;
      padding: 10px;
      background: #081a3d;
      border-radius: 12px;
    }

    .bubble {
      max-width: 90%;
      padding: 11px 13px;
      margin: 10px 0;
      border-radius: 14px;
      overflow-wrap: anywhere;
      background: #263d70;
    }

    .mine {
      margin-left: auto;
      background: #8b5cf6;
    }

    .bubble p {
      margin: 0 0 7px;
      white-space: pre-wrap;
    }

    .bubble small {
      display: block;
      font-size: 11px;
      opacity: 0.8;
    }

    .chat-input {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #536b9a;
      background: #071b49;
      color: white;
      font-size: 16px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      min-width: 120px;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .send {
      background: #06b6d4;
      color: #071b49;
    }

    .translate {
      background: #f472b6;
      color: #071b49;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #notice {
      color: #c6d5f7;
      font-size: 13px;
      line-height: 1.6;
    }

    #translationResult {
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <header class="header">
    <h1>🪞 AYNA BOOK</h1>
    <p>Connect. Create. Share.</p>
    <strong>AYNA BOOK Messenger</strong>
  </header>

  <main class="chat-wrap">
    <section class="card">
      <h2>💬 অনলাইন মেসেজিং</h2>
      <p id="status">সংযোগ পরীক্ষা করা হচ্ছে...</p>
      <p>রুম: <strong>AYNA BOOK General Chat</strong></p>
    </section>

    <section class="card">
      <div id="messages" aria-live="polite">
        মেসেজ লোড হচ্ছে...
      </div>
    </section>

    <section class="card">
      <form id="chatForm">
        <label for="message">আপনার মেসেজ লিখুন:</label>

        <textarea
          id="message"
          class="chat-input"
          maxlength="2000"
          placeholder="বাংলা বা ইংরেজিতে লিখুন..."
          required
        ></textarea>

        <div class="buttons">
          <button
            id="sendButton"
            class="send"
            type="submit"
            disabled
          >
            ➤ মেসেজ পাঠান
          </button>

          <button
            id="translate"
            class="translate"
            type="button"
          >
            🌐 অনুবাদ
          </button>
        </div>
      </form>

      <p id="translationResult"></p>

      <p id="notice">
        আপনার নিরাপত্তার জন্য অপ্রয়োজনীয় ব্যক্তিগত তথ্য
        মেসেজে শেয়ার করবেন না।
      </p>
    </section>
  </main>

  <script type="module" src="./chat.js"></script>
</body>
</html>
