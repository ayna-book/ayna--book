<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b49">
  <meta name="description" content="AYNA BOOK Messenger">
  <title>AYNA BOOK Messenger</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071b49;
      color: #ffffff;
    }

    header {
      padding: 22px 12px;
      text-align: center;
      background: linear-gradient(
        120deg,
        #ec4899,
        #7c3aed,
        #06b6d4
      );
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin-bottom: 0;
    }

    main {
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: #102657;
      border: 1px solid #344b7d;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 15px;
    }

    #status {
      color: #fbbf24;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #messages {
      height: 45vh;
      min-height: 280px;
      overflow-y: auto;
      padding: 10px;
      background: #081a3d;
      border-radius: 12px;
    }

    .bubble {
      max-width: 90%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 14px;
      background: #263d70;
      overflow-wrap: anywhere;
    }

    .mine {
      margin-left: auto;
      background: #8b5cf6;
    }

    .bubble p {
      white-space: pre-wrap;
      margin: 7px 0;
    }

    .bubble small {
      display: block;
      font-size: 11px;
      opacity: 0.85;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      padding: 13px;
      border: 1px solid #536b9a;
      border-radius: 12px;
      background: #071b49;
      color: white;
      font-size: 16px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      flex: 1;
      min-width: 120px;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #sendButton {
      background: #06b6d4;
      color: #071b49;
    }

    #translate {
      background: #f472b6;
      color: #071b49;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #translationResult,
    .note {
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .note {
      color: #c6d5f7;
    }
  </style>
</head>

<body>
  <header>
    <h1>🪞 AYNA BOOK</h1>
    <p>Connect. Create. Share.</p>
    <strong>💬 AYNA BOOK Messenger</strong>
  </header>

  <main>
    <section class="card">
      <h2>অনলাইন মেসেজিং</h2>
      <p id="status">Firebase সংযোগ পরীক্ষা করা হচ্ছে...</p>
      <p>চ্যাট রুম: General Chat</p>
    </section>

    <section class="card">
      <h3>💬 মেসেজ</h3>
      <div id="messages" aria-live="polite">
        মেসেজ লোড হচ্ছে...
      </div>
    </section>

    <section class="card">
      <form id="chatForm">
        <label for="message">আপনার মেসেজ লিখুন:</label>

        <textarea
          id="message"
          maxlength="2000"
          placeholder="বাংলা বা ইংরেজিতে লিখুন..."
          required
        ></textarea>

        <div class="buttons">
          <button id="sendButton" type="submit" disabled>
            ➤ মেসেজ পাঠান
          </button>

          <button id="translate" type="button">
            🌐 অনুবাদ
          </button>
        </div>
      </form>

      <p id="translationResult"></p>

      <p class="note">
        এই সংস্করণে একই General Chat রুমের মেসেজ দেখা যাবে।
        ব্যক্তিগত পাসওয়ার্ড বা গোপন তথ্য শেয়ার করবেন না।
      </p>
    </section>
  </main>

  <script type="module" src="./chat.js"></script>
</body>
</html>
