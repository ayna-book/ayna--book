<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b49">
  <title>AYNA BOOK — 10,000-Year Quantum Audio & Video Messaging Hub</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #071b49;
      --accent-color: #00ffcc;
      --dark-bg: #020c24;
      --text-color: #ffffff;
      --neon-pink: #ff007f;
    }
    body {
      background-color: var(--dark-bg);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    .messaging-container {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .top-nav a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* চ্যাট উইন্ডো বক্স */
    .chat-box-wrapper {
      background: linear-gradient(145deg, var(--primary-color), var(--dark-bg));
      border: 2px solid var(--accent-color);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 0 35px rgba(0, 255, 204, 0.25);
    }
    .messages-area {
      height: 380px;
      background: #000;
      border: 1px solid rgba(0,255,204,0.3);
      border-radius: 12px;
      padding: 15px;
      overflow-y: auto;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg-bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg-incoming {
      background: rgba(7, 27, 73, 0.9);
      border: 1px solid rgba(0,255,204,0.4);
      align-self: flex-start;
      color: #fff;
    }
    .msg-outgoing {
      background: var(--accent-color);
      color: #000;
      align-self: flex-end;
      font-weight: 500;
    }

    /* কন্ট্রোল প্যানেল ও ইনপুট */
    .messaging-form {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .msg-input {
      flex: 1;
      padding: 14px;
      background: rgba(2, 12, 36, 0.9);
      border: 1px solid var(--accent-color);
      color: #fff;
      border-radius: 10px;
      font-size: 14px;
    }
    .msg-input:focus {
      outline: none;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
    }
    .action-btn {
      padding: 14px 20px;
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
    }
    .action-btn:hover {
      background: #00cca3;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.8);
    }
    .btn-media {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
    }
    .btn-media:hover {
      background: var(--accent-color);
      color: #000;
    }
    
    /* ভিডিও কল প্রিভিউ সেকশন */
    .video-call-box {
      margin-top: 25px;
      background: #000;
      border: 2px solid var(--neon-pink);
      border-radius: 16px;
      padding: 15px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .video-call-box video {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 10px;
    }
  </style>
</head>

<body>
<div class="messaging-container">

  <div class="top-nav">
    <h2><i class="fa-solid fa-comments" style="color: var(--accent-color);"></i> Quantum Audio & Video Messaging</h2>
    <a href="./index.html"><i class="fa-solid fa-arrow-left"></i> হোমে চলুন</a>
  </div>

  <div class="chat-box-wrapper">
    <!-- মেসেজ দেখার স্ক্রিন -->
    <div class="messages-area" id="chatHistory">
      <div class="msg-bubble msg-incoming">
        <strong>AYNA Quantum AI:</strong> স্বাগতম Sathiya! আপনার ১০,০০০ বছরের কোয়ান্টাম অডিও, ভিডিও এবং মেসেজিং হাব প্রস্তুত।
      </div>
    </div>

    <!-- ফাইল সিলেকশন ডিসপ্লে -->
    <div id="fileNotice" style="font-size: 12px; color: var(--accent-color); margin-bottom: 8px; display: none;"></div>

    <!-- মেসেজিং ফর্ম -->
    <form id="mediaChatForm" class="messaging-form">
      <input type="file" id="mediaFileInput" style="display: none;" multiple accept="image/*,video/*,audio/*,.zip,.pdf">
      
      <button type="button" class="action-btn btn-media" onclick="document.getElementById('mediaFileInput').click()" title="বড় ফাইল বা মিডিয়া সংযুক্ত করুন">
        <i class="fa-solid fa-paperclip"></i>
      </button>

      <button type="button" class="action-btn btn-media" id="recordVoiceBtn" title="ভয়েস মেসেজ রেকর্ড করুন">
        <i class="fa-solid fa-microphone"></i>
      </button>

      <input type="text" id="chatTextInput" class="msg-input" placeholder="কোয়ান্টাম মেসেজ লিখুন..." autocomplete="off" required>

      <button type="submit" class="action-btn">
        <i class="fa-solid fa-paper-plane"></i> পাঠান
      </button>
    </form>
  </div>

  <!-- লাইভ ভিডিও চ্যাট প্রিভিউ বক্স -->
  <div class="video-call-box">
    <h3 style="color: var(--neon-pink); margin-top: 0;"><i class="fa-solid fa-video"></i> ইনস্ট্যান্ট ভিডিও কল স্টুডিও</h3>
    <video id="liveStreamVideo" autoplay playsinline muted></video>
    <div style="margin-top: 15px;">
      <button class="action-btn" id="startVideoCallBtn" style="background: var(--neon-pink); color: #fff; margin: 0 auto;">
        <i class="fa-solid fa-camera"></i> ক্যামেরা অন করে ভিডিও কল শুরু করুন
      </button>
    </div>
  </div>

</div>

<script>
  // ফাইল সিলেক্ট নোটিফিকেশন
  const mediaFileInput = document.getElementById('mediaFileInput');
  const fileNotice = document.getElementById('fileNotice');

  if (mediaFileInput) {
    mediaFileInput.addEventListener('change', () => {
      if (mediaFileInput.files.length > 0) {
        fileNotice.style.display = 'block';
        fileNotice.textContent = `📎 ${mediaFileInput.files.length}টি ফাইল (অডিও/ভিডিও/ডকুমেন্ট) সংযুক্ত করা হয়েছে।`;
      }
    });
  }

  // মেসেজ সাবমিট হ্যান্ডলার
  const mediaChatForm = document.getElementById('mediaChatForm');
  const chatTextInput = document.getElementById('chatTextInput');
  const chatHistory = document.getElementById('chatHistory');

  if (mediaChatForm) {
    mediaChatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = chatTextInput.value.trim();
      if (!text && (!mediaFileInput || mediaFileInput.files.length === 0)) return;

      // ইউজারের মেসেজ যোগ করা
      const userMsgDiv = document.createElement('div');
      userMsgDiv.className = 'msg-bubble msg-outgoing';
      
      let attachmentText = "";
      if (mediaFileInput && mediaFileInput.files.length > 0) {
        attachmentText = `<br><span style="font-size: 12px; font-weight: bold;">[📁 ${mediaFileInput.files.length} Media File Sent at 100GB/s]</span>`;
      }

      userMsgDiv.innerHTML = `<strong>আপনি:</strong> ${text} ${attachmentText}`;
      chatHistory.appendChild(userMsgDiv);
      chatHistory.scrollTop = chatHistory.scrollHeight;

      // ইনপুট রিসেট
      chatTextInput.value = "";
      if (mediaFileInput) mediaFileInput.value = "";
      if (fileNotice) fileNotice.style.display = 'none';

      // অটো রিপ্লাই বা এআই রেসপন্স સિમ્યુલેશન
      setTimeout(() => {
        const aiMsgDiv = document.createElement('div');
        aiMsgDiv.className = 'msg-bubble msg-incoming';
        aiMsgDiv.innerHTML = `<strong>AYNA AI:</strong> আপনার বার্তা ও মিডিয়া ফাইল কোয়ান্টাম এনক্রিপশনে সফলভাবে আদান-প্রদান সম্পন্ন হয়েছে। ⚡`;
        chatHistory.appendChild(aiMsgDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;
      }, 1000);
    });
  }

  // ভয়েস রেকর্ডিং সিমুলেশন
  const recordVoiceBtn = document.getElementById('recordVoiceBtn');
  let isRecording = false;
  if (recordVoiceBtn) {
    recordVoiceBtn.addEventListener('click', () => {
      isRecording = !isRecording;
      if (isRecording) {
        recordVoiceBtn.style.background = "#ff4d4d";
        recordVoiceBtn.style.color = "#fff";
        alert("🎙️ ভয়েস রেকর্ডিং শুরু হয়েছে...");
      } else {
        recordVoiceBtn.style.background = "rgba(255, 255, 255, 0.1)";
        recordVoiceBtn.style.color = "var(--accent-color)";
        alert("🟢 ভয়েস মেসেজ সফলভাবে রেকর্ড ও এনক্রিপ্ট করা হয়েছে!");
      }
    });
  }

  // লাইভ ভিডিও কল ক্যামেরা অন
  const startVideoCallBtn = document.getElementById('startVideoCallBtn');
  const liveStreamVideo = document.getElementById('liveStreamVideo');

  if (startVideoCallBtn && liveStreamVideo) {
    startVideoCallBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        liveStreamVideo.srcObject = stream;
        startVideoCallBtn.textContent = "🟢 ভিডিও কল লাইভ ও একটিভ";
        startVideoCallBtn.style.background = "var(--accent-color)";
        startVideoCallBtn.style.color = "#000";
      } catch (err) {
        alert("ক্যামেরা পারমিশন পাওয়া যায়নি। ব্রাউজার সেটিংস চেক করুন।");
        console.error(err);
      }
    });
  }
</script>
</body>
</html>
