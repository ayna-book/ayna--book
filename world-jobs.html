<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#050a18">

<title>AYNA BOOK — World Jobs & Careers</title>

<style>
:root{
  --bg:#050a18;
  --navy:#081633;
  --navy2:#102657;
  --gold:#ffd700;
  --gold2:#d4af37;
  --white:#fff;
  --muted:#c8d1e8;
  --cyan:#00e5ff;
  --green:#25d366;
  --red:#ff5b5b;
  --card:#0b1734;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  min-height:100%;
  background:var(--bg);
  color:var(--white);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Bengali",
    "Noto Sans",
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 50% 0%,
      #18377c 0%,
      #0a1633 35%,
      #050a18 78%
    );
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  padding:14px;
  background:
    linear-gradient(
      180deg,
      #18377c,
      #09152f
    );
  border-bottom:2px solid var(--gold2);
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}

.header-row{
  max-width:1250px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.brand{
  font-size:clamp(24px,5vw,40px);
  font-weight:950;
}

.brand span{
  color:var(--gold);
}

.header-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.top-btn{
  min-height:54px;
  padding:10px 16px;
  border:2px solid var(--gold);
  border-radius:14px;
  background:#071126;
  color:#fff;
  font-size:clamp(17px,4vw,24px);
  font-weight:900;
}

/* MAIN */

main{
  width:100%;
  max-width:1250px;
  margin:auto;
  padding:20px 14px 50px;
}

.hero{
  text-align:center;
  padding:18px 8px 25px;
}

.hero h1{
  color:var(--gold);
  font-size:clamp(32px,8vw,62px);
  line-height:1.1;
  font-weight:950;
}

.hero p{
  margin-top:12px;
  color:var(--muted);
  font-size:clamp(18px,4vw,28px);
  line-height:1.5;
}

/* SEARCH */

.search-panel{
  padding:20px;
  border:2px solid var(--gold2);
  border-radius:24px;
  background:
    linear-gradient(
      145deg,
      rgba(17,43,94,.95),
      rgba(5,12,29,.98)
    );
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}

.search-title{
  color:var(--cyan);
  font-size:clamp(25px,5vw,38px);
  font-weight:950;
  margin-bottom:15px;
}

.search-grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:14px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.field label{
  font-size:clamp(18px,4vw,25px);
  font-weight:850;
}

input,
select{
  width:100%;
  min-height:62px;
  padding:12px 15px;
  border:2px solid #456092;
  border-radius:14px;
  outline:none;
  background:#050d20;
  color:#fff;
  font-size:clamp(18px,4vw,25px);
}

input:focus,
select:focus{
  border-color:var(--gold);
}

.search-btn{
  width:100%;
  min-height:68px;
  margin-top:15px;
  border:2px solid var(--gold);
  border-radius:16px;
  background:
    linear-gradient(
      145deg,
      #d4af37,
      #8c6d10
    );
  color:#050a18;
  font-size:clamp(21px,5vw,30px);
  font-weight:950;
}

/* QUICK CATEGORIES */

.section{
  margin-top:25px;
}

.section-title{
  margin-bottom:14px;
  color:var(--gold);
  font-size:clamp(26px,5vw,40px);
  font-weight:950;
}

.category-grid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:14px;
}

.category{
  min-height:125px;
  padding:18px 10px;
  border:2px solid #304b80;
  border-radius:20px;
  background:
    linear-gradient(
      145deg,
      #112b5f,
      #071126
    );
  color:#fff;
  font-size:clamp(18px,4vw,25px);
  font-weight:900;
  line-height:1.25;
}

.category span{
  display:block;
  font-size:42px;
  margin-bottom:8px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:14px;
  margin-top:25px;
}

.stat{
  padding:20px;
  text-align:center;
  border:2px solid #304b80;
  border-radius:20px;
  background:#071126;
}

.stat strong{
  display:block;
  color:var(--gold);
  font-size:clamp(30px,6vw,48px);
  font-weight:950;
}

.stat span{
  display:block;
  margin-top:6px;
  color:var(--muted);
  font-size:clamp(16px,3.5vw,22px);
  font-weight:700;
}

/* JOB RESULTS */

.results{
  margin-top:25px;
}

.result-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.result-count{
  color:var(--cyan);
  font-size:clamp(18px,4vw,26px);
  font-weight:850;
}

.jobs{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:16px;
}

.job-card{
  padding:20px;
  border:2px solid #304b80;
  border-radius:22px;
  background:
    linear-gradient(
      145deg,
      #0d2046,
      #071126
    );
  box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.job-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.job-title{
  color:#fff;
  font-size:clamp(22px,4.5vw,31px);
  font-weight:950;
  line-height:1.25;
}

.job-type{
  flex:0 0 auto;
  padding:7px 10px;
  border:1px solid var(--green);
  border-radius:10px;
  color:#8dffb0;
  font-size:15px;
  font-weight:800;
}

.company{
  margin-top:10px;
  color:var(--gold);
  font-size:clamp(18px,4vw,24px);
  font-weight:850;
}

.job-info{
  margin-top:12px;
  display:grid;
  gap:8px;
}

.job-info div{
  color:#d9e2f5;
  font-size:clamp(17px,3.7vw,22px);
  line-height:1.4;
}

.job-description{
  margin-top:13px;
  color:var(--muted);
  font-size:clamp(16px,3.5vw,20px);
  line-height:1.5;
}

.job-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}

.job-btn{
  min-height:58px;
  border:2px solid var(--gold2);
  border-radius:13px;
  background:#091630;
  color:#fff;
  font-size:clamp(17px,3.5vw,22px);
  font-weight:900;
}

.job-btn.apply{
  background:#173f32;
  border-color:var(--green);
  color:#a4ffc0;
}

/* AI */

.ai-box{
  margin-top:25px;
  padding:20px;
  border:2px solid var(--cyan);
  border-radius:22px;
  background:
    linear-gradient(
      145deg,
      #071a34,
      #071126
    );
}

.ai-title{
  color:var(--cyan);
  font-size:clamp(25px,5vw,38px);
  font-weight:950;
}

.ai-text{
  margin-top:10px;
  color:#dce7ff;
  font-size:clamp(17px,4vw,24px);
  line-height:1.55;
}

/* NOTICE */

.notice{
  margin-top:25px;
  padding:20px;
  border:2px solid #304b80;
  border-radius:22px;
  background:#071126;
}

.notice h2{
  color:var(--gold);
  font-size:clamp(24px,5vw
