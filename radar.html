<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AYNA BOOK ★ Civil & Weather Radar</title>
  <style>
    :root {
      --navy-dark: #050a18;
      --navy-mid: #10214a;
      --gold: #ffe64d;
      --gold-soft: #fff6b3;
      --cyan: #38f2ff;
      --alert: #ff4d6d;
      --text: #eef6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, var(--navy-mid), var(--navy-dark) 72%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    .topbar {
      max-width: 1120px;
      margin: 0 auto 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(10, 20, 48, 0.85);
      border: 1px solid rgba(255, 230, 77, 0.35);
      border-radius: 14px;
      padding: 12px 18px;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 0.6px;
    }

    .nav-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      background: linear-gradient(135deg, #1b3b7c, #0b1938);
      color: var(--gold-soft);
      border: 1px solid rgba(255, 230, 77, 0.45);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .btn.alert-btn {
      border-color: rgba(255, 77, 109, 0.65);
      color: #ff9eb0;
    }

    .grid-layout {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(300px, 560px) 1fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: rgba(8, 17, 40, 0.88);
      border: 1px solid rgba(56, 242, 255, 0.25);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .panel-title {
      color: var(--gold);
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 520px;
      margin: 0 auto;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255, 230, 77, 0.55);
      box-shadow: 0 0 28px rgba(56, 242, 255, 0.18);
      background: #040914;
    }

    canvas#aynaRadarCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .telemetry-bar {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      font-size: 0.85rem;
    }

    .stat-box {
      background: rgba(15, 31, 68, 0.75);
      border: 1px solid rgba(255, 230, 77, 0.2);
      border-radius: 10px;
      padding: 10px;
    }

    .stat-label {
      color: #9ec5e8;
      font-size: 0.76rem;
    }

    .stat-val {
      color: var(--cyan);
      font-weight: 800;
      font-size: 0.98rem;
      margin-top: 3px;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .advisory-box {
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid rgba(56, 242, 255, 0.35);
      background: rgba(18, 42, 82, 0.55);
      line-height: 1.5;
      font-size: 0.92rem;
    }

    .advisory-box.moderate {
      border-color: rgba(255, 230, 77, 0.7);
      background: rgba(82, 66, 12, 0.45);
      color: var(--gold-soft);
    }

    .advisory-box.high {
      border-color: rgba(255, 77, 109, 0.85);
      background: rgba(95, 18, 36, 0.55);
      color: #ffd6de;
    }

    .target-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
    }

    .target-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(14, 29, 64, 0.8);
      border: 1px solid rgba(56, 242, 255, 0.18);
      font-size: 0.88rem;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      background: rgba(56, 242, 255, 0.16);
      color: var(--cyan);
    }

    .badge.close {
      background: rgba(255, 77, 109, 0.25);
      color: #ff8ca1;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">AYNA BOOK ★ বেসামরিক ও আবহাওয়া রাডার</div>
    <nav class="nav-links">
      <a class="btn" href="ayna-book-complete-hub.html">হোম হাব</a>
      <a class="btn" href="profile.html">প্রোফাইল</a>
      <button class="btn" id="btnVoiceAdvisory">ভয়েস রিপোর্ট</button>
    </nav>
  </header>

  <main class="grid-layout">
    <section class="panel">
      <div class="panel-title">
        <span>লাইভ রাডার ও কম্পাস স্ক্যান (840×840)</span>
        <span id="radarStatusBadge" class="badge">ACTIVE</span>
      </div>

      <div class="canvas-wrap">
        <canvas id="aynaRadarCanvas" width="840" height="840"></canvas>
      </div>

      <div class="telemetry-bar">
        <div class="stat-box">
          <div class="stat-label">স্থানাঙ্ক (Lat / Lon)</div>
          <div class="stat-val" id="coordReadout">23.8103, 90.4125</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">আবহাওয়া ও বাতাস</div>
          <div class="stat-val" id="weatherReadout">28°C • 14 km/h</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">টার্গেট সংখ্যা</div>
          <div class="stat-val" id="targetCountReadout">0 Targets</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">
        <span>আবহাওয়া সতর্কতা ও বেসামরিক পয়েন্ট</span>
      </div>

      <div class="controls-row">
        <button class="btn" id="btnWeatherClear">স্বাভাবিক আবহাওয়া</button>
        <button class="btn" id="btnWeatherRain">বৃষ্টি / আর্দ্রতা</button>
        <button class="btn alert-btn" id="btnWeatherStorm">ঝড় / সতর্কতা</button>
        <button class="btn" id="btnGpsSync">GPS সিঙ্ক</button>
      </div>

      <div id="advisoryBox" class="advisory-box">
        আবহাওয়া তথ্য লোড হচ্ছে...
      </div>

      <div class="panel-title" style="margin-top: 8px;">
        <span>নিকটবর্তী বেসামরিক পয়েন্টসমূহ</span>
      </div>
      <div id="targetList" class="target-list"></div>
    </section>
  </main>

  <!-- কোর ও অ্যাডভান্সড মডিউলসমূহ -->
  <script src="uhd-sounds-engine.js"></script>
  <script src="speed-booster-engine.js"></script>
  <script src="gps-ai-module.js"></script>
  <script src="realtime-sync-bus.js"></script>
  <script src="civil-weather-radar.js"></script>
  <script src="radar-overlay-renderer.js"></script>

  <script>
    (function initAynaRadarPage() {
      const canvas = document.getElementById("aynaRadarCanvas");
      const ctx = canvas.getContext("2d");
      const sound = window.aynaSound || window.uhdSoundsEngine;
      const radarEngine = window.aynaCivilWeather;
      const overlay = window.aynaRadarOverlay;
      const speed = window.aynaSpeed;

      let originLat = 23.8103;
      let originLon = 90.4125;
      let sweepDeg = 0;

      const sampleCivilPoints = [
        { id: "HUB-01", name: "Dhaka Central Hub", category: "checkpoint", lat: 23.8103, lon: 90.4125, speedKmh: 0 },
        { id: "TRN-02", name: "Uttara Transit Node", category: "transit", lat: 23.8759, lon: 90.3795, speedKmh: 38 },
        { id: "RIV-03", name: "Sadarghat Ferry Lane", category: "vessel", lat: 23.7081, lon: 90.4094, speedKmh: 22 },
        { id: "WTH-04", name: "Purbachal Relay Station", category: "weather-station", lat: 23.8350, lon: 90.4950, speedKmh: 0 }
      ];

      function refreshRadarData() {
        if (!radarEngine) return;
        const targets = radarEngine.setCivilTargets(originLat, originLon, sampleCivilPoints);
        const { weather, advisory } = radarEngine.updateWeather({});

        document.getElementById("coordReadout").textContent =
          `${originLat.toFixed(4)}, ${originLon.toFixed(4)}`;
        document.getElementById("weatherReadout").textContent =
          `${weather.temperatureC}°C • ${weather.windSpeedKmh} km/h`;
        document.getElementById("targetCountReadout").textContent =
          `${targets.length} Nodes`;

        const box = document.getElementById("advisoryBox");
        box.className = `advisory-box ${advisory.level}`;
        box.textContent = advisory.summaryBn;

        const listEl = document.getElementById("targetList");
        listEl.innerHTML = targets
          .map(
            t => `
          <div class="target-item">
            <div>
              <strong>${t.name}</strong>
              <div style="font-size:0.78rem;color:#9ec5e8;">
                দূরত্ব: ${t.distanceKm} কিমি • বিয়ারিং: ${t.bearingDeg}°
              </div>
            </div>
            <span class="badge ${t.proximityAlert === "close" ? "close" : ""}">
              ${t.proximityAlert === "close" ? "NEAR" : t.category.toUpperCase()}
            </span>
          </div>
        `
          )
          .join("");
      }

      function drawBaseRadar() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const maxR = Math.min(cx, cy) * 0.86;

        ctx.clearRect(0, 0, w, h);

        // ব্যাকগ্রাউন্ড ডিস্ক
        const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, maxR);
        grad.addColorStop(0, "rgba(18, 46, 94, 0.65)");
        grad.addColorStop(1, "rgba(5, 11, 26, 0.95)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
        ctx.fill();

        // রেঞ্জ সার্কেলসমূহ
        [0.25, 0.5, 0.75, 1].forEach(ratio => {
          ctx.strokeStyle = "rgba(56, 242, 255, 0.22)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(cx, cy, maxR * ratio, 0, Math.PI * 2);
          ctx.stroke();
        });

        // ক্রস অ্যাক্সিস
        ctx.strokeStyle = "rgba(255, 230, 77, 0.2)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx - maxR, cy);
        ctx.lineTo(cx + maxR, cy);
        ctx.moveTo(cx, cy - maxR);
        ctx.lineTo(cx, cy + maxR);
        ctx.stroke();

        // রোটেশনাল সুইপ রশ্মি
        const rad = (sweepDeg - 90) * (Math.PI / 180);
        const sx = cx + Math.cos(rad) * maxR;
        const sy = cy + Math.sin(rad) * maxR;

        ctx.strokeStyle = "#ffe64d";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(sx, sy);
        ctx.stroke();

        // বেসামরিক ও আবহাওয়া ওভারলে
        if (overlay) {
          overlay.draw(ctx, w, h, sweepDeg);
        }

        // কেন্দ্রের পয়েন্ট
        ctx.fillStyle = "#ffe64d";
        ctx.beginPath();
        ctx.arc(cx, cy, 7, 0, Math.PI * 2);
        ctx.fill();
      }

      function loop(now) {
        const canDraw = speed ? speed.shouldRenderFrame(now) : true;
        if (canDraw) {
          sweepDeg = (sweepDeg + 2.2) % 360;
          drawBaseRadar();
        }
        requestAnimationFrame(loop);
      }

      document.getElementById("btnWeatherClear").addEventListener("click", () => {
        radarEngine?.updateWeather({
          conditionCode: "clear",
          temperatureC: 28,
          humidityPct: 62,
          windSpeedKmh: 12,
          visibilityKm: 10
        });
        sound?.playTone?.("confirm");
        refreshRadarData();
      });

      document.getElementById("btnWeatherRain").addEventListener("click", () => {
        radarEngine?.updateWeather({
          conditionCode: "rain",
          temperatureC: 24,
          humidityPct: 91,
          windSpeedKmh: 24,
          visibilityKm: 4.5
        });
        sound?.playTone?.("alert");
        refreshRadarData();
      });

      document.getElementById("btnWeatherStorm").addEventListener("click", () => {
        radarEngine?.updateWeather({
          conditionCode: "storm",
          temperatureC: 22,
          humidityPct: 95,
          windSpeedKmh: 52,
          visibilityKm: 1.2
        });
        sound?.playTone?.("alert");
        refreshRadarData();
      });

      document.getElementById("btnGpsSync").addEventListener("click", () => {
        if (!navigator.geolocation) {
          sound?.speak?.("এই ডিভাইসে GPS সমর্থন পাওয়া যায়নি।");
          return;
        }
        navigator.geolocation.getCurrentPosition(
          pos => {
            originLat = pos.coords.latitude;
            originLon = pos.coords.longitude;
            sound?.playTone?.("confirm");
            refreshRadarData();
          },
          () => {
            sound?.speak?.("GPS অবস্থান পাওয়া যায়নি। ফলব্যাক স্থানাঙ্ক সক্রিয় আছে।");
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      });

      document.getElementById("btnVoiceAdvisory").addEventListener("click", () => {
        const adv = radarEngine?.getWeatherAdvisory();
        if (adv && sound?.speak) {
          sound.speak(adv.summaryBn);
        }
      });

      refreshRadarData();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
