
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020b08">
<title>AYNA BOOK Radar</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#020b08;color:#00ff99;font-family:Arial,sans-serif}
header{padding:18px;text-align:center;background:#061b13}
h2{margin:0;color:#00ff99}
main{height:calc(100dvh - 65px);display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:12px}
.radar{width:min(88vw,55vh);aspect-ratio:1;border:2px solid #00ff99;border-radius:50%;position:relative;overflow:hidden;background:repeating-radial-gradient(circle,transparent 0 18%,#0b5138 19% 19.5%,transparent 20% 25%),linear-gradient(90deg,transparent 49.7%,#176c48 50%,transparent 50.3%),linear-gradient(transparent 49.7%,#176c48 50%,transparent 50.3%)}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,#00ff9955 45deg,transparent 75deg);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center{position:absolute;left:50%;top:50%;width:9px;height:9px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
.info{text-align:center;line-height:1.8}
button{background:#00bb70;color:#001b10;border:0;border-radius:8px;padding:13px 24px;font-weight:bold}
</style>
</head>
<body>
<header><h2>AYNA BOOK RADAR</h2></header>
<main>
<div class="radar"><div class="sweep"></div><div class="center"></div></div>
<div class="info">
<div id="status">RADAR READY</div>
<div id="gps">GPS: অপেক্ষমাণ</div>
<div>MODE: VISUAL RADAR</div>
</div>
<button onclick="startGPS()">GPS চালু করুন</button>
</main>
<script>
function startGPS(){
if(!navigator.geolocation){gps.textContent="GPS সমর্থিত নয়";return}
status.textContent="GPS CONNECTING...";
navigator.geolocation.watchPosition(p=>{
gps.textContent="LAT: "+p.coords.latitude.toFixed(5)+" | LNG: "+p.coords.longitude.toFixed(5);
status.textContent="GPS CONNECTED";
},e=>status.textContent="GPS ERROR: "+e.message,
{enableHighAccuracy:true,maximumAge:5000});
}
</script>
</body>
</html>
