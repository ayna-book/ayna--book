
<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0A0F1E"
  >

  <title>AYNA BOOK — Login Activity</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #0A0F1E;
      color: #FFFFFF;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      color: #FFD700;
    }

    .card {
      background: #1A2233;
      border: 1px solid #303B50;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .activity {
      border-bottom: 1px solid #303B50;
      padding: 15px 0;
    }

    .activity:last-child {
      border-bottom: none;
    }

    .activity h3 {
      color: #FFD700;
      margin: 0 0 10px;
    }

    .activity p {
      color: #A9B0BC;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #statusMessage {
      color: #A9B0BC;
      text-align: center;
      line-height: 1.7;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #FFD700;
      color: #0A0F1E;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    a {
      display: block;
      color: #FFD700;
      text-align: center;
      text-decoration: none;
      margin-top: 20px;
    }
  </style>

</head>

<body>

  <main class="container">

    <header>
      <h1>AYNA BOOK</h1>
      <h2>Login Activity</h2>

      <p>
        আপনার অ্যাকাউন্টের Login Activity দেখুন।
      </p>
    </header>


    <section class="card">

      <h3>Recent Account Activity</h3>

      <p id="statusMessage">
        Activity Load হচ্ছে...
      </p>

      <div id="activityList"></div>

      <button
        type="button"
        id="refreshButton"
      >
        Refresh Activity
      </button>

    </section>


    <a href="./account-security.html">
      Back to Account Security
    </a>

    <a href="./profile.html">
      Back to Profile
    </a>

  </main>


  <script
    type="module"
    src="./login-activity-dashboard.js"
  ></script>

</body>

</html>
