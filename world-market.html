<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060d21">
<title>AYNA BOOK — দৈনিক বিশ্ব বাজার মূল্যতালিকা</title>

<style>
:root {
  --bg: #050a18;
  --navy-top: #172e63;
  --navy-bottom: #08122b;
  --gold: #ffd700;
  --gold-base: #755206;
  --white: #ffffff;
  --muted: #dce6fa;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: Arial, "Noto Sans Bengali", sans-serif;
  font-size: 20px;
  padding-bottom: 80px;
}

.gold-3d {
  background: linear-gradient(155deg, var(--navy-top) 0%, var(--navy-bottom) 100%);
  border: 2.5px solid var(--gold);
  border-radius: 6px;
  box-shadow:
    0 7px 0 var(--gold-base),
    0 12px 22px rgba(0, 0, 0, 0.8),
    inset 0 2px 3px rgba(255, 242, 166, 0.5);
}

header {
  background: linear-gradient(180deg, #0f1f47 0%, #060d21 100%);
  border-bottom: 2.5px solid var(--gold);
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 50;
}

.brand {
  color: var(--gold);
  font-size: 24px;
  font-weight: 1000;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.star-1s {
  color: #ffffff;
  font-size: 26px;
  display: inline-block;
  animation: starFlash1s 1s infinite alternate ease-in-out;
}

@keyframes starFlash1s {
  0% { transform: scale(0.95); text-shadow: 0 0 6px #ffd700; }
  100% { transform: scale(1.35); text-shadow: 0 0 14px #ffffff, 0 0 32px #ffd700; }
}

.back-btn {
  text-decoration: none;
  background: linear-gradient(180deg, #ffd700 0%, #c99314 100%);
  color: #050a18;
  font-weight: 1000;
  font-size: 17px;
  padding: 8px 14px;
  border-radius: 6px;
  border: 1.5px solid #fff2a6;
  box-shadow: 0 4px 0 #664604;
}

.container {
  max-width: 1050px;
  margin: 18px auto;
  padding: 0 14px;
}

.page-title {
  font-size: 28px;
  font-weight: 1000;
  color: var(--gold);
  margin-bottom: 16px;
}

.box-pad {
  padding: 18px;
  margin-bottom: 20px;
}

.box-pad h2 {
  color: var(--gold);
  font-size: 23px;
  margin-bottom: 12px;
}

.auto-status-box {
  background: #050b1c;
  border: 1.5px solid var(--gold);
  border-radius: 6px;
  padding: 12px;
  color: var(--gold);
  font-size: 17px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 14px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(1, minmax(0, 1fr));
  gap: 12px;
}

@media(min-width: 650px) {
  .grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

input, select, textarea {
  width: 100%;
  background: #050b1c;
  color: var(--white);
  border: 2px solid var(--gold);
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 19px;
  margin-bottom: 12px;
}

.btn-gold-3d {
  width: 100%;
  min-height: 56px;
  background: linear-gradient(180deg, #ffd700 0%, #c99314 100%);
  color: #050a18;
  font-size: 21px;
  font-weight: 1000;
  border: 2px solid #fff2a6;
  border-radius: 6px;
  box-shadow: 0 5px 0 #664604;
  cursor: pointer;
}

.btn-gold-3d:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #664604;
}

.market-grid {
  display: grid;
  grid-template-columns: repeat(1, minmax(0, 1fr));
  gap: 16px;
}

@media(min-width: 720px) {
  .market-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.market-card {
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
}

.market-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.market-badge {
  background: #050b1c;
  color: var(--gold);
  border: 1.5px solid var(--gold);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 15px;
  font-weight: bold;
}

.market-trend {
  background: #050b1c;
  color: var(--white);
  border: 1px solid rgba(255, 215, 0, 0.6);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 14px;
  font-weight: bold;
}

.market-name {
  font-size: 23px;
  font-weight: 1000;
  color: var(--white);
  margin-bottom: 6px;
}

.market-region {
  font-size: 16px;
  color: var(--muted);
  margin-bottom: 10px;
}

.market-price-box {
  background: #050b1c;
  border: 1.5px solid var(--gold);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 23px;
  font-weight: 1000;
  color: var(--gold);
  margin-bottom: 8px;
}

.market-note {
  font-size: 17px;
  line-height: 1.5;
  color: var(--muted);
}

.market-footer {
  border-top: 1px solid rgba(255, 215, 0, 0.35);
  padding-top: 10px;
  font-size: 15px;
  color: var(--muted);
}

#notice {
  position: fixed;
  top: 76px;
  left: 50%;
  transform: translateX(-50%);
  background: #0a1636;
  color: #ffffff;
  border: 2px solid var(--gold);
  padding: 12px 18px;
  border-radius: 6px;
  z-index: 100;
  display: none;
  font-size: 18px;
  text-align: center;
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="brand">AYNA BOOK <span class="star-1s">★</span></a>
  <a href="index.html" class="back-btn">🏠 হোম</a>
</header>

<div id="notice"></div>

<main class="container">
  <h1 class="page-title">🌍 দৈনিক বিশ্ব বাজার মূল্যতালিকা</h1>

  <!-- অটো আপডেট স্ট্যাটাস, মুদ্রা, বিভাগ ও সার্চ -->
  <section class="gold-3d box-pad">
    <div id="worldMarketStatus" class="auto-status-box">
      🔄 দৈনিক বিশ্ব বাজার মূল্যতালিকা লোড হচ্ছে...
    </div>

    <div class="grid-2">
      <select id="marketCurrencySelect">
        <option value="BDT">🇧🇩 বাংলাদেশ (টাকা ৳)</option>
        <option value="USD">🇺🇸 যুক্তরাষ্ট্র (ডলার USD)</option>
        <option value="SAR">🇸🇦 সৌদি আরব (রিয়াল SAR)</option>
        <option value="AED">🇦🇪 সংযুক্ত আরব আমিরাত (দিরহাম AED)</option>
        <option value="GBP">🇬🇧 যুক্তরাজ্য (পাউন্ড £)</option>
        <option value="INR">🇮🇳 ভারত (রুপি ₹)</option>
      </select>

      <select id="marketCategoryFilter">
        <option value="ALL">🌐 সব বাজার বিভাগ</option>
        <option value="জ্বালানি ও ধাতু">জ্বালানি ও ধাতু</option>
        <option value="শস্য ও কৃষি পণ্য">শস্য ও কৃষি পণ্য</option>
        <option value="নিত্যপ্রয়োজনীয় মুদি ও খাদ্য">নিত্যপ্রয়োজনীয় মুদি ও খাদ্য</option>
        <option value="পোলোট্রি ও প্রাণিসম্পদ">পোলোট্রি ও প্রাণিসম্পদ</option>
        <option value="নির্মাণ ও শিল্প উপকরণ">নির্মাণ ও শিল্প উপকরণ</option>
      </select>
    </div>

    <div class="grid-2">
      <input id="marketRegionFilter" type="text" placeholder="দেশ বা অঞ্চল (যেমন: বিশ্ববাজার, বাংলাদেশ, সৌদি আরব)...">
      <input id="marketSearchInput" type="text" placeholder="পণ্যের নাম, বিভাগ বা তথ্য খুঁজুন...">
    </div>

    <button id="refreshWorldMarketBtn" type="button" class="btn-gold-3d">
      🔄 আজকের বিশ্ব বাজার মূল্যতালিকা অটো আপডেট করুন
    </button>
  </section>

  <!-- নতুন দৈনিক বাজার দর যুক্ত বা আপডেট করার ফর্ম -->
  <section class="gold-3d box-pad">
    <h2>➕ দৈনিক বিশ্ব বাজারে নতুন দর যুক্ত বা আপডেট করুন</h2>
    <div class="grid-2">
      <select id="newMarketCategory">
        <option value="জ্বালানি ও ধাতু">জ্বালানি ও ধাতু</option>
        <option value="শস্য ও কৃষি পণ্য">শস্য ও কৃষি পণ্য</option>
        <option value="নিত্যপ্রয়োজনীয় মুদি ও খাদ্য">নিত্যপ্রয়োজনীয় মুদি ও খাদ্য</option>
        <option value="পোলোট্রি ও প্রাণিসম্পদ">পোলোট্রি ও প্রাণিসম্পদ</option>
        <option value="নির্মাণ ও শিল্প উপকরণ">নির্মাণ ও শিল্প উপকরণ</option>
      </select>
      <input id="newMarketRegion" type="text" placeholder="দেশ / অঞ্চল (যেমন: বিশ্ববাজার, বাংলাদেশ)">
    </div>

    <div class="grid-2">
      <input id="newMarketName" type="text" placeholder="পণ্যের নাম (যেমন: গম, পাম তেল, স্বর্ণ, চাল)...">
      <input id="newMarketUnit" type="text" placeholder="একক (যেমন: প্রতি কেজি / প্রতি ব্যারেল / প্রতি গ্রাম)">
    </div>

    <div class="grid-2">
      <input id="newMarketBdt" type="number" step="0.01" placeholder="দাম (BDT টাকায়)...">
      <input id="newMarketTrend" type="text" placeholder="অবস্থা (যেমন: দৈনিক আপডেট, স্থিতিশীল, বৃদ্ধি)">
    </div>

    <textarea id="newMarketNote" rows="2" placeholder="বাজার পরিস্থিতি বা সংক্ষিপ্ত নোট লিখুন..."></textarea>
    <button id="addMarketItemBtn" type="button" class="btn-gold-3d">
      📌 দৈনিক মূল্যতালিকায় যুক্ত করুন
    </button>
  </section>

  <!-- বিশ্ব বাজার মূল্যতালিকা গ্রিড -->
  <section id="worldMarketList" class="market-grid">
    <div class="gold-3d box-pad" style="grid-column:1/-1;text-align:center;">
      বিশ্ব বাজার মূল্যতালিকা লোড হচ্ছে...
    </div>
  </section>
</main>

<script type="module" src="./world-market.js"></script>
</body>
</html>
