<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060d21">
<title>AYNA BOOK — Real Live TV (Bangladesh & World)</title>
<style>
  :root {
    --bg: #050a18;
    --panel: #0b1633;
    --gold: #ffe64d;
    --gold-bright: #fff6b3;
    --gold-base: #8a6105;
    --cyan: #38f2ff;
    --text: #ffffff;
    --muted: #dce6fa;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, "Noto Sans Bengali", sans-serif;
    font-size: 20px;
    padding: 16px;
  }

  .tv-wrap {
    max-width: 1020px;
    margin: 0 auto;
    background: var(--panel);
    border: 3px solid var(--gold);
    border-radius: 10px;
    padding: 18px;
    box-shadow: 0 0 18px rgba(255, 230, 77, 0.5), 0 7px 0 var(--gold-base);
  }

  .tv-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .tv-title {
    margin: 0;
    font-size: 28px;
    color: var(--gold-bright);
  }

  .back-link {
    color: var(--gold);
    text-decoration: none;
    font-weight: bold;
    border: 2px solid var(--gold);
    padding: 8px 14px;
    border-radius: 6px;
  }

  .mode-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .filter-btn {
    padding: 10px 16px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 8px;
    border: 2px solid var(--gold);
    background: #050b1c;
    color: var(--text);
    cursor: pointer;
  }

  .filter-btn.active {
    background: linear-gradient(180deg, #ffe64d 0%, #c99314 100%);
    color: #050a18;
  }

  .player-box {
    position: relative;
    width: 100%;
    background: #141414;
    border: 2.5px solid var(--gold);
    border-radius: 8px;
    overflow: hidden;
  }

  video {
    width: 100%;
    max-height: 540px;
    display: block;
    background: #141414;
  }

  .channel-select,
  .custom-url-input,
  .quality-select {
    width: 100%;
    margin-top: 14px;
    padding: 14px 16px;
    font-size: 20px;
    border-radius: 8px;
    border: 2.5px solid var(--gold);
  }

  .channel-select,
  .quality-select {
    background: #ffffff;
    color: #050a18;
    font-weight: bold;
  }

  .custom-url-input {
    background: #050b1c;
    color: #ffffff;
  }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 240px;
    gap: 12px;
  }

  @media (max-width: 700px) {
    .row-2 {
      grid-template-columns: 1fr;
    }
  }

  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  .tv-btn {
    padding: 12px 22px;
    font-size: 19px;
    font-weight: 900;
    border-radius: 8px;
    border: 2px solid var(--gold-bright);
    background: linear-gradient(180deg, #ffe64d 0%, #c99314 100%);
    color: #050a18;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--gold-base);
  }

  .tv-btn:active {
    transform: translateY(3px);
  }

  .status-box {
    margin-top: 16px;
    padding: 14px;
    border-radius: 8px;
    background: #050b1c;
    border: 2px solid var(--gold);
  }

  .stream-tag {
    color: var(--cyan);
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 6px;
  }

  .status-msg {
    margin: 0;
    font-size: 19px;
    color: var(--muted);
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>

<div class="tv-wrap">
  <div class="tv-header">
    <h1 class="tv-title">📺 AYNA BOOK REAL TV</h1>
    <a class="back-link" href="index.html">← হোমে ফিরুন</a>
  </div>

  <div class="mode-bar" role="group" aria-label="Channel Region Filter">
    <button type="button" class="filter-btn active" data-region="ALL">সব চ্যানেল (ALL)</button>
    <button type="button" class="filter-btn" data-region="BD">🇧🇩 বাংলাদেশ</button>
    <button type="button" class="filter-btn" data-region="WORLD">🌍 বিশ্ব চ্যানেল</button>
  </div>

  <div class="player-box" id="playerBox">
    <video id="tvVideo" controls playsinline></video>
  </div>

  <div class="row-2">
    <select id="channelSelect" class="channel-select" aria-label="Select TV Channel">
      <option value="">Select TV Channel</option>
    </select>

    <select id="qualityMode" class="quality-select" aria-label="Stream Speed & Quality Mode">
      <option value="high">⚡ High Speed (Max)</option>
      <option value="8k">✨ 8K Ultra Profile</option>
      <option value="auto">🔄 Auto ABR</option>
    </select>
  </div>

  <input
    type="url"
    id="customStreamUrl"
    class="custom-url-input"
    placeholder="যেকোনো লাইভ .m3u8 বা .mp4 স্ট্রিম লিংক এখানে দিন..."
  >

  <div class="controls">
    <button type="button" class="tv-btn" id="playBtn">▶ PLAY</button>
    <button type="button" class="tv-btn" id="stopBtn">■ STOP</button>
    <button type="button" class="tv-btn" id="fullscreenBtn">⛶ FULL SCREEN</button>
  </div>

  <div class="status-box">
    <div class="stream-tag" id="streamTag">HIGH-SPEED LIVE ENGINE</div>
    <p class="status-msg" id="tvStatus">Please select a valid TV channel.</p>
  </div>
</div>

<script src="tv-live.js"></script>
</body>
</html>
