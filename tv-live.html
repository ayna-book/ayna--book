
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>AYNA BOOK — TV Live</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #d4af37;
    }

    header h1 { color: #d4af37; margin: 0; }

    .container {
      width: 94%;
      max-width: 850px;
      margin: 25px auto;
    }

    .player-box {
      background: #171717;
      border: 1px solid #d4af37;
      border-radius: 15px;
      padding: 15px;
    }

    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
      border-radius: 10px;
    }

    h2 { color: #d4af37; }

    select {
      width: 100%;
      padding: 14px;
      background: #222;
      color: white;
      border: 1px solid #d4af37;
      border-radius: 8px;
      margin: 12px 0;
    }

    button {
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 25px;
      background: #d4af37;
      color: black;
      font-weight: bold;
    }

    #status {
      color: #d4af37;
      min-height: 24px;
    }

  </style>
</head>

<body>

<header>
  <h1>AYNA BOOK</h1>
  <p>GLOBAL TV LIVE</p>
</header>

<main class="container">

  <section class="player-box">

    <h2 id="channelName">AYNA TV</h2>

    <video
      id="tvPlayer"
      controls
      playsinline
      preload="none">
    </video>

    <select id="channelSelect">
      <option value="">Select TV Channel</option>
    </select>

    <div>
      <button id="playButton">▶ PLAY</button>
      <button id="stopButton">■ STOP</button>
      <button id="fullscreenButton">⛶ FULL SCREEN</button>
    </div>

    <p id="status">Select a channel to start.</p>

  </section>

</main>

<script type="module" src="./tv-live.js"></script>

</body>
</html>
