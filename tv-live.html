<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050a18">
<title>_ LIVE TV</title>
<style>
  :root {
    --bg: #050a18;
    --box-bg: #0b1633;
    --box-grad: linear-gradient(155deg, #13285c 0%, #071129 100%);
    --gold: #ffd700;
    --gold-bright: #fff380;
    --gold-glow: 0 0 14px rgba(255, 215, 0, 0.55), inset 0 0 8px rgba(255, 215, 0, 0.25);
    --text: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 12px;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, "Noto Sans Bengali", sans-serif;
  }

  .tv-shell {
    max-width: 960px;
    margin: 0 auto;
    background: var(--box-bg);
    border: 3px solid var(--gold);
    border-radius: 12px;
    padding: 14px;
    box-shadow: var(--gold-glow);
  }

  .gold-box {
    background: var(--box-grad);
    border: 2.5px solid var(--gold);
    border-radius: 10px;
    padding: 12px;
    box-shadow: var(--gold-glow);
    margin-bottom: 12px;
  }

  .head-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .brand-title {
    font-weight: 800;
    font-size: 18px;
    color: var(--gold-bright);
  }

  .home-link {
    color: var(--gold-bright);
    text-decoration: none;
    border: 2px solid var(--gold);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 14px;
    font-weight: 700;
  }

  .two-col {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .filter-btn,
  .tv-btn {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 2px solid var(--gold);
    background: var(--box-grad);
    color: var(--gold-bright);
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    box-shadow: var(--gold-glow);
  }

  .filter-btn.active {
    background: linear-gradient(180deg, #ffe64d 0%, #c99314 100%);
    color: #050a18;
  }

  .player-box {
    border: 2.5px solid var(--gold);
    border-radius: 10px;
    overflow: hidden;
    background: #141414;
    margin-bottom: 12px;
    box-shadow: var(--gold-glow);
  }

  video {
    width: 100%;
    max-height: 460px;
    display: block;
    background: #141414;
  }

  .input-box,
  .select-box {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 2px solid var(--gold);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    margin-bottom: 10px;
  }

  .slider-box {
    width: 100%;
    cursor: pointer;
  }

  .fav-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .fav-item {
    border: 1.5px solid var(--gold);
    border-radius: 6px;
    padding: 8px;
    background: var(--bg);
    font-size: 13px;
    cursor: pointer;
    text-align: center;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>
  <div class="tv-shell">
    <div class="gold-box head-row">
      <div class="brand-title"><span>_</span> <span>LIVE TV</span></div>
      <a href="index.html" class="home-link">_ HOME</a>
    </div>

    <div class="gold-box two-col" id="scopeBar">
      <button type="button" class="filter-btn active" data-scope="ALL">ALL</button>
      <button type="button" class="filter-btn" data-scope="BD">BD</button>
      <button type="button" class="filter-btn" data-scope="WORLD">WORLD</button>
      <button type="button" class="filter-btn" data-scope="NEWS">NEWS</button>
      <button type="button" class="filter-btn" data-scope="SPORTS">SPORTS</button>
      <button type="button" class="filter-btn" id="reloadBtn">REFRESH</button>
    </div>

    <div class="player-box" id="playerBox">
      <video id="tvVideo" controls playsinline></video>
    </div>

    <div class="gold-box">
      <div class="two-col">
        <input type="search" id="channelSearch" class="input-box" placeholder="Search channel / CH-01...">
        <select id="countryFilter" class="select-box">
          <option value="">ALL COUNTRIES</option>
          <option value="BD">BD</option>
          <option value="IN">IN</option>
          <option value="GB">GB</option>
          <option value="US">US</option>
          <option value="SA">SA</option>
          <option value="AE">AE</option>
          <option value="DE">DE</option>
          <option value="FR">FR</option>
        </select>
      </div>
      <div id="freqReadout" class="brand-title" style="font-size:14px;margin-bottom:6px;">CH-01</div>
      <input type="range" id="freqSlider" class="slider-box" min="0" max="0" value="0">
    </div>

    <div class="gold-box">
      <div class="two-col">
        <select id="channelSelect" class="select-box"></select>
        <select id="qualityMode" class="select-box">
          <option value="high">HIGH</option>
          <option value="8k">8K</option>
          <option value="auto">AUTO</option>
        </select>
      </div>
      <input type="url" id="customStreamUrl" class="input-box" placeholder=".m3u8 / .mp4">
      <div class="two-col">
        <button type="button" class="tv-btn" id="playBtn">PLAY</button>
        <button type="button" class="tv-btn" id="stopBtn">STOP</button>
        <button type="button" class="tv-btn" id="nextBtn">NEXT</button>
        <button type="button" class="tv-btn" id="favSaveBtn">FAV +</button>
        <button type="button" class="tv-btn" id="fullscreenBtn">FULL</button>
      </div>
    </div>

    <div class="gold-box">
      <div id="favoritesList" class="fav-list"></div>
    </div>

    <div class="gold-box">
      <div id="streamTag" class="brand-title" style="font-size:14px;">READY</div>
      <div id="tvStatus" style="font-size:14px;margin-top:4px;">_</div>
    </div>
  </div>

  <script src="tv-live.js"></script>
</body>
</html>
