<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060d21">
<title>AYNA BOOK — High-Speed Global Live TV</title>
<style>
  :root {
    --bg: #050a18;
    --panel: #0b1633;
    --gold: #ffe64d;
    --gold-bright: #fff6b3;
    --gold-base: #8a6105;
    --cyan: #38f2ff;
    --text: #ffffff;
    --muted: #dce6fa;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, "Noto Sans Bengali", sans-serif;
    font-size: 20px;
    padding: 16px;
  }

  .tv-wrap {
    max-width: 1040px;
    margin: 0 auto;
    background: var(--panel);
    border: 3px solid var(--gold);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 0 18px rgba(255, 230, 77, 0.5), 0 7px 0 var(--gold-base);
  }

  .tv-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .tv-title {
    margin: 0;
    font-size: 28px;
    color: var(--gold-bright);
  }

  .back-link {
    color: var(--gold);
    text-decoration: none;
    font-weight: bold;
    border: 2px solid var(--gold);
    padding: 8px 14px;
    border-radius: 6px;
  }

  .filter-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .filter-btn {
    padding: 10px 16px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 8px;
    border: 2px solid var(--gold);
    background: #050b1c;
    color: var(--text);
    cursor: pointer;
  }

  .filter-btn.active {
    background: linear-gradient(180deg, #ffe64d 0%, #c99314 100%);
    color: #050a18;
  }

  .player-box {
    position: relative;
    width: 100%;
    background: #141414;
    border: 2.5px solid var(--gold);
    border-radius: 8px;
    overflow: hidden;
  }

  video {
    width: 100%;
    max-height: 540px;
    display: block;
    background: #141414;
  }

  .search-row {
    display: grid;
    grid-template-columns: 1fr 240px;
    gap: 12px;
    margin-top: 14px;
  }

  @media (max-width: 700px) {
    .search-row {
      grid-template-columns: 1fr;
    }
  }

  .search-input,
  .country-select,
  .channel-select,
  .quality-select,
  .custom-url-input {
    width: 100%;
    padding: 13px 16px;
    font-size: 19px;
    border-radius: 8px;
    border: 2.5px solid var(--gold);
    margin-bottom: 12px;
  }

  .search-input,
  .custom-url-input {
    background: #050b1c;
    color: #ffffff;
  }

  .country-select,
  .channel-select,
  .quality-select {
    background: #ffffff;
    color: #050a18;
    font-weight: bold;
  }

  .freq-tuner {
    background: #050b1c;
    border: 2px solid var(--gold);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }

  .freq-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 8px;
    font-size: 18px;
    color: var(--cyan);
    font-weight: bold;
  }

  .freq-slider {
    width: 100%;
    cursor: pointer;
  }

  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 8px;
  }

  .tv-btn {
    padding: 12px 20px;
    font-size: 18px;
    font-weight: 900;
    border-radius: 8px;
    border: 2px solid var(--gold-bright);
    background: linear-gradient(180deg, #ffe64d 0%, #c99314 100%);
    color: #050a18;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--gold-base);
  }

  .tv-btn:active {
    transform: translateY(3px);
  }

  .live-meta {
    margin-top: 16px;
    padding: 14px;
    border-radius: 8px;
    background: #050b1c;
    border: 2px solid var(--gold);
  }

  .live-badge {
    display: inline-block;
    color: var(--cyan);
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 6px;
  }

  .status-msg {
    font-size: 19px;
    color: var(--muted);
    margin: 0;
    word-break: break-word;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>

<div class="tv-wrap">
  <div class="tv-header">
    <h1 class="tv-title">📺 AYNA BOOK HIGH-SPEED LIVE TV</h1>
    <a class="back-link" href="index.html">← হোমে ফিরুন</a>
  </div>

  <div class="filter-bar" role="group" aria-label="TV Scope Filter">
    <button type="button" class="filter-btn active" data-scope="ALL">🌐 সব (BD + বিশ্ব)</button>
    <button type="button" class="filter-btn" data-scope="BD">🇧🇩 বাংলাদেশ</button>
    <button type="button" class="filter-btn" data-scope="WORLD">🌍 বিশ্ব টিভি</button>
    <button type="button" class="filter-btn" data-scope="NEWS">📰 নিউজ</button>
    <button type="button" class="filter-btn" data-scope="SPORTS">⚽ স্পোর্টস</button>
  </div>

  <div class="player-box" id="playerBox">
    <video id="tvVideo" controls playsinline></video>
  </div>

  <div class="search-row">
    <input
      type="search"
      id="channelSearch"
      class="search-input"
      placeholder="চ্যানেল, ফ্রিকোয়েন্সি স্লট বা দেশ (যেমন BTV, CH-01, DW, France 24) লিখে খুঁজুন..."
    >
    <select id="countryFilter" class="country-select" aria-label="Select Country">
      <option value="">All World + BD</option>
      <option value="BD">Bangladesh (BD)</option>
      <option value="IN">India (IN)</option>
      <option value="GB">UK (GB)</option>
      <option value="US">USA (US)</option>
      <option value="SA">Saudi Arabia (SA)</option>
      <option value="AE">UAE (AE)</option>
      <option value="DE">Germany (DE)</option>
      <option value="FR">France (FR)</option>
    </select>
  </div>

  <div class="freq-tuner">
    <div class="freq-top">
      <span>⚡ HIGH-SPEED TV FREQUENCY / CHANNEL TUNER</span>
      <span id="freqReadout">CH-01 • UHD/HD</span>
    </div>
    <input
      type="range"
      id="freqSlider"
      class="freq-slider"
      min="0"
      max="100"
      value="0"
      aria-label="TV Frequency Tuner"
    >
  </div>

  <div class="search-row">
    <select id="channelSelect" class="channel-select" aria-label="Select TV Channel">
      <option value="">চ্যানেল লোড হচ্ছে...</option>
    </select>

    <select id="qualityMode" class="quality-select" aria-label="Quality Mode">
      <option value="high">⚡ High Speed (Max)</option>
      <option value="8k">✨ 8K Ultra Profile</option>
      <option value="auto">🔄 Auto ABR</option>
    </select>
  </div>

  <input
    type="url"
    id="customStreamUrl"
    class="custom-url-input"
    placeholder="অথবা সরাসরি .m3u8 / .mp4 লাইভ টিভি স্ট্রিম লিংক দিন..."
  >

  <div class="controls">
    <button type="button" class="tv-btn" id="playBtn">▶ PLAY</button>
    <button type="button" class="tv-btn" id="stopBtn">■ STOP</button>
    <button type="button" class="tv-btn" id="nextBtn">⏭ NEXT</button>
    <button type="button" class="tv-btn" id="fullscreenBtn">⛶ FULL SCREEN</button>
    <button type="button" class="tv-btn" id="reloadBtn">🔄 REFRESH ALL</button>
  </div>

  <div class="live-meta">
    <div class="live-badge" id="streamTag">HIGH-SPEED MULTI-CHANNEL TV ENGINE</div>
    <p class="status-msg" id="tvStatus">বাংলাদেশ ও বিশ্ব লাইভ টিভি চ্যানেল লোড হচ্ছে...</p>
  </div>
</div>

<script src="tv-live.js"></script>
</body>
</html>
