
<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0A0F1E"
  >

  <title>AYNA BOOK — Account Recovery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0A0F1E;
      color: #FFFFFF;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 28px;
      background: #1A2233;
      border: 1px solid #303B50;
      border-radius: 16px;
    }

    h1 {
      text-align: center;
      color: #FFD700;
    }

    h2 {
      text-align: center;
    }

    p {
      color: #A9B0BC;
      line-height: 1.7;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #303B50;
      border-radius: 8px;
      background: #0A0F1E;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      background: #FFD700;
      color: #0A0F1E;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    a {
      display: block;
      margin-top: 18px;
      color: #FFD700;
      text-align: center;
      text-decoration: none;
    }

    #statusMessage {
      text-align: center;
      min-height: 45px;
      overflow-wrap: anywhere;
    }
  </style>

</head>

<body>

  <main class="container">

    <h1>AYNA BOOK</h1>

    <h2>Account Recovery</h2>

    <p>
      আপনার Gmail ঠিকানা লিখুন।
      আমরা Password Reset Link পাঠাব।
    </p>

    <form id="recoveryForm">

      <label for="email">
        Gmail Address
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="example@gmail.com"
        autocomplete="email"
        required
      >

      <button
        type="submit"
        id="resetButton"
      >
        Send Reset Link
      </button>

    </form>

    <p id="statusMessage"></p>

    <a href="./login.html">
      Back to Login
    </a>

  </main>

  <script
    type="module"
    src="./forgot-password.js"
  ></script>

</body>

</html>
