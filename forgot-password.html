<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AYNA BOOK - Reset Password</title>
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --bg-dark: #090b10;
      --card-bg: #121622;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1a2035 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .reset-card {
      background: var(--card-bg);
      border: 2px solid var(--gold);
      border-radius: 16px;
      padding: 34px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
      text-align: center;
    }
    .reset-card h1 { color: var(--gold); font-size: 26px; letter-spacing: 1.5px; margin-bottom: 8px; }
    .reset-card p.sub { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .form-group { text-align: left; margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; color: var(--gold-light); margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: #0b0e17;
      border: 1px solid #2d3548;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .form-group input:focus { border-color: var(--gold); }
    .btn-gold {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #d4af37, #aa8018);
      color: #000;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-gold:hover { filter: brightness(1.15); }
    .status-box {
      margin-top: 16px;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .back-link { display: inline-block; margin-top: 20px; color: var(--gold); text-decoration: none; font-size: 14px; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="reset-card">
    <h1>AYNA BOOK</h1>
    <p class="sub">Enter your registered email address. We will send a secure password reset link to your inbox.</p>

    <form id="resetForm">
      <div class="form-group">
        <label>Registered Email</label>
        <input type="email" id="resetEmail" placeholder="Enter your email" required />
      </div>
      <button type="submit" class="btn-gold" id="resetBtn">Send Reset Link</button>
    </form>

    <div class="status-box" id="statusBox"></div>
    <a href="index.html" class="back-link">← Back to Login</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "ayna-book.firebaseapp.com",
      databaseURL: "https://ayna-book-default-rtdb.firebaseio.com",
      projectId: "ayna-book",
      storageBucket: "ayna-book.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const resetForm = document.getElementById("resetForm");
    const statusBox = document.getElementById("statusBox");
    const resetBtn = document.getElementById("resetBtn");

    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("resetEmail").value.trim();

      resetBtn.disabled = true;
      resetBtn.textContent = "Sending...";

      try {
        await sendPasswordResetEmail(auth, email);
        statusBox.style.display = "block";
        statusBox.style.background = "rgba(74, 222, 128, 0.12)";
        statusBox.style.border = "1px solid #4ade80";
        statusBox.style.color = "#4ade80";
        statusBox.textContent = "Password reset link sent! Please check your email inbox (and Spam folder).";
      } catch (error) {
        statusBox.style.display = "block";
        statusBox.style.background = "rgba(248, 113, 113, 0.12)";
        statusBox.style.border = "1px solid #f87171";
        statusBox.style.color = "#f87171";
        statusBox.textContent = error.message;
      } finally {
        resetBtn.disabled = false;
        resetBtn.textContent = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
