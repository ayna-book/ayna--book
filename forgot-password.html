<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AYNA BOOK — Reset Password</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #0b0b0b;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 30px 24px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.08);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;

      border: 2px solid #d4af37;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #d4af37;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      text-align: center;
      color: #d4af37;
      font-size: 27px;
    }

    .subtitle {
      margin: 10px 0 25px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px 15px;

      border: 1px solid #333;
      border-radius: 10px;

      background: #151515;
      color: #fff;

      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #d4af37;
      box-shadow:
        0 0 0 2px rgba(212, 175, 55, 0.12);
    }

    .required {
      color: #d4af37;
    }

    #resetButton {
      width: 100%;
      padding: 14px;

      border: none;
      border-radius: 10px;

      background: #d4af37;
      color: #000;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    #resetButton:hover {
      background: #e5c04b;
    }

    #resetButton:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;

      border-radius: 9px;

      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #ffb4b4;
      background: rgba(180, 0, 0, 0.15);
      border: 1px solid rgba(255, 80, 80, 0.25);
    }

    .message.success {
      color: #b9f6c5;
      background: rgba(0, 150, 50, 0.12);
      border: 1px solid rgba(80, 220, 110, 0.25);
    }

    .back {
      display: block;
      margin-top: 22px;

      text-align: center;

      color: #d4af37;
      text-decoration: none;

      font-size: 14px;
      font-weight: bold;
    }

    .back:hover {
      text-decoration: underline;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">
        AB
      </div>

      <h1>
        Reset Password
      </h1>

      <div class="subtitle">
        Enter your email address and we will send you
        a password reset link.
      </div>


      <form id="forgotPasswordForm">

        <div class="form-group">

          <label for="email">
            Email
            <span class="required">*</span>
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            placeholder="Enter your email address"
            required
          >

        </div>


        <button
          id="resetButton"
          type="submit"
        >
          Send Reset Email
        </button>

      </form>


      <div
        id="message"
        class="message"
        role="alert"
      ></div>


      <a
        href="login.html"
        class="back"
      >
        ← Back to Sign In
      </a>

    </div>

  </div>


  <script
    type="module"
    src="./forgot-password.js"
  ></script>

</body>
</html>
