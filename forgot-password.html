<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0F1E">

  <title>AYNA BOOK — Forgot Password</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      background: #0A0F1E;
      color: #FFFFFF;

      font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    /* =====================================================
       BRAND
    ===================================================== */

    .brand {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand h1 {
      margin: 0;

      color: #FFFFFF;

      font-size: 31px;
      font-weight: 800;

      letter-spacing: 2px;
    }

    .brand p {
      margin: 8px 0 0;

      color: #A9B0BC;

      font-size: 14px;
    }

    /* =====================================================
       CARD
    ===================================================== */

    .card {
      background: #111827;

      border: 1px solid #FFD700;

      border-radius: 18px;

      padding: 25px;

      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.45);
    }

    .icon {
      width: 62px;
      height: 62px;

      margin: 0 auto 15px;

      border-radius: 50%;

      background: #1A2233;

      border: 1px solid #FFD700;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 27px;
    }

    .title {
      margin: 0;

      text-align: center;

      font-size: 23px;

      color: #FFFFFF;
    }

    .description {
      margin: 10px 0 24px;

      text-align: center;

      color: #A9B0BC;

      font-size: 13px;

      line-height: 1.6;
    }

    /* =====================================================
       FIELD
    ===================================================== */

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #FFFFFF;

      font-size: 14px;

      font-weight: 600;
    }

    input {
      width: 100%;

      height: 50px;

      padding: 0 14px;

      background: #1A2233;

      border: 1px solid #334155;

      border-radius: 10px;

      outline: none;

      color: #FFFFFF;

      font-size: 15px;
    }

    input::placeholder {
      color: #7F8898;
    }

    input:focus {
      border-color: #FFD700;

      box-shadow:
        0 0 0 2px rgba(255, 215, 0, 0.12);
    }

    /* =====================================================
       RESET BUTTON
    ===================================================== */

    .reset-btn {
      width: 100%;

      min-height: 50px;

      border: 0;

      border-radius: 10px;

      background: #FFD700;

      color: #0A0F1E;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;
    }

    .reset-btn:hover {
      filter: brightness(1.05);
    }

    .reset-btn:disabled {
      opacity: 0.55;

      cursor: not-allowed;
    }

    /* =====================================================
       MESSAGE
    ===================================================== */

    .message {
      min-height: 24px;

      margin-top: 15px;

      text-align: center;

      color: #FFD700;

      font-size: 14px;

      line-height: 1.5;
    }

    /* =====================================================
       LINKS
    ===================================================== */

    .links {
      margin-top: 22px;

      padding-top: 18px;

      border-top: 1px solid #263247;

      text-align: center;

      font-size: 14px;
    }

    .links a {
      color: #FFD700;

      text-decoration: none;

      font-weight: 700;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .security-note {
      margin-top: 18px;

      text-align: center;

      color: #7F8898;

      font-size: 11px;

      line-height: 1.5;
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 20px;
      }

      .brand h1 {
        font-size: 28px;
      }

    }
  </style>
</head>

<body>

  <main class="container">

    <!-- ===================================================
         BRAND
    ==================================================== -->

    <div class="brand">

      <h1>AYNA BOOK</h1>

      <p>
        নিরাপদ ডিজিটাল সামাজিক প্ল্যাটফর্ম
      </p>

    </div>


    <!-- ===================================================
         CARD
    ==================================================== -->

    <section class="card">

      <div class="icon">
        🔐
      </div>

      <h2 class="title">
        Password Reset
      </h2>

      <p class="description">
        আপনার AYNA BOOK Account-এর Gmail লিখুন।
        আমরা Password পরিবর্তনের জন্য একটি নিরাপদ
        Reset Email পাঠাব।
      </p>


      <!-- =================================================
           FORM
      ================================================== -->

      <form id="resetForm">

        <div class="field">

          <label for="email">
            Gmail
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            autocomplete="email"
            maxlength="120"
            required
          >

        </div>


        <button
          type="submit"
          id="resetBtn"
          class="reset-btn"
        >
          RESET PASSWORD
        </button>


        <div
          id="message"
          class="message"
          aria-live="polite"
        ></div>

      </form>


      <!-- =================================================
           LINKS
      ================================================== -->

      <div class="links">

        <a href="./login.html">
          ← LOGIN
        </a>

        &nbsp; | &nbsp;

        <a href="./signup.html">
          REGISTER
        </a>

      </div>


      <div class="security-note">
        🔒 Password Reset Link কাউকে শেয়ার করবেন না।
      </div>

    </section>

  </main>


  <!-- =====================================================
       PASSWORD RESET SCRIPT
  ====================================================== -->

  <script type="module">

    import {
      resetPassword
    } from "./auth.js";


    // =====================================================
    // Elements
    // =====================================================

    const form =
      document.getElementById("resetForm");

    const email =
      document.getElementById("email");

    const resetBtn =
      document.getElementById("resetBtn");

    const message =
      document.getElementById("message");


    // =====================================================
    // Submit
    // =====================================================

    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const emailValue =
          email.value.trim().toLowerCase();


        if (!emailValue) {

          message.textContent =
            "Gmail দিন।";

          return;
        }


        // -------------------------------------------------
        // Disable button
        // -------------------------------------------------

        resetBtn.disabled = true;

        resetBtn.textContent =
          "EMAIL পাঠানো হচ্ছে...";

        message.textContent = "";


        try {

          await resetPassword(
            emailValue
          );


          message.textContent =
            "Password Reset Email পাঠানো হয়েছে। Gmail Inbox ও Spam/Junk folder পরীক্ষা করুন।";


          email.value = "";


        } catch (error) {

          console.error(
            "Password Reset Error:",
            error
          );

          message.textContent =
            error.message ||
            "Password Reset Email পাঠানো যায়নি।";

        } finally {

          resetBtn.disabled = false;

          resetBtn.textContent =
            "RESET PASSWORD";

        }

      }
    );


    // =====================================================
    // Ready
    // =====================================================

    console.log(
      "AYNA BOOK — Forgot Password page loaded."
    );

  </script>

</body>
</html>
