<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0F1E">

  <title>AYNA BOOK — Forgot Password</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #0A0F1E;
      color: #ffffff;

      font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-title {
      color: #ffffff;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .logo-subtitle {
      margin-top: 7px;
      color: #A9B0BC;
      font-size: 14px;
    }

    .card {
      padding: 28px 22px;

      background: #1A2233;
      border: 1px solid #2d3748;
      border-radius: 18px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;

      text-align: center;

      color: #FFD700;
      font-size: 25px;
    }

    .description {
      margin: 0 0 24px;

      text-align: center;

      color: #A9B0BC;
      font-size: 14px;
      line-height: 1.6;
    }

    .message {
      display: none;

      margin-bottom: 18px;
      padding: 12px 14px;

      border-radius: 9px;

      font-size: 13px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(46, 204, 113, 0.10);
      border: 1px solid #2ECC71;
      color: #2ECC71;
    }

    .message.error {
      background: rgba(255, 70, 70, 0.10);
      border: 1px solid #ff5555;
      color: #ff7777;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #ffffff;

      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 48px;

      padding: 0 14px;

      background: #0A0F1E;
      color: #ffffff;

      border: 1px solid #4A4A2A;
      border-radius: 10px;

      outline: none;

      font-size: 15px;

      transition: 0.2s ease;
    }

    input:focus {
      border-color: #FFD700;

      box-shadow:
        0 0 0 3px rgba(255, 215, 0, 0.10);
    }

    input::placeholder {
      color: #737b89;
    }

    .reset-button {
      width: 100%;
      height: 50px;

      border: 1px solid #FFD700;
      border-radius: 10px;

      background: #FFD700;
      color: #0A0F1E;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .reset-button:hover {
      transform: translateY(-1px);

      box-shadow:
        0 7px 20px rgba(255, 215, 0, 0.18);
    }

    .reset-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .links {
      margin-top: 20px;

      display: flex;
      flex-direction: column;
      gap: 12px;

      text-align: center;
    }

    .links a {
      color: #FFD700;
      text-decoration: none;

      font-size: 14px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .security-note {
      margin-top: 20px;

      padding: 12px;

      border-radius: 9px;

      background: rgba(46, 204, 113, 0.06);
      border: 1px solid rgba(46, 204, 113, 0.25);

      color: #A9B0BC;

      font-size: 12px;
      line-height: 1.5;

      text-align: center;
    }

    @media (max-width: 480px) {

      body {
        padding: 14px;
      }

      .card {
        padding: 24px 17px;
        border-radius: 15px;
      }

      .logo-title {
        font-size: 26px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- AYNA BOOK Logo -->

    <div class="logo">

      <div class="logo-title">
        AYNA BOOK
      </div>

      <div class="logo-subtitle">
        Connect • Share • Create
      </div>

    </div>


    <!-- Card -->

    <section class="card">

      <h1>
        পাসওয়ার্ড ভুলে গেছেন?
      </h1>

      <p class="description">
        আপনার অ্যাকাউন্টের ইমেইল লিখুন।
        আমরা পাসওয়ার্ড পরিবর্তনের জন্য একটি লিংক পাঠাব।
      </p>


      <!-- Message -->

      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite">
      </div>


      <!-- Reset Form -->

      <form
        id="resetForm"
        autocomplete="on"
        novalidate>

        <div class="form-group">

          <label for="email">
            ইমেইল
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            autocomplete="email"
            maxlength="254"
            required>

        </div>


        <button
          type="submit"
          id="resetButton"
          class="reset-button">

          Reset Password

        </button>

      </form>


      <!-- Security -->

      <div class="security-note">
        🔒 পাসওয়ার্ড পরিবর্তনের লিংক Firebase Authentication থেকে আপনার ইমেইলে পাঠানো হবে।
      </div>


      <!-- Links -->

      <div class="links">

        <a href="login.html">
          ← লগইন পেজে ফিরে যান
        </a>

        <a href="signup.html">
          নতুন অ্যাকাউন্ট তৈরি করুন
        </a>

      </div>

    </section>

  </main>


  <!-- Firebase Password Reset -->

  <script type="module">

    import {
      resetPassword
    } from "./auth.js";


    const resetForm =
      document.getElementById("resetForm");

    const emailInput =
      document.getElementById("email");

    const resetButton =
      document.getElementById("resetButton");

    const messageBox =
      document.getElementById("message");


    // =====================================================
    // Show Message
    // =====================================================

    function showMessage(
      text,
      type = "error"
    ) {

      messageBox.textContent = text;

      messageBox.className =
        "message show " + type;
    }


    // =====================================================
    // Reset Password
    // =====================================================

    if (resetForm) {

      resetForm.addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();


          const email =
            emailInput.value.trim();


          // -------------------------------------------------
          // Validation
          // -------------------------------------------------

          if (!email) {

            showMessage(
              "আপনার ইমেইল লিখুন।",
              "error"
            );

            emailInput.focus();

            return;
          }


          // -------------------------------------------------
          // Disable
          // -------------------------------------------------

          resetButton.disabled = true;

          resetButton.textContent =
            "ইমেইল পাঠানো হচ্ছে...";


          showMessage(
            "আপনার ইমেইল যাচাই করা হচ্ছে...",
            "success"
          );


          try {

            const result =
              await resetPassword(email);


            if (result?.success) {

              showMessage(
                result.message ||
                "পাসওয়ার্ড reset link পাঠানো হয়েছে।",
                "success"
              );

              resetForm.reset();

              resetButton.textContent =
                "ইমেইল পাঠানো হয়েছে ✓";

            } else {

              showMessage(
                result?.message ||
                "Reset email পাঠানো যায়নি।",
                "error"
              );

              resetButton.disabled = false;

              resetButton.textContent =
                "Reset Password";
            }


          } catch (error) {

            console.error(
              "AYNA BOOK Password Reset Error:",
              error
            );

            showMessage(
              "পাসওয়ার্ড reset করার সময় সমস্যা হয়েছে। আবার চেষ্টা করুন।",
              "error"
            );

            resetButton.disabled = false;

            resetButton.textContent =
              "Reset Password";
          }

        }
      );

    }


    console.log(
      "AYNA BOOK — Forgot Password Page Loaded Successfully."
    );

  </script>

</body>
</html>
