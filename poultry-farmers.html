<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060d21">
<title>AYNA BOOK — পোলোট্রি কৃষক ও ব্যবসায়ী</title>

<style>
:root {
  --bg: #050a18;
  --navy-top: #172e63;
  --navy-bottom: #08122b;
  --gold: #ffd700;
  --gold-base: #755206;
  --white: #ffffff;
  --muted: #dce6fa;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: Arial, "Noto Sans Bengali", sans-serif;
  font-size: 20px;
  padding-bottom: 80px;
}

.gold-3d {
  background: linear-gradient(155deg, var(--navy-top) 0%, var(--navy-bottom) 100%);
  border: 2.5px solid var(--gold);
  border-radius: 6px;
  box-shadow:
    0 7px 0 var(--gold-base),
    0 12px 22px rgba(0, 0, 0, 0.8),
    inset 0 2px 3px rgba(255, 242, 166, 0.5);
}

header {
  background: linear-gradient(180deg, #0f1f47 0%, #060d21 100%);
  border-bottom: 2.5px solid var(--gold);
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 50;
}

.brand {
  color: var(--gold);
  font-size: 24px;
  font-weight: 1000;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.star-1s {
  color: #ffffff;
  font-size: 26px;
  display: inline-block;
  animation: starFlash1s 1s infinite alternate ease-in-out;
}

@keyframes starFlash1s {
  0% { transform: scale(0.95); text-shadow: 0 0 6px #ffd700; }
  100% { transform: scale(1.35); text-shadow: 0 0 14px #ffffff, 0 0 32px #ffd700; }
}

.back-btn {
  text-decoration: none;
  background: linear-gradient(180deg, #ffd700 0%, #c99314 100%);
  color: #050a18;
  font-weight: 1000;
  font-size: 17px;
  padding: 8px 14px;
  border-radius: 6px;
  border: 1.5px solid #fff2a6;
  box-shadow: 0 4px 0 #664604;
}

.container {
  max-width: 1050px;
  margin: 18px auto;
  padding: 0 14px;
}

.page-title {
  font-size: 28px;
  font-weight: 1000;
  color: var(--gold);
  margin-bottom: 16px;
}

.box-pad {
  padding: 18px;
  margin-bottom: 20px;
}

.box-pad h2 {
  color: var(--gold);
  font-size: 23px;
  margin-bottom: 12px;
}

.auto-status-box {
  background: #050b1c;
  border: 1.5px solid var(--gold);
  border-radius: 6px;
  padding: 12px;
  color: var(--gold);
  font-size: 17px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 14px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(1, minmax(0, 1fr));
  gap: 12px;
}

@media(min-width: 650px) {
  .grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

input, select, textarea {
  width: 100%;
  background: #050b1c;
  color: var(--white);
  border: 2px solid var(--gold);
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 19px;
  margin-bottom: 12px;
}

.btn-gold-3d {
  width: 100%;
  min-height: 56px;
  background: linear-gradient(180deg, #ffd700 0%, #c99314 100%);
  color: #050a18;
  font-size: 21px;
  font-weight: 1000;
  border: 2px solid #fff2a6;
  border-radius: 6px;
  box-shadow: 0 5px 0 #664604;
  cursor: pointer;
}

.btn-gold-3d:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #664604;
}

.poultry-grid {
  display: grid;
  grid-template-columns: repeat(1, minmax(0, 1fr));
  gap: 16px;
}

@media(min-width: 750px) {
  .poultry-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.poultry-card {
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
}

.poultry-badge {
  display: inline-block;
  background: #050b1c;
  color: var(--gold);
  border: 1.5px solid var(--gold);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 8px;
}

.poultry-title {
  font-size: 23px;
  font-weight: 1000;
  color: var(--white);
  margin-bottom: 6px;
}

.poultry-rate {
  font-size: 19px;
  font-weight: bold;
  color: var(--gold);
  background: #050b1c;
  border: 1.5px solid var(--gold);
  border-radius: 6px;
  padding: 8px 12px;
  display: inline-block;
  margin-bottom: 10px;
}

.poultry-desc {
  font-size: 18px;
  line-height: 1.55;
  color: var(--muted);
  white-space: pre-wrap;
}

.poultry-footer {
  border-top: 1px solid rgba(255, 215, 0, 0.35);
  padding-top: 10px;
  font-size: 16px;
  color: var(--muted);
}

#notice {
  position: fixed;
  top: 76px;
  left: 50%;
  transform: translateX(-50%);
  background: #0a1636;
  color: #ffffff;
  border: 2px solid var(--gold);
  padding: 12px 18px;
  border-radius: 6px;
  z-index: 100;
  display: none;
  font-size: 18px;
  text-align: center;
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="brand">AYNA BOOK <span class="star-1s">★</span></a>
  <a href="index.html" class="back-btn">🏠 হোম</a>
</header>

<div id="notice"></div>

<main class="container">
  <h1 class="page-title">🐔 পোলোট্রি কৃষক ও ব্যবসায়ী</h1>

  <!-- অটো আপডেট স্ট্যাটাস, মুদ্রা ও ফিল্টার -->
  <section class="gold-3d box-pad">
    <div id="poultryAutoStatus" class="auto-status-box">
      🔄 পোলোট্রি বাজার ও মুদ্রা হার অটো-আপডেট লোড হচ্ছে...
    </div>

    <div class="grid-2">
      <select id="poultryCurrencySelect">
        <option value="BDT">🇧🇩 বাংলাদেশ (টাকা ৳)</option>
        <option value="SAR">🇸🇦 সৌদি আরব (রিয়াল SAR)</option>
        <option value="AED">🇦🇪 সংযুক্ত আরব আমিরাত (দিরহাম AED)</option>
        <option value="GBP">🇬🇧 যুক্তরাজ্য (পাউন্ড £)</option>
        <option value="USD">🇺🇸 যুক্তরাষ্ট্র (ডলার USD)</option>
        <option value="INR">🇮🇳 ভারত (রুপি ₹)</option>
      </select>

      <select id="poultryCategoryFilter">
        <option value="ALL">🐔 সব ক্যাটাগরি</option>
        <option value="ব্রয়লার ও সোনালী মুরগি">ব্রয়লার ও সোনালী মুরগি</option>
        <option value="ডিম ও লেয়ার খামার">ডিম ও লেয়ার খামার</option>
        <option value="পোলোট্রি ফিড ও বাচ্চা (DOC)">পোলোট্রি ফিড ও বাচ্চা (DOC)</option>
        <option value="ভ্যাকসিন ও চিকিৎসা পরামর্শ">ভ্যাকসিন ও চিকিৎসা পরামর্শ</option>
        <option value="পোলোট্রি ব্যবসায়ী ও পাইকার">পোলোট্রি ব্যবসায়ী ও পাইকার</option>
      </select>
    </div>

    <div class="grid-2">
      <input id="poultryLocationFilter" type="text" placeholder="এলাকা বা দেশ (যেমন: চট্টগ্রাম, কক্সবাজার, ঢাকা)...">
      <input id="poultrySearch" type="text" placeholder="মুরগি, ডিম, ফিড, খামার বা ব্যবসায়ীর নাম খুঁজুন...">
    </div>

    <button id="refreshPoultryBtn" type="button" class="btn-gold-3d">
      🔄 আজকের পোলোট্রি দর অটো আপডেট করুন
    </button>
  </section>

  <!-- নতুন পোলোট্রি কৃষক বা ব্যবসায়ীর দর ও তথ্য যুক্ত করার ফর্ম -->
  <section class="gold-3d box-pad">
    <h2>➕ নতুন পোলোট্রি তথ্য বা দর যুক্ত করুন</h2>
    <div class="grid-2">
      <select id="poultryCategory">
        <option value="ব্রয়লার ও সোনালী মুরগি">ব্রয়লার ও সোনালী মুরগি</option>
        <option value="ডিম ও লেয়ার খামার">ডিম ও লেয়ার খামার</option>
        <option value="পোলোট্রি ফিড ও বাচ্চা (DOC)">পোলোট্রি ফিড ও বাচ্চা (DOC)</option>
        <option value="ভ্যাকসিন ও চিকিৎসা পরামর্শ">ভ্যাকসিন ও চিকিৎসা পরামর্শ</option>
        <option value="পোলোট্রি ব্যবসায়ী ও পাইকার">পোলোট্রি ব্যবসায়ী ও পাইকার</option>
      </select>
      <input id="poultryLocation" type="text" placeholder="এলাকা / বাজার (যেমন: বাংলাদেশ — চট্টগ্রাম)">
    </div>

    <div class="grid-2">
      <input id="poultryOwnerName" type="text" placeholder="কৃষক, খামারি বা ব্যবসায়ীর নাম...">
      <input id="poultryProductName" type="text" placeholder="পণ্যের নাম (যেমন: ব্রয়লার মুরগি, সোনালী, ডিম, ফিড)">
    </div>

    <div class="grid-2">
      <input id="poultryPriceBdt" type="number" step="0.01" placeholder="দাম (BDT টাকায়, ঐচ্ছিক)">
      <input id="poultryUnit" type="text" placeholder="একক (যেমন: প্রতি কেজি / প্রতি ১০০ পিস / প্রতি বস্তা)">
    </div>

    <input id="poultryTitle" type="text" placeholder="শিরোনাম (যেমন: ফার্মের ব্রয়লার মুরগি ও ডিমের পাইকারি দর)...">
    <input id="poultryPhone" type="text" placeholder="যোগাযোগের নম্বর / তথ্য (ঐচ্ছিক)">
    <textarea id="poultryDesc" rows="3" placeholder="খামার বা ব্যবসার বিবরণ, সরবরাহ সক্ষমতা বা অন্যান্য তথ্য লিখুন..."></textarea>
    <button id="addPoultryPostBtn" type="button" class="btn-gold-3d">
      🐔 পোলোট্রি তালিকায় প্রকাশ করুন
    </button>
  </section>

  <!-- পোলোট্রি কৃষক ও ব্যবসায়ী তালিকা -->
  <section id="poultryList" class="poultry-grid">
    <div class="gold-3d box-pad" style="grid-column:1/-1;text-align:center;">
      পোলোট্রি তথ্য লোড হচ্ছে...
    </div>
  </section>
</main>

<script type="module" src="./poultry-farmers.js"></script>
</body>
</html>
