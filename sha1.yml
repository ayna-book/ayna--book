
name: AYNA BOOK Android SHA-1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/sha1.yml"

permissions:
  contents: read

jobs:
  signing-report:
    name: Generate Android SHA-1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant Gradle Permission
        working-directory: android
        run: chmod +x gradlew

      - name: Generate Signing Report
        working-directory: android
        run: ./gradlew :app:signingReport
