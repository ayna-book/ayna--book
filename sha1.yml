
name: AYNA BOOK SHA Fingerprint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sha:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate SHA Fingerprints
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:signingReport
