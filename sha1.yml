name: AYNA BOOK SHA Fingerprint

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  sha:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        # আপনার অ্যান্ড্রয়েড ফোল্ডার ডিরেক্টরি অনুযায়ী রান করবে
        run: chmod +x gradlew
        working-directory: ./android # যদি প্রজেক্টের সব ফাইল android ফোল্ডারে থাকে

      - name: Run Gradle Signing Report
        run: ./gradlew signingReport
        working-directory: ./android # যদি প্রজেক্টের সব ফাইল android ফোল্ডারে থাকে