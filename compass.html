
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>AYNA Compass</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial;text-align:center}
header{padding:20px;color:#e9c65a}
main{height:calc(100dvh - 65px);display:flex;flex-direction:column;align-items:center;justify-content:space-around}
.compass{width:min(80vw,45vh);aspect-ratio:1;border:5px solid #d7b64b;border-radius:50%;position:relative;background:radial-gradient(circle,#17263d,#050912)}
.direction{position:absolute;font-size:22px;font-weight:bold}
.n{top:8px;left:48%;color:red}.s{bottom:8px;left:48%}
.e{right:12px;top:47%}.w{left:12px;top:47%}
.needle{position:absolute;left:50%;top:50%;width:5px;height:75%;background:linear-gradient(red 50%,white 50%);transform:translate(-50%,-50%)}
button{padding:14px 22px;background:#d7b64b;border:0;border-radius:8px}
</style>
</head>
<body>
<header><h2>AYNA BOOK COMPASS</h2></header>
<main>
<div class="compass">
<span class="direction n">N</span>
<span class="direction s">S</span>
<span class="direction e">E</span>
<span class="direction w">W</span>
<div class="needle" id="needle"></div>
</div>
<h2 id="heading">Direction: অপেক্ষমাণ</h2>
<button onclick="startCompass()">COMPASS চালু করুন</button>
</main>
<script>
async function startCompass(){
try{
if(typeof DeviceOrientationEvent!=="undefined" &&
typeof DeviceOrientationEvent.requestPermission==="function"){
const permission=await DeviceOrientationEvent.requestPermission();
if(permission!=="granted")throw new Error("Permission denied");
}
window.addEventListener("deviceorientation",e=>{
let angle;
if(typeof e.webkitCompassHeading==="number")angle=e.webkitCompassHeading;
else if(e.alpha!==null)angle=360-e.alpha;
else return;
needle.style.transform=`translate(-50%,-50%) rotate(${angle}deg)`;
heading.textContent="Direction: "+Math.round(angle)+"°";
});
}catch(e){heading.textContent="Compass পাওয়া যায়নি: "+e.message}
}
</script>
</body>
</html>
