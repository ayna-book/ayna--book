<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেডিসিন স্টোর - AYNA HEALTH</title>
    <style>
        body { background: #090a0f; color: #fff; font-family: sans-serif; padding: 20px; border: 3px solid #ffd700; min-height: 100vh; margin: 0; font-size: 18px; }
        .card { background: rgba(255,255,255,0.08); border: 2px solid #ffd700; border-radius: 14px; padding: 18px; margin-top: 15px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #111; border: 1.5px solid #ffd700; color: #fff; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .med-item { background: rgba(255,215,0,0.1); border: 1px solid #b8860b; padding: 12px; border-radius: 8px; margin-top: 10px; }
        a.back { color: #ffd700; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← হোমে ফিরে যান</a>
    <div class="card">
        <h2 style="color: #ffd700;">💊 AYNA মেডিসিন স্টোর</h2>
        <input type="text" id="search-med" placeholder="ওষুধের নাম দিয়ে খুঁজুন..." onkeyup="filterMedicine()">
        
        <div id="med-list">
            <div class="med-item"><strong>Napa Extra (নাপা এক্সট্রা)</strong> - প্যারাসিটামল | মূল্য: ৩.০০ টাকা</div>
            <div class="med-item"><strong>Seclo 20mg (সেকলো)</strong> - ওমিপ্রাজল | মূল্য: ৫.০০ টাকা</div>
            <div class="med-item"><strong>Monas 10mg (মোনাস)</strong> - মন্টেলুকাষ্ট | মূল্য: ১৫.০০ টাকা</div>
        </div>
    </div>

    <script>
        function filterMedicine() {
            let input = document.getElementById('search-med').value.toLowerCase();
            let items = document.getElementsByClassName('med-item');
            for (let i = 0; i < items.length; i++) {
                let text = items[i].textContent.toLowerCase();
                items[i].style.display = text.includes(input) ? "" : "none";
            }
        }
    </script>
</body>
</html>
