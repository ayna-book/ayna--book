
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071426">
<title>AYNA BOOK GPS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071426;color:white;font-family:Arial}
header{text-align:center;padding:20px;background:#102746;color:#eac75a}
main{height:calc(100dvh - 65px);padding:20px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.box{padding:20px;background:#122b49;border:1px solid #31577e;border-radius:12px;line-height:2;overflow-wrap:anywhere}
button{padding:15px;background:#eac75a;color:#101010;border:0;border-radius:8px;font-weight:bold}
a{color:#71caff}
</style>
</head>
<body>
<header><h2>AYNA BOOK GPS</h2></header>
<main>
<div class="box">
<div id="status">GPS বন্ধ আছে</div>
<div id="lat">Latitude: --</div>
<div id="lng">Longitude: --</div>
<div id="accuracy">Accuracy: --</div>
<div id="time">Updated: --</div>
</div>
<button onclick="startGPS()">GPS চালু করুন</button>
<button onclick="stopGPS()">GPS বন্ধ করুন</button>
<a id="map" href="#" target="_blank" hidden>Google Maps-এ দেখুন</a>
</main>
<script>
let watchId=null;
function startGPS(){
if(!navigator.geolocation){
status.textContent="এই ব্রাউজারে GPS সমর্থিত নয়";
return;
}
if(watchId!==null)return;
status.textContent="GPS খোঁজা হচ্ছে...";
watchId=navigator.geolocation.watchPosition(p=>{
const c=p.coords;
lat.textContent="Latitude: "+c.latitude;
lng.textContent="Longitude: "+c.longitude;
accuracy.textContent="Accuracy: "+c.accuracy+" মিটার";
time.textContent="Updated: "+new Date().toLocaleTimeString();
map.href="https://www.google.com/maps?q="+c.latitude+","+c.longitude;
map.hidden=false;
status.textContent="GPS CONNECTED";
},e=>{
status.textContent="GPS Error: "+e.message;
},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function stopGPS(){
if(watchId!==null)navigator.geolocation.clearWatch(watchId);
watchId=null;
status.textContent="GPS বন্ধ করা হয়েছে";
}
</script>
</body>
</html>
