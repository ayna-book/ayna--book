<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লাইভ জিপিএস - AYNA GPS</title>
    <style>
        body { background: #090a0f; color: #fff; font-family: sans-serif; padding: 20px; border: 3px solid #ffd700; min-height: 100vh; margin: 0; font-size: 18px; }
        .card { background: rgba(255,255,255,0.08); border: 2px solid #ffd700; border-radius: 14px; padding: 20px; text-align: center; margin-top: 20px; }
        button { padding: 14px 24px; background: #ffd700; color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 15px; }
        a.back { color: #ffd700; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
        #coords { margin-top: 18px; font-size: 1.1rem; color: #ffd700; line-height: 1.6; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← হোমে ফিরে যান</a>
    <div class="card">
        <h2 style="color: #ffd700;">📍 AYNA লাইভ জিপিএস</h2>
        <p>আপনার বর্তমান অবস্থান জানতে নিচের বাটনে চাপ দিন</p>
        <button onclick="getLocation()">লোকেশন বের করুন</button>
        <div id="coords">অপেক্ষা করা হচ্ছে...</div>
    </div>

    <script>
        function getLocation() {
            const output = document.getElementById('coords');
            if (!navigator.geolocation) {
                output.textContent = "আপনার ব্রাউজারে জিপিএস সাপোর্ট নেই।";
                return;
            }
            output.textContent = "লোকেশন খোঁজা হচ্ছে...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude.toFixed(6);
                    const lon = pos.coords.longitude.toFixed(6);
                    output.innerHTML = `
                        অক্ষাংশ (Latitude): <strong>${lat}</strong><br>
                        দ্রাঘিমাংশ (Longitude): <strong>${lon}</strong><br><br>
                        <a href="https://maps.google.com/?q=${lat},${lon}" target="_blank" style="color:#00ffcc; text-decoration:underline;">গুগল ম্যাপে দেখুন</a>
                    `;
                },
                (err) => {
                    output.textContent = "লোকেশন পারমিশন চালু করুন। (" + err.message + ")";
                }
            );
        }
    </script>
</body>
</html>
