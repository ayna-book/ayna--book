<!-- AYNA BOOK AI Translator -->
<section class="ai-translator">
  <h2>🌐 AYNA BOOK AI Translator</h2>
  <p>বিশ্বের বিভিন্ন ভাষায় বার্তা অনুবাদ করুন।</p>

  <label for="translateInput">আপনার বার্তা</label>
  <textarea
    id="translateInput"
    maxlength="2000"
    rows="4"
    placeholder="এখানে বার্তা লিখুন..."
  ></textarea>

  <label for="targetLanguage">যে ভাষায় অনুবাদ করবেন</label>
  <select id="targetLanguage">
    <option value="en">English — ইংরেজি</option>
    <option value="bn">বাংলা — Bengali</option>
    <option value="ar">العربية — আরবি</option>
    <option value="hi">हिन्दी — হিন্দি</option>
    <option value="ur">اردو — উর্দু</option>
    <option value="fr">Français — ফরাসি</option>
    <option value="es">Español — স্প্যানিশ</option>
    <option value="zh">中文 — চীনা</option>
    <option value="pt">Português — পর্তুগিজ</option>
    <option value="ru">Русский — রুশ</option>
  </select>

  <button id="aiTranslateButton" type="button">
    ✨ AI দিয়ে অনুবাদ করুন
  </button>

  <p id="aiTranslateStatus" role="status" aria-live="polite"></p>

  <label for="translatedOutput">অনুবাদের ফলাফল</label>
  <textarea
    id="translatedOutput"
    rows="4"
    readonly
    placeholder="অনুবাদ এখানে দেখা যাবে..."
  ></textarea>

  <button id="copyTranslationButton" type="button">
    📋 অনুবাদ কপি করুন
  </button>
</section>

<style>
  .ai-translator {
    margin: 20px 0;
    padding: 18px;
    border-radius: 18px;
    background: linear-gradient(135deg, #071b49, #512b81);
    color: white;
  }

  .ai-translator label {
    display: block;
    margin: 14px 0 7px;
  }

  .ai-translator textarea,
  .ai-translator select {
    box-sizing: border-box;
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    font: inherit;
  }

  .ai-translator button {
    width: 100%;
    margin-top: 12px;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(90deg, #ff4fa3, #8b5cf6, #35d9ef);
    color: white;
    font-weight: bold;
  }
</style>

<script type="module" src="./js/translator.js"></script>
