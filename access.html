<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AYNA BOOK ACCESS</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #080808;
      color: #d4af37;
      font-family: Arial, sans-serif;
    }

    .box {
      max-width: 430px;
      margin: 35px auto;
      padding: 22px;
      background: #171717;
      border: 1px solid #d4af37;
      border-radius: 12px;
    }

    h2 { text-align: center; }

    select, input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 10px 0;
      border-radius: 7px;
    }

    select, input {
      background: #080808;
      color: white;
      border: 1px solid #d4af37;
    }

    button {
      background: #d4af37;
      color: #080808;
      border: 0;
      font-weight: bold;
    }

    #message {
      color: white;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>AYNA BOOK ACCESS</h2>

    <label for="tier">Account Type</label>
    <select id="tier">
      <option value="business">BUSINESS</option>
      <option value="vip">VIP</option>
      <option value="vvip">VVIP</option>
    </select>

    <label for="accessCode">Access Code</label>
    <input
      id="accessCode"
      type="text"
      maxlength="18"
      placeholder="আপনার Access Code লিখুন"
      autocomplete="off"
    >

    <button id="redeemButton">VERIFY ACCESS</button>

    <p id="message"></p>
  </div>

  <script type="module" src="./access.js"></script>
</body>
</html>
