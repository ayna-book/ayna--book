<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060d21">
<title>AYNA BOOK — বিশ্ব ঘড়ি ও AI সিগন্যাল</title>
<style>
:root {
  --bg:#050a18;
  --navy-top:#1a3575;
  --navy-bottom:#08122b;
  --gold:#ffe64d;
  --gold-bright:#fff6b3;
  --gold-base:#8a6105;
  --quantum-cyan:#38f2ff;
  --white:#ffffff;
  --muted:#e6eeff;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--white);
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  font-size:34px;
  line-height:1.5;
}
button,input { font:inherit; cursor:pointer; }
header {
  background:linear-gradient(180deg,#122659 0%,#060d21 100%);
  border-bottom:4px solid var(--gold);
  padding:20px;
  position:sticky;
  top:0;
  z-index:50;
}
.header-inner {
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.logo { color:var(--gold-bright); font-size:42px; font-weight:1000; text-decoration:none; }
.nav-btns { display:flex; gap:10px; flex-wrap:wrap; }
.nav-btns a, .nav-btns button {
  text-decoration:none;
  color:#fff;
  background:linear-gradient(155deg,#1d3b7e,#08122b);
  border:3px solid var(--gold);
  border-radius:8px;
  padding:10px 16px;
  font-size:24px;
  font-weight:bold;
}
.container { max-width:1100px; margin:auto; padding:22px; }
.panel {
  background:linear-gradient(155deg,var(--navy-top) 0%,var(--navy-bottom) 100%);
  border:4px solid var(--gold);
  border-radius:10px;
  padding:26px;
  margin-bottom:24px;
  box-shadow:0 0 18px rgba(255,230,77,.65), 0 9px 0 var(--gold-base);
}
.clock-time {
  font-size:52px;
  font-weight:1000;
  color:var(--quantum-cyan);
  text-align:center;
  display:block;
  margin:14px 0;
}
.btn-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  margin-top:16px;
}
.action-btn {
  min-height:80px;
  border-radius:8px;
  border:3px solid var(--gold);
  background:linear-gradient(155deg,#1d3b7e,#08122b);
  color:#fff;
  font-size:27px;
  font-weight:bold;
}
.primary-btn {
  width:100%;
  min-height:86px;
  margin-top:14px;
  border-radius:8px;
  border:3.5px solid var(--gold-bright);
  background:linear-gradient(180deg,#ffe64d 0%,#c99314 100%);
  color:#050a18;
  font-size:30px;
  font-weight:1000;
}
.ai-out {
  margin-top:16px;
  background:#050b1c;
  border:3px solid var(--quantum-cyan);
  border-radius:8px;
  padding:18px;
  font-size:28px;
  color:var(--gold-bright);
  white-space:pre-line;
}
@media(max-width:600px) { .btn-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a class="logo" href="index.html">AYNA BOOK ★</a>
    <div class="nav-btns">
      <button type="button" id="topSpeakBtn">🕒 সময় বলুন</button>
      <button type="button" id="topToggleBtn">🔊 ঘড়ি: চালু</button>
      <a href="index.html">🏠 হোম</a>
      <a href="radio-tv.html">📻 রেডিও-টিভি</a>
    </div>
  </div>
</header>

<main class="container">
  <section class="panel">
    <h2>🕒 বিশ্ব ঘড়ি — প্রতি ১ ঘণ্টা পর পর ও এখনই সময় ঘোষণা</h2>
    <span class="clock-time" id="liveClock">লোড হচ্ছে...</span>
    <div class="btn-grid">
      <button type="button" class="action-btn" id="speakNowBtn">🎙️ এখনই সময় বলুন</button>
      <button type="button" class="action-btn" id="toggleClockBtn">🔊 সময় বলা: চালু</button>
      <button type="button" class="action-btn" id="openClockBtn">🟢 ঘড়ি চালু (খোলা)</button>
      <button type="button" class="action-btn" id="closeClockBtn">🔴 ঘড়ি বন্ধ</button>
    </div>
    <div class="ai-out" id="clockAiBox">
      প্রতি ১ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে সময় বলবে। যেকোনো সময় "এখনই সময় বলুন" চাপুন।
    </div>
  </section>
</main>

<script type="module">
import { AynaAiSignal } from "./ayna-ai-signal.js";
const $ = id => document.getElementById(id);

function syncButtons() {
  const label = AynaAiSignal.clockEnabled ? "🔊 সময় বলা: চালু" : "🔇 সময় বলা: বন্ধ";
  if ($("toggleClockBtn")) $("toggleClockBtn").textContent = label;
  if ($("topToggleBtn")) $("topToggleBtn").textContent = AynaAiSignal.clockEnabled ? "🔊 ঘড়ি: চালু" : "🔇 ঘড়ি: বন্ধ";
}

AynaAiSignal.startHourlyClock(now => {
  if ($("liveClock")) {
    $("liveClock").textContent = now.toLocaleTimeString("bn-BD", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: true
    });
  }
  syncButtons();
});

$("speakNowBtn")?.addEventListener("click", () => {
  AynaAiSignal.speakNow();
  $("clockAiBox").textContent = `🤖 AI সিগন্যাল: এখন সময় ${AynaAiSignal.formatBanglaTime(new Date())} ঘোষণা করা হয়েছে।`;
});
$("topSpeakBtn")?.addEventListener("click", () => AynaAiSignal.speakNow());
$("toggleClockBtn")?.addEventListener("click", () => {
  AynaAiSignal.setClockEnabled(!AynaAiSignal.clockEnabled, true);
  syncButtons();
});
$("topToggleBtn")?.addEventListener("click", () => {
  AynaAiSignal.setClockEnabled(!AynaAiSignal.clockEnabled, true);
  syncButtons();
});
$("openClockBtn")?.addEventListener("click", () => {
  AynaAiSignal.setClockEnabled(true, true);
  syncButtons();
});
$("closeClockBtn")?.addEventListener("click", () => {
  AynaAiSignal.setClockEnabled(false, false);
  syncButtons();
});
</script>
</body>
</html>
