<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060d21">
<title>AYNA BOOK — বিশ্ব গার্মেন্টস মালিক ও শ্রমিক</title>

<style>
:root {
  --bg: #050a18;
  --navy-top: #172e63;
  --navy-bottom: #08122b;
  --gold: #ffd700;
  --gold-base: #755206;
  --white: #ffffff;
  --muted: #dce6fa;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: Arial, "Noto Sans Bengali", sans-serif;
  font-size: 20px;
  padding-bottom: 80px;
}

.gold-3d {
  background: linear-gradient(155deg, var(--navy-top) 0%, var(--navy-bottom) 100%);
  border: 2.5px solid var(--gold);
  border-radius: 6px;
  box-shadow:
    0 7px 0 var(--gold-base),
    0 12px 22px rgba(0, 0, 0, 0.8),
    inset 0 2px 3px rgba(255, 242, 166, 0.5);
}

header {
  background: linear-gradient(180deg, #0f1f47 0%, #060d21 100%);
  border-bottom: 2.5px solid var(--gold);
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 50;
}

.brand {
  color: var(--gold);
  font-size: 24px;
  font-weight: 1000;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.star-1s {
  color: #ffffff;
  font-size: 26px;
  display: inline-block;
  animation: starFlash1s 1s infinite alternate ease-in-out;
}

@keyframes starFlash1s {
  0% { transform: scale(0.95); text-shadow: 0 0 6px #ffd700; }
  100% { transform: scale(1.35); text-shadow: 0 0 14px #ffffff, 0 0 32px #ffd700; }
}

.back-btn {
  text-decoration: none;
  background: linear-gradient(180deg, #ffd700 0%, #c99314 100%);
  color: #050a18;
  font-weight: 1000;
  font-size: 17px;
  padding: 8px 14px;
  border-radius: 6px;
  border: 1.5px solid #fff2a6;
  box-shadow: 0 4px 0 #664604;
}

.container {
  max-width: 1050px;
  margin: 18px auto;
  padding: 0 14px;
}

.page-title {
  font-size: 28px;
  font-weight: 1000;
  color: var(--gold);
  margin-bottom: 16px;
}

.box-pad {
  padding: 18px;
  margin-bottom: 20px;
}

.box-pad h2 {
  color: var(--gold);
  font-size: 23px;
  margin-bottom: 12px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(1, minmax(0, 1fr));
  gap: 12px;
}

@media(min-width: 650px) {
  .grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

input, select, textarea {
  width: 100%;
  background: #050b1c;
  color: var(--white);
  border: 2px solid var(--gold);
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 19px;
  margin-bottom: 12px;
}

.btn-gold-3d {
  width: 100%;
  min-height: 56px;
  background: linear-gradient(180deg, #ffd700 0%, #c99314 100%);
  color: #050a18;
  font-size: 21px;
  font-weight: 1000;
  border: 2px solid #fff2a6;
  border-radius: 6px;
  box-shadow: 0 5px 0 #664604;
  cursor: pointer;
}

.btn-gold-3d:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #664604;
}

.garments-grid {
  display: grid;
  grid-template-columns: repeat(1, minmax(0, 1fr));
  gap: 16px;
}

@media(min-width: 750px) {
  .garments-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.garment-card {
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
}

.garment-badge {
  display: inline-block;
  background: #050b1c;
  color: var(--gold);
  border: 1.5px solid var(--gold);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 8px;
}

.garment-name {
  font-size: 23px;
  font-weight: 1000;
  color: var(--white);
  margin-bottom: 6px;
}

.garment-role {
  font-size: 18px;
  font-weight: bold;
  color: var(--gold);
  margin-bottom: 8px;
}

.garment-info {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin-bottom: 6px;
  white-space: pre-wrap;
}

.garment-footer {
  border-top: 1px solid rgba(255, 215, 0, 0.35);
  padding-top: 10px;
  font-size: 15px;
  color: var(--muted);
}

#notice {
  position: fixed;
  top: 76px;
  left: 50%;
  transform: translateX(-50%);
  background: #0a1636;
  color: #ffffff;
  border: 2px solid var(--gold);
  padding: 12px 18px;
  border-radius: 6px;
  z-index: 100;
  display: none;
  font-size: 18px;
  text-align: center;
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="brand">AYNA BOOK <span class="star-1s">★</span></a>
  <a href="index.html" class="back-btn">🏠 হোম</a>
</header>

<div id="notice"></div>

<main class="container">
  <h1 class="page-title">👕 বিশ্ব গার্মেন্টস মালিক ও শ্রমিক</h1>

  <!-- ফিল্টার ও অনুসন্ধান -->
  <section class="gold-3d box-pad">
    <h2>🔍 ক্যাটাগরি, দেশ বা দক্ষতা দিয়ে খুঁজুন</h2>
    <div class="grid-2">
      <select id="garmentCategoryFilter">
        <option value="ALL">🌐 সব ক্যাটাগরি (মালিক ও শ্রমিক)</option>
        <option value="গার্মেন্টস মালিক / বায়ার">গার্মেন্টস মালিক / বায়ার</option>
        <option value="গার্মেন্টস শ্রমিক / অপারেটর">গার্মেন্টস শ্রমিক / অপারেটর</option>
        <option value="কাটিং, সুইং ও ফিনিশিং">কাটিং, সুইং ও ফিনিশিং</option>
        <option value="মার্চেন্ডাইজিং ও কোয়ালিটি">মার্চেন্ডাইজিং ও কোয়ালিটি</option>
        <option value="টেক্সটাইল ও অ্যাক্সেসরিজ">টেক্সটাইল ও অ্যাক্সেসরিজ</option>
      </select>

      <input id="garmentCountryFilter" type="text" placeholder="দেশ বা এলাকা (যেমন: বাংলাদেশ, ভিয়েতনাম, তুরস্ক, চীন)...">
    </div>

    <input id="garmentSearchInput" type="text" placeholder="নাম, ফ্যাক্টরি, দক্ষতা, ফোন বা ইমেইল খুঁজুন...">
  </section>

  <!-- নতুন গার্মেন্টস মালিক বা শ্রমিকের তথ্য যুক্ত করার ফর্ম -->
  <section class="gold-3d box-pad">
    <h2>➕ নতুন গার্মেন্টস মালিক বা শ্রমিকের তথ্য যুক্ত করুন</h2>
    <div class="grid-2">
      <select id="newGarmentCategory">
        <option value="গার্মেন্টস মালিক / বায়ার">গার্মেন্টস মালিক / বায়ার</option>
        <option value="গার্মেন্টস শ্রমিক / অপারেটর">গার্মেন্টস শ্রমিক / অপারেটর</option>
        <option value="কাটিং, সুইং ও ফিনিশিং">কাটিং, সুইং ও ফিনিশিং</option>
        <option value="মার্চেন্ডাইজিং ও কোয়ালিটি">মার্চেন্ডাইজিং ও কোয়ালিটি</option>
        <option value="টেক্সটাইল ও অ্যাক্সেসরিজ">টেক্সটাইল ও অ্যাক্সেসরিজ</option>
      </select>

      <input id="newGarmentCountry" type="text" placeholder="দেশ ও এলাকা (যেমন: বাংলাদেশ — চট্টগ্রাম / ঢাকা)">
    </div>

    <div class="grid-2">
      <input id="newGarmentName" type="text" placeholder="নাম বা প্রতিষ্ঠানের নাম...">
      <input id="newGarmentRole" type="text" placeholder="পদবি বা দক্ষতা (যেমন: ফ্যাক্টরি মালিক / সুইং অপারেটর / QC)">
    </div>

    <div class="grid-2">
      <input id="newGarmentContact" type="text" placeholder="ফোন / হোয়াটসঅ্যাপ / ইমেইল (ঐচ্ছিক)">
      <input id="newGarmentNeed" type="text" placeholder="চাহিদা বা অভিজ্ঞতা (যেমন: অর্ডার প্রয়োজন / কাজের সুযোগ খুঁজছি)">
    </div>

    <textarea id="newGarmentDesc" rows="3" placeholder="ফ্যাক্টরি, উৎপাদন ক্ষমতা, অভিজ্ঞতা বা যোগাযোগের বিস্তারিত লিখুন..."></textarea>
    <button id="addGarmentBtn" type="button" class="btn-gold-3d">
      📌 গার্মেন্টস তালিকায় যুক্ত করুন
    </button>
  </section>

  <!-- তালিকা -->
  <section id="worldGarmentsList" class="garments-grid">
    <div class="gold-3d box-pad" style="grid-column:1/-1;text-align:center;">
      গার্মেন্টস তথ্য লোড হচ্ছে...
    </div>
  </section>
</main>

<script type="module" src="./world-garments.js"></script>
</body>
</html>
