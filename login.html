
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0f">
  <title>AYNA BOOK — Login</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#090a0f;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
    .container{width:100%;max-width:460px;background:#101116;border:1px solid #b99a45;border-radius:15px;padding:30px}
    h1{text-align:center;color:#e3c46d;letter-spacing:3px}
    .sub{text-align:center;color:#aaa;margin-bottom:28px}
    label{display:block;margin:17px 0 7px;color:#e5d7ae}
    input{width:100%;padding:14px;background:#08090d;color:white;border:1px solid #806c39;border-radius:7px;font-size:16px}
    button{width:100%;padding:14px;margin-top:18px;border:1px solid #d6b65c;border-radius:7px;background:#b8953e;color:#090a0f;font-weight:bold;font-size:16px;cursor:pointer}
    button:disabled{opacity:.5}
    .secondary{background:transparent;color:#e3c46d}
    a{color:#e3c46d}
    .message{text-align:center;margin-top:15px;line-height:1.5;overflow-wrap:anywhere}
    .links{text-align:center;margin-top:18px;line-height:2}
  </style>
</head>
<body>
  <main class="container">
    <h1>✦ AYNA BOOK</h1>
    <p class="sub">Welcome back</p>

    <form id="loginForm">
      <label for="email">Gmail Address</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="loginButton" type="submit">LOGIN</button>
    </form>

    <p id="statusMessage" class="message" role="status" aria-live="polite"></p>

    <div class="links">
      <a href="./forgot-password.html">Forgot Password?</a><br>
      <a href="./signup.html">Create New Account</a>
    </div>
    <button class="secondary" type="button" onclick="location.href='./index.html'">Back to Home</button>
  </main>
  <script type="module" src="./login.js"></script>
</body>
</html>
