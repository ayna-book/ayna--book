<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AYNA BOOK — Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* =====================================================
       FULL SCREEN CONTAINER
    ===================================================== */

    .auth-page {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding:
        max(25px, env(safe-area-inset-top))
        20px
        max(25px, env(safe-area-inset-bottom))
        20px;

      background:
        radial-gradient(
          circle at top,
          #171717 0%,
          #080808 42%,
          #000 100%
        );
    }

    /* =====================================================
       MAIN CONTENT
    ===================================================== */

    .auth-container {
      width: 100%;
      max-width: 460px;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 25px 20px;
    }

    /* =====================================================
       LOGO
    ===================================================== */

    .logo {
      width: 82px;
      height: 82px;

      border: 2px solid #d4af37;
      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      margin-bottom: 18px;

      color: #d4af37;

      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;

      box-shadow:
        0 0 20px rgba(212, 175, 55, 0.18),
        inset 0 0 15px rgba(212, 175, 55, 0.08);
    }

    .brand-name {
      color: #d4af37;

      font-size: 30px;
      font-weight: 800;

      letter-spacing: 4px;

      text-align: center;

      margin-bottom: 7px;
    }

    .brand-subtitle {
      color: #999;

      font-size: 13px;

      text-align: center;

      margin-bottom: 35px;

      letter-spacing: 1px;
    }

    /* =====================================================
       LOGIN BOX
    ===================================================== */

    .auth-box {
      width: 100%;

      background: rgba(15, 15, 15, 0.96);

      border: 1px solid #292929;

      border-radius: 18px;

      padding: 28px 22px;

      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.55),
        0 0 25px rgba(212, 175, 55, 0.04);
    }

    .title {
      color: #fff;

      font-size: 25px;
      font-weight: 700;

      text-align: center;

      margin-bottom: 8px;
    }

    .description {
      color: #888;

      font-size: 13px;

      text-align: center;

      margin-bottom: 28px;
    }

    /* =====================================================
       FORM
    ===================================================== */

    .form-group {
      width: 100%;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;

      color: #d4af37;

      font-size: 13px;
      font-weight: 600;

      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;

      height: 52px;

      padding: 0 15px;

      background: #090909;

      color: #fff;

      border: 1px solid #303030;

      border-radius: 10px;

      outline: none;

      font-size: 15px;

      transition: 0.25s ease;
    }

    .form-group input:focus {
      border-color: #d4af37;

      box-shadow:
        0 0 0 2px rgba(212, 175, 55, 0.08);
    }

    .form-group input::placeholder {
      color: #666;
    }

    /* =====================================================
       FORGOT PASSWORD
    ===================================================== */

    .forgot-row {
      width: 100%;

      display: flex;
      justify-content: flex-end;

      margin-top: -5px;
      margin-bottom: 20px;
    }

    .forgot-link {
      color: #d4af37;

      font-size: 13px;

      text-decoration: none;

      cursor: pointer;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* =====================================================
       LOGIN BUTTON
    ===================================================== */

    .login-button {
      width: 100%;

      height: 54px;

      border: none;

      border-radius: 10px;

      background: #d4af37;

      color: #000;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;

      transition: 0.2s ease;

      box-shadow:
        0 8px 20px rgba(212, 175, 55, 0.15);
    }

    .login-button:hover {
      background: #e2c158;
    }

    .login-button:active {
      transform: scale(0.98);
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =====================================================
       STATUS MESSAGE
    ===================================================== */

    #message {
      width: 100%;

      margin-top: 15px;

      padding: 11px;

      border-radius: 8px;

      text-align: center;

      font-size: 13px;

      display: none;
    }

    /* =====================================================
       REGISTER LINK
    ===================================================== */

    .bottom-text {
      text-align: center;

      color: #888;

      font-size: 13px;

      margin-top: 25px;
    }

    .register-link {
      color: #d4af37;

      text-decoration: none;

      font-weight: 700;

      margin-left: 4px;
    }

    .register-link:hover {
      text-decoration: underline;
    }

    /* =====================================================
       FOOTER
    ===================================================== */

    .footer {
      margin-top: 30px;

      text-align: center;

      color: #555;

      font-size: 11px;

      letter-spacing: 0.5px;
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 480px) {

      .auth-page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .auth-container {
        padding-left: 5px;
        padding-right: 5px;
      }

      .logo {
        width: 72px;
        height: 72px;

        font-size: 24px;
      }

      .brand-name {
        font-size: 26px;
        letter-spacing: 3px;
      }

      .brand-subtitle {
        margin-bottom: 27px;
      }

      .auth-box {
        padding: 24px 18px;
        border-radius: 15px;
      }

      .title {
        font-size: 23px;
      }
    }

    /* =====================================================
       SMALL HEIGHT DEVICES
    ===================================================== */

    @media (max-height: 650px) {

      .auth-page {
        align-items: flex-start;
      }

      .auth-container {
        padding-top: 20px;
        padding-bottom: 20px;
      }

      .logo {
        width: 58px;
        height: 58px;

        font-size: 20px;

        margin-bottom: 10px;
      }

      .brand-name {
        font-size: 23px;
      }

      .brand-subtitle {
        margin-bottom: 20px;
      }

      .auth-box {
        padding-top: 20px;
        padding-bottom: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="auth-page">

    <div class="auth-container">

      <!-- =================================================
           AYNA BOOK LOGO
      ================================================== -->

      <div class="logo">
        AB
      </div>

      <div class="brand-name">
        AYNA BOOK
      </div>

      <div class="brand-subtitle">
        CONNECT • SHARE • DISCOVER
      </div>


      <!-- =================================================
           LOGIN BOX
      ================================================== -->

      <section class="auth-box">

        <h1 class="title">
          Welcome Back
        </h1>

        <p class="description">
          Sign in to your AYNA BOOK account
        </p>


        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <form id="loginForm">

          <div class="form-group">

            <label for="email">
              Email Address
            </label>

            <input
              id="email"
              name="email"
              type="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >

          </div>


          <div class="form-group">

            <label for="password">
              Password
            </label>

            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

          </div>


          <!-- Forgot Password -->

          <div class="forgot-row">

            <a
              href="./forgot-password.html"
              class="forgot-link"
            >
              Forgot Password?
            </a>

          </div>


          <!-- Login Button -->

          <button
            id="loginButton"
            class="login-button"
            type="submit"
          >
            LOGIN
          </button>


          <!-- Status -->

          <div id="message"></div>

        </form>


        <!-- =================================================
             REGISTER
        ================================================== -->

        <div class="bottom-text">

          Don't have an account?

          <a
            href="./register.html"
            class="register-link"
          >
            Create Account
          </a>

        </div>

      </section>


      <!-- =================================================
           FOOTER
      ================================================== -->

      <div class="footer">
        © 2026 AYNA BOOK. All Rights Reserved.
      </div>

    </div>

  </main>


  <!-- =====================================================
       LOGIN JAVASCRIPT
  ===================================================== -->

  <script
    type="module"
    src="./login.js"
  ></script>

</body>
</html>
