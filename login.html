
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>AYNA BOOK - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #080808;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 18px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 76px;
      height: 76px;
      border: 2px solid #d4af37;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      color: #d4af37;
      font-size: 27px;
      font-weight: bold;
      box-shadow: 0 0 18px #d4af3730;
    }

    .brand h1 {
      color: #d4af37;
      font-size: 28px;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .brand p {
      color: #888888;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .login-box {
      width: 100%;
      padding: 35px 28px;
      background: #101010;
      border: 1px solid #292929;
      border-radius: 18px;
      box-shadow: 0 10px 40px #00000080;
    }

    .login-heading {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-heading h2 {
      font-size: 27px;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .login-heading p {
      color: #888888;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 23px;
    }

    .form-group label {
      display: block;
      color: #d4af37;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .form-group input {
      width: 100%;
      height: 58px;
      padding: 0 16px;
      background: #080808;
      border: 1px solid #333333;
      border-radius: 10px;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 8px #d4af3725;
    }

    .form-group input::placeholder {
      color: #777777;
    }

    .forgot {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 25px;
    }

    .forgot a {
      color: #d4af37;
      text-decoration: none;
      font-size: 13px;
    }

    .login-button {
      width: 100%;
      height: 58px;
      background: #d4af37;
      color: #080808;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 18px #d4af3730;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 17px;
      font-size: 14px;
      color: #ffffff;
      overflow-wrap: anywhere;
    }

    .register-link {
      text-align: center;
      margin-top: 28px;
      color: #888888;
      font-size: 14px;
    }

    .register-link a {
      color: #d4af37;
      font-weight: bold;
      text-decoration: none;
      margin-left: 5px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #666666;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 25px 14px;
        align-items: center;
      }

      .container {
        max-width: 100%;
      }

      .brand {
        margin-bottom: 24px;
      }

      .logo {
        width: 68px;
        height: 68px;
      }

      .brand h1 {
        font-size: 25px;
      }

      .login-box {
        padding: 30px 22px;
        border-radius: 16px;
      }

      .login-heading h2 {
        font-size: 25px;
      }

      .form-group input {
        height: 56px;
        font-size: 16px;
      }

      .login-button {
        height: 58px;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <div class="container">

      <header class="brand">
        <div class="logo">AB</div>

        <h1>AYNA BOOK</h1>

        <p>CONNECT · SHARE · DISCOVER</p>
      </header>

      <section class="login-box">

        <div class="login-heading">
          <h2>Welcome Back</h2>
          <p>Sign in to your AYNA BOOK account</p>
        </div>

        <form id="loginForm">

          <div class="form-group">
            <label for="email">Email Address *</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >
          </div>

          <div class="form-group">
            <label for="password">Password *</label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
          </div>

          <div class="forgot">
            <a href="./forgot-password.html">
              Forgot Password?
            </a>
          </div>

          <button
            type="submit"
            id="loginButton"
            class="login-button"
          >
            LOGIN
          </button>

          <p id="message" aria-live="polite"></p>

        </form>

        <div class="register-link">
          Don't have an account?
          <a href="./register.html">Create Account</a>
        </div>

      </section>

      <footer class="footer">
        © 2026 AYNA BOOK. All Rights Reserved.
      </footer>

    </div>
  </main>

  <script type="module" src="./login.js"></script>

</body>
</html>
