
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>AYNA BOOK - Login</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:18px;
 display:flex;align-items:center;justify-content:center;
 background:#101827;color:white;font-family:Arial,sans-serif
}
.container{
 width:100%;max-width:450px;padding:25px 20px;
 background:#1b2638;border:1px solid #34445c;
 border-radius:18px;box-shadow:0 10px 30px #0008
}
.logo{text-align:center;color:#e8bd55;font-size:32px;font-weight:bold}
h2{text-align:center;margin:12px 0 25px}
label{display:block;margin:15px 0 7px;color:#e8bd55}
input{
 width:100%;padding:14px;border:1px solid #52627a;
 border-radius:9px;background:#101827;color:white;font-size:16px
}
.password{display:flex;gap:7px}
.password input{flex:1;min-width:0}
.password button{
 border:0;border-radius:8px;background:#34445c;color:white;padding:0 12px
}
#loginBtn{
 width:100%;padding:14px;margin-top:22px;
 border:0;border-radius:9px;background:#e8bd55;
 color:#101827;font-size:17px;font-weight:bold
}
#loginBtn:disabled{opacity:.6}
#statusMsg{text-align:center;margin-top:15px;overflow-wrap:anywhere}
a{color:#e8bd55;text-decoration:none}
.links{text-align:center;margin-top:20px;line-height:2}
</style>
</head>

<body>
<main class="container">
 <div class="logo">AYNA BOOK</div>
 <h2>Login to Your Account</h2>

 <form id="loginForm">
  <label for="email">Email Address</label>
  <input id="email" type="email" autocomplete="email" required>

  <label for="password">Password</label>
  <div class="password">
   <input id="password" type="password"
    autocomplete="current-password" required>
   <button type="button" id="togglePassword">Show</button>
  </div>

  <button id="loginBtn" type="submit">Login</button>
  <div id="statusMsg" role="status" aria-live="polite"></div>
 </form>

 <div class="links">
  <a href="./forgot-password.html">Forgot Password?</a><br>
  Don't have an account? <a href="./register.html">Register</a>
 </div>
</main>

<script>
document.getElementById("togglePassword").addEventListener("click",function(){
 const p=document.getElementById("password");
 p.type=p.type==="password"?"text":"password";
 this.textContent=p.type==="password"?"Show":"Hide";
});
</script>
<script type="module" src="./login.js"></script>
</body>
</html>
