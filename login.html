<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0F1E">

  <title>AYNA BOOK — Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #0A0F1E;
      color: #ffffff;

      font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-title {
      color: #ffffff;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .logo-subtitle {
      margin-top: 7px;
      color: #A9B0BC;
      font-size: 14px;
    }

    .card {
      padding: 28px 22px;

      background: #1A2233;
      border: 1px solid #2d3748;
      border-radius: 18px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;

      text-align: center;

      color: #FFD700;
      font-size: 25px;
    }

    .description {
      margin: 0 0 24px;

      text-align: center;

      color: #A9B0BC;
      font-size: 14px;
      line-height: 1.6;
    }

    .message {
      display: none;

      margin-bottom: 18px;
      padding: 12px 14px;

      border-radius: 9px;

      font-size: 13px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(46, 204, 113, 0.10);
      border: 1px solid #2ECC71;
      color: #2ECC71;
    }

    .message.error {
      background: rgba(255, 70, 70, 0.10);
      border: 1px solid #ff5555;
      color: #ff7777;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #ffffff;

      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 48px;

      padding: 0 14px;

      background: #0A0F1E;
      color: #ffffff;

      border: 1px solid #4A4A2A;
      border-radius: 10px;

      outline: none;

      font-size: 15px;

      transition: 0.2s ease;
    }

    input:focus {
      border-color: #FFD700;

      box-shadow:
        0 0 0 3px rgba(255, 215, 0, 0.10);
    }

    input::placeholder {
      color: #737b89;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 75px;
    }

    .toggle-password {
      position: absolute;

      top: 50%;
      right: 8px;

      transform: translateY(-50%);

      height: 34px;
      padding: 0 10px;

      border: 0;
      border-radius: 7px;

      background: transparent;
      color: #FFD700;

      cursor: pointer;

      font-size: 12px;
    }

    .toggle-password:hover {
      background: rgba(255, 215, 0, 0.08);
    }

    .forgot-password {
      display: block;

      margin-top: -5px;
      margin-bottom: 20px;

      text-align: right;

      color: #FFD700;
      text-decoration: none;

      font-size: 13px;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    .login-button,
    .signup-button {
      width: 100%;
      height: 50px;

      border-radius: 10px;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .login-button {
      border: 1px solid #FFD700;

      background: #FFD700;
      color: #0A0F1E;
    }

    .login-button:hover {
      transform: translateY(-1px);

      box-shadow:
        0 7px 20px rgba(255, 215, 0, 0.18);
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .divider {
      display: flex;
      align-items: center;

      gap: 12px;

      margin: 22px 0;

      color: #737b89;

      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background: #354052;
    }

    .signup-button {
      border: 1px solid #4A4A2A;

      background: transparent;
      color: #FFD700;
    }

    .signup-button:hover {
      background: rgba(255, 215, 0, 0.06);
    }

    .security-note {
      margin-top: 20px;

      padding: 12px;

      border-radius: 9px;

      background: rgba(46, 204, 113, 0.06);
      border: 1px solid rgba(46, 204, 113, 0.25);

      color: #A9B0BC;

      font-size: 12px;
      line-height: 1.5;

      text-align: center;
    }

    .back-home {
      display: block;

      margin-top: 15px;

      text-align: center;

      color: #A9B0BC;
      text-decoration: none;

      font-size: 13px;
    }

    .back-home:hover {
      color: #ffffff;
    }

    @media (max-width: 480px) {

      body {
        padding: 14px;
      }

      .card {
        padding: 24px 17px;
        border-radius: 15px;
      }

      .logo-title {
        font-size: 26px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="login-container">

    <!-- AYNA BOOK Logo -->

    <div class="logo">

      <div class="logo-title">
        AYNA BOOK
      </div>

      <div class="logo-subtitle">
        Connect • Share • Create
      </div>

    </div>


    <!-- Login Card -->

    <section class="card">

      <h1>
        AYNA BOOK-এ লগইন
      </h1>

      <p class="description">
        আপনার অ্যাকাউন্টে প্রবেশ করুন।
      </p>


      <!-- Message -->

      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite">
      </div>


      <!-- Login Form -->

      <form
        id="loginForm"
        autocomplete="on"
        novalidate>

        <!-- Email -->

        <div class="form-group">

          <label for="email">
            ইমেইল
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            autocomplete="email"
            maxlength="254"
            required>

        </div>


        <!-- Password -->

        <div class="form-group">

          <label for="password">
            পাসওয়ার্ড
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="আপনার পাসওয়ার্ড"
              autocomplete="current-password"
              maxlength="128"
              required>

            <button
              type="button"
              class="toggle-password"
              id="togglePassword">

              দেখুন

            </button>

          </div>

        </div>


        <!-- Forgot Password -->

        <a
          href="forgot-password.html"
          class="forgot-password">

          পাসওয়ার্ড ভুলে গেছেন?

        </a>


        <!-- Login -->

        <button
          type="submit"
          id="loginBtn"
          class="login-button">

          লগইন করুন

        </button>

      </form>


      <!-- Divider -->

      <div class="divider">
        অথবা
      </div>


      <!-- Signup -->

      <button
        type="button"
        id="signupBtn"
        class="signup-button">

        নতুন অ্যাকাউন্ট তৈরি করুন

      </button>


      <!-- Security -->

      <div class="security-note">
        🔒 AYNA BOOK Authentication Firebase দ্বারা পরিচালিত।
      </div>

    </section>


    <!-- Home -->

    <a
      href="index.html"
      class="back-home">

      ← AYNA BOOK হোমে ফিরে যান

    </a>

  </main>


  <!-- Password Toggle Only -->

  <script>

    const passwordInput =
      document.getElementById("password");

    const togglePassword =
      document.getElementById("togglePassword");

    if (togglePassword && passwordInput) {

      togglePassword.addEventListener(
        "click",
        () => {

          if (passwordInput.type === "password") {

            passwordInput.type = "text";
            togglePassword.textContent = "লুকান";

          } else {

            passwordInput.type = "password";
            togglePassword.textContent = "দেখুন";

          }

        }
      );

    }

  </script>


  <!-- Main Login System -->

  <script
    type="module"
    src="./login.js">
  </script>

</body>
</html>
