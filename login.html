<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - AYNA APP</title>
    <link rel="stylesheet" href="styles.css">[span_1](start_span)[span_1](end_span)
    <style>
        body { background: #090a0f; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: rgba(255,255,255,0.05); border: 2px solid #ffd700; padding: 25px; border-radius: 12px; width: 320px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #111; border: 1px solid #b8860b; color: #fff; border-radius: 6px; }
        button { width: 100%; padding: 10px; background: #ffd700; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; color: #000; }
        a { color: #ffd700; font-size: 0.85rem; text-decoration: none; display: block; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 style="color: #ffd700; margin-bottom: 15px;">লগইন করুন</h2>
        <input type="email" id="login-email" placeholder="ইমেইল দিন">
        <input type="password" id="login-pass" placeholder="পাসওয়ার্ড দিন">
        <button id="login-btn">প্রবেশ করুন</button>
        <a href="signup.html">অ্যাকাউন্ট নেই? সাইন আপ করুন</a>[span_2](start_span)[span_2](end_span)
    </div>

    <script type="module">
        import { loginUser } from './auth.js';
        
        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            try {
                await loginUser(email, pass);
                alert('লগইন সফল হয়েছে!');
                window.location.href = 'index.html';[span_3](start_span)[span_3](end_span)
            } catch (error) {
                alert('ত্রুটি: ' + error.message);
            }
        });
    </script>
</body>
</html>
