
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b49">

  <title>AYNA BOOK — Login</title>

  <link rel="stylesheet" href="./styles.css">

  <style>
    body {
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #071b49, #512b81);
      color: white;
      font-family: Arial, sans-serif;
    }

    .login-card {
      max-width: 450px;
      margin: 45px auto;
      padding: 25px;
      background: #ffffff12;
      border: 1px solid #ffffff35;
      border-radius: 20px;
    }

    .login-card h1,
    .subtitle {
      text-align: center;
    }

    .subtitle {
      color: #35d9ef;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 17px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, #ff4fa3, #8b5cf6, #35d9ef);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #loginStatus {
      min-height: 24px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    .links a {
      color: #35d9ef;
    }
  </style>
</head>

<body>
  <main class="login-card">

    <h1>🌍 AYNA BOOK</h1>

    <p class="subtitle">
      My World. My Story. My AYNA BOOK.
    </p>

    <h2>🔐 লগইন করুন</h2>

    <form id="loginForm">

      <label for="email">ইমেইল ঠিকানা</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="আপনার ইমেইল লিখুন"
        required
      >

      <label for="password">পাসওয়ার্ড</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="আপনার পাসওয়ার্ড লিখুন"
        required
      >

      <button id="loginButton" type="submit">
        🚀 Login to AYNA BOOK
      </button>

    </form>

    <p id="loginStatus" role="status" aria-live="polite"></p>

    <div class="links">
      অ্যাকাউন্ট নেই?
      <a href="./signup.html">নতুন অ্যাকাউন্ট তৈরি করুন</a>
      <br>
      <a href="./index.html">← হোম পেজে ফিরে যান</a>
    </div>

  </main>

  <script type="module" src="./js/login.js"></script>

</body>
</html>
