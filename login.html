<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0A0F1E"
  >

  <title>AYNA BOOK — Login</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #0A0F1E;
      color: #FFFFFF;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
    }

    .page {
      width: 100%;
      max-width: 480px;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .home-icon {
      width: 42px;
      height: 42px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 7px;
      border: 1px solid #FFD700;
      border-radius: 10px;
      background: #1A2233;
      text-decoration: none;
    }

    .home-icon span {
      display: block;
      background: #FFFFFF;
      border-radius: 3px;
    }

    .brand {
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      text-align: center;
    }

    .star {
      width: 32px;
      text-align: center;
      color: #FFFFFF;
      font-size: 16px;
      animation: starPulse 1s infinite;
    }

    @keyframes starPulse {

      0%,
      100% {
        opacity: 0.55;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.35);
      }

    }

    /* =====================================================
       CARD
       ===================================================== */

    .card {
      background: #111827;
      border: 1px solid #FFD700;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.45);
    }

    .title {
      margin: 0;
      text-align: center;
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      margin: 8px 0 25px;
      text-align: center;
      color: #A9B0BC;
      font-size: 14px;
      line-height: 1.5;
    }

    /* =====================================================
       FORM
       ===================================================== */

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #384357;
      border-radius: 10px;
      background: #1A2233;
      color: #FFFFFF;
      padding: 0 14px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #FFD700;
      box-shadow:
        0 0 0 2px rgba(255, 215, 0, 0.10);
    }

    input::placeholder {
      color: #7F8999;
    }

    .password-input {
      padding-right: 55px;
    }

    .eye-button {
      position: absolute;
      top: 50%;
      right: 7px;
      transform: translateY(-50%);
      width: 40px;
      height: 38px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #FFFFFF;
      cursor: pointer;
      font-size: 19px;
    }

    .eye-button:hover {
      background: #273247;
    }

    /* =====================================================
       FORGOT PASSWORD
       ===================================================== */

    .forgot {
      display: block;
      margin-top: -6px;
      margin-bottom: 20px;
      text-align: right;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 13px;
    }

    .forgot:hover {
      color: #FFD700;
    }

    /* =====================================================
       LOGIN BUTTON
       ===================================================== */

    .login-button {
      width: 100%;
      height: 52px;
      border: 1px solid #FFD700;
      border-radius: 11px;
      background: #FFD700;
      color: #0A0F1E;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-button:hover {
      filter: brightness(1.08);
    }

    .login-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =====================================================
       MESSAGE
       ===================================================== */

    .message {
      min-height: 24px;
      margin: 14px 0 4px;
      text-align: center;
      color: #FFD700;
      font-size: 13px;
      line-height: 1.5;
    }

    /* =====================================================
       REGISTER
       ===================================================== */

    .register-area {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #273247;
      text-align: center;
      color: #A9B0BC;
      font-size: 14px;
    }

    .register-area a {
      color: #FFFFFF;
      font-weight: 700;
      text-decoration: none;
    }

    .register-area a:hover {
      color: #FFD700;
    }

    /* =====================================================
       SECURITY
       ===================================================== */

    .security-note {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #273247;
      text-align: center;
      color: #707B8D;
      font-size: 11px;
      line-height: 1.5;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 480px) {

      body {
        padding: 14px 10px;
        align-items: flex-start;
      }

      .card {
        padding: 22px 15px;
        border-radius: 16px;
      }

      .brand {
        font-size: 19px;
      }

      .title {
        font-size: 25px;
      }

    }

  </style>

</head>


<body>

  <main class="page">

    <!-- ===================================================
         HEADER
         =================================================== -->

    <header class="top-header">

      <a
        href="./index.html"
        class="home-icon"
        aria-label="AYNA BOOK Home"
      >
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </a>

      <div class="brand">
        AYNA BOOK
      </div>

      <div class="star">
        ★
      </div>

    </header>


    <!-- ===================================================
         LOGIN CARD
         =================================================== -->

    <section class="card">

      <h1 class="title">
        LOGIN
      </h1>

      <p class="subtitle">
        আপনার AYNA BOOK অ্যাকাউন্টে নিরাপদে প্রবেশ করুন।
      </p>


      <!-- =================================================
           LOGIN FORM
           ================================================= -->

      <form
        id="loginForm"
        novalidate
      >

        <!-- GMAIL -->

        <div class="field">

          <label for="email">
            Gmail
          </label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="example@gmail.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="input-wrap">

            <input
              id="password"
              name="password"
              class="password-input"
              type="password"
              placeholder="আপনার Password"
              autocomplete="current-password"
              required
            >

            <button
              id="togglePassword"
              class="eye-button"
              type="button"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </div>


        <!-- FORGOT -->

        <a
          href="./forgot-password.html"
          class="forgot"
        >
          Forgot Password?
        </a>


        <!-- MESSAGE -->

        <div
          id="message"
          class="message"
          aria-live="polite"
        ></div>


        <!-- LOGIN -->

        <button
          id="loginBtn"
          class="login-button"
          type="submit"
        >
          LOGIN
        </button>

      </form>


      <!-- =================================================
           REGISTER
           ================================================= -->

      <div class="register-area">

        নতুন AYNA BOOK অ্যাকাউন্ট তৈরি করতে

        <a href="./signup.html">
          REGISTER
        </a>

      </div>


      <!-- =================================================
           SECURITY
           ================================================= -->

      <div class="security-note">

        AYNA BOOK — Secure Login<br>
        আপনার Password কারও সঙ্গে শেয়ার করবেন না।

      </div>

    </section>

  </main>


  <!-- =====================================================
       LOGIN CONTROLLER
       ===================================================== -->

  <script
    type="module"
    src="./login.js"
  ></script>

</body>

</html>
