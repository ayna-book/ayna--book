
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0F1E">
<title>AYNA BOOK - Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px 12px;background:#0A0F1E;color:white;font-family:Arial,sans-serif}
.card{max-width:500px;margin:50px auto;padding:28px 22px;background:#1A2233;border:1px solid #FFD700;border-radius:22px}
h1,h2{text-align:center}
label{display:block;margin:22px 0 8px;font-weight:bold}
input{width:100%;padding:15px;border:1px solid #FFD700;border-radius:10px;background:#0A0F1E;color:white;font-size:16px}
button{width:100%;padding:15px;margin-top:20px;background:#FFD700;color:#0A0F1E;border:0;border-radius:10px;font-size:17px;font-weight:bold}
button:disabled{opacity:.5}
#message{display:none;margin-top:16px;padding:12px;background:#26344A;border-radius:9px;overflow-wrap:anywhere}
a{color:#FFD700}
.center{text-align:center;margin-top:22px}
</style>
</head>
<body>
<div class="card">
<h1>AYNA BOOK</h1>
<p class="center">Connect • Share • Create</p>
<h2>LOGIN</h2>

<form id="loginForm">
<label>Gmail / Email</label>
<input id="email" type="email" required autocomplete="username">

<label>Password</label>
<input id="password" type="password" minlength="11" required autocomplete="current-password">

<button id="loginBtn" type="submit">LOGIN</button>
</form>

<div id="message" role="status" aria-live="polite"></div>

<p class="center">
<a href="./forgot-password.html">Forgot Password?</a>
</p>
<p class="center">
নতুন অ্যাকাউন্ট?
<a href="./signup.html">REGISTER</a>
</p>
<p class="center"><a href="./index.html">Back to Home</a></p>
</div>

<script type="module" src="./login.js"></script>
</body>
</html>
