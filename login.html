
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070b">
  <meta name="description" content="AYNA BOOK secure login">
  <title>AYNA BOOK — Login</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      color: #fff;
      background: radial-gradient(circle at top, #182238, #080b12 50%, #030407);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container { width: 100%; max-width: 430px; }

    .logo { text-align: center; margin-bottom: 22px; }

    .logo-icon {
      width: 76px;
      height: 76px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 900;
      color: #05070b;
      background: linear-gradient(135deg, #ffd700, #ffb300);
      box-shadow: 0 0 30px rgba(255,215,0,.3);
    }

    .logo h1 { color: #ffd700; letter-spacing: 2px; }
    .logo p { color: #aeb7c7; font-size: 13px; }

    .card {
      background: rgba(12,16,25,.95);
      border: 1px solid rgba(255,215,0,.35);
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    h2 { text-align: center; margin-bottom: 8px; }

    .subtitle {
      text-align: center;
      color: #9fa8b8;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .field { margin-bottom: 17px; }

    label { display: block; margin-bottom: 7px; font-size: 14px; }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      outline: none;
      background: rgba(255,255,255,.06);
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      border-color: #ffd700;
      box-shadow: 0 0 0 3px rgba(255,215,0,.08);
    }

    .password-box { position: relative; }
    .password-box input { padding-right: 55px; }

    .show {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #ffd700;
      cursor: pointer;
      font-size: 18px;
    }

    .forgot { text-align: right; margin-bottom: 20px; }

    .forgot button {
      border: 0;
      background: none;
      color: #ffd700;
      cursor: pointer;
    }

    .login {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffd700, #ffb300);
      color: #05070b;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }

    .login:disabled { opacity: .6; cursor: wait; }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .message.show { display: block; }
    .error { color: #ff8a80; background: rgba(255,82,82,.1); }
    .success { color: #69f0ae; background: rgba(0,230,118,.1); }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0;
      color: #687182;
      font-size: 12px;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,.1);
    }

    .register { text-align: center; color: #aeb7c7; font-size: 14px; }

    .register a {
      color: #ffd700;
      text-decoration: none;
      font-weight: bold;
    }

    .home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #8f99aa;
      text-decoration: none;
      font-size: 13px;
    }

    .status {
      text-align: center;
      color: #aeb7c7;
      font-size: 12px;
      margin-top: 18px;
    }

    @media (max-width: 380px) {
      .card { padding: 24px 17px; }
    }
  </style>
</head>

<body>
<div class="container">

  <div class="logo">
    <div class="logo-icon">A</div>
    <h1>AYNA BOOK</h1>
    <p>আধুনিক নিরাপদ ডিজিটাল সোশ্যাল প্ল্যাটফর্ম</p>
  </div>

  <section class="card">
    <h2>🔐 Login</h2>

    <p class="subtitle">
      আপনার AYNA BOOK অ্যাকাউন্টে প্রবেশ করুন
    </p>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">📧 Email Address</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          placeholder="আপনার ইমেইল লিখুন"
          required
        >
      </div>

      <div class="field">
        <label for="password">🔑 Password</label>
        <div class="password-box">
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="আপনার পাসওয়ার্ড লিখুন"
            required
          >
          <button id="showPassword" class="show" type="button"
            aria-label="Show password">👁️</button>
        </div>
      </div>

      <div class="forgot">
        <button id="forgotPassword" type="button">
          পাসওয়ার্ড ভুলে গেছেন?
        </button>
      </div>

      <button id="loginButton" class="login" type="submit">
        LOGIN
      </button>
    </form>

    <div class="divider">অথবা</div>

    <div class="register">
      নতুন ব্যবহারকারী?
      <a href="./signup.html">অ্যাকাউন্ট তৈরি করুন</a>
    </div>
  </section>

  <div class="status">
    AYNA BOOK Authentication
  </div>

  <a class="home" href="./index.html">
    ← AYNA BOOK Home
  </a>

</div>

<script type="module">
import {
  loginUser,
  resetPassword,
  watchAuthState
} from "./auth.js";

const email = document.getElementById("email");
const password = document.getElementById("password");
const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const forgotPassword = document.getElementById("forgotPassword");
const showPassword = document.getElementById("showPassword");
const message = document.getElementById("message");

function showMessage(text, type = "error") {
  message.textContent = text;
  message.className = "message show " + type;
}

// LOGIN
loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const emailValue = email.value.trim();
  const passwordValue = password.value;

  if (!emailValue || !passwordValue) {
    showMessage("ইমেইল ও পাসওয়ার্ড দিন।");
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "LOGIN হচ্ছে...";

  try {
    const result = await loginUser(emailValue, passwordValue);

    if (result?.success === true && result.user) {
      showMessage("সফলভাবে Login হয়েছে।", "success");
      loginButton.textContent = "সফল হয়েছে";
      window.location.replace("./index.html");
      return;
    }

    showMessage(
      result?.error || result?.message ||
      "ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।"
    );

  } catch (error) {
    console.error("Login error:", error);
    showMessage("Login করা যায়নি। আবার চেষ্টা করুন।");

  } finally {
    loginButton.disabled = false;
    loginButton.textContent = "LOGIN";
  }
});

// SHOW / HIDE PASSWORD
showPassword.addEventListener("click", () => {
  const hidden = password.type === "password";
  password.type = hidden ? "text" : "password";
  showPassword.textContent = hidden ? "🙈" : "👁️";
  showPassword.setAttribute(
    "aria-label",
    hidden ? "Hide password" : "Show password"
  );
});

// PASSWORD RESET
forgotPassword.addEventListener("click", async () => {
  const emailValue = email.value.trim();

  if (!emailValue) {
    showMessage("প্রথমে আপনার ইমেইল লিখুন।");
    email.focus();
    return;
  }

  forgotPassword.disabled = true;

  try {
    const result = await resetPassword(emailValue);

    if (result?.success === true) {
      showMessage(
        result.message || "Reset link ইমেইলে পাঠানো হয়েছে।",
        "success"
      );
    } else {
      showMessage(
        result?.error || result?.message ||
        "Password reset করা যায়নি।"
      );
    }

  } catch (error) {
    console.error("Password reset error:", error);
    showMessage("Password reset করা যায়নি।");

  } finally {
    forgotPassword.disabled = false;
  }
});

// AUTH STATE
watchAuthState(user => {
  if (user) {
    console.log("AYNA BOOK logged in:", user.email);
  } else {
    console.log("No user logged in.");
  }
});

console.log("AYNA BOOK Login page initialized.");
</script>
</body>
</html>
