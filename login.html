<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYNA BOOK - লগইন</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .login-box { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border-top: 6px solid #1a73e8; }
        h1 { font-size: 2.2rem; color: #1a73e8; margin-bottom: 10px; }
        p { font-size: 1.1rem; color: #555; margin-bottom: 20px; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 1.1rem; }
        button { width: 100%; padding: 14px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        button.register-btn { background: #28a745; }
        #statusMsg { margin-top: 15px; font-size: 1rem; color: #d93025; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>AYNA BOOK</h1>
        <p>আপনার অ্যাকাউন্টে প্রবেশ করুন</p>
        <input type="email" id="emailInput" placeholder="ইমেইল ঠিকানা দিন" required>
        <input type="password" id="passwordInput" placeholder="পাসওয়ার্ড দিন (কমপক্ষে ৬ অক্ষর)" required>
        <button id="loginBtn">লগইন করুন</button>
        <button id="registerBtn" class="register-btn">নতুন অ্যাকাউন্ট তৈরি করুন</button>
        <div id="statusMsg"></div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-init.js';
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const statusMsg = document.getElementById('statusMsg');

        // ইউজার আগে থেকেই লগইন করা থাকলে ড্যাশবোর্ডে পাঠাবে
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        // লগইন বাটন হ্যান্ডলার
        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            
            if(!email || !password) {
                statusMsg.textContent = "দয়া করে ইমেইল ও পাসওয়ার্ড দিন।";
                return;
            }

            statusMsg.textContent = "যাচাই করা হচ্ছে...";
            
            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    statusMsg.textContent = "ত্রুটি: " + error.message;
                });
        });

        // নতুন একাউন্ট রেজিস্ট্রেশন ও ফায়ারস্টোর ডাটা সেভ
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;

            if(!email || !password) {
                statusMsg.textContent = "দয়া করে ইমেইল ও পাসওয়ার্ড দিন।";
                return;
            }

            statusMsg.textContent = "অ্যাকাউন্ট তৈরি হচ্ছে...";

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // ফায়ারস্টোর users কালেকশনে ডেটা সেভ
                await setDoc(doc(db, "users", user.uid), {
                    email: email,
                    name: email.split('@')[0],
                    phone: "",
                    plan: "Standard",
                    created: serverTimestamp()
                });

               window.location.href = 'index.html';
            } catch (error) {
                statusMsg.textContent = "ত্রুটি: " + error.message;
            }
        });
    </script>
</body>
</html>
