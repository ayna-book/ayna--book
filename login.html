<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17112f">
  <title>Login | AYNA BOOK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #17112f, #472078, #087eae);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 24px;
      background: rgba(255,255,255,.10);
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 32px;
      color: #ff72d2;
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #e5dcff;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #b8a6e8;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #ff72d2;
      box-shadow: 0 0 0 3px rgba(255,114,210,.2);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #ff4fbd, #00d5e9);
      color: #17112f;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .links {
      margin-top: 20px;
      text-align: center;
      line-height: 2;
    }

    a {
      color: #80f4ff;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .home {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: white;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>AYNA BOOK</h1>
    <h2>আপনার অ্যাকাউন্টে প্রবেশ করুন</h2>
    <p class="subtitle">My World. Your Story. My AYNA BOOK.</p>

    <form id="loginForm">
      <label for="email">ইমেইল ঠিকানা</label>
      <input
        type="email"
        id="email"
        autocomplete="email"
        placeholder="আপনার ইমেইল লিখুন"
        required
      >

      <label for="password">পাসওয়ার্ড</label>
      <input
        type="password"
        id="password"
        autocomplete="current-password"
        placeholder="পাসওয়ার্ড লিখুন"
        required
      >

      <button type="submit" id="loginButton">
        লগইন করুন
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="links">
      নতুন ব্যবহারকারী?
      <a href="./signup.html">নতুন অ্যাকাউন্ট তৈরি করুন</a>
      <br>
      <a href="#" id="forgotPassword">পাসওয়ার্ড ভুলে গেছেন?</a>
    </div>

    <a class="home" href="./index.html">← AYNA BOOK হোমপেজ</a>
  </main>
