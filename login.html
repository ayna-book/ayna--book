<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17112f">
  <title>Login | AYNA BOOK</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #17112f, #512b81, #087eae);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 28px 24px;
      border: 1px solid #ffffff40;
      border-radius: 24px;
      background: #ffffff12;
      box-shadow: 0 15px 45px #0005;
    }

    h1 {
      text-align: center;
      color: #ff72d2;
      font-size: 32px;
    }

    h2 {
      text-align: center;
      font-size: 21px;
    }

    .subtitle {
      text-align: center;
      line-height: 1.7;
      color: #e5dcff;
    }

    label {
      display: block;
      margin: 18px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #b8a6e8;
      border-radius: 12px;
      font-size: 16px;
    }

    .password-row {
      display: flex;
      gap: 8px;
    }

    .password-row input {
      flex: 1;
      min-width: 0;
    }

    .show-button {
      width: auto;
      margin: 0;
      padding: 0 12px;
      background: #ffffff;
      color: #17112f;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(90deg, #ff4fbd, #00d5e9);
      color: #17112f;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .links {
      margin-top: 18px;
      text-align: center;
      line-height: 2.1;
    }

    a { color: #80f4ff; }

    #message {
      overflow-wrap: anywhere;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>🌍 AYNA BOOK</h1>
    <h2>আপনার অ্যাকাউন্টে প্রবেশ করুন</h2>

    <p class="subtitle">
      My World. My Story. My AYNA BOOK.
      <br>Connect. Create. Share.
    </p>

    <form id="loginForm">
      <label for="email">Gmail / ইমেইল</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="আপনার ইমেইল লিখুন"
        required
      >

      <label for="password">পাসওয়ার্ড</label>

      <div class="password-row">
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="আপনার পাসওয়ার্ড"
          required
        >

        <button
          class="show-button"
          id="showPassword"
          type="button"
          aria-label="পাসওয়ার্ড দেখান"
        >দেখুন</button>
      </div>

      <button id="loginButton" type="submit">
        🔐 লগইন করুন
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="links">
      <a href="#" id="forgotPassword">🔄 পাসওয়ার্ড ভুলে গেছেন?</a>
      <br>
      নতুন ব্যবহারকারী?
      <br>
      <a href="./signup.html">🆕 নতুন অ্যাকাউন্ট তৈরি করুন</a>
    </div>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAIW4FK9Il2yct-tOSCKuSodso8KN2UsTA",
      authDomain: "ayna-book.firebaseapp.com",
      projectId: "ayna-book",
      storageBucket: "ayna-book.firebasestorage.app",
      messagingSenderId: "805601138500",
      appId: "1:805601138500:web:47acdc90cb0cb521626911",
      measurementId: "G-RKHHSKNB4B"
    };

    const $ = id => document.getElementById(id);

    const form = $("loginForm");
    const email = $("email");
    const password = $("password");
    const loginButton = $("loginButton");
    const message = $("message");
    const forgot = $("forgotPassword");

    let auth;

    function showMessage(text, error = false) {
      message.textContent = text;
      message.style.color = error ? "#ffb4b4" : "#a7ffcf";
    }

    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
    } catch (error) {
      console.error(error);
      showMessage("Firebase চালু হয়নি। কনফিগারেশন পরীক্ষা করুন।", true);
      loginButton.disabled = true;
    }

    $("showPassword").addEventListener("click", () => {
      const visible = password.type === "password";
      password.type = visible ? "text" : "password";
      $("showPassword").textContent = visible ? "লুকান" : "দেখুন";
    });

    // আগে থেকেই লগইন করা থাকলে হোমপেজে পাঠান।
    if (auth) {
      onAuthStateChanged(auth, user => {
        if (user) {
          window.location.replace("./index.html");
        }
      });
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!auth) {
        showMessage("Firebase সংযোগ পাওয়া যায়নি।", true);
        return;
      }

      loginButton.disabled = true;
      showMessage("লগইন হচ্ছে...");

      try {
        await signInWithEmailAndPassword(
          auth,
          email.value.trim(),
          password.value
        );

        showMessage("লগইন সফল! হোমপেজ খুলছে...");

        window.location.replace("./index.html");
      } catch (error) {
        console.error("Login error:", error);

        const errors = {
          "auth/invalid-email": "ইমেইল ঠিকানা সঠিক নয়।",
          "auth/invalid-credential": "ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।",
          "auth/user-not-found": "অ্যাকাউন্ট পাওয়া যায়নি।",
          "auth/wrong-password": "পাসওয়ার্ড সঠিক নয়।",
          "auth/too-many-requests": "অনেকবার চেষ্টা হয়েছে। পরে চেষ্টা করুন।",
          "auth/network-request-failed": "ইন্টারনেট সংযোগ পরীক্ষা করুন।",
          "auth/operation-not-allowed":
            "Firebase-এ Email/Password চালু করুন।"
        };

        showMessage(
          errors[error.code] || "লগইন ব্যর্থ: " + error.code,
          true
        );
      } finally {
        loginButton.disabled = false;
      }
    });

    forgot.addEventListener("click", async event => {
      event.preventDefault();

      if (!auth) {
        showMessage("Firebase সংযোগ পাওয়া যায়নি।", true);
        return;
      }

      const address = email.value.trim();

      if (!address) {
        showMessage("প্রথমে আপনার ইমেইল লিখুন।", true);
        email.focus();
        return;
      }

      try {
        await sendPasswordResetEmail(auth, address);

        showMessage(
          "যদি এই অ্যাকাউন্টের জন্য রিসেট অনুমোদিত হয়, " +
          "ইমেইলে নির্দেশনা পাবেন। Inbox ও Spam পরীক্ষা করুন।"
        );
      } catch (error) {
        console.error(error);
        showMessage(
          "রিসেট ইমেইল পাঠানো যায়নি। ইন্টারনেট ও Firebase সেটিংস পরীক্ষা করুন।",
          true
        );
      }
    });
  </script>
</body>
</html>
