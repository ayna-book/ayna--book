<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b49">
  <title>AYNA BOOK — Login</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="app-shell" style="padding: 20px; max-width: 500px; margin: 50px auto;">
  <div class="panel">
    <h2><i class="fa-solid fa-lock"></i> Quantum Secure Login</h2>
    <form id="standaloneLoginForm">
      <label>ইমেইল বা ফোন</label>
      <input type="text" placeholder="Registered email or phone" required style="width: 100%; padding: 10px; margin: 8px 0; background: #071b49; border: 1px solid #00ffcc; color: #fff; border-radius: 8px;">

      <label>পাসওয়ার্ড</label>
      <input type="password" placeholder="Password" required style="width: 100%; padding: 10px; margin: 8px 0; background: #071b49; border: 1px solid #00ffcc; color: #fff; border-radius: 8px;">

      <button type="submit" class="btn primary full-width" style="margin-top: 15px; width: 100%; padding: 12px; background: #00ffcc; color: #000; font-weight: bold; border-radius: 8px; border: none; cursor: pointer;">লগইন করুন</button>
    </form>
    
    <p style="text-align: center; margin-top: 15px;">
      <a href="./index.html" style="color: #00ffcc; text-decoration: none;">← হোম পেজে ফিরে যান</a>
    </p>
  </div>
</div>
</body>
</html>
