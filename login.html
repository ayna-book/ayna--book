
<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#090a0f">

  <meta
    name="description"
    content="AYNA BOOK - Secure Account Login"
  >

  <title>AYNA BOOK - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      background:
        radial-gradient(
          circle at top,
          #171923 0%,
          #090a0f 55%,
          #050609 100%
        );

      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 30px 24px;

      background: rgba(18, 20, 29, 0.96);

      border: 1px solid rgba(212, 175, 55, 0.30);
      border-radius: 18px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55);
    }

    .brand {
      text-align: center;
      margin-bottom: 8px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .brand span {
      color: #d4af37;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 28px;
      color: #bfc2ca;
      font-size: 14px;
      line-height: 1.6;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 23px;
      color: #ffffff;
    }

    .description {
      margin: 0 0 24px;
      text-align: center;
      color: #aeb2bc;
      font-size: 14px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #eeeeee;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 15px;

      border-radius: 10px;
      border: 1px solid #363946;
      outline: none;

      background: #0d0f15;
      color: #ffffff;
      font-size: 15px;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input::placeholder {
      color: #707480;
    }

    input:focus {
      border-color: #d4af37;

      box-shadow:
        0 0 0 3px rgba(212, 175, 55, 0.12);
    }

    button {
      width: 100%;
      padding: 14px 16px;

      border: none;
      border-radius: 10px;

      background: #d4af37;
      color: #090a0f;

      font-size: 15px;
      font-weight: 800;
      cursor: pointer;

      transition:
        transform 0.15s,
        opacity 0.15s;
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    /* STATUS MESSAGE */

    .status-message {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;

      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .status-message.info {
      display: block;
      background: rgba(70, 120, 180, 0.12);
      border: 1px solid rgba(70, 120, 180, 0.30);
      color: #c9ddff;
    }

    .status-message.success {
      display: block;
      background: rgba(60, 170, 100, 0.12);
      border: 1px solid rgba(60, 170, 100, 0.30);
      color: #9ff0b7;
    }

    .status-message.error {
      display: block;
      background: rgba(210, 70, 70, 0.12);
      border: 1px solid rgba(210, 70, 70, 0.30);
      color: #ffaaaa;
    }

    .status-message.warning {
      display: block;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.30);
      color: #f5d76e;
    }

    .forgot {
      display: block;
      margin-top: 16px;
      text-align: right;
      color: #d4af37;
      text-decoration: none;
      font-size: 13px;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .links {
      margin-top: 24px;
      text-align: center;
      color: #aeb2bc;
      font-size: 14px;
    }

    .links a {
      color: #d4af37;
      text-decoration: none;
      font-weight: 600;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #666b76;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .container {
        padding: 26px 20px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="brand">
      AYNA <span>BOOK</span>
    </div>

    <div class="subtitle">
      Connect • Share • Create
    </div>

    <h1>Welcome Back</h1>

    <p class="description">
      আপনার Verified Gmail ও Password
      দিয়ে AYNA BOOK-এ Login করুন।
    </p>

    <form id="loginForm" novalidate>

      <div class="form-group">

        <label for="email">
          Gmail Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="yourname@gmail.com"
          autocomplete="email"
          inputmode="email"
          required
        >

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <a
          href="./forgot-password.html"
          class="forgot"
        >
          Forgot Password?
        </a>

      </div>

      <button
        type="submit"
        id="loginButton"
      >
        Log In
      </button>

    </form>

    <div
      id="statusMessage"
      class="status-message"
      role="status"
      aria-live="polite"
    ></div>

    <div class="links">
      Don't have an account?

      <a href="./signup.html">
        Create Account
      </a>
    </div>

    <div class="footer">
      © AYNA BOOK
    </div>

  </main>

  <script
    type="module"
    src="./login.js"
  ></script>

</body>
</html>
