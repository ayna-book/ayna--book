<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070b">
  <title>AYNA BOOK — Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top, #182238 0%, #080b12 45%, #030407 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo-icon {
      width: 76px;
      height: 76px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 900;
      color: #05070b;
      background: linear-gradient(135deg, #ffd700, #ffb300);
      box-shadow: 0 0 30px rgba(255, 215, 0, .3);
    }

    .logo h1 {
      margin-top: 12px;
      color: #ffd700;
      letter-spacing: 2px;
    }

    .logo p {
      margin-top: 6px;
      color: #aeb7c7;
      font-size: 13px;
    }

    .card {
      background: rgba(12, 16, 25, .95);
      border: 1px solid rgba(255, 215, 0, .35);
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9fa8b8;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .14);
      outline: none;
      background: rgba(255, 255, 255, .06);
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      border-color: #ffd700;
      box-shadow: 0 0 0 3px rgba(255, 215, 0, .08);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 55px;
    }

    .show {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #ffd700;
      cursor: pointer;
      font-size: 18px;
    }

    .forgot {
      text-align: right;
      margin-bottom: 20px;
    }

    .forgot button {
      border: 0;
      background: none;
      color: #ffd700;
      cursor: pointer;
    }

    .login {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffd700, #ffb300);
      color: #05070b;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }

    .login:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .error {
      color: #ff8a80;
      background: rgba(255, 82, 82, .1);
    }

    .success {
      color: #69f0ae;
      background: rgba(0, 230, 118, .1);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0;
      color: #687182;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, .1);
    }

    .register {
      text-align: center;
      color: #aeb7c7;
      font-size: 14px;
    }

    .register a {
      color: #ffd700;
      text-decoration: none;
      font-weight: bold;
    }

    .home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #8f99aa;
      text-decoration: none;
      font-size: 13px;
    }

    .status {
      text-align: center;
      color: #69f0ae;
      font-size: 12px;
      margin-top: 18px;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00e676;
      margin-right: 5px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <div class="logo-icon">A</div>
    <h1>AYNA BOOK</h1>
    <p>আধুনিক নিরাপদ ডিজিটাল সোশ্যাল প্ল্যাটফর্ম</p>
  </div>

  <section class="card">

    <h2>🔐 Login</h2>

    <p class="subtitle">
      আপনার AYNA BOOK অ্যাকাউন্টে প্রবেশ করুন
    </p>

    <div id="message" class="message"></div>

    <div class="field">
      <label for="email">📧 Email Address</label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="আপনার ইমেইল লিখুন"
        required
      >
    </div>

    <div class="field">

      <label for="password">🔑 Password</label>

      <div class="password-box">

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="আপনার পাসওয়ার্ড লিখুন"
          required
        >

        <button
          id="showPassword"
          class="show"
          type="button"
        >
          👁️
        </button>

      </div>

    </div>

    <div class="forgot">

      <button
        id="forgotPassword"
        type="button"
      >
        পাসওয়ার্ড ভুলে গেছেন?
      </button>

    </div>

    <button
      id="loginButton"
      class="login"
      type="button"
    >
      LOGIN
    </button>

    <div class="divider">
      অথবা
    </div>

    <div class="register">
      নতুন ব্যবহারকারী?
      <a href="./signup.html">
        অ্যাকাউন্ট তৈরি করুন
      </a>
    </div>

  </section>

  <div class="status">
    <span class="dot"></span>
    Firebase Authentication Ready
  </div>

  <a class="home" href="./index.html">
    ← AYNA BOOK Home
  </a>

</div>


<script type="module">

import {
  loginUser,
  watchAuthState
} from "./auth.js";

import {
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
  auth
} from "./firebase-init.js";


const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const forgotPassword =
  document.getElementById("forgotPassword");

const showPassword =
  document.getElementById("showPassword");

const message =
  document.getElementById("message");


function showMessage(text, type = "error") {

  message.textContent = text;

  message.className =
    "message show " + type;
}


// ======================================================
// LOGIN
// ======================================================

loginButton.addEventListener(
  "click",
  async () => {

    const emailValue =
      email.value.trim();

    const passwordValue =
      password.value;


    if (!emailValue || !passwordValue) {

      showMessage(
        "ইমেইল ও পাসওয়ার্ড দিন।"
      );

      return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
      "LOGIN হচ্ছে...";


    try {

      const user =
        await loginUser(
          emailValue,
          passwordValue
        );


      if (user) {

        showMessage(
          "✅ সফলভাবে Login হয়েছে।",
          "success"
        );


        setTimeout(() => {

          window.location.href =
            "./index.html";

        }, 700);

      }

    } catch (error) {

      console.error(
        "Login failed:",
        error
      );

      showMessage(
        error?.message ||
        "Login ব্যর্থ হয়েছে।"
      );

      loginButton.disabled = false;

      loginButton.textContent =
        "LOGIN";
    }

  }
);


// ======================================================
// ENTER KEY LOGIN
// ======================================================

password.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      loginButton.click();

    }

  }
);


// ======================================================
// SHOW / HIDE PASSWORD
// ======================================================

showPassword.addEventListener(
  "click",
  () => {

    if (password.type === "password") {

      password.type = "text";

      showPassword.textContent =
        "🙈";

    } else {

      password.type = "password";

      showPassword.textContent =
        "👁️";

    }

  }
);


// ======================================================
// PASSWORD RESET
// ======================================================

forgotPassword.addEventListener(
  "click",
  async () => {

    const emailValue =
      email.value.trim();


    if (!emailValue) {

      showMessage(
        "প্রথমে আপনার ইমেইল লিখুন।"
      );

      email.focus();

      return;
    }


    forgotPassword.disabled = true;


    try {

      await sendPasswordResetEmail(
        auth,
        emailValue
      );


      showMessage(
        "✅ Password reset link আপনার ইমেইলে পাঠানো হয়েছে।",
        "success"
      );


    } catch (error) {

      console.error(
        "Password reset error:",
        error
      );

      showMessage(
        error?.message ||
        "Password reset করা যায়নি।"
      );

    } finally {

      forgotPassword.disabled = false;

    }

  }
);


// ======================================================
// AUTH STATE
// ======================================================

watchAuthState(
  user => {

    if (user) {

      console.log(
        "👤 Logged in:",
        user.email
      );

    }

  }
);


console.log(
  "✅ AYNA BOOK Login page ready."
);

</script>

</body>
</html>
