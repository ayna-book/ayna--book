<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0A0F1E"
  >

  <title>AYNA BOOK — Login</title>

  <style>

    /* =====================================================
       RESET
       ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: #0A0F1E;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      background: #0A0F1E;
      color: #FFFFFF;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow-x: hidden;

      /* FULL SCREEN + STATIC */
      display: flex;
      justify-content: center;
      align-items: center;

      padding:
        max(18px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
    }


    /* =====================================================
       PAGE
       ===================================================== */

    .page {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .top-header {
      width: 100%;

      display: grid;
      grid-template-columns: 52px 1fr 52px;
      align-items: center;

      min-height: 58px;

      margin-bottom: 18px;
    }


    /* =====================================================
       HOME BUTTON
       ===================================================== */

    .home-icon {
      width: 46px;
      height: 46px;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;

      padding: 7px;

      border: 1px solid #FFD700;
      border-radius: 10px;

      background: #1A2233;

      text-decoration: none;

      /* ABSOLUTELY STATIC */
      transform: none;
      transition: none;
    }

    .home-icon span {
      display: block;

      background: #FFFFFF;

      border-radius: 3px;
    }


    /* =====================================================
       BRAND
       ===================================================== */

    .brand {
      text-align: center;

      color: #FFFFFF;

      font-size: 30px;
      font-weight: 900;

      letter-spacing: 1px;
      line-height: 1;

      white-space: nowrap;
    }


    /* =====================================================
       STAR
       K-এর ডান কর্ণারের উজ্জ্বল সাদা তারকা
       ===================================================== */

    .star {
      width: 52px;
      height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #FFFFFF;

      font-size: 25px;
      font-weight: 900;

      text-shadow:
        0 0 4px #FFFFFF,
        0 0 9px #FFFFFF,
        0 0 18px rgba(255,255,255,0.95);

      /* শুধু আলো জ্বলবে,
         অবস্থান পরিবর্তন হবে না */
      animation: starGlow 1s ease-in-out infinite;

      transform: none;
    }

    @keyframes starGlow {

      0%,
      100% {
        opacity: 0.78;

        text-shadow:
          0 0 4px #FFFFFF,
          0 0 8px #FFFFFF,
          0 0 14px rgba(255,255,255,0.75);
      }

      50% {
        opacity: 1;

        text-shadow:
          0 0 5px #FFFFFF,
          0 0 12px #FFFFFF,
          0 0 24px #FFFFFF,
          0 0 36px rgba(255,255,255,0.85);
      }
    }


    /* =====================================================
       LOGIN CARD
       ===================================================== */

    .card {
      width: 100%;

      background: #111827;

      border: 1px solid #FFD700;
      border-radius: 20px;

      padding: 32px 28px;

      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.55);

      /* STATIC */
      transform: none;
      transition: none;
    }


    /* =====================================================
       TITLE
       ===================================================== */

    .title {
      margin: 0;

      text-align: center;

      color: #FFFFFF;

      font-size: 36px;
      font-weight: 900;

      line-height: 1.2;

      letter-spacing: 1px;
    }


    /* =====================================================
       SUBTITLE
       ===================================================== */

    .subtitle {
      margin: 11px 0 28px;

      text-align: center;

      color: #A9B0BC;

      font-size: 18px;

      line-height: 1.6;
    }


    /* =====================================================
       FORM FIELD
       ===================================================== */

    .field {
      width: 100%;
      margin-bottom: 22px;
    }

    label {
      display: block;

      margin-bottom: 9px;

      color: #FFFFFF;

      font-size: 18px;
      font-weight: 700;

      line-height: 1.4;
    }


    /* =====================================================
       INPUT WRAPPER
       ===================================================== */

    .input-wrap {
      position: relative;
      width: 100%;
    }


    /* =====================================================
       INPUT
       ===================================================== */

    input {
      display: block;

      width: 100%;
      height: 60px;

      border: 1px solid #384357;
      border-radius: 11px;

      background: #1A2233;

      color: #FFFFFF;

      padding: 0 17px;

      outline: none;

      font-family: inherit;
      font-size: 18px;

      /* NO MOVEMENT */
      transform: none;
      transition: none;
    }

    input:focus {
      border-color: #FFD700;

      box-shadow:
        0 0 0 2px rgba(255, 215, 0, 0.12);

      transform: none;
    }

    input::placeholder {
      color: #7F8999;
      font-size: 17px;
    }


    /* =====================================================
       PASSWORD INPUT
       ===================================================== */

    .password-input {
      padding-right: 88px;
    }


    /* =====================================================
       SHOW / HIDE BUTTON
       ===================================================== */

    .eye-button {
      position: absolute;

      top: 50%;
      right: 7px;

      width: 70px;
      height: 46px;

      /* IMPORTANT:
         কোনো translate ব্যবহার নেই */
      margin-top: -23px;

      border: 1px solid #4A566C;
      border-radius: 9px;

      background: #273247;

      color: #FFFFFF;

      cursor: pointer;

      font-family: inherit;
      font-size: 16px;
      font-weight: 800;

      text-align: center;

      outline: none;

      /* NO MOVEMENT */
      transform: none;
      transition: none;
    }

    .eye-button:hover {
      background: #33405A;
      color: #FFFFFF;

      transform: none;
    }

    .eye-button:focus {
      border-color: #FFD700;

      box-shadow:
        0 0 0 2px rgba(255,215,0,0.12);

      transform: none;
    }

    .eye-button:active {
      transform: none;
      margin-top: -23px;
    }


    /* =====================================================
       FORGOT PASSWORD
       ===================================================== */

    .forgot {
      display: block;

      margin-top: -4px;
      margin-bottom: 24px;

      text-align: right;

      color: #FFFFFF;

      text-decoration: none;

      font-size: 17px;
      font-weight: 700;

      line-height: 1.5;
    }

    .forgot:hover {
      color: #FFD700;
    }


    /* =====================================================
       MESSAGE
       ===================================================== */

    .message {
      width: 100%;

      min-height: 28px;

      margin: 14px 0 9px;

      text-align: center;

      color: #FFD700;

      font-size: 16px;
      font-weight: 600;

      line-height: 1.6;

      overflow-wrap: anywhere;
    }


    /* =====================================================
       LOGIN BUTTON
       ===================================================== */

    .login-button {
      display: block;

      width: 100%;
      height: 60px;

      border: 1px solid #FFD700;
      border-radius: 11px;

      background: #FFD700;
      color: #0A0F1E;

      font-family: inherit;

      font-size: 21px;
      font-weight: 900;

      cursor: pointer;

      outline: none;

      /* IMPORTANT:
         কোনো movement নেই */
      transform: none;
      transition: none;
    }

    .login-button:hover {
      background: #FFD700;

      filter: brightness(1.08);

      transform: none;
    }

    .login-button:focus {
      box-shadow:
        0 0 0 3px rgba(255,215,0,0.18);

      transform: none;
    }

    .login-button:active {
      background: #FFD700;

      transform: none;
    }

    .login-button:disabled {
      opacity: 0.55;

      cursor: not-allowed;

      transform: none;
    }


    /* =====================================================
       REGISTER AREA
       ===================================================== */

    .register-area {
      width: 100%;

      margin-top: 25px;
      padding-top: 20px;

      border-top: 1px solid #273247;

      text-align: center;

      color: #A9B0BC;

      font-size: 17px;

      line-height: 1.8;
    }

    .register-area a {
      color: #FFD700;

      font-size: 19px;
      font-weight: 900;

      text-decoration: none;

      white-space: nowrap;
    }

    .register-area a:hover {
      color: #FFFFFF;
    }


    /* =====================================================
       SECURITY NOTE
       ===================================================== */

    .security-note {
      width: 100%;

      margin-top: 20px;
      padding-top: 15px;

      border-top: 1px solid #273247;

      text-align: center;

      color: #7F8999;

      font-size: 14px;

      line-height: 1.7;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      body {
        min-height: 100vh;
        min-height: 100dvh;

        padding:
          max(12px, env(safe-area-inset-top))
          max(10px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom))
          max(10px, env(safe-area-inset-left));

        /* FULL SCREEN CENTER */
        align-items: center;
      }

      .page {
        width: 100%;
        max-width: 100%;
      }

      .top-header {
        grid-template-columns: 48px 1fr 48px;

        min-height: 52px;

        margin-bottom: 14px;
      }

      .home-icon {
        width: 44px;
        height: 44px;
      }

      .brand {
        font-size: 24px;
        letter-spacing: 0.7px;
      }

      .star {
        width: 48px;
        height: 48px;

        font-size: 23px;
      }

      .card {
        width: 100%;

        padding: 27px 17px;

        border-radius: 17px;
      }

      .title {
        font-size: 32px;
      }

      .subtitle {
        font-size: 16px;

        margin-bottom: 24px;
      }

      label {
        font-size: 17px;
      }

      input {
        height: 58px;

        font-size: 18px;
      }

      input::placeholder {
        font-size: 16px;
      }

      .password-input {
        padding-right: 84px;
      }

      .eye-button {
        width: 68px;
        height: 44px;

        margin-top: -22px;

        font-size: 15px;
      }

      .eye-button:active {
        margin-top: -22px;
      }

      .forgot {
        font-size: 16px;
      }

      .login-button {
        height: 60px;

        font-size: 20px;
      }

      .message {
        font-size: 15px;
      }

      .register-area {
        font-size: 15.5px;
      }

      .register-area a {
        font-size: 18px;
      }

      .security-note {
        font-size: 13px;
      }
    }


    /* =====================================================
       VERY SMALL PHONES
       ===================================================== */

    @media (max-height: 700px) and (max-width: 600px) {

      body {
        align-items: flex-start;
        padding-top: 8px;
        padding-bottom: 8px;
      }

      .top-header {
        margin-bottom: 8px;
      }

      .card {
        padding-top: 20px;
        padding-bottom: 20px;
      }

      .subtitle {
        margin-bottom: 18px;
      }

      .field {
        margin-bottom: 16px;
      }

      .forgot {
        margin-bottom: 16px;
      }

      .register-area {
        margin-top: 18px;
        padding-top: 14px;
      }

      .security-note {
        margin-top: 14px;
        padding-top: 10px;
      }
    }

  </style>

</head>


<body>

  <main class="page">

    <!-- ===================================================
         HEADER
         =================================================== -->

    <header class="top-header">

      <a
        href="./index.html"
        class="home-icon"
        aria-label="AYNA BOOK Home"
      >
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </a>


      <div class="brand">
        AYNA BOOK
      </div>


      <!-- K-এর ডানদিকে উজ্জ্বল সাদা তারকা -->

      <div
        class="star"
        aria-hidden="true"
      >
        ★
      </div>

    </header>


    <!-- ===================================================
         LOGIN CARD
         =================================================== -->

    <section class="card">

      <h1 class="title">
        LOGIN
      </h1>


      <p class="subtitle">
        আপনার AYNA BOOK অ্যাকাউন্টে নিরাপদে প্রবেশ করুন।
      </p>


      <!-- =================================================
           LOGIN FORM
           ================================================= -->

      <form
        id="loginForm"
        novalidate
      >

        <!-- GMAIL -->

        <div class="field">

          <label for="email">
            Gmail Address
          </label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="example@gmail.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label for="password">
            Password
          </label>


          <div class="input-wrap">

            <input
              id="password"
              name="password"
              class="password-input"
              type="password"
              placeholder="আপনার Password"
              autocomplete="current-password"
              required
            >


            <button
              id="togglePassword"
              class="eye-button"
              type="button"
              aria-label="Show password"
              aria-pressed="false"
            >
              Show
            </button>

          </div>

        </div>


        <!-- FORGOT PASSWORD -->

        <a
          href="./forgot-password.html"
          class="forgot"
        >
          Forgot Password?
        </a>


        <!-- MESSAGE -->

        <div
          id="message"
          class="message"
          aria-live="polite"
        ></div>


        <!-- LOGIN -->

        <button
          id="loginBtn"
          class="login-button"
          type="submit"
        >
          LOGIN
        </button>

      </form>


      <!-- =================================================
           REGISTER
           ================================================= -->

      <div class="register-area">

        নতুন AYNA BOOK অ্যাকাউন্ট তৈরি করতে

        <a href="./signup.html">
          REGISTER
        </a>

      </div>


      <!-- =================================================
           SECURITY
           ================================================= -->

      <div class="security-note">

        AYNA BOOK — Secure Login<br>

        আপনার Password কারও সঙ্গে শেয়ার করবেন না।

      </div>

    </section>

  </main>


  <!-- =====================================================
       LOGIN CONTROLLER
       ===================================================== -->

  <script
    type="module"
    src="./login.js"
  ></script>

</body>

</html>
