<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>AYNA BOOK - Login</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #071d16;
    }

    body {
      position: fixed;
      inset: 0;
    }

    .page {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(25, 160, 105, .25), transparent 35%),
        linear-gradient(145deg, #03130e, #08271d 55%, #03130e);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .login-box {
      width: min(92%, 430px);
      max-height: 94dvh;
      background: rgba(10, 35, 27, .97);
      border: 1px solid rgba(67, 211, 145, .25);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }

    .login-box::-webkit-scrollbar {
      display: none;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 14px;
      border-radius: 22px;
      background: linear-gradient(145deg, #19a96b, #08734a);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 25px;
      font-weight: 900;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0;
      text-align: center;
      color: #ffffff;
      font-size: 25px;
    }

    .subtitle {
      margin: 7px 0 25px;
      text-align: center;
      color: #9fc7b7;
      font-size: 14px;
    }

    label {
      display: block;
      color: #dff8ed;
      font-size: 14px;
      font-weight: 700;
      margin: 15px 0 7px;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #285445;
      border-radius: 13px;
      outline: none;
      background: #071d16;
      color: #ffffff;
      padding: 0 15px;
      font-size: 16px;
    }

    input:focus {
      border-color: #25c987;
      box-shadow: 0 0 0 3px rgba(37,201,135,.12);
    }

    .password-input {
      padding-right: 75px;
    }

    .show-btn {
      position: absolute;
      right: 8px;
      top: 7px;
      height: 38px;
      padding: 0 10px;
      border: 0;
      border-radius: 9px;
      background: #123f30;
      color: #75e6b5;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      height: 54px;
      margin-top: 23px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #20bd7b, #087d50);
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 9px 25px rgba(10,160,100,.25);
    }

    .login-btn:active {
      transform: scale(.98);
    }

    .status {
      min-height: 22px;
      margin-top: 13px;
      text-align: center;
      color: #ffb3b3;
      font-size: 13px;
      line-height: 1.5;
    }

    .links {
      text-align: center;
      margin-top: 18px;
      line-height: 2;
    }

    .links a {
      color: #69e2ae;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .divider {
      height: 1px;
      background: #214638;
      margin: 18px 0;
    }

    .register-text {
      color: #9fc7b7;
      font-size: 14px;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #668f80;
      font-size: 11px;
    }
  </style>
</head>

<body>

<div class="page">

  <div class="login-box">

    <div class="logo">AB</div>

    <h1>AYNA BOOK</h1>

    <div class="subtitle">
      Login to Your Account
    </div>

    <form id="loginForm">

      <label for="email">Email Address</label>

      <input
        id="email"
        name="email"
        type="email"
        placeholder="example@email.com"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>

      <div class="input-wrap">

        <input
          id="password"
          name="password"
          class="password-input"
          type="password"
          placeholder="Enter password"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          id="togglePassword"
          class="show-btn">
          Show
        </button>

      </div>

      <button
        id="loginBtn"
        class="login-btn"
        type="submit">
        Login
      </button>

      <div
        id="statusMsg"
        class="status">
      </div>

    </form>

    <div class="links">

      <a href="#" id="forgotPassword">
        Forgot Password?
      </a>

      <div class="divider"></div>

      <div class="register-text">
        Don't have an account?
        <a href="./register.html">
          Register
        </a>
      </div>

    </div>

    <div class="footer">
      © AYNA BOOK
    </div>

  </div>

</div>

<script type="module" src="./login.js"></script>

</body>
</html>
