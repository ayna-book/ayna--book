<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0A0F1E"
  >

  <title>AYNA BOOK — Login</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      background: #0A0F1E;

      color: #FFFFFF;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 420px;
    }

    .brand {
      text-align: center;

      font-size: 28px;

      font-weight: 800;

      letter-spacing: 3px;

      color: #FFFFFF;

      margin-bottom: 5px;
    }

    .brand-line {
      width: 60px;
      height: 2px;

      background: #FFD700;

      margin: 0 auto 25px;
    }

    .card {
      width: 100%;

      background: #111827;

      border:
        1px solid
        #FFD700;

      border-radius: 18px;

      padding: 25px 18px;

      box-shadow:
        0 0 30px
        rgba(255, 215, 0, 0.07);
    }

    h1 {
      text-align: center;

      font-size: 22px;

      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;

      color: #A9B0BC;

      font-size: 12px;

      line-height: 1.5;

      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;

      font-weight: 700;
    }

    input {
      width: 100%;

      height: 52px;

      padding: 0 14px;

      background: #1A2233;

      color: #FFFFFF;

      border:
        1px solid
        rgba(255, 215, 0, 0.35);

      border-radius: 10px;

      outline: none;

      font-size: 14px;
    }

    input:focus {
      border-color: #FFD700;

      box-shadow:
        0 0 0 2px
        rgba(255, 215, 0, 0.08);
    }

    input::placeholder {
      color: #778092;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 52px;
    }

    #togglePassword {
      position: absolute;

      right: 7px;

      top: 50%;

      transform: translateY(-50%);

      width: 40px;
      height: 40px;

      border: 0;

      background: transparent;

      color: #FFFFFF;

      font-size: 18px;

      cursor: pointer;
    }

    .forgot {
      display: block;

      text-align: right;

      margin-top: 7px;

      color: #FFD700;

      font-size: 12px;

      text-decoration: none;
    }

    .login-btn {
      width: 100%;

      height: 52px;

      margin-top: 17px;

      border: 0;

      border-radius: 10px;

      background: #FFFFFF;

      color: #0A0F1E;

      font-size: 15px;

      font-weight: 800;

      letter-spacing: 1px;

      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: 0.55;

      cursor: not-allowed;
    }

    #message {
      min-height: 24px;

      margin-top: 15px;

      text-align: center;

      color: #FFD700;

      font-size: 13px;

      line-height: 1.5;
    }

    .register-link {
      text-align: center;

      margin-top: 22px;

      padding-top: 20px;

      border-top:
        1px solid
        rgba(255, 255, 255, 0.08);

      color: #A9B0BC;

      font-size: 13px;
    }

    .register-link a {
      color: #FFD700;

      font-weight: 800;

      text-decoration: none;
    }

    .security-note {
      text-align: center;

      margin-top: 16px;

      color: #6F7888;

      font-size: 10px;

      line-height: 1.5;
    }

    @media (max-width: 420px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 22px 15px;
      }

      .brand {
        font-size: 26px;
      }
    }

  </style>
</head>


<body>

  <main class="page">

    <div class="brand">
      AYNA BOOK
    </div>

    <div class="brand-line"></div>


    <section class="card">

      <h1>
        Login
      </h1>

      <p class="subtitle">
        আপনার AYNA BOOK Account-এ প্রবেশ করুন
      </p>


      <form
        id="loginForm"
        novalidate
      >

        <div class="form-group">

          <label for="email">
            Gmail
          </label>

          <input
            id="email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="example@gmail.com"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrap">

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="আপনার Password"
              required
            >

            <button
              type="button"
              id="togglePassword"
              aria-label="Show password"
            >
              👁
            </button>

          </div>


          <a
            class="forgot"
            href="./forgot-password.html"
          >
            Password ভুলে গেছেন?
          </a>

        </div>


        <button
          type="submit"
          class="login-btn"
          id="loginBtn"
        >
          LOGIN
        </button>


        <div
          id="message"
          role="status"
          aria-live="polite"
        ></div>

      </form>


      <div class="register-link">

        Account নেই?

        <a href="./signup.html">
          REGISTER
        </a>

      </div>


      <div class="security-note">
        🔒 আপনার Account Firebase Authentication
        দ্বারা সুরক্ষিত।
      </div>

    </section>

  </main>


  <!--
    IMPORTANT:
    এখানে শুধু login.js থাকবে।
    কোনো দ্বিতীয় Login submit script রাখবেন না।
  -->

  <script
    type="module"
    src="./login.js"
  ></script>

</body>

</html>
