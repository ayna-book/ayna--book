<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b49">
  <meta name="description" content="AYNA BOOK — Quantum Physics & Entanglement Hub.">
  <title>AYNA BOOK — Quantum Physics Simulator</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #071b49;
      --accent-color: #00ffcc;
      --dark-bg: #020c24;
      --text-color: #ffffff;
      --neon-pink: #ff007f;
      --quantum-purple: #9d00ff;
    }
    body {
      background-color: var(--dark-bg);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    .quantum-container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 20px;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .top-nav a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quantum-hero {
      background: radial-gradient(circle, #240046 0%, #020c24 100%);
      border: 3px solid var(--quantum-purple);
      border-radius: 24px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 0 60px rgba(157, 0, 255, 0.4);
      margin-bottom: 25px;
    }
    .quantum-hero h1 {
      color: var(--accent-color);
      margin-top: 0;
      font-size: 28px;
    }

    .sim-panel {
      background: linear-gradient(145deg, var(--primary-color), var(--dark-bg));
      border: 2px solid var(--accent-color);
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
    }
    .atom-box {
      font-size: 60px;
      color: var(--accent-color);
      margin: 20px 0;
      animation: spin 6s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .btn-quantum {
      padding: 12px 25px;
      background: var(--neon-pink);
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
    }
  </style>
</head>
<body>
<div class="quantum-container">

  <div class="top-nav">
    <h2><i class="fa-solid fa-atom" style="color: var(--accent-color);"></i> AYNA Quantum Entanglement</h2>
    <a href="./index.html"><i class="fa-solid fa-arrow-left"></i> হোমে চলুন</a>
  </div>

  <div class="quantum-hero">
    <h1><i class="fa-solid fa-brain" style="color: var(--neon-pink);"></i> Quantum Entanglement Mesh</h1>
    <p style="color: #fff; font-size: 14px; max-width: 650px; margin: 10px auto 0 auto;">১০,০০০ বছরের ভবিষ্যৎ প্রযুক্তি এবং আল্ট্রা-সিকিউর কোয়ান্টাম এনক্রিপশন সিস্টেম।</p>
  </div>

  <div class="sim-panel">
    <div class="atom-box">
      <i class="fa-solid fa-atom"></i>
    </div>
    <h3 style="color: var(--accent-color);">কোয়ান্টাম স্পিন ও ডাটা এনক্রিপটর</h3>
    <p style="color: #aaa; font-size: 13px;">নিচে চাপ দিয়ে ইনস্ট্যান্ট কোয়ান্টাম সিকিউরিটি পাস তৈরি করুন:</p>
    <button class="btn-quantum" onclick="generateKey()">
      <i class="fa-solid fa-key"></i> Quantum Key Generate করুন
    </button>
    <div id="keyDisplay" style="margin-top: 20px; font-weight: bold; color: var(--neon-pink); font-family: monospace;"></div>
  </div>

</div>

<script>
  function generateKey() {
    const key = 'QKEY-' + Math.random().toString(36).substring(2, 12).toUpperCase() + '-10000Y';
    document.getElementById('keyDisplay').textContent = `🔑 Generated Key: ${key}`;
  }
</script>
</body>
</html>
