<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060d21">
<title>AYNA BOOK — বিশ্ব এমপি, মন্ত্রী ও সরকারি কর্মকর্তা</title>

<style>
:root {
  --bg: #050a18;
  --navy-top: #172e63;
  --navy-bottom: #08122b;
  --gold: #ffd700;
  --gold-base: #755206;
  --white: #ffffff;
  --muted: #dce6fa;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: Arial, "Noto Sans Bengali", sans-serif;
  font-size: 20px;
  padding-bottom: 80px;
}

.gold-3d {
  background: linear-gradient(155deg, var(--navy-top) 0%, var(--navy-bottom) 100%);
  border: 2.5px solid var(--gold);
  border-radius: 6px;
  box-shadow:
    0 7px 0 var(--gold-base),
    0 12px 22px rgba(0, 0, 0, 0.8),
    inset 0 2px 3px rgba(255, 242, 166, 0.5);
}

header {
  background: linear-gradient(180deg, #0f1f47 0%, #060d21 100%);
  border-bottom: 2.5px solid var(--gold);
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 50;
}

.brand {
  color: var(--gold);
  font-size: 24px;
  font-weight: 1000;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.star-1s {
  color: #ffffff;
  font-size: 26px;
  display: inline-block;
  animation: starFlash1s 1s infinite alternate ease-in-out;
}

@keyframes starFlash1s {
  0% { transform: scale(0.95); text-shadow: 0 0 6px #ffd700; }
  100% { transform: scale(1.35); text-shadow: 0 0 14px #ffffff, 0 0 32px #ffd700; }
}

.back-btn {
  text-decoration: none;
  background: linear-gradient(180deg, #ffd700 0%, #c99314 100%);
  color: #050a18;
  font-weight: 1000;
  font-size: 17px;
  padding: 8px 14px;
  border-radius: 6px;
  border: 1.5px solid #fff2a6;
  box-shadow: 0 4px 0 #664604;
}

.container {
  max-width: 1050px;
  margin: 18px auto;
  padding: 0 14px;
}

.page-title {
  font-size: 28px;
  font-weight: 1000;
  color: var(--gold);
  margin-bottom: 16px;
}

.box-pad {
  padding: 18px;
  margin-bottom: 20px;
}

.box-pad h2 {
  color: var(--gold);
  font-size: 23px;
  margin-bottom: 12px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(1, minmax(0, 1fr));
  gap: 12px;
}

@media(min-width: 650px) {
  .grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

input, select, textarea {
  width: 100%;
  background: #050b1c;
  color: var(--white);
  border: 2px solid var(--gold);
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 19px;
  margin-bottom: 12px;
}

.btn-gold-3d {
  width: 100%;
  min-height: 56px;
  background: linear-gradient(180deg, #ffd700 0%, #c99314 100%);
  color: #050a18;
  font-size: 21px;
  font-weight: 1000;
  border: 2px solid #fff2a6;
  border-radius: 6px;
  box-shadow: 0 5px 0 #664604;
  cursor: pointer;
}

.btn-gold-3d:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #664604;
}

.officials-grid {
  display: grid;
  grid-template-columns: repeat(1, minmax(0, 1fr));
  gap: 16px;
}

@media(min-width: 750px) {
  .officials-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.official-card {
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
}

.official-top {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 10px;
}

.official-photo {
  width: 92px;
  height: 92px;
  object-fit: cover;
  border: 3px solid var(--gold);
  border-radius: 6px;
  background: #050b1c;
  flex-shrink: 0;
  box-shadow: 0 4px 0 var(--gold-base);
}

.official-badge {
  display: inline-block;
  background: #050b1c;
  color: var(--gold);
  border: 1.5px solid var(--gold);
  border-radius: 6px;
  padding: 3px 10px;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 6px;
}

.official-name {
  font-size: 22px;
  font-weight: 1000;
  color: var(--white);
}

.official-role {
  font-size: 17px;
  font-weight: bold;
  color: var(--gold);
  margin-top: 3px;
}

.official-meta {
  font-size: 16px;
  color: var(--muted);
  margin-top: 3px;
}

.official-bio {
  font-size: 18px;
  line-height: 1.55;
  color: var(--muted);
  white-space: pre-wrap;
}

.official-footer {
  border-top: 1px solid rgba(255, 215, 0, 0.35);
  padding-top: 10px;
  font-size: 15px;
  color: var(--muted);
}

#notice {
  position: fixed;
  top: 76px;
  left: 50%;
  transform: translateX(-50%);
  background: #0a1636;
  color: #ffffff;
  border: 2px solid var(--gold);
  padding: 12px 18px;
  border-radius: 6px;
  z-index: 100;
  display: none;
  font-size: 18px;
  text-align: center;
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="brand">AYNA BOOK <span class="star-1s">★</span></a>
  <a href="index.html" class="back-btn">🏠 হোম</a>
</header>

<div id="notice"></div>

<main class="container">
  <h1 class="page-title">🏛️ বিশ্বের সকল এমপি, মন্ত্রী ও সরকারি কর্মকর্তা</h1>

  <!-- ফিল্টার ও অনুসন্ধান -->
  <section class="gold-3d box-pad">
    <h2>🔍 ক্যাটাগরি, দেশ, দপ্তর বা নাম দিয়ে খুঁজুন</h2>
    <div class="grid-2">
      <select id="officialCategoryFilter">
        <option value="ALL">🌐 সব ক্যাটাগরি</option>
        <option value="সংসদ সদস্য (MP)">সংসদ সদস্য (MP)</option>
        <option value="মন্ত্রী ও প্রতিমন্ত্রী">মন্ত্রী ও প্রতিমন্ত্রী</option>
        <option value="সরকারি কর্মকর্তা">সরকারি কর্মকর্তা</option>
        <option value="কূটনীতিক ও রাষ্ট্রদূত">কূটনীতিক ও রাষ্ট্রদূত</option>
        <option value="স্থানীয় প্রশাসন">স্থানীয় প্রশাসন</option>
      </select>

      <input id="officialCountryFilter" type="text" placeholder="দেশ বা এলাকা (যেমন: বাংলাদেশ, সৌদি আরব, যুক্তরাজ্য)...">
    </div>

    <input id="officialSearchInput" type="text" placeholder="নাম, পদবি, মন্ত্রণালয়/দপ্তর বা আসন লিখে খুঁজুন...">
  </section>

  <!-- নতুন এমপি, মন্ত্রী বা সরকারি কর্মকর্তার তথ্য যুক্ত করার ফর্ম -->
  <section class="gold-3d box-pad">
    <h2>➕ নতুন এমপি, মন্ত্রী বা সরকারি কর্মকর্তার তথ্য যুক্ত করুন</h2>
    <div class="grid-2">
      <select id="newOfficialCategory">
        <option value="সংসদ সদস্য (MP)">সংসদ সদস্য (MP)</option>
        <option value="মন্ত্রী ও প্রতিমন্ত্রী">মন্ত্রী ও প্রতিমন্ত্রী</option>
        <option value="সরকারি কর্মকর্তা">সরকারি কর্মকর্তা</option>
        <option value="কূটনীতিক ও রাষ্ট্রদূত">কূটনীতিক ও রাষ্ট্রদূত</option>
        <option value="স্থানীয় প্রশাসন">স্থানীয় প্রশাসন</option>
      </select>

      <input id="newOfficialCountry" type="text" placeholder="দেশ (যেমন: বাংলাদেশ, সৌদি আরব, যুক্তরাষ্ট্র)...">
    </div>

    <div class="grid-2">
      <input id="newOfficialName" type="text" placeholder="নাম...">
      <input id="newOfficialRole" type="text" placeholder="পদবি (যেমন: সংসদ সদস্য, মন্ত্রী, সচিব, জেলা প্রশাসক)...">
    </div>

    <div class="grid-2">
      <input id="newOfficialDept" type="text" placeholder="মন্ত্রণালয় / দপ্তর / সংসদীয় আসন...">
      <input id="newOfficialPhoto" type="url" placeholder="ছবির লিংক (ঐচ্ছিক)...">
    </div>

    <input id="newOfficialContact" type="text" placeholder="দাপ্তরিক ওয়েবসাইট / ইমেইল / যোগাযোগ (ঐচ্ছিক)...">
    <textarea id="newOfficialBio" rows="3" placeholder="দায়িত্ব, দপ্তর বা সংক্ষিপ্ত পরিচিতি লিখুন..."></textarea>
    <button id="addOfficialBtn" type="button" class="btn-gold-3d">
      📌 তালিকায় তথ্য যুক্ত করুন
    </button>
  </section>

  <!-- তালিকা -->
  <section id="worldOfficialsList" class="officials-grid">
    <div class="gold-3d box-pad" style="grid-column:1/-1;text-align:center;">
      তথ্য লোড হচ্ছে...
    </div>
  </section>
</main>

<script type="module" src="./world-officials.js"></script>
</body>
</html>
