<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060d21">
<title>AYNA BOOK — বিশ্ব মুদির দোকান</title>

<style>
:root {
  --bg: #050a18;
  --navy-top: #172e63;
  --navy-bottom: #08122b;
  --gold: #ffd700;
  --gold-base: #755206;
  --white: #ffffff;
  --muted: #dce6fa;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: Arial, "Noto Sans Bengali", sans-serif;
  font-size: 20px;
  padding-bottom: 70px;
}

.gold-3d {
  background: linear-gradient(155deg, var(--navy-top) 0%, var(--navy-bottom) 100%);
  border: 2.5px solid var(--gold);
  border-radius: 6px;
  box-shadow:
    0 7px 0 var(--gold-base),
    0 12px 22px rgba(0, 0, 0, 0.8),
    inset 0 2px 3px rgba(255, 242, 166, 0.5);
}

header {
  background: linear-gradient(180deg, #0f1f47 0%, #060d21 100%);
  border-bottom: 2.5px solid var(--gold);
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 50;
}

.brand {
  color: var(--gold);
  font-size: 24px;
  font-weight: 1000;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.star-1s {
  color: #ffffff;
  font-size: 26px;
  display: inline-block;
  animation: starFlash1s 1s infinite alternate ease-in-out;
}

@keyframes starFlash1s {
  0% { transform: scale(0.95); text-shadow: 0 0 6px #ffd700; }
  100% { transform: scale(1.35); text-shadow: 0 0 14px #ffffff, 0 0 32px #ffd700; }
}

.back-btn {
  text-decoration: none;
  background: linear-gradient(180deg, #ffd700 0%, #c99314 100%);
  color: #050a18;
  font-weight: 1000;
  font-size: 17px;
  padding: 8px 14px;
  border-radius: 6px;
  border: 1.5px solid #fff2a6;
  box-shadow: 0 4px 0 #664604;
}

.container {
  max-width: 1050px;
  margin: 18px auto;
  padding: 0 14px;
}

.page-title {
  font-size: 28px;
  font-weight: 1000;
  color: var(--gold);
  margin-bottom: 14px;
}

.box-pad {
  padding: 18px;
  margin-bottom: 18px;
}

.box-pad h2 {
  color: var(--gold);
  font-size: 23px;
  margin-bottom: 12px;
}

.status-banner {
  background: #050b1c;
  border: 1.5px solid var(--gold);
  border-radius: 6px;
  padding: 12px;
  color: var(--gold);
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 14px;
  text-align: center;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(1, minmax(0, 1fr));
  gap: 12px;
}

@media(min-width: 650px) {
  .grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

input, select {
  width: 100%;
  background: #050b1c;
  color: var(--white);
  border: 2px solid var(--gold);
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 19px;
  margin-bottom: 12px;
}

.btn-gold-3d {
  width: 100%;
  min-height: 54px;
  background: linear-gradient(180deg, #ffd700 0%, #c99314 100%);
  color: #050a18;
  font-size: 20px;
  font-weight: 1000;
  border: 2px solid #fff2a6;
  border-radius: 6px;
  box-shadow: 0 5px 0 #664604;
  cursor: pointer;
}

.btn-gold-3d:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #664604;
}

.grocery-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

@media(min-width: 750px) {
  .grocery-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

.grocery-card {
  padding: 16px 12px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.item-emoji {
  font-size: 44px;
  margin-bottom: 8px;
}

.item-cat {
  font-size: 14px;
  color: var(--gold);
  font-weight: bold;
  margin-bottom: 4px;
}

.item-name {
  font-size: 21px;
  font-weight: 1000;
  color: var(--white);
  margin-bottom: 6px;
}

.item-unit {
  font-size: 15px;
  color: var(--muted);
  margin-bottom: 8px;
}

.item-price {
  background: #050b1c;
  border: 1.5px solid var(--gold);
  border-radius: 6px;
  padding: 8px;
  font-size: 22px;
  font-weight: 1000;
  color: var(--gold);
}

.item-trend {
  font-size: 14px;
  margin-top: 8px;
  font-weight: bold;
}

#notice {
  position: fixed;
  top: 76px;
  left: 50%;
  transform: translateX(-50%);
  background: #0a1636;
  color: #ffffff;
  border: 2px solid var(--gold);
  padding: 12px 18px;
  border-radius: 6px;
  z-index: 100;
  display: none;
  font-size: 18px;
  text-align: center;
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="brand">AYNA BOOK <span class="star-1s">★</span></a>
  <a href="index.html" class="back-btn">🏠 হোম</a>
</header>

<div id="notice"></div>

<main class="container">
  <h1 class="page-title">🛒 বিশ্ব মুদির দোকান — দৈনিক বাজার দর</h1>

  <section class="gold-3d box-pad">
    <div id="autoUpdateBanner" class="status-banner">
      🔄 দৈনিক মূল্য ও লাইভ মুদ্রা হার লোড হচ্ছে...
    </div>

    <div class="grid-2">
      <div>
        <select id="groceryCountrySelect">
          <option value="BDT">🇧🇩 বাংলাদেশ (টাকা ৳)</option>
          <option value="SAR">🇸🇦 সৌদি আরব (রিয়াল ﷼)</option>
          <option value="AED">🇦🇪 সংযুক্ত আরব আমিরাত (দিরহাম د.إ)</option>
          <option value="GBP">🇬🇧 যুক্তরাজ্য (পাউন্ড £)</option>
          <option value="USD">🇺🇸 যুক্তরাষ্ট্র (ডলার $)</option>
          <option value="INR">🇮🇳 ভারত (রুপি ₹)</option>
        </select>
      </div>

      <div>
        <select id="groceryCategoryFilter">
          <option value="ALL">📦 সব ক্যাটাগরি</option>
          <option value="চাল ও আটা">চাল ও আটা</option>
          <option value="ডাল ও ছোলা">ডাল ও ছোলা</option>
          <option value="তেল ও চিনি">তেল ও চিনি</option>
          <option value="পেঁয়াজ ও মসলা">পেঁয়াজ ও মসলা</option>
          <option value="ডিম, দুধ ও চা">ডিম, দুধ ও চা</option>
        </select>
      </div>
    </div>

    <input id="grocerySearch" type="text" placeholder="পণ্যের নাম লিখে খুঁজুন (যেমন: চাল, তেল, চিনি, পেঁয়াজ)...">
    <button id="refreshRatesBtn" class="btn-gold-3d">🔄 আজকের মূল্য অটো আপডেট করুন</button>
  </section>

  <!-- লাইভ মূল্য আপডেট বা নতুন পণ্য যোগ (অ্যাডমিন / বিক্রেতা) -->
  <section class="gold-3d box-pad">
    <h2>✍️ দৈনিক মূল্য আপডেট বা নতুন মুদি পণ্য যোগ</h2>
    <div class="grid-2">
      <select id="newGroceryCat">
        <option value="চাল ও আটা">চাল ও আটা</option>
        <option value="ডাল ও ছোলা">ডাল ও ছোলা</option>
        <option value="তেল ও চিনি">তেল ও চিনি</option>
        <option value="পেঁয়াজ ও মসলা">পেঁয়াজ ও মসলা</option>
        <option value="ডিম, দুধ ও চা">ডিম, দুধ ও চা</option>
      </select>
      <input id="newGroceryEmoji" type="text" placeholder="আইকন ইমোজি (যেমন: 🍚, 🛢️, 🧅)" value="🛒">
    </div>
    <div class="grid-2">
      <input id="newGroceryName" type="text" placeholder="পণ্যের নাম (যেমন: মিনিকেট চাল)">
      <input id="newGroceryUnit" type="text" placeholder="পরিমাণ (যেমন: প্রতি কেজি / প্রতি লিটার)">
    </div>
    <input id="newGroceryBdtPrice" type="number" step="0.01" placeholder="বাংলাদেশী টাকায় (BDT) আজকের দাম লিখুন...">
    <button id="saveGroceryPriceBtn" class="btn-gold-3d">📌 দৈনিক মূল্য সেভ ও অটো-সিঙ্ক করুন</button>
  </section>

  <!-- মুদি পণ্যের গ্রিড -->
  <section id="groceryGrid" class="grocery-grid"></section>
</main>

<script type="module" src="./world-grocery.js"></script>
</body>
</html>
