<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060d21">
<title>AYNA BOOK — বিশ্ব আলেম সমাজ গবেষণাগার</title>

<style>
:root {
  --bg: #050a18;
  --navy-top: #172e63;
  --navy-bottom: #08122b;
  --gold: #ffd700;
  --gold-base: #755206;
  --white: #ffffff;
  --muted: #dce6fa;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: Arial, "Noto Sans Bengali", sans-serif;
  font-size: 20px;
  padding-bottom: 70px;
}

.gold-3d {
  background: linear-gradient(155deg, var(--navy-top) 0%, var(--navy-bottom) 100%);
  border: 2.5px solid var(--gold);
  border-radius: 6px;
  box-shadow:
    0 7px 0 var(--gold-base),
    0 12px 22px rgba(0, 0, 0, 0.8),
    inset 0 2px 3px rgba(255, 242, 166, 0.5);
}

header {
  background: linear-gradient(180deg, #0f1f47 0%, #060d21 100%);
  border-bottom: 2.5px solid var(--gold);
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 50;
}

.brand {
  color: var(--gold);
  font-size: 24px;
  font-weight: 1000;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.star-1s {
  color: #ffffff;
  font-size: 26px;
  display: inline-block;
  animation: starFlash1s 1s infinite alternate ease-in-out;
}

@keyframes starFlash1s {
  0% { transform: scale(0.95); text-shadow: 0 0 6px #ffd700; }
  100% { transform: scale(1.35); text-shadow: 0 0 14px #ffffff, 0 0 32px #ffd700; }
}

.back-btn {
  text-decoration: none;
  background: linear-gradient(180deg, #ffd700 0%, #c99314 100%);
  color: #050a18;
  font-weight: 1000;
  font-size: 17px;
  padding: 8px 14px;
  border-radius: 6px;
  border: 1.5px solid #fff2a6;
  box-shadow: 0 4px 0 #664604;
}

.container {
  max-width: 1000px;
  margin: 18px auto;
  padding: 0 14px;
}

.page-title {
  font-size: 28px;
  font-weight: 1000;
  color: var(--gold);
  margin-bottom: 16px;
}

.box-pad {
  padding: 18px;
  margin-bottom: 20px;
}

.box-pad h2 {
  color: var(--gold);
  font-size: 23px;
  margin-bottom: 12px;
}

input, select, textarea {
  width: 100%;
  background: #050b1c;
  color: var(--white);
  border: 2px solid var(--gold);
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 19px;
  margin-bottom: 12px;
}

.btn-gold-3d {
  width: 100%;
  min-height: 56px;
  background: linear-gradient(180deg, #ffd700 0%, #c99314 100%);
  color: #050a18;
  font-size: 21px;
  font-weight: 1000;
  border: 2px solid #fff2a6;
  border-radius: 6px;
  box-shadow: 0 5px 0 #664604;
  cursor: pointer;
}

.btn-gold-3d:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #664604;
}

.research-card {
  padding: 18px;
  margin-bottom: 16px;
}

.research-meta {
  color: var(--gold);
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 8px;
}

.research-title {
  font-size: 24px;
  font-weight: 1000;
  color: var(--white);
  margin-bottom: 10px;
}

.research-body {
  font-size: 19px;
  line-height: 1.65;
  color: var(--muted);
  white-space: pre-wrap;
}

.research-author {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid rgba(255, 215, 0, 0.35);
  font-size: 17px;
  color: var(--white);
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="brand">AYNA BOOK <span class="star-1s">★</span></a>
  <a href="index.html" class="back-btn">🏠 হোম</a>
</header>

<main class="container">
  <h1 class="page-title">📚 বিশ্ব আলেম সমাজ গবেষণাগার</h1>

  <!-- ফিল্টার ও অনুসন্ধান -->
  <section class="gold-3d box-pad">
    <h2>🔍 বিষয় ও দেশ অনুযায়ী গবেষণা খুঁজুন</h2>
    <select id="topicFilter">
      <option value="ALL">সব বিষয়</option>
      <option value="কুরআন ও হাদিস">কুরআন ও হাদিস</option>
      <option value="ফিকহ ও ফতোয়া">ফিকহ ও ফতোয়া</option>
      <option value="ইসলামি অর্থনীতি">ইসলামি অর্থনীতি</option>
      <option value="সমাজ ও আধুনিকতা">সমাজ ও আধুনিকতা</option>
      <option value="ইতিহাস ও জীবনী">ইতিহাস ও জীবনী</option>
    </select>
    <input id="researchSearch" type="text" placeholder="শিরোনাম, গবেষক বা বিষয় লিখে খুঁজুন...">
  </section>

  <!-- নতুন গবেষণা বা প্রবন্ধ যুক্ত করার ফর্ম -->
  <section class="gold-3d box-pad">
    <h2>✍️ নতুন গবেষণা বা প্রবন্ধ যুক্ত করুন</h2>
    <select id="researchTopic">
      <option value="কুরআন ও হাদিস">কুরআন ও হাদিস</option>
      <option value="ফিকহ ও ফতোয়া">ফিকহ ও ফতোয়া</option>
      <option value="ইসলামি অর্থনীতি">ইসলামি অর্থনীতি</option>
      <option value="সমাজ ও আধুনিকতা">সমাজ ও আধুনিকতা</option>
      <option value="ইতিহাস ও জীবনী">ইতিহাস ও জীবনী</option>
    </select>
    <input id="researchCountry" type="text" placeholder="দেশ / অঞ্চল (যেমন: বাংলাদেশ, সৌদি আরব, মিশর)...">
    <input id="researchTitle" type="text" placeholder="গবেষণাপত্র বা প্রবন্ধের শিরোনাম...">
    <input id="researchScholar" type="text" placeholder="আলেম বা গবেষকের নাম...">
    <textarea id="researchSummary" rows="4" placeholder="মূল বক্তব্য বা গবেষণার সারসংক্ষেপ লিখুন..."></textarea>
    <button id="publishResearchBtn" class="btn-gold-3d">📌 গবেষণাগার তালিকায় যুক্ত করুন</button>
  </section>

  <!-- গবেষণা তালিকা -->
  <section id="researchList">
    <div class="gold-3d box-pad">গবেষণা তালিকা লোড হচ্ছে...</div>
  </section>
</main>

<script type="module">
import { auth, database } from "./firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";

const $ = (id) => document.getElementById(id);
let currentUser = null;
let allResearch = [];

onAuthStateChanged(auth, (user) => {
  currentUser = user;
});

$("publishResearchBtn")?.addEventListener("click", async () => {
  if (!currentUser) {
    alert("গবেষণা যুক্ত করতে আগে লগইন করুন।");
    return;
  }

  const topic = $("researchTopic").value;
  const country = $("researchCountry").value.trim() || "আন্তর্জাতিক";
  const title = $("researchTitle").value.trim();
  const scholar = $("researchScholar").value.trim() || "আলেম সমাজ";
  const summary = $("researchSummary").value.trim();

  if (!title || !summary) {
    alert("অনুগ্রহ করে শিরোনাম এবং সারসংক্ষেপ লিখুন।");
    return;
  }

  const itemRef = push(ref(database, "ulemaResearch"));
  await set(itemRef, {
    topic,
    country,
    title,
    scholar,
    summary,
    uid: currentUser.uid,
    createdAt: Date.now()
  });

  $("researchCountry").value = "";
  $("researchTitle").value = "";
  $("researchScholar").value = "";
  $("researchSummary").value = "";
  alert("গবেষণাগারে সফলভাবে যুক্ত হয়েছে!");
});

$("topicFilter")?.addEventListener("change", renderResearch);
$("researchSearch")?.addEventListener("input", renderResearch);

onValue(ref(database, "ulemaResearch"), (snap) => {
  const data = snap.val() || {};
  allResearch = Object.entries(data)
    .map(([id, item]) => ({ id, ...item }))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  renderResearch();
});

function renderResearch() {
  const container = $("researchList");
  if (!container) return;

  const selectedTopic = $("topicFilter")?.value || "ALL";
  const query = ($("researchSearch")?.value || "").trim().toLowerCase();

  const filtered = allResearch.filter((item) => {
    const matchTopic = selectedTopic === "ALL" || item.topic === selectedTopic;
    const matchQuery =
      !query ||
      (item.title && item.title.toLowerCase().includes(query)) ||
      (item.scholar && item.scholar.toLowerCase().includes(query)) ||
      (item.summary && item.summary.toLowerCase().includes(query)) ||
      (item.country && item.country.toLowerCase().includes(query));
    return matchTopic && matchQuery;
  });

  container.innerHTML = "";

  if (!filtered.length) {
    container.innerHTML =
      '<div class="gold-3d box-pad">এই বিষয়ে এখনও কোনো গবেষণা যুক্ত করা হয়নি।</div>';
    return;
  }

  filtered.forEach((item) => {
    const article = document.createElement("article");
    article.className = "gold-3d research-card";
    article.innerHTML = `
      <div class="research-meta">📖 ${item.topic} • 🌍 ${item.country}</div>
      <h3 class="research-title">${item.title}</h3>
      <p class="research-body">${item.summary}</p>
      <div class="research-author">গবেষক / আলেম: <strong>${item.scholar}</strong></div>
    `;
    container.appendChild(article);
  });
}
</script>
</body>
</html>
