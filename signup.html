<!-- =====================================================
     AYNA BOOK — PROFILE PHOTO
===================================================== -->

<div class="form-group">
  <label for="photo">
    Profile Photo <span style="color:#d4af37;">*</span>
  </label>

  <input
    id="photo"
    name="photo"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    required
  />

  <small>
    JPG, PNG অথবা WebP • সর্বোচ্চ 5 MB
  </small>

  <div
    id="photoPreviewBox"
    style="
      display:none;
      margin-top:12px;
      text-align:center;
    "
  >
    <img
      id="photoPreview"
      src=""
      alt="Profile photo preview"
      style="
        width:120px;
        height:120px;
        object-fit:cover;
        border-radius:50%;
        border:2px solid #d4af37;
      "
    >
  </div>

  <div
    id="photoStatus"
    role="status"
    aria-live="polite"
  ></div>
</div>
