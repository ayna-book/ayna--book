
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0F1E">

  <title>AYNA BOOK — Registration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 12px;
      background: #0A0F1E;
      color: #FFFFFF;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo {
      font-size: 29px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #FFFFFF;
    }

    .star {
      color: #FFD700;
      font-size: 19px;
      animation: glow 1s infinite alternate;
    }

    @keyframes glow {
      from { opacity: .5; }
      to { opacity: 1; }
    }

    .card {
      background: #1A2233;
      border: 1px solid #FFD700;
      border-radius: 15px;
      padding: 22px;
    }

    h2 {
      text-align: center;
      margin-top: 0;
      color: #FFFFFF;
    }

    .subtitle {
      color: #A9B0BC;
      text-align: center;
      font-size: 13px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #526078;
      border-radius: 8px;
      background: #0A0F1E;
      color: white;
      font-size: 15px;
    }

    input:focus, select:focus {
      outline: 1px solid #FFD700;
    }

    input[type="file"] {
      padding: 9px;
    }

    .password-box {
      display: flex;
      gap: 7px;
    }

    .password-box input {
      flex: 1;
      min-width: 0;
    }

    .show-button {
      padding: 0 12px;
      background: #34415A;
      color: white;
      border: 0;
      border-radius: 8px;
    }

    .photo-preview {
      display: block;
      width: 110px;
      height: 110px;
      margin: 12px auto;
      border-radius: 50%;
      border: 2px solid #FFD700;
      object-fit: contain;
      background: #0A0F1E;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: 18px;
      color: #A9B0BC;
      font-size: 13px;
    }

    .terms input {
      width: auto;
      margin-top: 2px;
    }

    button.submit {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: 0;
      border-radius: 9px;
      background: #FFD700;
      color: #0A0F1E;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #statusMessage {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      display: none;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #A9B0BC;
    }

    a {
      color: #FFD700;
      text-decoration: none;
    }

    .note {
      color: #A9B0BC;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">
      AYNA BOOK <span class="star">✦</span>
    </div>
    <p>Connect • Share • Create</p>
  </div>

  <div class="card">

    <h2>Create Your Account</h2>

    <p class="subtitle">
      Registration with Gmail Verification
    </p>

    <form id="registrationForm">

      <label for="accountType">Account Category</label>

      <select id="accountType" required>
        <option value="personal">Personal — Free</option>
        <option value="business">Business — $10</option>
        <option value="vip">VIP — $10</option>
        <option value="vvip">VVIP — $20</option>
      </select>

      <label for="fullName">Full Name</label>
      <input
        id="fullName"
        type="text"
        maxlength="100"
        autocomplete="name"
        required
      >

      <label for="email">Gmail Address</label>
      <input
        id="email"
        type="email"
        placeholder="example@gmail.com"
        autocomplete="email"
        required
      >

      <label for="phone">Mobile Number</label>
      <input
        id="phone"
        type="tel"
        placeholder="+8801XXXXXXXXX"
        autocomplete="tel"
        required
      >

      <label for="profilePhoto">Profile Photo (Optional)</label>

      <img
        id="photoPreview"
        class="photo-preview"
        alt="Profile photo preview"
      >

      <input
        id="profilePhoto"
        type="file"
        accept="image/jpeg,image/png,image/webp"
      >

      <label for="password">Password (Minimum 11 Characters)</label>

      <div class="password-box">
        <input
          id="password"
          type="password"
          minlength="11"
          autocomplete="new-password"
          required
        >

        <button
          class="show-button"
          type="button"
          data-toggle="password"
        >Show</button>
      </div>

      <label for="confirmPassword">Confirm Password</label>

      <div class="password-box">
        <input
          id="confirmPassword"
          type="password"
          minlength="11"
          autocomplete="new-password"
          required
        >

        <button
          class="show-button"
          type="button"
          data-toggle="confirmPassword"
        >Show</button>
      </div>

      <div class="terms">
        <input id="terms" type="checkbox" required>
        <label for="terms">
          I agree to AYNA BOOK's Terms and Privacy Policy.
        </label>
      </div>

      <button
        class="submit"
        id="registerButton"
        type="submit"
      >
        REGISTER
      </button>

    </form>

    <div id="statusMessage" role="status" aria-live="polite"></div>

    <p class="note">
      Registration-এর পরে আপনার Gmail-এ একটি verification link পাঠানো হবে।
      Inbox অথবা Spam folder পরীক্ষা করুন।
    </p>

    <div class="login-link">
      Already have an account?
      <a href="./login.html">LOGIN</a>
    </div>

  </div>

</div>

<script type="module" src="./signup.js"></script>

</body>
</html>
