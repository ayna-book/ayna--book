<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাইন আপ - AYNA APP</title>
    <style>
        body { background: #090a0f; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-size: 18px; }
        .box { background: rgba(255,255,255,0.08); border: 2px solid #ffd700; padding: 28px; border-radius: 14px; width: 340px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #111; border: 1.5px solid #b8860b; color: #fff; border-radius: 8px; font-size: 1rem; }
        button { width: 100%; padding: 14px; background: #ffd700; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; color: #000; font-size: 1.1rem; margin-top: 8px; }
        a { color: #ffd700; font-size: 0.95rem; text-decoration: none; display: block; margin-top: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #ffd700; margin-bottom: 15px;">নতুন অ্যাকাউন্ট খুলুন</h2>
        <input type="email" id="reg-email" placeholder="আপনার ইমেইল দিন">
        <input type="password" id="reg-pass" placeholder="নতুন পাসওয়ার্ড দিন (কমপক্ষে ৬ অক্ষর)">
        <button id="signup-btn">রেজিস্টার করুন</button>
        <a href="login.html">আগে থেকেই অ্যাকাউন্ট আছে? লগইন করুন</a>
    </div>

    <script type="module">
        import { registerUser } from './auth.js';
        
        document.getElementById('signup-btn').addEventListener('click', async () => {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            try {
                await registerUser(email, pass);
                alert('অ্যাকাউন্ট তৈরি সফল হয়েছে!');
                window.location.href = 'index.html';
            } catch (error) {
                alert('ত্রুটি: ' + error.message);
            }
       });
    </script>
</body>
</html>
