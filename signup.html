<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AYNA BOOK - Sign Up</title>
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f5d76e;
      --bg-dark: #07090f;
      --card-bg: #111521;
      --input-bg: #0b0e17;
      --border-dim: #262e42;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      background: radial-gradient(circle at top, #171d30 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      overflow-x: hidden;
    }

    .page-wrapper {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .auth-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1.5px solid var(--gold);
      border-radius: 16px;
      padding: 28px 22px;
      box-shadow: 0 0 28px rgba(212, 175, 55, 0.22);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-header h1 {
      color: var(--gold);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .brand-header p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--gold-light);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border-dim);
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: 0.25s;
    }

    .form-group input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
    }

    .btn-gold {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e0b838, #b88918);
      color: #090b10;
      font-weight: 800;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.25s;
    }

    .btn-gold:hover {
      filter: brightness(1.08);
    }

    .status-msg {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
      line-height: 1.4;
    }

    .links {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
    }

    .links a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 700;
    }

    .links a:hover {
      text-decoration: underline;
    }

    /* মোবাইলে সম্পূর্ণ edge-to-edge ফুল স্ক্রিন লুক চাইলে */
    @media (max-width: 520px) {
      .page-wrapper {
        padding: 0;
        align-items: stretch;
      }
      .auth-container {
        max-width: 100%;
        min-height: 100dvh;
        border-radius: 0;
        border-left: none;
        border-right: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="auth-container">
      <div class="brand-header">
        <h1>AYNA BOOK</h1>
        <p>Create your Global Digital Identity</p>
      </div>

      <form id="signupForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="example@email.com" required />
        </div>

        <div class="form-group">
          <label for="country">Phone / Country</label>
          <input type="text" id="country" placeholder="e.g. Bangladesh" required />
        </div>

        <div class="form-group">
          <label for="password">Password (Min 6 characters)</label>
          <input type="password" id="password" placeholder="••••••••" minlength="6" required />
        </div>

        <button type="submit" class="btn-gold" id="submitBtn">Create AYNA Account</button>
        <div class="status-msg" id="statusMsg"></div>
      </form>

      <div class="links">
        Already have an account? <a href="index.html">Log In</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "ayna-book.firebaseapp.com",
      databaseURL: "https://ayna-book-default-rtdb.firebaseio.com",
      projectId: "ayna-book",
      storageBucket: "ayna-book.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const signupForm = document.getElementById("signupForm");
    const statusMsg = document.getElementById("statusMsg");
    const submitBtn = document.getElementById("submitBtn");

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const country = document.getElementById("country").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating Account...";
      statusMsg.style.color = "#f5d76e";
      statusMsg.textContent = "Generating your AYNA ID...";

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        await updateProfile(user, { displayName: fullName });
        await sendEmailVerification(user);

        const counterRef = ref(db, "system/lastUserSerial");
        const transactionResult = await runTransaction(counterRef, (currentValue) => {
          return (currentValue || 10000000) + 1;
        });
        const aynaId = `2026-----${transactionResult.snapshot.val()}`;

        await set(ref(db, `users/${user.uid}`), {
          uid: user.uid,
          aynaId: aynaId,
          fullName: fullName,
          email: email,
          country: country,
          photoURL: "https://via.placeholder.com/300/121622/d4af37?text=AYNA+USER",
          privacy: "public",
          createdAt: new Date().toISOString()
        });

        statusMsg.style.color = "#4ade80";
        statusMsg.textContent = `Success! Your AYNA ID: ${aynaId}. Redirecting to Dashboard...`;
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1800);
      } catch (error) {
        statusMsg.style.color = "#f87171";
        statusMsg.textContent = error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = "Create AYNA Account";
      }
    });
  </script>
</body>
</html>
