<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070b">

  <title>AYNA BOOK — Sign Up</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      color: #fff;

      background:
        radial-gradient(
          circle at top,
          #182238 0%,
          #080b12 45%,
          #030407 100%
        );

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .logo {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo-icon {
      width: 76px;
      height: 76px;

      margin: auto;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 40px;
      font-weight: 900;

      color: #05070b;

      background:
        linear-gradient(
          135deg,
          #ffd700,
          #ffb300
        );

      box-shadow:
        0 0 30px rgba(255, 215, 0, .3);
    }

    .logo h1 {
      margin: 12px 0 0;

      color: #ffd700;

      letter-spacing: 2px;
    }

    .logo p {
      color: #aeb7c7;
      font-size: 13px;
    }

    .card {
      background: rgba(12, 16, 25, .95);

      border:
        1px solid
        rgba(255, 215, 0, .35);

      border-radius: 22px;

      padding: 28px 22px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, .5);
    }

    h2 {
      text-align: center;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;

      color: #9fa8b8;

      font-size: 14px;

      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {

      width: 100%;

      padding: 14px;

      border-radius: 12px;

      border:
        1px solid
        rgba(255, 255, 255, .14);

      outline: none;

      background:
        rgba(255, 255, 255, .06);

      color: #fff;

      font-size: 15px;
    }

    input:focus {

      border-color: #ffd700;

      box-shadow:
        0 0 0 3px
        rgba(255, 215, 0, .08);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 55px;
    }

    .show {
      position: absolute;

      right: 8px;
      top: 50%;

      transform: translateY(-50%);

      border: 0;

      background: transparent;

      color: #ffd700;

      cursor: pointer;

      font-size: 18px;
    }

    .terms {

      display: flex;

      gap: 9px;

      align-items: flex-start;

      margin: 17px 0;

      color: #aeb7c7;

      font-size: 13px;

      line-height: 1.5;
    }

    .terms input[type="checkbox"] {

      width: 17px;
      height: 17px;

      margin-top: 3px;

      accent-color: #ffd700;

      flex-shrink: 0;
    }

    .terms a {

      color: #ffd700;

      text-decoration: none;
    }

    .signup {

      width: 100%;

      padding: 14px;

      border: 0;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #ffd700,
          #ffb300
        );

      color: #05070b;

      font-weight: 800;

      font-size: 16px;

      cursor: pointer;
    }

    .signup:disabled {

      opacity: .6;

      cursor: wait;
    }

    .message {

      display: none;

      padding: 12px;

      border-radius: 10px;

      margin-bottom: 16px;

      text-align: center;

      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .error {

      color: #ff8a80;

      background:
        rgba(255, 82, 82, .1);
    }

    .success {

      color: #69f0ae;

      background:
        rgba(0, 230, 118, .1);
    }

    .divider {

      display: flex;

      align-items: center;

      gap: 10px;

      margin: 22px 0;

      color: #687182;

      font-size: 12px;
    }

    .divider::before,
    .divider::after {

      content: "";

      flex: 1;

      height: 1px;

      background:
        rgba(255, 255, 255, .1);
    }

    .login {

      text-align: center;

      color: #aeb7c7;

      font-size: 14px;
    }

    .login a {

      color: #ffd700;

      text-decoration: none;

      font-weight: bold;
    }

    .home {

      display: block;

      text-align: center;

      margin-top: 20px;

      color: #8f99aa;

      text-decoration: none;

      font-size: 13px;
    }

    .status {

      text-align: center;

      color: #69f0ae;

      font-size: 12px;

      margin-top: 18px;
    }

    .dot {

      display: inline-block;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #00e676;

      margin-right: 5px;
    }
  </style>
</head>


<body>

<div class="container">


  <!-- LOGO -->

  <div class="logo">

    <div class="logo-icon">
      A
    </div>

    <h1>
      AYNA BOOK
    </h1>

    <p>
      আধুনিক নিরাপদ ডিজিটাল সোশ্যাল প্ল্যাটফর্ম
    </p>

  </div>


  <!-- SIGNUP CARD -->

  <section class="card">

    <h2>
      ✨ Create Account
    </h2>

    <p class="subtitle">
      AYNA BOOK-এ আপনার নতুন অ্যাকাউন্ট তৈরি করুন
    </p>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message">
    </div>


    <!-- NAME -->

    <div class="field">

      <label for="name">
        👤 Full Name
      </label>

      <input
        id="name"
        type="text"
        autocomplete="name"
        placeholder="আপনার নাম লিখুন"
        required
      >

    </div>


    <!-- EMAIL -->

    <div class="field">

      <label for="email">
        📧 Email Address
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="আপনার ইমেইল লিখুন"
        required
      >

    </div>


    <!-- PASSWORD -->

    <div class="field">

      <label for="password">
        🔑 Password
      </label>

      <div class="password-box">

        <input
          id="password"
          type="password"
          autocomplete="new-password"
          placeholder="কমপক্ষে ৬ অক্ষর"
          required
        >

        <button
          id="showPassword"
          class="show"
          type="button"
          aria-label="Show password">

          👁️

        </button>

      </div>

    </div>


    <!-- CONFIRM PASSWORD -->

    <div class="field">

      <label for="confirmPassword">
        🔐 Confirm Password
      </label>

      <div class="password-box">

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="পাসওয়ার্ড আবার লিখুন"
          required
        >

        <button
          id="showConfirmPassword"
          class="show"
          type="button"
          aria-label="Show confirm password">

          👁️

        </button>

      </div>

    </div>


    <!-- TERMS -->

    <label class="terms">

      <input
        id="terms"
        type="checkbox"
      >

      <span>

        আমি AYNA BOOK-এর

        <a
          href="./privacy.html"
          target="_blank">

          Privacy Policy

        </a>

        এবং

        <a
          href="./terms.html"
          target="_blank">

          Terms

        </a>

        মেনে নিচ্ছি।

      </span>

    </label>


    <!-- SIGNUP BUTTON -->

    <button
      id="signupButton"
      class="signup"
      type="button">

      CREATE ACCOUNT

    </button>


    <div class="divider">
      অথবা
    </div>


    <!-- LOGIN -->

    <div class="login">

      ইতিমধ্যে অ্যাকাউন্ট আছে?

      <a href="./login.html">

        Login করুন

      </a>

    </div>

  </section>


  <!-- STATUS -->

  <div class="status">

    <span class="dot"></span>

    Firebase Authentication Ready

  </div>


  <!-- HOME -->

  <a
    class="home"
    href="./index.html">

    ← AYNA BOOK Home

  </a>


</div>



<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script type="module">

import {
  registerUser
} from "./auth.js";


const nameInput =
  document.getElementById("name");


const emailInput =
  document.getElementById("email");


const passwordInput =
  document.getElementById("password");


const confirmPasswordInput =
  document.getElementById("confirmPassword");


const termsInput =
  document.getElementById("terms");


const signupButton =
  document.getElementById("signupButton");


const showPasswordButton =
  document.getElementById("showPassword");


const showConfirmPasswordButton =
  document.getElementById(
    "showConfirmPassword"
  );


const message =
  document.getElementById("message");



/* ==================================================
   MESSAGE
================================================== */

function showMessage(
  text,
  type = "error"
) {

  message.textContent = text;

  message.className =
    "message show " + type;

}



/* ==================================================
   PASSWORD SHOW / HIDE
================================================== */

showPasswordButton.addEventListener(
  "click",
  () => {

    if (
      passwordInput.type ===
      "password"
    ) {

      passwordInput.type =
        "text";

      showPasswordButton.textContent =
        "🙈";

    } else {

      passwordInput.type =
        "password";

      showPasswordButton.textContent =
        "👁️";

    }

  }
);



showConfirmPasswordButton.addEventListener(
  "click",
  () => {

    if (
      confirmPasswordInput.type ===
      "password"
    ) {

      confirmPasswordInput.type =
        "text";

      showConfirmPasswordButton.textContent =
        "🙈";

    } else {

      confirmPasswordInput.type =
        "password";

      showConfirmPasswordButton.textContent =
        "👁️";

    }

  }
);



/* ==================================================
   REGISTER
================================================== */

signupButton.addEventListener(
  "click",
  async () => {

    const name =
      nameInput.value.trim();


    const email =
      emailInput.value.trim();


    const password =
      passwordInput.value;


    const confirmPassword =
      confirmPasswordInput.value;



    /* NAME */

    if (!name) {

      showMessage(
        "আপনার নাম লিখুন।"
      );

      nameInput.focus();

      return;

    }



    /* EMAIL */

    if (!email) {

      showMessage(
        "আপনার ইমেইল লিখুন।"
      );

      emailInput.focus();

      return;

    }



    /* PASSWORD */

    if (password.length < 6) {

      showMessage(
        "পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।"
      );

      passwordInput.focus();

      return;

    }



    /* CONFIRM PASSWORD */

    if (
      password !==
      confirmPassword
    ) {

      showMessage(
        "দুইটি পাসওয়ার্ড একই নয়।"
      );

      confirmPasswordInput.focus();

      return;

    }



    /* TERMS */

    if (!termsInput.checked) {

      showMessage(
        "Terms ও Privacy Policy গ্রহণ করুন।"
      );

      return;

    }



    /* BUTTON */

    signupButton.disabled =
      true;

    signupButton.textContent =
      "ACCOUNT তৈরি হচ্ছে...";



    try {


      /*
       * IMPORTANT:
       *
       * Current auth.js returns:
       *
       * {
       *   success: true,
       *   user: user,
       *   message: "..."
       * }
       *
       * অথবা error হলে:
       *
       * {
       *   success: false,
       *   message: "..."
       * }
       */

      const result =
        await registerUser(
          name,
          email,
          password
        );



      /* SUCCESS */

      if (
        result &&
        result.success === true
      ) {

        showMessage(
          result.message ||
          "✅ Account সফলভাবে তৈরি হয়েছে।",
          "success"
        );


        /*
         * Give Firebase a moment
         * before redirect.
         */

        setTimeout(
          () => {

            window.location.href =
              "./index.html";

          },
          1000
        );


        return;

      }



      /* FAILED */

      showMessage(
        result?.message ||
        "Account তৈরি করা যায়নি।"
      );


      signupButton.disabled =
        false;

      signupButton.textContent =
        "CREATE ACCOUNT";


    } catch (error) {

      console.error(
        "❌ Registration failed:",
        error
      );


      showMessage(
        error?.message ||
        "Account তৈরি করা যায়নি।"
      );


      signupButton.disabled =
        false;

      signupButton.textContent =
        "CREATE ACCOUNT";

    }

  }
);



/* ==================================================
   ENTER KEY
================================================== */

confirmPasswordInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      signupButton.click();

    }

  }
);



/* ==================================================
   INITIAL STATUS
================================================== */

console.log(
  "✅ AYNA BOOK Signup page loaded."
);

console.log(
  "🔥 Firebase registration handled by auth.js"
);

</script>

</body>
</html>
