
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070b">
  <title>AYNA BOOK — Sign Up</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05070b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .signup-box {
      width: 100%;
      max-width: 440px;
      padding: 30px 24px;
      background: #10141d;
      border: 1px solid #333b49;
      border-radius: 20px;
      box-shadow: 0 15px 45px #0008;
    }

    .logo {
      text-align: center;
      color: #e8bd62;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    h2 {
      text-align: center;
      margin: 10px 0;
    }

    .subtitle {
      text-align: center;
      color: #aab1bd;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #e6c477;
      font-size: 14px;
    }

    input:not([type="checkbox"]) {
      width: 100%;
      padding: 14px;
      border: 1px solid #394353;
      border-radius: 10px;
      background: #080c13;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #e8bd62;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 65px;
    }

    .toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #e8bd62;
      cursor: pointer;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 20px 0;
      color: #c1c6cf;
      font-size: 13px;
      line-height: 1.6;
    }

    .terms input {
      margin-top: 4px;
    }

    a {
      color: #e8bd62;
      text-decoration: none;
    }

    .signup-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #f1d38b, #bd8b34);
      color: #111;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .signup-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      margin: 15px 0;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.show { display: block; }
    .message.success {
      background: #123a29;
      color: #8df0b5;
    }

    .message.error {
      background: #431b20;
      color: #ffadb5;
    }

    .login {
      text-align: center;
      color: #aab1bd;
      font-size: 14px;
      margin-top: 22px;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #707987;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="signup-box">

    <div class="logo">AYNA BOOK</div>
    <h2>Create Account</h2>
    <p class="subtitle">Join the AYNA BOOK community</p>

    <form id="signupForm">

      <label for="name">Full Name</label>
      <input
        id="name"
        type="text"
        placeholder="Enter your full name"
        minlength="2"
        maxlength="60"
        autocomplete="name"
        required
      >

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <div class="password-wrap">
        <input
          id="password"
          type="password"
          placeholder="Minimum 6 characters"
          minlength="6"
          autocomplete="new-password"
          required
        >
        <button class="toggle" type="button"
          data-target="password">Show</button>
      </div>

      <label for="confirmPassword">Confirm Password</label>
      <div class="password-wrap">
        <input
          id="confirmPassword"
          type="password"
          placeholder="Enter password again"
          minlength="6"
          autocomplete="new-password"
          required
        >
        <button class="toggle" type="button"
          data-target="confirmPassword">Show</button>
      </div>

      <div class="terms">
        <input id="terms" type="checkbox" required>
        <span>
          I agree to the
          <a href="./terms.html">Terms & Conditions</a>
          and
          <a href="./privacy.html">Privacy Policy</a>.
        </span>
      </div>

      <div id="message" class="message" role="status"
        aria-live="polite"></div>

      <button id="signupButton" class="signup-btn" type="submit">
        Create Account
      </button>

    </form>

    <p class="login">
      Already have an account?
      <a href="./login.html">Login</a>
    </p>

    <div class="footer">
      AYNA BOOK — Modern Digital Social Platform
    </div>

  </main>

  <script type="module">
    import { registerUser } from "./auth.js";

    const form = document.getElementById("signupForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const termsInput = document.getElementById("terms");
    const signupButton = document.getElementById("signupButton");
    const messageBox = document.getElementById("message");

    function showMessage(message, type) {
      messageBox.textContent = message;
      messageBox.className = "message show " + type;
    }

    document.querySelectorAll(".toggle").forEach(button => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);
        const visible = input.type === "password";

        input.type = visible ? "text" : "password";
        button.textContent = visible ? "Hide" : "Show";
      });
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const name = nameInput.value.trim();
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (name.length < 2) {
        showMessage("Please enter your full name.", "error");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.", "error");
        confirmInput.focus();
        return;
      }

      if (!termsInput.checked) {
        showMessage("Please accept the Terms & Conditions.", "error");
        return;
      }

      signupButton.disabled = true;
      signupButton.textContent = "Creating Account...";

      try {
        const result = await registerUser(name, email, password);

        if (!result || result.success !== true) {
          showMessage(
            result?.message || "Registration failed. Please try again.",
            "error"
          );
          return;
        }

        showMessage(
          "Account created successfully! Redirecting...",
          "success"
        );

        form.reset();

        setTimeout(() => {
          window.location.replace("./index.html");
        }, 1200);

      } catch (error) {
        console.error("AYNA BOOK registration error:", error);

        showMessage(
          error?.message || "Something went wrong. Please try again.",
          "error"
        );
      } finally {
        if (!messageBox.classList.contains("success")) {
          signupButton.disabled = false;
          signupButton.textContent = "Create Account";
        }
      }
    });
  </script>

</body>
</html>
