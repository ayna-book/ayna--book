<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#090a0f"
  >

  <meta
    name="description"
    content="Create your AYNA BOOK account."
  >

  <title>AYNA BOOK — Create Account</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #090a0f;
      color: #f5f5f5;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 28px 16px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      height: max-content;
      background: #0f1118;
      border: 1px solid #d4af37;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.08);
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand h1 {
      margin: 0;
      color: #d4af37;
      font-size: 30px;
      letter-spacing: 2px;
    }

    .brand p {
      margin: 8px 0 0;
      color: #aaa;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid #383b45;
      border-radius: 9px;
      background: #090a0f;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #d4af37;
    }

    input[type="file"] {
      padding: 9px;
    }

    small {
      display: block;
      margin-top: 7px;
      color: #999;
      line-height: 1.5;
    }

    .photo-box {
      display: none;
      margin-top: 12px;
      text-align: center;
    }

    .photo-box img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid #d4af37;
      background: #090a0f;
    }

    .status {
      min-height: 22px;
      margin: 12px 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #ff6b6b;
    }

    .success {
      color: #d4af37;
    }

    .submit {
      width: 100%;
      min-height: 48px;
      border: 1px solid #d4af37;
      border-radius: 9px;
      background: #d4af37;
      color: #090a0f;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .bottom {
      margin-top: 20px;
      text-align: center;
      color: #999;
      font-size: 14px;
    }

    .bottom a {
      color: #d4af37;
      text-decoration: none;
    }

    .password-note {
      color: #888;
      font-size: 12px;
      margin-top: 6px;
    }
  </style>
</head>

<body>

<main class="page">

  <section class="card">

    <header class="brand">
      <h1>AYNA BOOK</h1>
      <p>Create your account</p>
    </header>

    <form id="signupForm" novalidate>

      <!-- =================================================
           NAME
      ================================================== -->

      <div class="form-group">

        <label for="fullName">
          Full Name
        </label>

        <input
          id="fullName"
          name="fullName"
          type="text"
          autocomplete="name"
          maxlength="100"
          required
        >

      </div>


      <!-- =================================================
           GMAIL
      ================================================== -->

      <div class="form-group">

        <label for="email">
          Gmail
        </label>

        <input
          id="email"
          name="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          placeholder="example@gmail.com"
          required
        >

      </div>


      <!-- =================================================
           PHONE
      ================================================== -->

      <div class="form-group">

        <label for="phone">
          Phone Number
        </label>

        <input
          id="phone"
          name="phone"
          type="tel"
          autocomplete="tel"
          placeholder="+8801XXXXXXXXX"
          required
        >

      </div>


      <!-- =================================================
           PASSWORD
      ================================================== -->

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="6"
          maxlength="128"
          required
        >

        <div class="password-note">
          Password অবশ্যই 6–128 characters হতে হবে।
        </div>

      </div>


      <!-- =================================================
           PROFILE PHOTO
      ================================================== -->

      <div class="form-group">

        <label for="photo">
          Profile Photo
          <span style="color:#d4af37;">*</span>
        </label>

        <input
          id="photo"
          name="photo"
          type="file"
          accept="image/jpeg,image/png,image/webp"
          required
        >

        <small>
          JPG, PNG অথবা WebP • সর্বোচ্চ 5 MB
        </small>

        <div
          id="photoPreviewBox"
          class="photo-box"
        >

          <img
            id="photoPreview"
            src=""
            alt="Profile photo preview"
          >

        </div>

        <div
          id="photoStatus"
          class="status"
          role="status"
          aria-live="polite"
        ></div>

      </div>


      <!-- =================================================
           GLOBAL STATUS
      ================================================== -->

      <div
        id="status"
        class="status"
        role="alert"
        aria-live="polite"
      ></div>


      <!-- =================================================
           CREATE ACCOUNT
      ================================================== -->

      <button
        id="signupButton"
        class="submit"
        type="submit"
      >
        Create Account
      </button>

    </form>


    <div class="bottom">
      Already have an account?
      <a href="./login.html">
        Sign In
      </a>
    </div>

  </section>

</main>


<!-- =====================================================
     SIGNUP CONTROLLER
===================================================== -->

<script type="module" src="./signup.js"></script>

</body>
</html>
