<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#090a0f"
  >

  <meta
    name="description"
    content="Create your AYNA BOOK account with Gmail verification."
  >

  <title>AYNA BOOK - Sign Up</title>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #090a0f;
      color: #ffffff;
      font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;
    }

    .container {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 24px 18px 40px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 10px 0 6px;
    }

    .subtitle {
      text-align: center;
      color: #b9bec9;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .card {
      background: #11131a;
      border: 1px solid #272b36;
      border-radius: 18px;
      padding: 22px;
      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 22px;
      text-align: center;
      margin: 0 0 8px;
    }

    .description {
      color: #aeb4c0;
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #343947;
      background: #090a0f;
      color: #ffffff;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      border-color: #d4af37;
    }

    input::placeholder {
      color: #777d89;
    }

    .password-note {
      color: #8e95a3;
      font-size: 12px;
      margin-top: 6px;
    }

    .photo-preview {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
      margin: 10px auto;
      border: 2px solid #d4af37;
    }

    .terms {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      margin: 18px 0;
      font-size: 13px;
      color: #b9bec9;
      line-height: 1.5;
    }

    .terms input {
      width: 18px;
      min-height: 18px;
      margin-top: 2px;
      flex: 0 0 auto;
    }

    button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 11px;
      background: #d4af37;
      color: #090a0f;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin: 16px 0 0;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .status.show {
      display: block;
    }

    .status.info {
      background: #17243a;
      color: #a9c9ff;
      border: 1px solid #2c4f82;
    }

    .status.success {
      background: #12351f;
      color: #8ff0ae;
      border: 1px solid #246c3a;
    }

    .status.warning {
      background: #3a3015;
      color: #f5d76e;
      border: 1px solid #75601e;
    }

    .status.error {
      background: #35171b;
      color: #ff9ba5;
      border: 1px solid #7a2933;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #aeb4c0;
    }

    .login-link a {
      color: #f5d76e;
      text-decoration: none;
      font-weight: 700;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

  </style>

</head>


<body>

  <main class="container">

    <div class="logo">
      AYNA BOOK
    </div>

    <div class="subtitle">
      Connect • Share • Create
    </div>


    <section class="card">

      <h1>
        Create Your Account
      </h1>

      <div class="description">
        Registration with Gmail Verification
      </div>


      <form
        id="registrationForm"
        novalidate
      >

        <!-- ==========================================
             ACCOUNT CATEGORY
        =========================================== -->

        <div class="field">

          <label for="accountType">
            Account Category
          </label>

          <select
            id="accountType"
            name="accountType"
            required
          >

            <option value="personal">
              Personal — Free
            </option>

          </select>

        </div>


        <!-- ==========================================
             FULL NAME
        =========================================== -->

        <div class="field">

          <label for="fullName">
            Full Name
          </label>

          <input
            id="fullName"
            name="fullName"
            type="text"
            autocomplete="name"
            maxlength="100"
            placeholder="আপনার পূর্ণ নাম"
            required
          >

        </div>


        <!-- ==========================================
             GMAIL
        =========================================== -->

        <div class="field">

          <label for="email">
            Gmail Address
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            placeholder="example@gmail.com"
            required
          >

        </div>


        <!-- ==========================================
             PHONE
        =========================================== -->

        <div class="field">

          <label for="phone">
            Mobile Number
          </label>

          <input
            id="phone"
            name="phone"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            maxlength="30"
            placeholder="01XXXXXXXXX"
            required
          >

        </div>


        <!-- ==========================================
             COUNTRY
        =========================================== -->

        <div class="field">

          <label for="country">
            Country
          </label>

          <input
            id="country"
            name="country"
            type="text"
            maxlength="100"
            value="Bangladesh"
            autocomplete="country-name"
            placeholder="Country"
            required
          >

        </div>


        <!-- ==========================================
             PROFILE PHOTO
        =========================================== -->

        <div class="field">

          <label for="profilePhoto">
            Profile Photo (Optional)
          </label>

          <input
            id="profilePhoto"
            name="profilePhoto"
            type="file"
            accept="image/jpeg,image/png,image/webp"
          >

          <img
            id="photoPreview"
            class="photo-preview"
            alt="Profile photo preview"
          >

        </div>


        <!-- ==========================================
             PASSWORD
        =========================================== -->

        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="11"
            maxlength="128"
            placeholder="Minimum 11 characters"
            required
          >

          <div class="password-note">
            Password অবশ্যই কমপক্ষে ১১ অক্ষরের হতে হবে।
          </div>

        </div>


        <!-- ==========================================
             CONFIRM PASSWORD
        =========================================== -->

        <div class="field">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="11"
            maxlength="128"
            placeholder="Password আবার লিখুন"
            required
          >

        </div>


        <!-- ==========================================
             TERMS
        =========================================== -->

        <label class="terms">

          <input
            id="terms"
            name="terms"
            type="checkbox"
            required
          >

          <span>
            আমি AYNA BOOK-এর Terms &amp; Conditions এবং
            Privacy Policy মেনে নিচ্ছি।
          </span>

        </label>


        <!-- ==========================================
             SUBMIT
        =========================================== -->

        <button
          id="registerButton"
          type="submit"
        >
          Create AYNA Account
        </button>


        <!-- ==========================================
             STATUS
        =========================================== -->

        <div
          id="statusMessage"
          class="status"
          role="status"
          aria-live="polite"
        ></div>

      </form>


      <!-- ==========================================
           LOGIN LINK
      =========================================== -->

      <div class="login-link">

        Already have an account?

        <a href="./login.html">
          Log In
        </a>

      </div>

    </section>

  </main>


  <!-- ==========================================
       SIGNUP CONTROLLER
  =========================================== -->

  <script
    type="module"
    src="./signup.js"
  ></script>

</body>

</html>
