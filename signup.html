
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0F1E">
<title>AYNA BOOK - Register</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px 12px;
  background:#0A0F1E;color:#fff;
  font-family:Arial,sans-serif
}
.card{
  max-width:560px;margin:25px auto;
  padding:25px 20px;
  background:#1A2233;
  border:1px solid #FFD700;
  border-radius:22px;
}
h1,h2{text-align:center}
h1{font-size:30px}
.subtitle{text-align:center;color:#ddd}
label{display:block;margin:20px 0 8px;font-weight:bold}
input{
  width:100%;padding:15px;
  border:1px solid #FFD700;
  border-radius:11px;
  background:#0A0F1E;color:white;
  font-size:16px
}
input[type=file]{font-size:14px}
button{
  width:100%;padding:15px;margin-top:14px;
  border:0;border-radius:11px;
  background:#FFD700;color:#0A0F1E;
  font-size:17px;font-weight:bold
}
button:disabled{opacity:.5}
.secondary{background:#26344A;color:white;border:1px solid #FFD700}
#preview{
  display:none;width:190px;height:190px;
  object-fit:cover;border-radius:50%;
  border:3px solid #FFD700;
  margin:18px auto
}
#message{
  display:none;margin-top:15px;padding:12px;
  border-radius:9px;background:#26344A;
  overflow-wrap:anywhere
}
#otpArea{display:none}
#recaptcha-container{margin-top:15px}
a{color:#FFD700}
.center{text-align:center;margin-top:20px}
</style>
</head>

<body>
<div class="card">

<h1>AYNA BOOK</h1>
<p class="subtitle">Connect • Share • Create</p>
<h2>CREATE ACCOUNT</h2>

<form id="signupForm">

<label>১. সম্পূর্ণ নাম</label>
<input id="name" required maxlength="80" autocomplete="name">

<label>২. Gmail / Email</label>
<input id="email" type="email" required autocomplete="email">

<label>৩. মোবাইল নম্বর</label>
<input id="phone" type="tel" required
placeholder="01XXXXXXXXX" autocomplete="tel">

<label>৪. প্রোফাইল ছবি (ঐচ্ছিক)</label>
<input id="photo" type="file" accept="image/*">
<img id="preview" alt="Profile preview">

<label>৫. পাসওয়ার্ড (কমপক্ষে ১১ অক্ষর)</label>
<input id="password" type="password" minlength="11" required>

<label>৬. পুনরায় পাসওয়ার্ড</label>
<input id="confirmPassword" type="password" minlength="11" required>

<label>
<input id="terms" type="checkbox" required style="width:auto">
আমি AYNA BOOK-এর নিয়ম ও গোপনীয়তা নীতি মেনে চলতে সম্মত।
</label>

<div id="recaptcha-container"></div>

<button type="button" id="sendOtpBtn">SEND SMS OTP</button>

<div id="otpArea">
  <label>৭. SMS OTP (৬ সংখ্যা)</label>
  <input id="otp" inputmode="numeric" maxlength="6"
  pattern="[0-9]{6}" placeholder="৬ সংখ্যার OTP">

  <p id="timer" class="center">সময়: ২:০০</p>

  <button type="submit" id="registerBtn">
    VERIFY OTP & CREATE ACCOUNT
  </button>

  <button type="button" id="resendBtn" class="secondary" disabled>
    RESEND OTP
  </button>
</div>

<div id="message" role="status" aria-live="polite"></div>

</form>

<p class="center">
আগে অ্যাকাউন্ট আছে?
<a href="./login.html">LOGIN</a>
</p>

<p class="center">
<a href="./index.html">Back to Home</a>
</p>

</div>

<script type="module">
import { auth } from "./firebase.js";

import {
  RecaptchaVerifier
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
  sendPhoneOtp,
  completeRegistration
} from "./auth.js";

const form = document.getElementById("signupForm");
const sendBtn = document.getElementById("sendOtpBtn");
const registerBtn = document.getElementById("registerBtn");
const resendBtn = document.getElementById("resendBtn");
const otpArea = document.getElementById("otpArea");
const message = document.getElementById("message");
const timerText = document.getElementById("timer");
const photoInput = document.getElementById("photo");
const preview = document.getElementById("preview");

let verifier = null;
let confirmation = null;
let expiresAt = 0;
let timer = null;
let busy = false;

function showMessage(text, success=false) {
  message.style.display = "block";
  message.textContent = text;
  message.style.border = success
    ? "1px solid #36C275"
    : "1px solid #FF6878";
}

function setBusy(value) {
  busy = value;
  sendBtn.disabled = value;
  registerBtn.disabled = value;
}

function createVerifier() {
  verifier = new RecaptchaVerifier(
    auth,
    "recaptcha-container",
    { size: "normal" }
  );
}

async function startTimer() {
  clearInterval(timer);
  expiresAt = Date.now() + 120000;
  resendBtn.disabled = true;

  timer = setInterval(() => {
    const remaining = Math.max(
      0,
      Math.ceil((expiresAt - Date.now()) / 1000)
    );

    const minutes = Math.floor(remaining / 60);
    const seconds = String(remaining % 60).padStart(2,"0");

    timerText.textContent =
      `সময়: ${minutes}:${seconds}`;

    if (remaining <= 0) {
      clearInterval(timer);
      confirmation = null;
      resendBtn.disabled = false;
      showMessage("সময় শেষ। নতুন OTP পাঠান।");
    }
  }, 500);
}

photoInput.addEventListener("change", () => {
  const file = photoInput.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/") ||
      file.size > 5 * 1024 * 1024) {
    photoInput.value = "";
    preview.style.display = "none";
    showMessage("শুধু ৫ MB-এর মধ্যে ছবি নির্বাচন করুন।");
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
});

async function requestOtp() {
  if (busy) return;

  try {
    const phone = document.getElementById("phone").value.trim();

    if (!phone) {
      showMessage("মোবাইল নম্বর লিখুন।");
      return;
    }

    setBusy(true);
    showMessage("reCAPTCHA যাচাই ও SMS পাঠানো হচ্ছে...");

    if (!verifier) createVerifier();

    confirmation = await sendPhoneOtp(phone, verifier);

    otpArea.style.display = "block";
    showMessage("SMS OTP পাঠানো হয়েছে। কোডটি লিখুন।", true);
    await startTimer();

  } catch (error) {
    console.error(error);
    showMessage(error.message || "OTP পাঠানো যায়নি।");

    if (verifier) {
      verifier.clear();
      verifier = null;
    }

  } finally {
    setBusy(false);
  }
}

sendBtn.addEventListener("click", requestOtp);

resendBtn.addEventListener("click", requestOtp);

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (busy) return;

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword =
    document.getElementById("confirmPassword").value;
  const otp = document.getElementById("otp").value.trim();
  const photoFile = photoInput.files[0] || null;

  if (!document.getElementById("terms").checked) {
    showMessage("নিয়ম ও গোপনীয়তায় সম্মতি দিন।");
    return;
  }

  if (password.length < 11) {
    showMessage("পাসওয়ার্ড কমপক্ষে ১১ অক্ষরের হতে হবে।");
    return;
  }

  if (password !== confirmPassword) {
    showMessage("দুটি পাসওয়ার্ড মিলছে না।");
    return;
  }

  if (!confirmation || Date.now() > expiresAt) {
    showMessage("OTP-এর সময় শেষ। নতুন OTP নিন।");
    return;
  }

  try {
    setBusy(true);
    showMessage("OTP যাচাই ও অ্যাকাউন্ট তৈরি হচ্ছে...");

    const result = await completeRegistration({
      name,
      email,
      phone,
      password,
      otp,
      verificationId: confirmation.verificationId,
      photoFile
    });

    clearInterval(timer);
    showMessage(result.message, true);
    form.reset();
    preview.style.display = "none";

    setTimeout(() => {
      window.location.replace("./login.html");
    }, 1800);

  } catch (error) {
    console.error("AYNA Registration:", error);
    showMessage(error.message || "Registration সম্পন্ন হয়নি।");

  } finally {
    setBusy(false);
  }
});

console.log("AYNA BOOK SMS Registration Ready.");
</script>
</body>
</html>
