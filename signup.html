
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0f">
  <title>AYNA BOOK — Create Account</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#090a0f;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
    .container{width:100%;max-width:520px;border:1px solid #b99a45;border-radius:15px;padding:28px;background:#101116}
    h1{text-align:center;color:#e3c46d;letter-spacing:3px;margin:0 0 8px}
    .sub{text-align:center;color:#aaa;margin-bottom:25px}
    label{display:block;margin:15px 0 7px;color:#e5d7ae}
    input{width:100%;padding:13px;border:1px solid #806c39;border-radius:7px;background:#08090d;color:white;font-size:16px}
    input[type=file]{padding:10px}
    button{width:100%;padding:14px;border:1px solid #d6b65c;border-radius:7px;background:#b8953e;color:#090a0f;font-weight:bold;font-size:16px;margin-top:18px;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .secondary{background:transparent;color:#e3c46d}
    .preview{width:150px;height:150px;object-fit:cover;border:2px solid #c7a64e;border-radius:50%;display:block;margin:12px auto}
    .message{margin-top:15px;text-align:center;line-height:1.5;overflow-wrap:anywhere}
    a{color:#e3c46d}
    .hint{font-size:13px;color:#aaa;line-height:1.5}
  </style>
</head>
<body>
  <main class="container">
    <h1>✦ AYNA BOOK</h1>
    <p class="sub">Create your account</p>

    <form id="signupForm">
      <label for="profilePhoto">Profile Photo — Required</label>
      <input id="profilePhoto" type="file" accept="image/jpeg,image/png,image/webp" required>
      <img id="photoPreview" class="preview" alt="Profile photo preview" hidden>

      <label for="fullName">Full Name</label>
      <input id="fullName" type="text" autocomplete="name" maxlength="80" required>

      <label for="email">Gmail Address</label>
      <input id="email" type="email" autocomplete="email" placeholder="example@gmail.com" required>

      <label for="phone">Phone Number (with country code)</label>
      <input id="phone" type="tel" autocomplete="tel" placeholder="+8801XXXXXXXXX" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" required>
      <p class="hint">Choose your own password. Firebase requires at least 6 characters by default.</p>

      <label for="confirmPassword">Re-enter Password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" required>

      <button id="signupButton" type="submit">CREATE ACCOUNT</button>
    </form>

    <p id="statusMessage" class="message" role="status" aria-live="polite"></p>
    <button class="secondary" type="button" onclick="location.href='./login.html'">Already have an account? Login</button>
  </main>
  <script type="module" src="./signup.js"></script>
</body>
</html>
