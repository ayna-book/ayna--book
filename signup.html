<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0A0F1E">

  <title>AYNA BOOK — Registration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0A0F1E;
      color: #FFFFFF;
      font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .brand {
      text-align: center;
      margin-bottom: 18px;
    }

    .brand h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 2px;
      color: #FFFFFF;
    }

    .brand p {
      margin: 8px 0 0;
      color: #A9B0BC;
      font-size: 14px;
    }

    .card {
      background: #111827;
      border: 1px solid #FFD700;
      border-radius: 18px;
      padding: 24px;
      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.45);
    }

    .photo-box {
      text-align: center;
      margin-bottom: 20px;
    }

    .photo-preview {
      width: 120px;
      height: 120px;
      margin: 0 auto 12px;
      border-radius: 50%;
      border: 2px solid #FFD700;
      background: #1A2233;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #A9B0BC;
      font-size: 13px;
    }

    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .photo-label {
      display: inline-block;
      background: #1A2233;
      border: 1px solid #FFD700;
      color: #FFFFFF;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    #photo {
      display: none;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      outline: none;
      background: #1A2233;
      color: #FFFFFF;
      font-size: 15px;
    }

    input:focus {
      border-color: #FFD700;
      box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.12);
    }

    input::placeholder {
      color: #7F8898;
    }

    .phone-row {
      display: flex;
      gap: 8px;
    }

    .phone-row input {
      flex: 1;
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
    }

    .otp-btn {
      width: auto;
      min-width: 130px;
      padding: 0 15px;
      background: #FFD700;
      color: #0A0F1E;
    }

    .otp-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .register-btn {
      margin-top: 8px;
      background: #FFD700;
      color: #0A0F1E;
    }

    .register-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .otp-section {
      display: none;
      margin-top: 8px;
      padding: 15px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #0F172A;
    }

    .otp-section.active {
      display: block;
    }

    .otp-title {
      margin: 0 0 8px;
      font-size: 14px;
      color: #FFFFFF;
    }

    .otp-info {
      margin: 0 0 12px;
      color: #A9B0BC;
      font-size: 13px;
      line-height: 1.5;
    }

    #otp {
      text-align: center;
      letter-spacing: 7px;
      font-size: 22px;
      font-weight: bold;
    }

    .timer {
      text-align: center;
      margin: 12px 0;
      color: #FFD700;
      font-size: 14px;
      font-weight: bold;
    }

    .resend-btn {
      background: transparent;
      color: #FFFFFF;
      border: 1px solid #475569;
      font-size: 13px;
    }

    .resend-btn:hover {
      border-color: #FFD700;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 15px 0;
      color: #A9B0BC;
      font-size: 13px;
      line-height: 1.5;
    }

    .terms input {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin-top: 2px;
    }

    .message {
      min-height: 22px;
      margin: 12px 0 0;
      text-align: center;
      color: #FFD700;
      font-size: 14px;
      line-height: 1.5;
    }

    .bottom {
      margin-top: 18px;
      text-align: center;
      color: #A9B0BC;
      font-size: 14px;
    }

    .bottom a {
      color: #FFD700
