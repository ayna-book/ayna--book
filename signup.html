
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b49">
  <title>AYNA BOOK — Sign Up</title>
  <link rel="stylesheet" href="./styles.css">

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #071b49, #512b81);
      color: white;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    .signup-card {
      width: 100%;
      max-width: 460px;
      margin: 35px auto;
      padding: 25px;
      border: 1px solid #ffffff35;
      border-radius: 20px;
      background: #ffffff12;
    }

    .signup-card h1,
    .signup-card .subtitle {
      text-align: center;
    }

    .signup-card label {
      display: block;
      margin: 16px 0 7px;
    }

    .signup-card input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    .signup-card button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, #ff4fa3, #8b5cf6, #35d9ef);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup-card button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #signupStatus {
      min-height: 24px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .signup-links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    .signup-links a {
      color: #35d9ef;
    }

    .note {
      font-size: 13px;
      color: #ddd;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="signup-card">
    <h1>🌍 AYNA BOOK</h1>
    <p class="subtitle">My World. My Story. My AYNA BOOK.</p>

    <h2>✨ নতুন অ্যাকাউন্ট তৈরি করুন</h2>

    <form id="signupForm">
      <label for="fullName">আপনার পূর্ণ নাম</label>
      <input
        id="fullName"
        type="text"
        maxlength="80"
        autocomplete="name"
        placeholder="আপনার নাম লিখুন"
        required
      >

      <label for="username">ইউজারনেম</label>
      <input
        id="username"
        type="text"
        maxlength="30"
        autocomplete="username"
        placeholder="যেমন: mahbub123"
        required
      >

      <label for="email">ইমেইল ঠিকানা</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="আপনার ইমেইল লিখুন"
        required
      >

      <label for="password">পাসওয়ার্ড</label>
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="কমপক্ষে ৮ অক্ষর"
        required
      >

      <label for="confirmPassword">পাসওয়ার্ড আবার লিখুন</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="পাসওয়ার্ড নিশ্চিত করুন"
        required
      >

      <button id="signupButton" type="submit">
        🚀 Create My AYNA BOOK Account
      </button>
    </form>

    <p id="signupStatus" role="status" aria-live="polite"></p>

    <p class="note">
      অ্যাকাউন্ট তৈরি হলে আপনার ইমেইলে verification link পাঠানো হবে।
      ইমেইল যাচাই না করা পর্যন্ত কিছু সুবিধা সীমিত থাকতে পারে।
    </p>

    <div class="signup-links">
      আগে অ্যাকাউন্ট আছে?
      <a href="./login.html">লগইন করুন</a>
      <br>
      <a href="./index.html">← হোম পেজে ফিরে যান</a>
    </div>
  </main>

  <script type="module" src="./js/signup.js"></script>
</body>
</html>
