<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0F1E">

  <title>AYNA BOOK — Sign Up</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0A0F1E;
      color: #ffffff;
      font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .signup-container {
      width: 100%;
      max-width: 460px;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-title {
      font-size: 30px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .logo-subtitle {
      margin-top: 7px;
      color: #A9B0BC;
      font-size: 14px;
    }

    .card {
      background: #1A2233;
      border: 1px solid #2d3748;
      border-radius: 18px;
      padding: 28px 22px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #FFD700;
      font-size: 25px;
    }

    .description {
      margin: 0 0 24px;
      text-align: center;
      color: #A9B0BC;
      font-size: 14px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 48px;

      padding: 0 14px;

      border: 1px solid #4A4A2A;
      border-radius: 10px;

      background: #0A0F1E;
      color: #ffffff;

      font-size: 15px;
      outline: none;

      transition: 0.2s ease;
    }

    input:focus {
      border-color: #FFD700;
      box-shadow:
        0 0 0 3px rgba(255, 215, 0, 0.10);
    }

    input::placeholder {
      color: #737b89;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 75px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 8px;

      transform: translateY(-50%);

      height: 34px;
      padding: 0 10px;

      border: 0;
      border-radius: 7px;

      background: transparent;
      color: #FFD700;

      cursor: pointer;
      font-size: 12px;
    }

    .toggle-password:hover {
      background: rgba(255, 215, 0, 0.08);
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;

      margin: 8px 0 20px;

      color: #A9B0BC;
      font-size: 13px;
      line-height: 1.5;
    }

    .terms input {
      width: 17px;
      height: 17px;
      min-width: 17px;
      margin-top: 2px;
      padding: 0;
      accent-color: #FFD700;
    }

    .terms label {
      margin: 0;
      color: #A9B0BC;
      font-weight: normal;
      cursor: pointer;
    }

    .signup-button {
      width: 100%;
      height: 50px;

      border: 1px solid #FFD700;
      border-radius: 10px;

      background: #FFD700;
      color: #0A0F1E;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
      transition: 0.2s ease;
    }

    .signup-button:hover {
      transform: translateY(-1px);
      box-shadow:
        0 7px 20px rgba(255, 215, 0, 0.18);
    }

    .signup-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .message {
      display: none;

      margin-bottom: 18px;
      padding: 12px 14px;

      border-radius: 9px;

      font-size: 13px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(46, 204, 113, 0.10);
      border: 1px solid #2ECC71;
      color: #2ECC71;
    }

    .message.error {
      background: rgba(255, 70, 70, 0.10);
      border: 1px solid #ff5555;
      color: #ff7777;
    }

    .message.warning {
      background: rgba(255, 215, 0, 0.10);
      border: 1px solid #FFD700;
      color: #FFD700;
    }

    .bottom-text {
      margin-top: 20px;
      text-align: center;

      color: #A9B0BC;
      font-size: 14px;
    }

    .bottom-text a {
      color: #FFD700;
      text-decoration: none;
      font-weight: 600;
    }

    .bottom-text a:hover {
      text-decoration: underline;
    }

    .back-home {
      display: block;
      margin-top: 15px;

      text-align: center;

      color: #A9B0BC;
      text-decoration: none;
      font-size: 13px;
    }

    .back-home:hover {
      color: #ffffff;
    }

    .security-note {
      margin-top: 20px;

      padding: 12px;

      border-radius: 9px;

      background: rgba(46, 204, 113, 0.06);
      border: 1px solid rgba(46, 204, 113, 0.25);

      color: #A9B0BC;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 480px) {

      body {
        padding: 14px;
      }

      .card {
        padding: 24px 17px;
        border-radius: 15px;
      }

      .logo-title {
        font-size: 26px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="signup-container">

    <!-- AYNA BOOK Logo -->

    <div class="logo">
      <div class="logo-title">
        AYNA BOOK
      </div>

      <div class="logo-subtitle">
        Connect • Share • Create
      </div>
    </div>


    <!-- Signup Card -->

    <section class="card">

      <h1>
        নতুন অ্যাকাউন্ট তৈরি করুন
      </h1>

      <p class="description">
        AYNA BOOK-এ যোগ দিন এবং আপনার ডিজিটাল প্রোফাইল তৈরি করুন।
      </p>


      <!-- Firebase Message -->

      <div
        id="auth-message"
        class="message"
        role="alert"
        aria-live="polite">
      </div>


      <!-- Signup Form -->

      <form
        id="signup-form"
        autocomplete="on"
        novalidate>

        <!-- Name -->

        <div class="form-group">

          <label for="name">
            আপনার নাম
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="আপনার পূর্ণ নাম"
            autocomplete="name"
            maxlength="100"
            required>

        </div>


        <!-- Email -->

        <div class="form-group">

          <label for="email">
            ইমেইল
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            autocomplete="email"
            maxlength="254"
            required>

        </div>


        <!-- Password -->

        <div class="form-group">

          <label for="password">
            পাসওয়ার্ড
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="কমপক্ষে ৬ অক্ষর"
              autocomplete="new-password"
              minlength="6"
              maxlength="128"
              required>

            <button
              type="button"
              class="toggle-password"
              data-target="password">
              দেখুন
            </button>

          </div>

        </div>


        <!-- Confirm Password -->

        <div class="form-group">

          <label for="confirm-password">
            পাসওয়ার্ড নিশ্চিত করুন
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="পাসওয়ার্ড আবার লিখুন"
              autocomplete="new-password"
              minlength="6"
              maxlength="128"
              required>

            <button
              type="button"
              class="toggle-password"
              data-target="confirm-password">
              দেখুন
            </button>

          </div>

        </div>


        <!-- Terms -->

        <div class="terms">

          <input
            type="checkbox"
            id="terms"
            name="terms"
            required>

          <label for="terms">
            আমি AYNA BOOK-এর নিয়ম ও গোপনীয়তা নীতি মেনে চলতে সম্মত।
          </label>

        </div>


        <!-- Submit -->

        <button
          type="submit"
          id="signup-button"
          class="signup-button">

          অ্যাকাউন্ট তৈরি করুন

        </button>

      </form>


      <!-- Security Note -->

      <div class="security-note">
        🔒 আপনার অ্যাকাউন্ট Firebase Authentication দ্বারা সুরক্ষিতভাবে পরিচালিত হবে।
      </div>


      <!-- Login -->

      <div class="bottom-text">

        ইতিমধ্যে অ্যাকাউন্ট আছে?

        <a href="login.html">
          লগইন করুন
        </a>

      </div>

    </section>


    <!-- Home -->

    <a
      href="index.html"
      class="back-home">

      ← AYNA BOOK হোমে ফিরে যান

    </a>

  </main>


  <!-- Signup JavaScript -->

  <script type="module">

    import {
      registerUser
    } from "./auth.js";


    const signupForm =
      document.getElementById("signup-form");

    const nameInput =
      document.getElementById("name");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById("confirm-password");

    const termsInput =
      document.getElementById("terms");

    const signupButton =
      document.getElementById("signup-button");

    const messageBox =
      document.getElementById("auth-message");


    // =====================================================
    // Message
    // =====================================================

    function showMessage(
      text,
      type = "error"
    ) {

      if (!messageBox) return;

      messageBox.textContent = text;

      messageBox.className =
        "message show " + type;
    }


    // =====================================================
    // Password Toggle
    // =====================================================

    document
      .querySelectorAll(".toggle-password")
      .forEach((button) => {

        button.addEventListener(
          "click",
          () => {

            const targetId =
              button.dataset.target;

            const input =
              document.getElementById(targetId);

            if (!input) return;

            if (input.type === "password") {

              input.type = "text";
              button.textContent = "লুকান";

            } else {

              input.type = "password";
              button.textContent = "দেখুন";
            }
          }
        );

      });


    // =====================================================
    // Signup
    // =====================================================

    if (signupForm) {

      signupForm.addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();


          const name =
            nameInput?.value.trim() || "";

          const email =
            emailInput?.value.trim() || "";

          const password =
            passwordInput?.value || "";

          const confirmPassword =
            confirmPasswordInput?.value || "";


          // -------------------------------------------------
          // Validation
          // -------------------------------------------------

          if (!name) {

            showMessage(
              "আপনার নাম লিখুন।",
              "error"
            );

            nameInput?.focus();
            return;
          }


          if (!email) {

            showMessage(
              "আপনার ইমেইল লিখুন।",
              "error"
            );

            emailInput?.focus();
            return;
          }


          if (!password) {

            showMessage(
              "আপনার পাসওয়ার্ড লিখুন।",
              "error"
            );

            passwordInput?.focus();
            return;
          }


          if (password.length < 6) {

            showMessage(
              "পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।",
              "error"
            );

            passwordInput?.focus();
            return;
          }


          if (password !== confirmPassword) {

            showMessage(
              "দুটি পাসওয়ার্ড একই নয়।",
              "error"
            );

            confirmPasswordInput?.focus();
            return;
          }


          if (!termsInput?.checked) {

            showMessage(
              "নিয়ম ও গোপনীয়তা নীতিতে সম্মতি দিন।",
              "error"
            );

            return;
          }


          // -------------------------------------------------
          // Disable Button
          // -------------------------------------------------

          signupButton.disabled = true;

          signupButton.textContent =
            "অ্যাকাউন্ট তৈরি হচ্ছে...";


          showMessage(
            "আপনার অ্যাকাউন্ট তৈরি করা হচ্ছে...",
            "success"
          );


          try {

            const result =
              await registerUser(
                name,
                email,
                password
              );


            // ------------------------------------------------
            // Registration Failed
            // ------------------------------------------------

            if (!result?.success) {

              showMessage(
                result?.message ||
                "অ্যাকাউন্ট তৈরি করা যায়নি।",
                "error"
              );

              signupButton.disabled = false;

              signupButton.textContent =
                "অ্যাকাউন্ট তৈরি করুন";

              return;
            }


            // ------------------------------------------------
            // Account Created but Profile Not Saved
            // ------------------------------------------------

            if (
              result.accountCreated &&
              result.profileSaved === false
            ) {

              showMessage(
                result.message ||
                "অ্যাকাউন্ট তৈরি হয়েছে, কিন্তু প্রোফাইল সংরক্ষণ করা যায়নি।",
                "warning"
              );

              signupButton.disabled = false;

              signupButton.textContent =
                "অ্যাকাউন্ট তৈরি হয়েছে";

              return;
            }


            // ------------------------------------------------
            // Fully Successful
            // ------------------------------------------------

            showMessage(
              result.message ||
              "অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে।",
              "success"
            );

            signupButton.textContent =
              "সফল হয়েছে ✓";


            // Give Firebase state a moment to settle

            setTimeout(() => {

              window.location.replace(
                "index.html"
              );

            }, 700);


          } catch (error) {

            console.error(
              "AYNA BOOK Signup Error:",
              error
            );

            showMessage(
              "অ্যাকাউন্ট তৈরি করার সময় একটি সমস্যা হয়েছে। আবার চেষ্টা করুন।",
              "error"
            );

            signupButton.disabled = false;

            signupButton.textContent =
              "অ্যাকাউন্ট তৈরি করুন";
          }

        }
      );

    }


    console.log(
      "AYNA BOOK — Signup Page Loaded Successfully."
    );

  </script>

</body>
</html>
