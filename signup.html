<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#090a0f"
  >

  <meta
    name="description"
    content="Create your AYNA BOOK account with Gmail verification."
  >

  <title>AYNA BOOK - Sign Up</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }


    body {
      background: #090a0f;
      color: #ffffff;
      font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;
      overflow-x: hidden;
    }


    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 18px 14px 36px;
    }


    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 6px 0 5px;
    }


    .subtitle {
      text-align: center;
      color: #b9bec9;
      font-size: 13px;
      margin-bottom: 18px;
    }


    .card {
      width: 100%;
      background: #11131a;
      border: 1px solid #272b36;
      border-radius: 16px;
      padding: 18px 15px 20px;
      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.35);
    }


    h1 {
      font-size: 21px;
      text-align: center;
      margin: 0 0 7px;
    }


    .description {
      color: #aeb4c0;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
    }


    .field {
      margin-bottom: 15px;
    }


    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }


    input,
    select {
      width: 100%;
      min-height: 47px;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid #343947;
      background: #090a0f;
      color: #ffffff;
      outline: none;
      font-size: 15px;
    }


    input:focus,
    select:focus {
      border-color: #d4af37;
    }


    input::placeholder {
      color: #777d89;
    }


    select {
      appearance: auto;
    }


    /* ==========================================
       PASSWORD FIELD
    =========================================== */

    .password-wrapper {
      position: relative;
      width: 100%;
    }


    .password-wrapper input {
      padding-right: 52px;
    }


    .password-toggle {
      position: absolute;
      top: 50%;
      right: 7px;
      transform: translateY(-50%);

      width: 40px;
      min-height: 38px;

      padding: 0;

      border: 0;
      border-radius: 8px;

      background: transparent;
      color: #b9bec9;

      font-size: 18px;
      font-weight: 400;

      cursor: pointer;
    }


    .password-toggle:hover {
      background: #1b1e27;
      color: #ffffff;
    }


    .password-toggle:focus {
      outline: 2px solid #d4af37;
      outline-offset: 1px;
    }


    .password-note {
      color: #8e95a3;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 6px;
    }


    /* ==========================================
       PASSWORD STRENGTH
    =========================================== */

    .password-strength {
      width: 100%;
      height: 6px;
      margin-top: 9px;

      background: #252934;
      border-radius: 20px;

      overflow: hidden;
    }


    .password-strength-bar {
      width: 0;
      height: 100%;

      background: #555b68;

      border-radius: 20px;

      transition:
        width 0.2s ease,
        background 0.2s ease;
    }


    .password-strength-text {
      min-height: 18px;

      margin-top: 5px;

      color: #8e95a3;
      font-size: 12px;
    }


    .password-match-message {
      min-height: 18px;

      margin-top: 5px;

      font-size: 12px;
      color: #8e95a3;
    }


    /* ==========================================
       PROFILE PHOTO
    =========================================== */

    .photo-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
    }


    .photo-preview {
      width: 190px;
      height: 190px;

      aspect-ratio: 1 / 1;

      border-radius: 14px;

      object-fit: cover;

      display: none;

      margin: 12px auto 4px;

      border: 2px solid #d4af37;

      background: #090a0f;
    }


    .photo-preview.show {
      display: block;
    }


    .photo-note {
      color: #8e95a3;
      font-size: 12px;
      text-align: center;
      margin-top: 6px;
    }


    /* ==========================================
       TERMS
    =========================================== */

    .terms {
      display: flex;
      gap: 9px;
      align-items: flex-start;

      margin: 18px 0;

      font-size: 13px;
      color: #b9bec9;

      line-height: 1.5;
    }


    .terms input {
      width: 18px;
      min-width: 18px;
      height: 18px;
      min-height: 18px;

      margin-top: 2px;

      padding: 0;

      flex: 0 0 auto;
    }


    .terms span {
      flex: 1;
    }


    /* ==========================================
       SUBMIT BUTTON
    =========================================== */

    .submit-button {
      width: 100%;
      min-height: 50px;

      border: 0;
      border-radius: 11px;

      background: #d4af37;
      color: #090a0f;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        transform 0.1s ease;
    }


    .submit-button:active {
      transform: scale(0.99);
    }


    .submit-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }


    /* ==========================================
       STATUS
    =========================================== */

    .status {
      display: none;

      margin: 16px 0 0;

      padding: 12px 14px;

      border-radius: 10px;

      font-size: 13px;
      line-height: 1.5;

      text-align: center;
    }


    .status.show {
      display: block;
    }


    .status.info {
      background: #17243a;
      color: #a9c9ff;
      border: 1px solid #2c4f82;
    }


    .status.success {
      background: #12351f;
      color: #8ff0ae;
      border: 1px solid #246c3a;
    }


    .status.warning {
      background: #3a3015;
      color: #f5d76e;
      border: 1px solid #75601e;
    }


    .status.error {
      background: #35171b;
      color: #ff9ba5;
      border: 1px solid #7a2933;
    }


    /* ==========================================
       LOGIN LINK
    =========================================== */

    .login-link {
      text-align: center;

      margin-top: 18px;

      font-size: 14px;
      color: #aeb4c0;
    }


    .login-link a {
      color: #f5d76e;

      text-decoration: none;

      font-weight: 700;
    }


    .login-link a:hover {
      text-decoration: underline;
    }


    /* ==========================================
       SMALL MOBILE DEVICES
    =========================================== */

    @media (max-width: 380px) {

      .container {
        padding-left: 10px;
        padding-right: 10px;
      }


      .card {
        padding: 16px 12px 18px;
      }


      .logo {
        font-size: 25px;
      }


      h1 {
        font-size: 20px;
      }


      input,
      select {
        font-size: 14px;
      }


      .photo-preview {
        width: 165px;
        height: 165px;
      }

    }


    /* ==========================================
       TABLET / DESKTOP
    =========================================== */

    @media (min-width: 600px) {

      .container {
        padding-top: 28px;
        padding-bottom: 50px;
      }


      .card {
        padding: 24px;
      }


      .logo {
        font-size: 30px;
      }


      .photo-preview {
        width: 210px;
        height: 210px;
      }

    }

  </style>

</head>


<body>

  <main class="container">

    <div class="logo">
      AYNA BOOK
    </div>


    <div class="subtitle">
      Connect • Share • Create
    </div>


    <section class="card">

      <h1>
        Create Your Account
      </h1>


      <div class="description">
        Registration with Gmail Verification
      </div>


      <form
        id="registrationForm"
        novalidate
      >


        <!-- ==========================================
             ACCOUNT CATEGORY
        =========================================== -->

        <div class="field">

          <label for="accountType">
            Account Category
          </label>

          <select
            id="accountType"
            name="accountType"
            required
          >

            <option value="personal">
              Personal — Free
            </option>

          </select>

        </div>


        <!-- ==========================================
             FULL NAME
        =========================================== -->

        <div class="field">

          <label for="fullName">
            Full Name
          </label>

          <input
            id="fullName"
            name="fullName"
            type="text"
            autocomplete="name"
            maxlength="100"
            placeholder="আপনার পূর্ণ নাম"
            required
          >

        </div>


        <!-- ==========================================
             GMAIL
        =========================================== -->

        <div class="field">

          <label for="email">
            Gmail Address
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            placeholder="example@gmail.com"
            required
          >

        </div>


        <!-- ==========================================
             PHONE
        =========================================== -->

        <div class="field">

          <label for="phone">
            Mobile Number
          </label>

          <input
            id="phone"
            name="phone"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            maxlength="30"
            placeholder="01XXXXXXXXX"
            required
          >

        </div>


        <!-- ==========================================
             COUNTRY
        =========================================== -->

        <div class="field">

          <label for="country">
            Country
          </label>

          <input
            id="country"
            name="country"
            type="text"
            maxlength="100"
            value="Bangladesh"
            autocomplete="country-name"
            placeholder="Country"
            required
          >

        </div>


        <!-- ==========================================
             PROFILE PHOTO
        =========================================== -->

        <div class="field">

          <label for="profilePhoto">
            Profile Photo (Optional)
          </label>


          <div class="photo-upload">

            <input
              id="profilePhoto"
              name="profilePhoto"
              type="file"
              accept="image/jpeg,image/png,image/webp"
            >


            <img
              id="photoPreview"
              class="photo-preview"
              alt="Profile photo preview"
            >


            <div class="photo-note">
              JPG, PNG বা WebP — সর্বোচ্চ 5MB
            </div>

          </div>

        </div>


        <!-- ==========================================
             PASSWORD
        =========================================== -->

        <div class="field">

          <label for="password">
            Password
          </label>


          <div class="password-wrapper">

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="50"
              placeholder="8–50 characters"
              required
            >


            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              aria-label="Show password"
              aria-pressed="false"
            >
              👁
            </button>

          </div>


          <div class="password-note">
            Password 8 থেকে 50 অক্ষরের মধ্যে হতে হবে।
            সংখ্যা, বড় হাতের অক্ষর বা বিশেষ চিহ্ন বাধ্যতামূলক নয়।
          </div>


          <div
            id="passwordStrength"
            class="password-strength"
            aria-hidden="true"
          >

            <div
              id="passwordStrengthBar"
              class="password-strength-bar"
            ></div>

          </div>


          <div
            id="passwordStrengthText"
            class="password-strength-text"
            aria-live="polite"
          ></div>

        </div>


        <!-- ==========================================
             CONFIRM PASSWORD
        =========================================== -->

        <div class="field">

          <label for="confirmPassword">
            Confirm Password
          </label>


          <div class="password-wrapper">

            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="50"
              placeholder="Password আবার লিখুন"
              required
            >


            <button
              type="button"
              class="password-toggle"
              id="confirmPasswordToggle"
              aria-label="Show confirm password"
              aria-pressed="false"
            >
              👁
            </button>

          </div>


          <div
            id="passwordMatchMessage"
            class="password-match-message"
            aria-live="polite"
          ></div>

        </div>


        <!-- ==========================================
             TERMS
        =========================================== -->

        <label class="terms">

          <input
            id="terms"
            name="terms"
            type="checkbox"
            required
          >


          <span>
            আমি AYNA BOOK-এর Terms &amp; Conditions এবং
            Privacy Policy মেনে নিচ্ছি।
          </span>

        </label>


        <!-- ==========================================
             SUBMIT
        =========================================== -->

        <button
          id="registerButton"
          class="submit-button"
          type="submit"
        >
          Create AYNA Account
        </button>


        <!-- ==========================================
             STATUS
        =========================================== -->

        <div
          id="statusMessage"
          class="status"
          role="status"
          aria-live="polite"
        ></div>


      </form>


      <!-- ==========================================
           LOGIN LINK
      =========================================== -->

      <div class="login-link">

        Already have an account?

        <a href="./login.html">
          Log In
        </a>

      </div>


    </section>

  </main>


  <!-- ==========================================
       PASSWORD SHOW / HIDE
  =========================================== -->

  <script>

    function setupPasswordToggle(
      inputId,
      buttonId
    ) {

      const input =
        document.getElementById(inputId);

      const button =
        document.getElementById(buttonId);


      if (!input || !button) {
        return;
      }


      button.addEventListener(
        "click",
        () => {

          const isPassword =
            input.type === "password";


          input.type =
            isPassword
              ? "text"
              : "password";


          button.textContent =
            isPassword
              ? "🙈"
              : "👁";


          button.setAttribute(
            "aria-label",
            isPassword
              ? "Hide password"
              : "Show password"
          );


          button.setAttribute(
            "aria-pressed",
            String(isPassword)
          );

        }
      );

    }


    setupPasswordToggle(
      "password",
      "passwordToggle"
    );


    setupPasswordToggle(
      "confirmPassword",
      "confirmPasswordToggle"
    );

  </script>


  <!-- ==========================================
       SIGNUP CONTROLLER
  =========================================== -->

  <script
    type="module"
    src="./signup.js"
  ></script>


</body>

</html>
