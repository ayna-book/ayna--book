
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#07090f">
  <title>AYNA BOOK - Sign Up</title>

  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f5d76e;
      --bg-dark: #07090f;
      --card-bg: #111521;
      --input-bg: #0b0e17;
      --border-dim: #262e42;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #171d30, #07090f);
      color: white;
    }

    .page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .auth-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1.5px solid var(--gold);
      border-radius: 16px;
      padding: 28px 22px;
      box-shadow: 0 0 28px rgba(212,175,55,.22);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-header h1 {
      color: var(--gold);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .brand-header p {
      color: #9ca3af;
      font-size: 13px;
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--gold-light);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border-dim);
      border-radius: 8px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 8px rgba(212,175,55,.3);
    }

    .btn-gold {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg,#e0b838,#b88918);
      color: #090b10;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-gold:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      min-height: 20px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .links {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #9ca3af;
    }

    .links a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 700;
    }

    @media(max-width:520px) {
      .page-wrapper {
        padding: 0;
      }

      .auth-container {
        max-width: 100%;
        min-height: 100vh;
        border-radius: 0;
        border-left: none;
        border-right: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
    }
  </style>
</head>

<body>

<div class="page-wrapper">
  <div class="auth-container">

    <div class="brand-header">
      <h1>AYNA BOOK</h1>
      <p>Create your Global Digital Identity</p>
    </div>

    <form id="signupForm">

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          placeholder="Enter your full name"
          autocomplete="name"
          maxlength="100"
          required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="example@gmail.com"
          autocomplete="email"
          required>
      </div>

      <div class="form-group">
        <label for="country">Phone / Country</label>
        <input
          type="text"
          id="country"
          placeholder="01XXXXXXXXX / Bangladesh"
          required>
      </div>

      <div class="form-group">
        <label for="password">Password (Min 6 characters)</label>
        <input
          type="password"
          id="password"
          placeholder="Minimum 6 characters"
          minlength="6"
          autocomplete="new-password"
          required>
      </div>

      <button
        type="submit"
        class="btn-gold"
        id="submitBtn">
        Create AYNA Account
      </button>

      <div
        class="status-msg"
        id="statusMsg"
        aria-live="polite">
      </div>

    </form>

    <div class="links">
      Already have an account?
      <a href="index.html">Log In</a>
    </div>

  </div>
</div>

<script type="module">

import { auth, database } from "./firebase-init.js";

import {
  createUserWithEmailAndPassword,
  updateProfile,
  sendEmailVerification
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
  ref,
  set
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";

const form = document.getElementById("signupForm");
const statusMsg = document.getElementById("statusMsg");
const submitBtn = document.getElementById("submitBtn");

function showStatus(message, color = "#f87171") {
  statusMsg.textContent = message;
  statusMsg.style.color = color;
}

function friendlyError(error) {
  const messages = {
    "auth/email-already-in-use":
      "এই Gmail দিয়ে ইতিমধ্যে Account আছে। Login করুন।",

    "auth/invalid-email":
      "সঠিক Email Address দিন।",

    "auth/weak-password":
      "Password কমপক্ষে ৬ অক্ষরের হতে হবে।",

    "auth/network-request-failed":
      "Internet connection পরীক্ষা করুন।",

    "auth/operation-not-allowed":
      "Firebase Email/Password Authentication চালু করুন।",

    "auth/api-key-not-valid":
      "Firebase API Key পরীক্ষা করুন।",

    "PERMISSION_DENIED":
      "Database Permission Denied। RTDB Rules পরীক্ষা করুন।"
  };

  return messages[error.code] ||
    error.message ||
    "Account তৈরি করা যায়নি।";
}

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  const fullName =
    document.getElementById("fullName").value.trim();

  const email =
    document.getElementById("email").value.trim().toLowerCase();

  const country =
    document.getElementById("country").value.trim();

  const password =
    document.getElementById("password").value;

  if (fullName.length < 2) {
    showStatus("সঠিক Full Name লিখুন।");
    return;
  }

  if (password.length < 6) {
    showStatus("Password কমপক্ষে ৬ অক্ষরের হতে হবে।");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Creating Account...";

  showStatus("Creating your AYNA Account...", "#f5d76e");

  let user = null;

  try {

    // 1. Firebase Authentication

    const credential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    user = credential.user;

    // 2. Profile name

    await updateProfile(user, {
      displayName: fullName
    });

    // 3. AYNA ID based on Firebase UID

    const aynaId = "AYNA-" + user.uid;

    // 4. Save profile in Realtime Database

    await set(
      ref(database, "users/" + user.uid),
      {
        uid: user.uid,
        aynaId: aynaId,
        fullName: fullName,
        email: email,
        country: country,
        photoURL: "",
        privacy: "public",
        createdAt: Date.now()
      }
    );

    // 5. Send email verification

    await sendEmailVerification(user);

    showStatus(
      "Account created! Verification link sent to your email. AYNA ID: " + aynaId,
      "#4ade80"
    );

    submitBtn.textContent = "Account Created";

    // Keep the user signed in so the verification link
    // and login flow can continue normally.

  } catch (error) {

    console.error("AYNA SIGNUP ERROR:", error);

    if (user && error.code === "PERMISSION_DENIED") {
      showStatus(
        "Authentication হয়েছে, কিন্তু profile save হয়নি। RTDB Rules বা database URL পরীক্ষা করুন।"
      );
    } else {
      showStatus(friendlyError(error));
    }

    submitBtn.disabled = false;
    submitBtn.textContent = "Create AYNA Account";

  }

});

console.log("AYNA BOOK Signup Loaded.");

</script>

</body>
</html>
