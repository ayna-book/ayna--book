
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0F1E">

  <title>AYNA BOOK - Registration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: #0A0F1E;
      color: #FFFFFF;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .register-container {
      width: 100%;
      max-width: 480px;
      padding: 28px 22px;
      background: #1A2233;
      border: 1px solid #FFD700;
      border-radius: 18px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      margin: 9px 0 25px;
      font-size: 14px;
      color: #FFFFFF;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 100%;
      padding: 14px;
      border: 1px solid #FFD700;
      border-radius: 9px;
      background: #0A0F1E;
      color: #FFFFFF;
      font-size: 15px;
      outline: none;
    }

    input::placeholder {
      color: #A9B0BC;
    }

    input:focus {
      border-color: #FFFFFF;
      box-shadow: 0 0 7px rgba(255,255,255,0.25);
    }

    input[type="file"] {
      padding: 10px;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 72px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 9px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #FFFFFF;
      font-size: 13px;
      cursor: pointer;
      padding: 7px;
    }

    .photo-preview {
      display: none;
      width: 100px;
      height: 100px;
      object-fit: cover;
      border: 1px solid #FFD700;
      border-radius: 50%;
      margin: 14px auto 0;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 20px;
      font-size: 13px;
      line-height: 1.5;
    }

    .terms input {
      width: 18px;
      height: 18px;
      margin: 2px 0 0;
      flex-shrink: 0;
    }

    .terms label {
      margin: 0;
      font-weight: normal;
    }

    .main-button {
      width: 100%;
      padding: 15px;
      margin-top: 23px;
      background: #0A0F1E;
      border: 1px solid #FFD700;
      border-radius: 9px;
      color: #FFFFFF;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-button:hover {
      background: #26334A;
    }

    .main-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      padding: 12px;
      margin-top: 17px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .login-link,
    .home-link {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
    }

    a {
      color: #FFFFFF;
    }

    .home-link a {
      text-decoration: none;
    }

    @media (max-width: 400px) {
      .register-container {
        padding: 23px 16px;
      }
    }
  </style>
</head>

<body>

  <main class="register-container">

    <div class="logo">AYNA BOOK</div>

    <div class="subtitle">
      Connect • Share • Create
    </div>

    <h2>CREATE ACCOUNT</h2>

    <form id="signupForm">

      <label for="name">১. সম্পূর্ণ নাম</label>

      <input
        type="text"
        id="name"
        name="name"
        placeholder="আপনার নাম লিখুন"
        autocomplete="name"
        maxlength="100"
        required
      >

      <label for="email">২. Gmail / Email</label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="example@gmail.com"
        autocomplete="email"
        required
      >

      <label for="phone">৩. ফোন নম্বর</label>

      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="+8801XXXXXXXXX"
        autocomplete="tel"
        maxlength="20"
        required
      >

      <label for="photo">৪. প্রোফাইল ছবি</label>

      <input
        type="file"
        id="photo"
        name="photo"
        accept="image/*"
      >

      <img
        id="photoPreview"
        class="photo-preview"
        alt="Profile photo preview"
      >

      <label for="password">৫. পাসওয়ার্ড</label>

      <div class="password-box">

        <input
          type="password"
          id="password"
          name="password"
          placeholder="কমপক্ষে ১১ অক্ষর"
          minlength="11"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="toggle-password"
          data-target="password"
          aria-pressed="false"
        >
          দেখুন
        </button>

      </div>

      <label for="confirmPassword">
        ৬. পুনরায় পাসওয়ার্ড
      </label>

      <div class="password-box">

        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="আবার পাসওয়ার্ড লিখুন"
          minlength="11"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="toggle-password"
          data-target="confirmPassword"
          aria-pressed="false"
        >
          দেখুন
        </button>

      </div>

      <div class="terms">

        <input
          type="checkbox"
          id="terms"
          required
        >

        <label for="terms">
          আমি AYNA BOOK-এর নিয়ম ও গোপনীয়তা নীতি মেনে চলতে সম্মত।
        </label>

      </div>

      <button
        type="submit"
        class="main-button"
        id="signupBtn"
      >
        SAVE / REGISTER
      </button>

      <div
        id="message"
        role="status"
        aria-live="polite"
      ></div>

    </form>

    <div class="login-link">
      আগে অ্যাকাউন্ট আছে?
      <a href="./login.html">LOGIN</a>
    </div>

    <div class="home-link">
      <a href="./index.html">← Back to Home</a>
    </div>

  </main>

  <script type="module">

    import { registerUser } from "./auth.js";

    const form = document.getElementById("signupForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const phoneInput = document.getElementById("phone");
    const photoInput = document.getElementById("photo");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const signupBtn = document.getElementById("signupBtn");
    const messageBox = document.getElementById("message");
    const photoPreview = document.getElementById("photoPreview");

    function showMessage(message, success = false) {
      messageBox.textContent = message;
      messageBox.style.display = "block";

      messageBox.style.background = success
        ? "#123B2A"
        : "#451C24";

      messageBox.style.border = success
        ? "1px solid #36C275"
        : "1px solid #FF6878";
    }

    // Show / Hide Password
    document.querySelectorAll(".toggle-password").forEach(button => {
      button.addEventListener("click", () => {
        const target = document.getElementById(button.dataset.target);
        const visible = target.type === "password";

        target.type = visible ? "text" : "password";
        button.textContent = visible ? "লুকান" : "দেখুন";
        button.setAttribute("aria-pressed", String(visible));
      });
    });

    // Profile Photo Preview
    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];

      if (!file) {
        photoPreview.removeAttribute("src");
        photoPreview.style.display = "none";
        return;
      }

      if (!file.type.startsWith("image/")) {
        showMessage("অনুগ্রহ করে একটি ছবির ফাইল নির্বাচন করুন।");
        photoInput.value = "";
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        showMessage("ছবির আকার সর্বোচ্চ ৫ MB হতে পারবে।");
        photoInput.value = "";
        return;
      }

      photoPreview.src = URL.createObjectURL(file);
      photoPreview.style.display = "block";
    });

    // Registration
    form.addEventListener("submit", async event => {
      event.preventDefault();

      messageBox.style.display = "none";

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const phone = phoneInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;
      const photoFile = photoInput.files[0] || null;

      if (password.length < 11) {
        showMessage("পাসওয়ার্ড কমপক্ষে ১১ অক্ষরের হতে হবে।");
        passwordInput.focus();
        return;
      }

      if (password !== confirmPassword) {
        showMessage("দুটি পাসওয়ার্ড মিলছে না।");
        confirmInput.focus();
        return;
      }

      if (!document.getElementById("terms").checked) {
        showMessage("নিয়ম ও গোপনীয়তা নীতিতে সম্মতি দিন।");
        return;
      }

      signupBtn.disabled = true;
      signupBtn.textContent = "অ্যাকাউন্ট তৈরি হচ্ছে...";

      try {
        const result = await registerUser(
          name,
          email,
          phone,
          password,
          photoFile
        );

        if (!result.success) {
          showMessage(result.message);
          return;
        }

        if (!result.profileSaved) {
          showMessage(result.message);
          return;
        }

        showMessage(
          "অভিনন্দন! AYNA BOOK অ্যাকাউন্ট তৈরি হয়েছে। Login পেজে যাচ্ছেন...",
          true
        );

        form.reset();
        photoPreview.removeAttribute("src");
        photoPreview.style.display = "none";

        setTimeout(() => {
          window.location.href = "./login.html";
        }, 1800);

      } catch (error) {
        console.error("Registration Error:", error);
        showMessage("Registration সম্পন্ন হয়নি। আবার চেষ্টা করুন।");

      } finally {
        signupBtn.disabled = false;
        signupBtn.textContent = "SAVE / REGISTER";
      }
    });

  </script>

</body>
</html>
