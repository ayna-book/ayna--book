
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0F1E">
  <title>AYNA BOOK — Sign Up</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0A0F1E;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: #1A2233;
      border: 1px solid #4A4A2A;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 15px 50px rgba(0,0,0,.45);
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand h1 {
      margin: 0;
      color: #FFD700;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .star {
      display: inline-block;
      margin-left: 6px;
      color: #fff;
      font-size: 16px;
      text-shadow: 0 0 5px #fff, 0 0 10px #fff;
      animation: glow 4s infinite;
    }

    @keyframes glow {
      0%, 100% { opacity: .8; transform: scale(1); }
      50% {
        opacity: 1;
        transform: scale(1.35);
        text-shadow: 0 0 8px #fff, 0 0 18px #fff;
      }
    }

    .subtitle {
      margin-top: 8px;
      color: #A9B0BC;
      font-size: 14px;
    }

    h2 {
      margin: 0 0 20px;
      text-align: center;
      color: #FFD700;
      font-size: 23px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    input:not([type="checkbox"]) {
      width: 100%;
      padding: 14px 15px;
      margin-bottom: 16px;
      border: 1px solid #4A4A2A;
      border-radius: 12px;
      outline: none;
      background: #0A0F1E;
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      border-color: #FFD700;
      box-shadow: 0 0 0 2px rgba(255,215,0,.12);
    }

    input::placeholder { color: #6f7888; }

    .password-box { position: relative; }

    .password-box input { padding-right: 58px; }

    .show-password {
      position: absolute;
      right: 10px;
      top: 8px;
      width: 42px;
      height: 42px;
      padding: 0;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #A9B0BC;
      cursor: pointer;
      font-size: 18px;
    }

    .show-password:hover {
      color: #FFD700;
      background: rgba(255,215,0,.08);
    }

    .password-help {
      margin-top: -8px;
      margin-bottom: 16px;
      color: #A9B0BC;
      font-size: 12px;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 5px 0 18px;
      color: #A9B0BC;
      font-size: 12px;
      line-height: 1.5;
    }

    .terms input {
      width: 16px;
      height: 16px;
      margin: 2px 0 0;
      accent-color: #FFD700;
      flex-shrink: 0;
    }

    .terms a {
      color: #FFD700;
      text-decoration: none;
    }

    .signup-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #FFD700;
      color: #0A0F1E;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .signup-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #auth-message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    #auth-message[data-type="success"] {
      display: block;
      color: #2ECC71;
      background: rgba(46,204,113,.10);
      border: 1px solid rgba(46,204,113,.35);
    }

    #auth-message[data-type="error"] {
      display: block;
      color: #ff7777;
      background: rgba(255,80,80,.10);
      border: 1px solid rgba(255,80,80,.35);
    }

    .login-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #FFD700;
      text-decoration: none;
      font-size: 14px;
    }

    .security {
      margin-top: 22px;
      padding: 12px;
      border-radius: 12px;
      background: #0A0F1E;
      color: #A9B0BC;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
<main class="container">
  <section class="card">

    <div class="brand">
      <h1>AYNA BOOK <span class="star">★</span></h1>
      <div class="subtitle">Secure Digital Social Platform</div>
    </div>

    <h2>নতুন অ্যাকাউন্ট তৈরি করুন</h2>

    <form id="signup-form">

      <label for="name">আপনার নাম</label>
      <input id="name" type="text"
        placeholder="আপনার পূর্ণ নাম"
        autocomplete="name" maxlength="60" required>

      <label for="email">ইমেইল ঠিকানা</label>
      <input id="email" type="email"
        placeholder="আপনার ইমেইল"
        autocomplete="email" required>

      <label for="password">পাসওয়ার্ড</label>
      <div class="password-box">
        <input id="password" type="password"
          placeholder="কমপক্ষে ৬ অক্ষর"
          autocomplete="new-password"
          minlength="6" required>
        <button class="show-password"
          id="show-password" type="button">👁</button>
      </div>

      <div class="password-help">
        নিরাপত্তার জন্য শক্তিশালী পাসওয়ার্ড ব্যবহার করুন।
      </div>

      <label for="confirm-password">পাসওয়ার্ড আবার লিখুন</label>
      <div class="password-box">
        <input id="confirm-password" type="password"
          placeholder="পাসওয়ার্ড আবার লিখুন"
          autocomplete="new-password"
          minlength="6" required>
        <button class="show-password"
          id="show-confirm-password" type="button">👁</button>
      </div>

      <label class="terms">
        <input id="terms" type="checkbox" required>
        <span>
          আমি AYNA BOOK-এর
          <a href="#" onclick="return false;">নিরাপত্তা ও ব্যবহারের নিয়ম</a>
          মেনে চলতে সম্মত।
        </span>
      </label>

      <button class="signup-button" id="signup-button" type="submit">
        Create Account
      </button>

    </form>

    <div id="auth-message" role="status" aria-live="polite"></div>

    <a class="login-link" href="./login.html">
      ইতিমধ্যে অ্যাকাউন্ট আছে? Login করুন
    </a>

    <div class="security">
      🔒 আপনার অ্যাকাউন্ট Firebase Authentication দ্বারা সুরক্ষিত।
    </div>

  </section>
</main>

<script type="module">
  import { registerUser } from "./auth.js";

  const form = document.getElementById("signup-form");
  const nameInput = document.getElementById("name");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const confirmPasswordInput = document.getElementById("confirm-password");
  const termsInput = document.getElementById("terms");
  const button = document.getElementById("signup-button");
  const message = document.getElementById("auth-message");

  function showMessage(text, type) {
    message.textContent = text;
    message.dataset.type = type;
  }

  function togglePassword(input, buttonElement) {
    buttonElement.addEventListener("click", () => {
      input.type = input.type === "password" ? "text" : "password";
      buttonElement.textContent =
        input.type === "password" ? "👁" : "🙈";
    });
  }

  togglePassword(passwordInput, document.getElementById("show-password"));
  togglePassword(
    confirmPasswordInput,
    document.getElementById("show-confirm-password")
  );

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const name = nameInput.value.trim();
    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (name.length < 2) {
      showMessage("আপনার নাম সঠিকভাবে লিখুন।", "error");
      return;
    }

    if (password.length < 6) {
      showMessage("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।", "error");
      return;
    }

    if (password !== confirmPassword) {
      showMessage("দুইটি পাসওয়ার্ড একই নয়।", "error");
      return;
    }

    if (!termsInput.checked) {
      showMessage("নিয়মে সম্মতি দিন।", "error");
      return;
    }

    button.disabled = true;
    button.textContent = "অ্যাকাউন্ট তৈরি হচ্ছে...";
    message.textContent = "";
    delete message.dataset.type;

    let success = false;

    try {
      const result = await registerUser(name, email, password);

      if (!result || result.success !== true) {
        showMessage(
          result?.message || "রেজিস্ট্রেশন সম্পন্ন হয়নি।",
          "error"
        );
        return;
      }

      success = true;
      showMessage(
        result.message || "অ্যাকাউন্ট তৈরি হয়েছে।",
        "success"
      );

      setTimeout(() => {
        window.location.href = "./index.html";
      }, 1500);

    } catch (error) {
      console.error("AYNA BOOK Signup Error:", error);
      showMessage(
        error.message || "সমস্যা হয়েছে। আবার চেষ্টা করুন।",
        "error"
      );
    } finally {
      if (!success) {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    }
  });
</script>

</body>
</html>
