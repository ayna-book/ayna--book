<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার প্রোফাইল - AYNA ID</title>
    <style>
        body { background: #090a0f; color: #fff; font-family: sans-serif; padding: 20px; border: 3px solid #ffd700; min-height: 100vh; margin: 0; font-size: 18px; }
        .card { background: rgba(255,255,255,0.08); border: 2px solid #ffd700; border-radius: 14px; padding: 20px; text-align: center; margin-top: 20px; }
        button { padding: 12px 24px; background: #ff4444; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; margin-top: 20px; cursor: pointer; }
        a.back { color: #ffd700; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← হোমে ফিরে যান</a>
    <div class="card">
        <h2 style="color: #ffd700;">★ AYNA ID প্রোফাইল ★</h2>
        <p id="user-email" style="margin: 15px 0; font-size: 1.1rem;">লোড হচ্ছে...</p>
        <p id="user-uid" style="font-size: 0.9rem; color: #ccc;"></p>
        <button id="logout-btn">লগআউট করুন</button>
    </div>

    <script type="module">
        import { auth } from './firebase.js';
        import { logoutUser } from './auth.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-email').textContent = `ইমেইল: ${user.email}`;
                document.getElementById('user-uid').textContent = `AYNA ID: ${user.uid}`;
            } else {
                window.location.href = 'login.html';
            }
        });

        document.getElementById('logout-btn').addEventListener('click', logoutUser);
    </script>
</body>
</html>
