<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYNA BOOK - Profile</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #060b19;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #ffffff;
    padding: 16px;
  }

  /* টপ হেডার */
  .top-header {
    background: linear-gradient(180deg, #0d1a3d 0%, #070e24 100%);
    border: 2px solid #ffd700;
    border-radius: 4px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 5px 0 #7a580c, 0 8px 18px rgba(0, 0, 0, 0.75);
    margin-bottom: 20px;
  }

  .brand-title {
    font-size: 22px;
    font-weight: 900;
    color: #ffd700;
    letter-spacing: 1px;
  }

  .star-pulse-1s {
    color: #ffffff;
    font-size: 24px;
    display: inline-block;
    animation: starGlow1s 1s infinite alternate ease-in-out;
  }

  @keyframes starGlow1s {
    0% {
      transform: scale(0.95);
      color: #ffe680;
      text-shadow: 0 0 4px #ffd700;
    }
    100% {
      transform: scale(1.32);
      color: #ffffff;
      text-shadow: 0 0 10px #ffffff, 0 0 22px #ffd700, 0 0 36px #ffae00;
    }
  }

  .back-btn-3d {
    background: linear-gradient(180deg, #ffd700, #c9961a);
    color: #060b19;
    text-decoration: none;
    font-weight: 800;
    font-size: 14px;
    padding: 7px 14px;
    border-radius: 4px;
    box-shadow: 0 3px 0 #6e4f08;
  }

  /* বড় সোনালী স্কয়ার প্রোফাইল কার্ড */
  .profile-card-3d {
    max-width: 600px;
    margin: 0 auto 20px;
    background: linear-gradient(160deg, #132757 0%, #071026 100%);
    border: 2px solid #ffd700;
    border-radius: 4px;
    padding: 22px 16px;
    text-align: center;
    box-shadow: 0 6px 0 #7a580c, 0 12px 22px rgba(0, 0, 0, 0.8);
  }

  .large-square-avatar {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border: 3px solid #ffd700;
    border-radius: 4px;
    box-shadow: 0 5px 0 #8a6614, 0 0 18px rgba(255, 215, 0, 0.5);
    margin: 0 auto 14px;
    display: block;
    background-color: #0b1636;
  }

  .user-name {
    font-size: 22px;
    font-weight: 900;
    color: #ffffff;
    margin-bottom: 6px;
  }

  .ayna-id-badge {
    display: inline-block;
    background-color: #060d21;
    border: 1.5px solid #ffd700;
    border-radius: 4px;
    color: #ffd700;
    font-size: 15px;
    font-weight: 800;
    padding: 6px 14px;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }

  /* সেন্টার্ড বারকোড বক্স */
  .barcode-box-3d {
    background-color: #ffffff;
    color: #060b19;
    border: 2px solid #ffd700;
    border-radius: 4px;
    padding: 10px 14px;
    max-width: 280px;
    margin: 0 auto;
    box-shadow: 0 4px 0 #7a580c;
    font-family: 'Courier New', Courier, monospace;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: 2px;
  }

  .barcode-bars {
    height: 36px;
    background: repeating-linear-gradient(
      90deg,
      #060b19 0px,
      #060b19 3px,
      transparent 3px,
      transparent 5px,
      #060b19 5px,
      #060b19 7px,
      transparent 7px,
      transparent 11px
    );
    margin-bottom: 6px;
  }
</style>
</head>
<body>

  <header class="top-header">
    <div class="brand-title">AYNA BOOK <span class="star-pulse-1s">★</span></div>
    <a href="index.html" class="back-btn-3d">হোম</a>
  </header>

  <section class="profile-card-3d">
    <img src="profile.jpg" alt="Mohammed Mahabub Alam" class="large-square-avatar">
    <h1 class="user-name">Mohammed Mahabub Alam</h1>
    <div class="ayna-id-badge">AYNA ID: 2026-----10000001</div>
    <div class="barcode-box-3d">
      <div class="barcode-bars"></div>
      <div>202610000001</div>
    </div>
  </section>

</body>
</html>
