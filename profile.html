<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#090a0f"
  >

  <title>AYNA BOOK - My Profile</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #171923 0%,
          #090a0f 55%,
          #050609 100%
        );

      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    header {

      padding: 18px 20px;

      border-bottom:
        1px solid
        rgba(212, 175, 55, 0.20);

      background:
        rgba(9, 10, 15, 0.94);

      position: sticky;

      top: 0;

      z-index: 10;
    }


    .header-inner {

      max-width: 900px;

      margin: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;
    }


    .brand {

      font-size: 22px;

      font-weight: 800;

      color: #ffffff;
    }


    .brand span {

      color: #d4af37;
    }


    .logout-button {

      border: 1px solid #d4af37;

      background: transparent;

      color: #d4af37;

      padding: 8px 14px;

      border-radius: 8px;

      cursor: pointer;

      font-weight: 700;
    }


    .logout-button:hover {

      background: #d4af37;

      color: #090a0f;
    }


    main {

      width: 100%;

      max-width: 900px;

      margin: auto;

      padding: 30px 18px 50px;
    }


    .profile-card {

      padding: 28px;

      border-radius: 18px;

      background:
        rgba(18, 20, 29, 0.96);

      border:
        1px solid
        rgba(212, 175, 55, 0.28);

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.45);
    }


    .profile-header {

      text-align: center;

      margin-bottom: 28px;
    }


    .avatar {

      width: 100px;

      height: 100px;

      margin: 0 auto 15px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      background: #171923;

      border:
        2px solid #d4af37;

      font-size: 38px;

      font-weight: 800;

      color: #d4af37;
    }


    .avatar img {

      width: 100%;

      height: 100%;

      object-fit: cover;
    }


    .profile-name {

      margin: 0;

      font-size: 25px;

      font-weight: 800;
    }


    .profile-email {

      margin-top: 7px;

      color: #aeb2bc;

      font-size: 14px;

      word-break: break-word;
    }


    .verified {

      display: inline-block;

      margin-top: 10px;

      padding: 5px 10px;

      border-radius: 20px;

      background:
        rgba(60, 170, 100, 0.12);

      border:
        1px solid
        rgba(60, 170, 100, 0.30);

      color: #9ff0b7;

      font-size: 12px;

      font-weight: 700;
    }


    .not-verified {

      display: inline-block;

      margin-top: 10px;

      padding: 5px 10px;

      border-radius: 20px;

      background:
        rgba(212, 175, 55, 0.12);

      border:
        1px solid
        rgba(212, 175, 55, 0.30);

      color: #f5d76e;

      font-size: 12px;

      font-weight: 700;
    }


    .section-title {

      margin:
        25px 0 15px;

      font-size: 17px;

      color: #d4af37;
    }


    .info-grid {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 14px;
    }


    .info-box {

      padding: 15px;

      border-radius: 12px;

      background: #0d0f15;

      border:
        1px solid #292c36;
    }


    .info-label {

      display: block;

      margin-bottom: 6px;

      color: #777d89;

      font-size: 12px;
    }


    .info-value {

      color: #eeeeee;

      font-size: 14px;

      word-break: break-word;
    }


    .status-message {

      display: none;

      margin-bottom: 18px;

      padding: 12px 14px;

      border-radius: 10px;

      text-align: center;

      font-size: 14px;

      line-height: 1.5;
    }


    .status-message.info {

      display: block;

      background:
        rgba(70, 120, 180, 0.12);

      border:
        1px solid
        rgba(70, 120, 180, 0.30);

      color: #c9ddff;
    }


    .status-message.success {

      display: block;

      background:
        rgba(60, 170, 100, 0.12);

      border:
        1px solid
        rgba(60, 170, 100, 0.30);

      color: #9ff0b7;
    }


    .status-message.error {

      display: block;

      background:
        rgba(210, 70, 70, 0.12);

      border:
        1px solid
        rgba(210, 70, 70, 0.30);

      color: #ffaaaa;
    }


    .loading {

      text-align: center;

      padding: 30px;

      color: #aeb2bc;
    }


    @media (max-width: 600px) {

      .profile-card {

        padding: 20px;
      }


      .info-grid {

        grid-template-columns: 1fr;
      }


      .header-inner {

        align-items: flex-start;
      }

    }

  </style>

</head>


<body>


  <header>

    <div class="header-inner">

      <div class="brand">

        AYNA <span>BOOK</span>

      </div>


      <button
        type="button"
        id="logoutButton"
        class="logout-button"
      >

        Logout

      </button>

    </div>

  </header>


  <main>


    <div
      id="statusMessage"
      class="status-message"
      role="status"
      aria-live="polite"
    ></div>


    <div
      id="loadingMessage"
      class="loading"
    >

      Profile loading...

    </div>


    <section
      id="profileCard"
      class="profile-card"
      style="display:none;"
    >


      <div class="profile-header">


        <div
          id="avatar"
          class="avatar"
        >

          A

        </div>


        <h1
          id="profileName"
          class="profile-name"
        >

          AYNA BOOK User

        </h1>


        <div
          id="profileEmail"
          class="profile-email"
        >

          —

        </div>


        <div
          id="verificationStatus"
        ></div>


      </div>


      <h2 class="section-title">

        Account Information

      </h2>


      <div class="info-grid">


        <div class="info-box">

          <span class="info-label">
            AYNA ID
          </span>

          <div
            id="uidValue"
            class="info-value"
          >
            —
          </div>

        </div>


        <div class="info-box">

          <span class="info-label">
            Account Type
          </span>

          <div
            id="accountTypeValue"
            class="info-value"
          >
            —
          </div>

        </div>


        <div class="info-box">

          <span class="info-label">
            Phone
          </span>

          <div
            id="phoneValue"
            class="info-value"
          >
            —
          </div>

        </div>


        <div class="info-box">

          <span class="info-label">
            Country
          </span>

          <div
            id="countryValue"
            class="info-value"
          >
            —
          </div>

        </div>


        <div class="info-box">

          <span class="info-label">
            Plan
          </span>

          <div
            id="planValue"
            class="info-value"
          >
            —
          </div>

        </div>


        <div class="info-box">

          <span class="info-label">
            Account Status
          </span>

          <div
            id="accountStatusValue"
            class="info-value"
          >
            —
          </div>

        </div>


      </div>


      <h2 class="section-title">

        About

      </h2>


      <div class="info-box">

        <div
          id="bioValue"
          class="info-value"
        >
          No bio available.
        </div>

      </div>


    </section>


  </main>


  <script
    type="module"
    src="./profile.js"
  ></script>


</body>

</html>
