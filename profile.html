<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b49">
  <title>AYNA BOOK — My Profile</title>
  <link rel="icon" href="./icon-192.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071b49, #512b81);
      color: white;
    }

    .card {
      max-width: 520px;
      margin: 20px auto;
      padding: 24px;
      background: #ffffff12;
      border: 1px solid #ffffff30;
      border-radius: 20px;
    }

    h1, .subtitle { text-align: center; }
    .subtitle { color: #35d9ef; }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ffffff40;
      border-radius: 10px;
      font-size: 16px;
    }

    button, .back {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, #ff4fa3, #8b5cf6, #35d9ef);
      color: white;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    #photoPreview {
      display: block;
      width: 120px;
      height: 120px;
      margin: 15px auto;
      border-radius: 50%;
      object-fit: cover;
      background: #ffffff20;
    }

    #status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .muted {
      color: #ddd;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>🌍 AYNA BOOK</h1>
    <p class="subtitle">আপনার পরিচয়, আপনার আয়না</p>

    <h2>👤 আমার অনলাইন প্রোফাইল</h2>

    <img id="photoPreview" alt="প্রোফাইল ছবির প্রিভিউ">

    <p id="accountEmail" class="muted">অ্যাকাউন্ট যাচাই হচ্ছে...</p>

    <form id="profileForm">
      <label for="name">আপনার নাম</label>
      <input id="name" maxlength="80" required>

      <label for="username">ইউজারনেম</label>
      <input id="username" maxlength="30" required>

      <label for="bio">আপনার পরিচিতি</label>
      <textarea id="bio" rows="3" maxlength="300"></textarea>

      <label for="location">আপনার শহর বা অবস্থান</label>
      <input id="location" maxlength="100">

      <label for="photo">প্রোফাইল ছবি (সর্বোচ্চ ২০০ KB)</label>
      <input id="photo" type="file" accept="image/*">

      <button type="submit">💾 অনলাইনে সংরক্ষণ করুন</button>
    </form>

    <button id="logoutButton" type="button">🚪 লগআউট</button>

    <p id="status" role="status" aria-live="polite"></p>

    <a class="back" href="./index.html">🏠 হোম পেজে ফিরে যান</a>

    <p class="muted">
      আপনার প্রোফাইল Firebase-এ সংরক্ষিত হবে।
      এটি কাজ করতে লগইন, Firestore Database ও সঠিক
      নিরাপত্তা নিয়ম প্রয়োজন।
    </p>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAIW4FK9Il2yct-tOSCKuSodso8KN2UsTA",
      authDomain: "ayna-book.firebaseapp.com",
      projectId: "ayna-book",
      storageBucket: "ayna-book.firebasestorage.app",
      messagingSenderId: "805601138500",
      appId: "1:805601138500:web:47acdc90cb0cb521626911",
      measurementId: "G-RKHHSKNB4B"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = id => document.getElementById(id);
    const form = $("profileForm");
    const photoInput = $("photo");
    const preview = $("photoPreview");
    const status = $("status");

    let currentUser = null;
    let photoData = "";

    function showStatus(message) {
      status.textContent = message;
    }

    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.href = "./login.html";
        return;
      }

      currentUser = user;
      $("accountEmail").textContent =
        "লগইন করা অ্যাকাউন্ট: " + (user.email || "ইমেইল নেই");

      try {
        const ref = doc(db, "users", user.uid);
        const snapshot = await getDoc(ref);

        if (snapshot.exists()) {
          const data = snapshot.data();

          $("name").value = data.name || "";
          $("username").value = data.username || "";
          $("bio").value = data.bio || "";
          $("location").value = data.location || "";

          photoData = data.photo || "";

          if (photoData) {
            preview.src = photoData;
          }
        }

        showStatus("প্রোফাইল প্রস্তুত।");
      } catch (error) {
        console.error(error);
        showStatus(
          "প্রোফাইল লোড হয়নি। Firebase সংযোগ ও Firestore Rules পরীক্ষা করুন।"
        );
      }
    });

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        showStatus("একটি সঠিক ছবি নির্বাচন করুন।");
        photoInput.value = "";
        return;
      }

      if (file.size > 200 * 1024) {
        showStatus("ছবিটি ২০০ KB-এর চেয়ে ছোট করুন।");
        photoInput.value = "";
        return;
      }

      const reader = new FileReader();

      reader.onload = () => {
        photoData = reader.result;
        preview.src = photoData;
        showStatus("ছবির প্রিভিউ তৈরি হয়েছে।");
      };

      reader.onerror = () => {
        showStatus("ছবি পড়া যায়নি। আবার চেষ্টা করুন।");
      };

      reader.readAsDataURL(file);
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!currentUser) {
        showStatus("আগে লগইন করুন।");
        return;
      }

      const name = $("name").value.trim();
      const username = $("username").value.trim()
        .replace(/^@/, "").toLowerCase();
      const bio = $("bio").value.trim();
      const location = $("location").value.trim();

      if (!name || !username) {
        showStatus("নাম ও ইউজারনেম লিখুন।");
        return;
      }

      if (!/^[a-zA-Z0-9_.-]{3,30}$/.test(username)) {
        showStatus(
          "ইউজারনেম ৩–৩০ অক্ষরের হতে হবে; ইংরেজি অক্ষর, সংখ্যা, _, . বা - ব্যবহার করুন।"
        );
        return;
      }

      showStatus("Firebase-এ সংরক্ষণ হচ্ছে...");

      try {
        await setDoc(
          doc(db, "users", currentUser.uid),
          {
            name,
            username,
            bio,
            location,
            photo: photoData,
            email: currentUser.email || "",
            updatedAt: new Date().toISOString()
          },
          { merge: true }
        );

        showStatus("✅ আপনার প্রোফাইল Firebase-এ সংরক্ষিত হয়েছে!");
      } catch (error) {
        console.error(error);
        showStatus(
          "সংরক্ষণ হয়নি। Authentication, Firestore Rules ও ইন্টারনেট পরীক্ষা করুন।"
        );
      }
    });

    $("logoutButton").addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.href = "./login.html";
      } catch (error) {
        console.error(error);
        showStatus("লগআউট করা যায়নি। আবার চেষ্টা করুন।");
      }
    });
  </script>
</body>
</html>
