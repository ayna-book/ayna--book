<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Profile - AYNA BOOK</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#050510;color:#fff;padding:14px}.card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:22px;padding:20px;margin:12px 0;text-align:center}#pic{width:280px;height:280px;border-radius:50%;object-fit:cover;object-position:50% 12%;border:6px solid #00d4ff;margin:20px auto;display:block;padding:5px;background:#0a0a2a}.btn{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(90deg,#ff5a8e,#7a00ff,#00d4ff);color:#fff;font-weight:800;margin:8px 0;cursor:pointer}input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin:8px 0}</style></head><body>
<div class="card">
<h2>Edit Profile - AYNA-956251</h2>
<img id="pic" src="" style="display:none"><div id="noPic" style="font-size:80px">👤</div>
<input type="file" id="file" accept="image/*" style="margin:14px 0">
<input type="text" id="name" placeholder="Your Name - Md.Mahabub Alam">
<button class="btn" onclick="save()">SAVE & GO TO HOME - 280px BIG</button>
<button class="btn" style="background:rgba(255,255,255,0.1)" onclick="location.href='index.html'">BACK TO HOME</button>
<p style="font-size:11px;opacity:0.6;margin-top:10px">Photo will be 280px SUPER BIG - Full Head Visible - No Rotation</p>
</div>
<script>
function load(){
const p=JSON.parse(localStorage.getItem('ayna_profile')||'{}');
if(p.name) document.getElementById('name').value=p.name;
const pic=localStorage.getItem('ayna_profile_pic');
if(pic){document.getElementById('pic').src=pic;document.getElementById('pic').style.display='block';document.getElementById('noPic').style.display='none';}
}
document.getElementById('file').addEventListener('change',function(e){
const file=e.target.files[0];
if(!file) return;
const reader=new FileReader();
reader.onload=function(ev){
localStorage.setItem('ayna_profile_pic',ev.target.result);
document.getElementById('pic').src=ev.target.result;
document.getElementById('pic').style.display='block';
document.getElementById('noPic').style.display='none';
};
reader.readAsDataURL(file);
});
function save(){
const name=document.getElementById('name').value||'Md.Mahabub Alam';
localStorage.setItem('ayna_profile',JSON.stringify({name:name}));
alert('Saved! Photo 280px will show on Home');
location.href='index.html';
}
load();
</script>
</body></html>
