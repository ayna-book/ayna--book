<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#071b49">

  <title>AYNA BOOK — Profile</title>

  <style>
    :root{
      --bg:#050914;
      --card:#0b1428;
      --card2:#101d36;
      --navy:#071b49;
      --gold:#ffd700;
      --gold2:#d4af37;
      --white:#ffffff;
      --muted:#aeb9cf;
      --line:#26385e;
      --green:#20d878;
      --red:#ff4d5e;
      --blue:#4285f4;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at top,#102653 0%,#050914 45%,#02040a 100%);
      color:var(--white);
      font-family:Arial,Helvetica,sans-serif;
      font-size:22px;
      padding-bottom:100px;
    }

    button,
    input,
    textarea{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:100;
      min-height:78px;
      background:linear-gradient(180deg,#102b62,#071631);
      border-bottom:2px solid var(--gold2);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 16px;
    }

    .brand{
      font-size:30px;
      font-weight:900;
      color:var(--gold);
      letter-spacing:.5px;
    }

    .top-actions{
      display:flex;
      gap:8px;
    }

    .icon-btn{
      min-width:54px;
      min-height:54px;
      border:1px solid var(--gold2);
      border-radius:14px;
      background:#0b1c3d;
      color:white;
      font-size:26px;
    }

    .container{
      width:min(100%,1000px);
      margin:auto;
    }

    .profile-header{
      background:var(--card);
      border-bottom:1px solid var(--line);
    }

    .cover{
      height:220px;
      background:
        linear-gradient(135deg,#173d83,#071633 55%,#02050d);
      position:relative;
      overflow:hidden;
    }

    .cover::after{
      content:"AYNA BOOK";
      position:absolute;
      right:20px;
      bottom:18px;
      color:rgba(255,215,0,.15);
      font-size:48px;
      font-weight:900;
    }

    .profile-main{
      padding:0 20px 22px;
      position:relative;
    }

    .avatar-wrap{
      width:170px;
      height:170px;
      margin-top:-85px;
      position:relative;
      z-index:3;
    }

    .avatar{
      width:170px;
      height:170px;
      border-radius:50%;
      object-fit:cover;
      border:5px solid var(--gold);
      background:#10203e;
      display:block;
    }

    .online-dot{
      position:absolute;
      right:12px;
      bottom:12px;
      width:28px;
      height:28px;
      border-radius:50%;
      background:var(--green);
      border:4px solid var(--card);
    }

    .profile-name{
      margin-top:14px;
      font-size:38px;
      font-weight:900;
      word-break:break-word;
    }

    .profile-email{
      margin-top:5px;
      color:var(--muted);
      font-size:20px;
      word-break:break-word;
    }

    .profile-bio{
      margin-top:16px;
      color:#e7ecf7;
      line-height:1.5;
      font-size:22px;
    }

    .verified{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:28px;
      height:28px;
      border-radius:50%;
      background:#2f8cff;
      color:white;
      font-size:17px;
      vertical-align:middle;
      margin-left:6px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      margin-top:22px;
    }

    .stat{
      text-align:center;
      background:var(--card2);
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px 5px;
    }

    .stat strong{
      display:block;
      font-size:30px;
      color:var(--gold);
    }

    .stat span{
      display:block;
      margin-top:5px;
      color:var(--muted);
      font-size:17px;
    }

    .profile-actions{
      display:grid;
      grid-template-columns:2fr 1fr 1fr;
      gap:10px;
      margin-top:18px;
    }

    .btn{
      min-height:60px;
      border-radius:14px;
      border:1px solid var(--gold2);
      background:#10285a;
      color:white;
      font-size:21px;
      font-weight:800;
      padding:10px 14px;
    }

    .btn.primary{
      background:linear-gradient(135deg,#ffd700,#b68a00);
      color:#080b12;
    }

    .btn.danger{
      border-color:#ff4d5e;
      background:#35101a;
    }

    .section{
      margin:16px 12px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:20px;
      overflow:hidden;
    }

    .section-title{
      padding:18px;
      border-bottom:1px solid var(--line);
      color:var(--gold);
      font-size:27px;
      font-weight:900;
    }

    .menu-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
      padding:14px;
    }

    .menu-card{
      min-height:105px;
      padding:15px;
      border-radius:16px;
      background:var(--card2);
      border:1px solid var(--line);
      color:white;
      text-align:left;
    }

    .menu-card .emoji{
      display:block;
      font-size:34px;
      margin-bottom:8px;
    }

    .menu-card strong{
      display:block;
      font-size:22px;
    }

    .menu-card small{
      display:block;
      color:var(--muted);
      margin-top:5px;
      font-size:16px;
    }

    .post{
      padding:18px;
      border-bottom:1px solid var(--line);
    }

    .post:last-child{
      border-bottom:0;
    }

    .post-head{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .post-avatar{
      width:52px;
      height:52px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid var(--gold2);
    }

    .post-author{
      font-weight:800;
      font-size:20px;
    }

    .post-time{
      display:block;
      color:var(--muted);
      font-size:15px;
      margin-top:3px;
    }

    .post-text{
      margin-top:15px;
      line-height:1.5;
      font-size:21px;
    }

    .post-actions{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-top:15px;
    }

    .post-actions button{
      min-height:50px;
      background:#0e1d37;
      color:white;
      border:1px solid var(--line);
      border-radius:12px;
      font-size:18px;
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:200;
      min-height:78px;
      background:#07142d;
      border-top:2px solid var(--gold2);
      display:grid;
      grid-template-columns:repeat(5,1fr);
      padding:7px 5px;
    }

    .bottom-nav button{
      border:0;
      background:transparent;
      color:white;
      font-size:15px;
      font-weight:700;
    }

    .bottom-nav .nav-icon{
      display:block;
      font-size:28px;
      margin-bottom:3px;
    }

    .loading{
      padding:40px 20px;
      text-align:center;
      color:var(--muted);
      font-size:24px;
    }

    .empty{
      padding:30px 20px;
      text-align:center;
      color:var(--muted);
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:95px;
      transform:translateX(-50%) translateY(20px);
      z-index:999;
      background:#111d34;
      color:white;
      border:1px solid var(--gold2);
      border-radius:14px;
      padding:14px 20px;
      opacity:0;
      pointer-events:none;
      transition:.25s;
      max-width:90%;
      text-align:center;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    @media(max-width:650px){
      body{
        font-size:20px;
      }

      .brand{
        font-size:26px;
      }

      .cover{
        height:170px;
      }

      .avatar-wrap,
      .avatar{
        width:140px;
        height:140px;
      }

      .avatar-wrap{
        margin-top:-70px;
      }

      .profile-name{
        font-size:31px;
      }

      .stats{
        grid-template-columns:repeat(2,1fr);
      }

      .profile-actions{
        grid-template-columns:1fr 1fr;
      }

      .profile-actions .primary{
        grid-column:1/-1;
      }

      .menu-grid{
        grid-template-columns:1fr 1fr;
      }
    }

    @media(max-width:420px){
      .menu-grid{
        grid-template-columns:1fr;
      }

      .cover::after{
        font-size:30px;
      }

      .profile-main{
        padding-left:14px;
        padding-right:14px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">AYNA BOOK</div>

    <div class="top-actions">
      <button class="icon-btn" id="homeBtn" title="Home">⌂</button>
      <button class="icon-btn" id="logoutBtn" title="Logout">↪</button>
    </div>
  </header>

  <main class="container">

    <section class="profile-header">

      <div class="cover"></div>

      <div class="profile-main">

        <div class="avatar-wrap">
          <img
            id="profileAvatar"
            class="avatar"
            src="https://ui-avatars.com/api/?name=AYNA+BOOK&background=071b49&color=FFD700&size=300"
            alt="Profile photo"
          >
          <span class="online-dot"></span>
        </div>

        <div class="profile-name">
          <span id="profileName">Profile Loading...</span>
          <span id="verifiedBadge" class="verified" style="display:none;">✓</span>
        </div>

        <div class="profile-email" id="profileEmail">
          Loading...
        </div>

        <div class="profile-bio" id="profileBio">
          AYNA BOOK — Connect • Share • Create
        </div>

        <div class="stats">

          <div class="stat">
            <strong id="postCount">0</strong>
            <span>Posts</span>
          </div>

          <div class="stat">
            <strong id="friendCount">0</strong>
            <span>Friends</span>
          </div>

          <div class="stat">
            <strong id="followerCount">0</strong>
            <span>Followers</span>
          </div>

          <div class="stat">
            <strong id="followingCount">0</strong>
            <span>Following</span>
          </div>

        </div>

        <div class="profile-actions">
          <button class="btn primary" id="editProfileBtn">
            ✏️ Edit Profile
          </button>

          <button class="btn" id="shareProfileBtn">
            ↗ Share
          </button>

          <button class="btn" id="qrBtn">
            ▣ QR
          </button>
        </div>

      </div>
    </section>

    <!-- Profile menu -->

    <section class="section">

      <div class="section-title">
        👤 Profile
      </div>

      <div class="menu-grid">

        <button class="menu-card" id="aboutBtn">
          <span class="emoji">ℹ️</span>
          <strong>About</strong>
          <small>Personal information</small>
        </button>

        <button class="menu-card" id="photosBtn">
          <span class="emoji">🖼️</span>
          <strong>Photos</strong>
          <small>Your photo collection</small>
        </button>

        <button class="menu-card" id="videosBtn">
          <span class="emoji">🎬</span>
          <strong>Videos</strong>
          <small>Your video posts</small>
        </button>

        <button class="menu-card" id="reelsBtn">
          <span class="emoji">📱</span>
          <strong>Reels</strong>
          <small>Short videos</small>
        </button>

        <button class="menu-card" id="storiesBtn">
          <span class="emoji">⭕</span>
          <strong>Stories</strong>
          <small>24-hour stories</small>
        </button>

        <button class="menu-card" id="memoriesBtn">
          <span class="emoji">🕰️</span>
          <strong>Memories</strong>
          <small>Your memories</small>
        </button>

        <button class="menu-card" id="friendsBtn">
          <span class="emoji">👥</span>
          <strong>Friends</strong>
          <small>Friends and requests</small>
        </button>

        <button class="menu-card" id="followersBtn">
          <span class="emoji">🌐</span>
          <strong>Followers</strong>
          <small>People following you</small>
        </button>

      </div>
    </section>

    <!-- Account -->

    <section class="section">

      <div class="section-title">
        ⚙️ Account & Security
      </div>

      <div class="menu-grid">

        <button class="menu-card" id="securityBtn">
          <span class="emoji">🔐</span>
          <strong>Security</strong>
          <small>Password and login activity</small>
        </button>

        <button class="menu-card" id="settingsBtn">
          <span class="emoji">⚙️</span>
          <strong>Settings</strong>
          <small>Account preferences</small>
        </button>

        <button class="menu-card" id="privacyBtn">
          <span class="emoji">🛡️</span>
          <strong>Privacy</strong>
          <small>Control your privacy</small>
        </button>

        <button class="menu-card" id="notificationsBtn">
          <span class="emoji">🔔</span>
          <strong>Notifications</strong>
          <small>Notification settings</small>
        </button>

      </div>
    </section>

    <!-- Posts -->

    <section class="section">

      <div class="section-title">
        📝 My Posts
      </div>

      <div id="postsContainer">
        <div class="loading">
          Posts loading...
        </div>
      </div>

    </section>

  </main>

  <!-- Bottom navigation -->

  <nav class="bottom-nav">

    <button id="bottomHome">
      <span class="nav-icon">⌂</span>
      Home
    </button>

    <button id="bottomFriends">
      <span class="nav-icon">👥</span>
      Friends
    </button>

    <button id="bottomMessenger">
      <span class="nav-icon">💬</span>
      Messenger
    </button>

    <button id="bottomReels">
      <span class="nav-icon">▶</span>
      Reels
    </button>

    <button id="bottomSettings">
      <span class="nav-icon">⚙</span>
      Settings
    </button>

  </nav>

  <div id="toast" class="toast"></div>

  <script type="module" src="./firebase-init.js"></script>
  <script type="module" src="./auth-guard.js"></script>
  <script type="module" src="./profile.js"></script>

</body>
</html>
