<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>AYNA BOOK — Profile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 25px;
    }

    .logo {
      color: #d4af37;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .back-button {
      border: 1px solid #d4af37;
      background: transparent;
      color: #d4af37;
      padding: 9px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .back-button:hover {
      background: #d4af37;
      color: #000;
    }

    .card {
      background: #0d0d0d;
      border: 1px solid #2b2b2b;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.08);
    }

    .title {
      text-align: center;
      color: #d4af37;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .avatar-section {
      text-align: center;
      margin-bottom: 25px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      margin: 0 auto 12px;
      border-radius: 50%;
      border: 3px solid #d4af37;
      background: #171717;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .avatar-initial {
      color: #d4af37;
      font-size: 40px;
      font-weight: 700;
    }

    .email-status {
      color: #aaa;
      font-size: 13px;
    }

    .verified {
      color: #4caf50;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #d4af37;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #333;
      border-radius: 9px;
      background: #050505;
      color: #fff;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.08);
    }

    input[readonly] {
      color: #888;
      cursor: not-allowed;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .save-button {
      width: 100%;
      border: none;
      border-radius: 9px;
      background: #d4af37;
      color: #000;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .save-button:hover {
      background: #e4c65a;
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      text-align: center;
      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(76, 175, 80, 0.12);
      border: 1px solid #4caf50;
      color: #4caf50;
    }

    .message.error {
      background: rgba(244, 67, 54, 0.12);
      border: 1px solid #f44336;
      color: #f44336;
    }

    .loading {
      text-align: center;
      color: #aaa;
      padding: 30px 0;
    }

    @media (max-width: 500px) {
      .page {
        padding: 14px;
      }

      .card {
        padding: 20px;
      }

      .title {
        font-size: 24px;
      }

      .logo {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="header">

      <div class="logo">
        AYNA BOOK
      </div>

      <button
        type="button"
        id="backButton"
        class="back-button"
      >
        Back
      </button>

    </header>


    <section class="card">

      <h1 class="title">
        My Profile
      </h1>

      <p class="subtitle">
        Manage your AYNA BOOK profile
      </p>


      <div
        id="loadingBox"
        class="loading"
      >
        Loading profile...
      </div>


      <div id="profileContent" style="display:none;">

        <!-- PROFILE PHOTO PREVIEW -->

        <div class="avatar-section">

          <div class="avatar">

            <img
              id="profileImage"
              src=""
              alt="Profile Photo"
            >

            <span
              id="avatarInitial"
              class="avatar-initial"
            >
              A
            </span>

          </div>

          <div
            id="emailStatus"
            class="email-status"
          >
            Email status
          </div>

        </div>


        <!-- MESSAGE -->

        <div
          id="message"
          class="message"
        ></div>


        <!-- PROFILE FORM -->

        <form
          id="profileForm"
          novalidate
        >

          <!-- DISPLAY NAME -->

          <div class="form-group">

            <label for="displayName">
              Full Name
            </label>

            <input
              id="displayName"
              name="displayName"
              type="text"
              maxlength="100"
              placeholder="Enter your name"
              autocomplete="name"
            >

          </div>


          <!-- EMAIL -->

          <div class="form-group">

            <label for="email">
              Email Address
            </label>

            <input
              id="email"
              name="email"
              type="email"
              readonly
              autocomplete="email"
            >

          </div>


          <!-- PHONE -->

          <div class="form-group">

            <label for="phone">
              Phone Number
            </label>

            <input
              id="phone"
              name="phone"
              type="tel"
              maxlength="30"
              placeholder="Enter your phone number"
              autocomplete="tel"
            >

          </div>


          <!-- BIRTH DATE -->

          <div class="form-group">

            <label for="birthDate">
              Birth Date
            </label>

            <input
              id="birthDate"
              name="birthDate"
              type="date"
            >

          </div>


          <!-- BIO -->

          <div class="form-group">

            <label for="bio">
              Bio
            </label>

            <textarea
              id="bio"
              name="bio"
              maxlength="500"
              placeholder="Tell something about yourself..."
            ></textarea>

          </div>


          <!-- SAVE -->

          <button
            id="saveButton"
            class="save-button"
            type="submit"
          >
            Save Profile
          </button>

        </form>

      </div>

    </section>

  </main>


  <!-- =====================================================
       AYNA BOOK
       PROFILE JAVASCRIPT
  ====================================================== -->

  <script
    type="module"
    src="./profile.js"
  ></script>

</body>
</html>
