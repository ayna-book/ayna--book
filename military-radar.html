
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#001008">
<title>AYNA Tactical Radar</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#001008;color:#48ff80;font-family:monospace}
header{padding:16px;text-align:center;border-bottom:1px solid #168b43}
main{height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:12px}
.radar{width:min(92vw,58vh);aspect-ratio:1;border:2px solid #39ff75;border-radius:50%;position:relative;overflow:hidden;background:repeating-radial-gradient(circle,transparent 0 19%,#176d35 19.5% 20%,transparent 20.5% 25%),linear-gradient(90deg,transparent 49.5%,#176d35 50%,transparent 50.5%),linear-gradient(transparent 49.5%,#176d35 50%,transparent 50.5%)}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(transparent 0deg,#36ff8055 45deg,transparent 75deg);animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#ffdf42;box-shadow:0 0 12px #ffdf42}
.d1{left:68%;top:32%}.d2{left:30%;top:62%}.d3{left:54%;top:78%}
.center{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:white}
.panel{text-align:center;line-height:1.9}
button{padding:12px 18px;background:#0d4d25;color:#55ff80;border:1px solid #39ff75;border-radius:6px}
</style>
</head>
<body>
<header><b>AYNA BOOK — TACTICAL RADAR</b></header>
<main>
<div class="radar">
<div class="sweep"></div>
<div class="center"></div>
<div class="dot d1"></div>
<div class="dot d2"></div>
<div class="dot d3"></div>
</div>
<div class="panel">
<div>SIMULATION / DEMO ONLY</div>
<div>CONTACTS: 03 (SIMULATED)</div>
<div>STATUS: SYSTEM ACTIVE</div>
</div>
<button onclick="alert('এটি শুধুমাত্র ডেমো Radar')">RADAR CONTROL</button>
</main>
</body>
</html>
