<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b49">
  <title>AYNA BOOK — 10,000-Year Quantum Camera & Live Stream</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #071b49;
      --accent-color: #00ffcc;
      --dark-bg: #020c24;
      --text-color: #ffffff;
    }
    body {
      background-color: var(--dark-bg);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    .camera-container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
    }
    .camera-viewport {
      width: 100%;
      height: 420px;
      background: #000;
      border: 3px solid var(--accent-color);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(0, 255, 204, 0.3);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .camera-controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .btn-cam {
      flex: 1;
      padding: 14px;
      background: linear-gradient(145deg, var(--primary-color), var(--dark-bg));
      border: 2px solid var(--accent-color);
      color: #fff;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
    }
    .btn-cam:hover {
      background: var(--accent-color);
      color: #000;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
    }
    .status-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.7);
      color: var(--accent-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid var(--accent-color);
    }
    .captured-preview {
      margin-top: 25px;
      background: var(--primary-color);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 204, 0.3);
    }
    canvas { display: none; }
  </style>
</head>

<body>
<div class="camera-container">

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2><i class="fa-solid fa-camera" style="color: var(--accent-color);"></i> AYNA Quantum Live Camera Studio</h2>
    <a href="./index.html" style="color: var(--accent-color); text-decoration: none; font-weight: bold;"><i class="fa-solid fa-arrow-left"></i> হোমে চলুন</a>
  </div>

  <div class="camera-viewport">
    <video id="videoElement" autoplay playsinline muted></video>
    <div class="status-badge" id="cameraStatus">🔴 ক্যামেরা বন্ধ রয়েছে</div>
  </div>

  <div class="camera-controls">
    <button class="btn-cam" id="startCamBtn"><i class="fa-solid fa-power-off"></i> ক্যামেরা অন করুন</button>
    <button class="btn-cam" id="captureBtn"><i class="fa-solid fa-circle-dot"></i> ছবি তুলুন</button>
    <button class="btn-cam" id="switchCamBtn"><i class="fa-solid fa-rotate"></i> ক্যামেরা সুইচ করুন</button>
  </div>

  <div class="captured-preview">
    <h3 style="color: var(--accent-color); margin-top: 0;"><i class="fa-solid fa-image"></i> তোলা ছবির প্রিভিউ</h3>
    <div id="photoGallery" style="display: flex; gap: 10px; overflow-x: auto; padding: 10px 0;">
      <p class="muted" id="noPhotoText" style="color: #aaa;">এখনো কোনো ছবি তোলা হয়নি।</p>
    </div>
  </div>

</div>

<canvas id="canvasElement"></canvas>

<script>
  const video = document.getElementById('videoElement');
  const startCamBtn = document.getElementById('startCamBtn');
  const captureBtn = document.getElementById('captureBtn');
  const switchCamBtn = document.getElementById('switchCamBtn');
  const cameraStatus = document.getElementById('cameraStatus');
  const canvas = document.getElementById('canvasElement');
  const photoGallery = document.getElementById('photoGallery');
  const noPhotoText = document.getElementById('noPhotoText');

  let currentStream = null;
  let useFacingMode = 'user'; // 'user' (সামনের ক্যামেরা) অথবা 'environment' (পিছনের ক্যামেরা)

  async function startCamera() {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
    }

    try {
      const constraints = {
        video: { facingMode: useFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      };
      
      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = currentStream;
      cameraStatus.textContent = "🟢 কোয়ান্টাম এইচডি ক্যামেরা লাইভ (Active)";
      startCamBtn.style.background = "var(--accent-color)";
      startCamBtn.style.color = "#000";
    } catch (err) {
      alert("ক্যামেরা অন করা সম্ভব হয়নি। পারমিশন চেক করুন।");
      cameraStatus.textContent = "❌ ক্যামেরা এরর";
      console.error(err);
    }
  }

  startCamBtn.addEventListener('click', startCamera);

  switchCamBtn.addEventListener('click', () => {
    useFacingMode = useFacingMode === 'user' ? 'environment' : 'user';
    startCamera();
  });

  captureBtn.addEventListener('click', () => {
    if (!currentStream) {
      alert("আগে ক্যামেরা অন করুন!");
      return;
    }

    const context = canvas.getContext('2d');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    const imageUrl = canvas.toDataURL('image/png');

    if (noPhotoText) noPhotoText.style.display = 'none';

    const img = document.createElement('img');
    img.src = imageUrl;
    img.style.cssText = "width: 120px; height: 90px; object-fit: cover; border-radius: 8px; border: 2px solid var(--accent-color);";
    photoGallery.prepend(img);
  });
</script>
</body>
</html>
