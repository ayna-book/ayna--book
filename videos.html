

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b49">
<title>AYNA BOOK — Videos</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050914;color:#fff;
 font-family:Arial,sans-serif;padding-bottom:90px
}
header{
 height:72px;padding:0 14px;
 display:flex;align-items:center;
 justify-content:space-between;
 background:#071b49;border-bottom:2px solid #d4af37
}
.logo{font-size:27px;font-weight:900;color:#ffd700}
button{
 background:#102b62;color:#fff;
 border:1px solid #d4af37;border-radius:12px;
 padding:13px 18px;font-size:19px;font-weight:900
}
.hero{
 padding:25px 16px;
 background:linear-gradient(135deg,#123d82,#07142e)
}
h1{font-size:34px;color:#ffd700;margin:0 0 8px}
.sub{font-size:19px;color:#c6d0e2}
.video{
 width:100%;aspect-ratio:1/1;
 object-fit:cover;
 background:#000;
 border-radius:14px;
 border:2px solid #263c65
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;padding:12px
}
.empty{
 grid-column:1/-1;
 text-align:center;padding:55px 15px;
 color:#b4bfd3;font-size:22px;font-weight:800
}
.bottom{
 position:fixed;bottom:0;left:0;right:0;
 height:78px;display:grid;
 grid-template-columns:repeat(3,1fr);
 background:#071b49;border-top:2px solid #d4af37
}
.bottom div{
 display:flex;align-items:center;
 justify-content:center;
 font-size:19px;font-weight:900
}
</style>
</head>

<body>

<header>
 <div class="logo">AYNA BOOK</div>
 <button onclick="location.href='profile.html'">← Profile</button>
</header>

<section class="hero">
 <h1>🎬 Videos</h1>
 <div class="sub">Your video posts</div>
</section>

<main id="videoGrid" class="grid">
 <div class="empty">Loading videos...</div>
</main>

<nav class="bottom">
 <div onclick="location.href='home.html'">🏠 Home</div>
 <div onclick="location.href='profile.html'">👤 Profile</div>
 <div onclick="location.href='messenger.html'">💬 Messenger</div>
</nav>

<script type="module">
import {auth,database} from "./firebase-init.js";
import {onAuthStateChanged}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import {ref,get}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";

const grid=document.getElementById("videoGrid");

onAuthStateChanged(auth,async user=>{

 if(!user){
  location.replace("login.html");
  return;
 }

 const params=new URLSearchParams(location.search);
 const uid=params.get("uid")||user.uid;

 try{

  const snap=await get(ref(database,"posts"));
  const videos=[];

  if(snap.exists()){

   snap.forEach(item=>{

    const p=item.val()||{};

    const owner=
     p.uid||p.userId||p.authorUid;

    if(owner!==uid)return;

    const url=
     p.videoUrl||
     p.video||
     (
      p.mediaType==="video"
      ? p.mediaUrl
      : ""
     );

    if(url)videos.push(url);

   });

  }

  grid.innerHTML="";

  if(!videos.length){

   grid.innerHTML=
    `<div class="empty">
      🎬 No videos yet.
     </div>`;

   return;
  }

  videos.forEach(url=>{

   const video=document.createElement("video");

   video.className="video";
   video.src=url;
   video.controls=true;
   video.playsInline=true;
   video.preload="metadata";

   grid.appendChild(video);

  });

 }catch(error){

  console.error(error);

  grid.innerHTML=
   `<div class="empty">
     ⚠️ Videos could not be loaded.
    </div>`;

 }

});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>AYNA BOOK — Reels</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 width:100%;
 height:100%;
 background:#000;
 color:#fff;
 font-family:Arial,sans-serif;
 overflow:hidden
}
header{
 position:fixed;
 top:0;left:0;right:0;
 height:70px;
 z-index:20;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 14px;
 background:linear-gradient(#000b,transparent);
}
.logo{
 color:#ffd700;
 font-size:27px;
 font-weight:900
}
button{
 border:1px solid #d4af37;
 background:#071b49;
 color:#fff;
 border-radius:12px;
 padding:12px 17px;
 font-size:19px;
 font-weight:900
}
#reels{
 width:100%;
 height:100vh;
 overflow-y:auto;
 scroll-snap-type:y mandatory
}
.reel{
 position:relative;
 width:100%;
 height:100vh;
 scroll-snap-align:start;
 background:#000
}
.reel video{
 width:100%;
 height:100%;
 object-fit:cover
}
.info{
 position:absolute;
 left:15px;
 right:90px;
 bottom:35px;
 z-index:5;
 text-shadow:0 2px 5px #000
}
.name{
 font-size:25px;
 font-weight:900
}
.caption{
 margin-top:8px;
 font-size:20px;
 line-height:1.3
}
.actions{
 position:absolute;
 right:12px;
 bottom:35px;
 z-index:10;
 display:flex;
 flex-direction:column;
 gap:12px
}
.action{
 width:62px;height:62px;
 border-radius:50%;
 border:1px solid #fff;
 background:#0009;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 font-size:25px;
 font-weight:900
}
.action span{
 font-size:12px;
 margin-top:2px
}
.empty{
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:25px;
 font-size:24px;
 color:#aaa
}
</style>
</head>

<body>

<header>
 <div class="logo">AYNA BOOK</div>
 <button onclick="location.href='profile.html'">← Profile</button>
</header>

<main id="reels">
 <div class="empty">Loading Reels...</div>
</main>

<script type="module">

import {auth,database}
from "./firebase-init.js";

import {onAuthStateChanged}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
 ref,get,update
}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";


const root=document.getElementById("reels");


onAuthStateChanged(auth,async user=>{

 if(!user){
  location.replace("login.html");
  return;
 }

 try{

  const snap=await get(
   ref(database,"reels")
  );

  root.innerHTML="";

  if(!snap.exists()){

   root.innerHTML=
    `<div class="empty">
      🎬<br><br>
      No Reels available yet.
     </div>`;

   return;
  }


  snap.forEach(item=>{

   const r=item.val()||{};
   const id=item.key;

   const videoUrl=
    r.videoUrl||
    r.mediaUrl||
    r.url||
    "";

   if(!videoUrl)return;


   const reel=document.createElement("section");
   reel.className="reel";


   const video=document.createElement("video");

   video.src=videoUrl;
   video.controls=true;
   video.loop=true;
   video.playsInline=true;
   video.preload="metadata";


   const info=document.createElement("div");
   info.className="info";

   info.innerHTML=`
    <div class="name">
      ${escapeHtml(
       r.authorName||
       r.fullName||
       "AYNA BOOK User"
      )}
    </div>

    <div class="caption">
      ${escapeHtml(
       r.caption||
       r.text||
       ""
      )}
    </div>
   `;


   const actions=document.createElement("div");
   actions.className="actions";


   const like=document.createElement("button");
   like.className="action";
   like.innerHTML=
    `❤️<span>${Number(r.likesCount||0)}</span>`;


   like.onclick=async()=>{

    const current=
     Number(
      like.querySelector("span").textContent
     );

    const next=current+1;

    like.querySelector("span").textContent=next;

    try{

     await update(
      ref(database,"reels/"+id),
      {likesCount:next}
     );

    }catch(error){

     console.error(error);

    }

   };


   const share=document.createElement("button");
   share.className="action";
   share.innerHTML=
    `↗<span>Share</span>`;


   share.onclick=async()=>{

    try{

     if(navigator.share){

      await navigator.share({
       title:"AYNA BOOK Reel",
       url:location.href
      });

     }else{

      await navigator.clipboard.writeText(
       location.href
      );

     }

    }catch(e){}

   };


   actions.appendChild(like);
   actions.appendChild(share);

   reel.appendChild(video);
   reel.appendChild(info);
   reel.appendChild(actions);

   root.appendChild(reel);

  });


  const observer=
   new IntersectionObserver(
    entries=>{

     entries.forEach(entry=>{

      const video=
       entry.target.querySelector("video");

      if(!video)return;

      if(entry.isIntersecting){

       video.play().catch(()=>{});

      }else{

       video.pause();

      }

     });

    },
    {threshold:.65}
   );


  document
   .querySelectorAll(".reel")
   .forEach(reel=>{
    observer.observe(reel);
   });


 }catch(error){

  console.error(error);

  root.innerHTML=
   `<div class="empty">
     ⚠️ Reels could not be loaded.
    </div>`;

 }

});


function escapeHtml(value){

 return String(value??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}

</script>

</body>
</html>
