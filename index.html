<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#000000">

  <title>AYNA BOOK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    #splashScreen {
      position: fixed;
      inset: 0;
      z-index: 999999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
    }

    .splashContainer {
      width: 100%;
      max-width: 500px;
      padding: 30px;
      text-align: center;
    }

    .logoCircle {
      width: 180px;
      height: 180px;

      margin: 0 auto 40px;

      border: 2px solid #d4af37;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 0 25px rgba(212, 175, 55, 0.15);
    }

    .logoText {
      color: #ffd84d;
      font-size: 58px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .brandName {
      margin-bottom: 25px;

      color: #ffd84d;

      font-size: 36px;
      font-weight: 700;
      letter-spacing: 6px;
    }

    #statusText {
      margin-bottom: 35px;

      color: #999;

      font-size: 18px;
    }

    .progressTrack {
      width: 310px;
      max-width: 90%;
      height: 5px;

      margin: 0 auto;

      background: #222;

      border-radius: 10px;
      overflow: hidden;
    }

    .progressBar {
      width: 0;
      height: 100%;

      background: #d4af37;

      animation: progress 3s ease forwards;
    }

    @keyframes progress {
      0% {
        width: 0;
      }

      60% {
        width: 70%;
      }

      100% {
        width: 100%;
      }
    }

    #startupError {
      display: none;

      margin-top: 25px;

      color: #ff6b6b;

      font-size: 14px;
      line-height: 1.5;
    }

    #retryButton {
      display: none;

      margin: 20px auto 0;

      padding: 12px 25px;

      border: 1px solid #d4af37;
      border-radius: 8px;

      background: #000;

      color: #ffd84d;

      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- =====================================
       AYNA BOOK SPLASH SCREEN
  ====================================== -->

  <div id="splashScreen">

    <div class="splashContainer">

      <div class="logoCircle">
        <div class="logoText">
          AB
        </div>
      </div>

      <div class="brandName">
        AYNA BOOK
      </div>

      <div id="statusText">
        Starting secure platform...
      </div>

      <div class="progressTrack">
        <div class="progressBar"></div>
      </div>

      <div id="startupError"></div>

      <button
        id="retryButton"
        type="button"
      >
        Retry
      </button>

    </div>

  </div>


  <!-- =====================================
       FIREBASE STARTUP
  ====================================== -->

  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged
    } from
    "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";


    // =====================================
    // FIREBASE CONFIG
    // =====================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyAIW4FK9Il2yct-tOSCKuSodso8KN2UsTA",

      authDomain:
        "ayna-book.firebaseapp.com",

      databaseURL:
        "https://ayna-book-default-rtdb.asia-southeast1.firebasedatabase.app",

      projectId:
        "ayna-book",

      storageBucket:
        "ayna-book.firebasestorage.app",

      messagingSenderId:
        "805601138500",

      appId:
        "1:805601138500:web:47acdc90cb0cb521626911",

      measurementId:
        "G-RKHHSKNB4B"

    };


    // =====================================
    // DOM
    // =====================================

    const splashScreen =
      document.getElementById(
        "splashScreen"
      );

    const statusText =
      document.getElementById(
        "statusText"
      );

    const startupError =
      document.getElementById(
        "startupError"
      );

    const retryButton =
      document.getElementById(
        "retryButton"
      );


    // =====================================
    // ERROR DISPLAY
    // =====================================

    function showError(message) {

      statusText.textContent =
        "Platform startup failed";

      startupError.textContent =
        message;

      startupError.style.display =
        "block";

      retryButton.style.display =
        "block";
    }


    // =====================================
    // RETRY
    // =====================================

    retryButton.addEventListener(
      "click",
      function () {

        window.location.reload();

      }
    );


    // =====================================
    // NAVIGATION
    // =====================================

    function goTo(page) {

      window.location.replace(page);

    }


    // =====================================
    // START AYNA BOOK
    // =====================================

    async function startAynaBook() {

      try {

        statusText.textContent =
          "Connecting secure platform...";


        // Firebase initialize

        const app =
          initializeApp(
            firebaseConfig
          );


        // Firebase Auth

        const auth =
          getAuth(app);


        statusText.textContent =
          "Checking secure account...";


        let completed = false;


        // =================================
        // 10 SECOND SAFETY TIMEOUT
        // =================================

        const timeoutId =
          setTimeout(
            function () {

              if (completed) {
                return;
              }

              completed = true;

              showError(
                "Firebase authentication is taking too long. Please check your internet connection and Firebase configuration."
              );

            },
            10000
          );


        // =================================
        // AUTH STATE
        // =================================

        onAuthStateChanged(

          auth,

          function (user) {

            if (completed) {
              return;
            }

            completed = true;

            clearTimeout(
              timeoutId
            );


            // =============================
            // USER EXISTS
            // =============================

            if (user) {

              // Email not verified

              if (!user.emailVerified) {

                statusText.textContent =
                  "Email verification required...";


                setTimeout(
                  function () {

                    goTo(
                      "verify-email.html"
                    );

                  },
                  300
                );

                return;
              }


              // ===========================
              // VERIFIED USER
              // ===========================

              statusText.textContent =
                "Secure platform ready...";


              setTimeout(
                function () {

                  goTo(
                    "home.html"
                  );

                },
                300
              );

              return;
            }


            // =============================
            // NO USER
            // =============================

            statusText.textContent =
              "Opening secure login...";


            setTimeout(
              function () {

                goTo(
                  "login.html"
                );

              },
              300
            );

          },


          function (error) {

            if (completed) {
              return;
            }

            completed = true;

            clearTimeout(
              timeoutId
            );


            console.error(
              "Firebase Auth Error:",
              error
            );


            showError(
              "Authentication could not be initialized. Please check Firebase settings."
            );

          }

        );


      } catch (error) {

        console.error(
          "AYNA BOOK Startup Error:",
          error
        );


        showError(
          "AYNA BOOK could not start. Please check the Firebase configuration."
        );

      }

    }


    // =====================================
    // START APPLICATION
    // =====================================

    startAynaBook();

  </script>

</body>
</html>
