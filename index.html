<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYNA BOOK - প্রোফাইল</title>
<style>
body{background:#3d2b6a;color:white;font-family:sans-serif;padding:15px}
input,textarea{width:100%;padding:12px;border-radius:12px;border:none;margin:8px 0;color:#333}
button{width:100%;padding:14px;border-radius:14px;border:none;margin:8px 0;
background:linear-gradient(90deg,#ff5a8e,#00d4ff);color:white;font-weight:bold;font-size:16px}
#preview{width:100px;height:100px;border-radius:50%;display:none;margin:10px auto}
.small{font-size:13px;opacity:0.8}
</style>
</head>
<body>

<p id="auth-status" class="small">অ্যাকাউন্ট যাচাই হচ্ছে...</p>

<input id="fullName" placeholder="পূর্ণ নাম">
<input id="gmail" placeholder="Gmail / ইমেইল">
<input id="phone" placeholder="+8801XXXXXXXXX">
<input id="city" placeholder="আপনার শহর">
<textarea id="bio" placeholder="নিজের সম্পর্কে লিখুন"></textarea>

<h3>প্রোফাইল ছবি নির্বাচন করুন</h3>
<input type="file" id="fileInput" accept="image/*">
<img id="preview">
<p id="storage-msg" class="small">ছবি প্রিভিউ দেখা যাবে। ১৫০KB ছবি হলে লোকালে সেভ হবে। Firebase Storage বন্ধ থাকলেও চলবে।</p>

<button onclick="saveProfile()">💾 প্রোফাইল সংরক্ষণ করুন</button>
<button onclick="logout()">🚪 লগআউট</button>
<button onclick="goHome()">🏠 হোম পেজে ফিরে যান</button>

<p class="small">আপনার প্রোফাইল তথ্য ব্রাউজারে সংরক্ষিত হবে।</p>

<script>
// OFFLINE FIRST - NO MORE STUCK
setTimeout(()=>{ document.getElementById('auth-status').innerText="📴 অফলাইন মোড - প্রোফাইল লোকালে সেভ হবে"; loadLocal(); }, 1500);

function loadLocal(){
  ['fullName','phone','city','bio','gmail'].forEach(id=>{
    const key='ayna_'+id;
    const val=localStorage.getItem(key);
    if(val && document.getElementById(id)) document.getElementById(id).value=val;
  });
  const pic=localStorage.getItem('ayna_profile_pic');
  if(pic){ const p=document.getElementById('preview'); p.src=pic; p.style.display='block'; }
}
loadLocal();

document.getElementById('fileInput').addEventListener('change', function(){
  const file=this.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    localStorage.setItem('ayna_profile_pic', e.target.result);
    const p=document.getElementById('preview'); p.src=e.target.result; p.style.display='block';
    document.getElementById('storage-msg').innerText="✅ ছবি রেডি!";
  };
  reader.readAsDataURL(file);
});

function saveProfile(){
  const data={
    fullName: document.getElementById('fullName').value,
    gmail: document.getElementById('gmail').value,
    phone: document.getElementById('phone').value,
    city: document.getElementById('city').value,
    bio: document.getElementById('bio').value
  };
 Object.keys(data).forEach(k=>localStorage.setItem('ayna_'+k, data[k]));
  localStorage.setItem('ayna_profile', JSON.stringify(data));
  alert('✅ প্রোফাইল সংরক্ষিত হয়েছে!');
  goHome();
}
function logout(){
  localStorage.clear();
  alert('লগআউট সম্পন্ন');
  location.href='index.html';
}
function goHome(){ location.href='index.html'; }
</script>
</body>
</html>
