<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AYNA BOOK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #splash {
      width: 100%;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      width: 100%;
      max-width: 500px;
      text-align: center;
      padding: 20px;
    }

    .logo {
      width: 180px;
      height: 180px;
      margin: 0 auto 45px;

      border: 2px solid #d4af37;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #d4af37;
      font-size: 58px;
      font-weight: bold;

      box-shadow:
        0 0 25px rgba(212,175,55,0.12);
    }

    .brand {
      color: #d4af37;
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 7px;
      margin-bottom: 25px;
    }

    .status {
      color: #aaa;
      font-size: 20px;
      margin-bottom: 35px;
    }

    .loader {
      width: 310px;
      max-width: 90%;
      height: 5px;
      background: #1d1d1d;
      border-radius: 10px;
      margin: 0 auto;
      overflow: hidden;
    }

    .loader-bar {
      width: 35%;
      height: 100%;
      background: #d4af37;
      border-radius: 10px;

      animation: loading 1.2s infinite ease-in-out;
    }

    @keyframes loading {
      0% {
        transform: translateX(-120%);
      }

      50% {
        transform: translateX(120%);
      }

      100% {
        transform: translateX(300%);
      }
    }

    #errorBox {
      display: none;
      margin: 25px auto 0;
      max-width: 360px;
      padding: 14px;
      border-radius: 10px;
      background: #180000;
      border: 1px solid #552222;
      color: #ffaaaa;
      font-size: 14px;
      line-height: 1.5;
    }

    #retryButton {
      display: none;
      margin: 15px auto 0;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="splash">

    <div class="content">

      <div class="logo">
        AB
      </div>

      <div class="brand">
        AYNA BOOK
      </div>

      <div
        id="status"
        class="status"
      >
        Starting secure platform...
      </div>

      <div class="loader">
        <div class="loader-bar"></div>
      </div>

      <div id="errorBox"></div>

      <button
        id="retryButton"
        type="button"
      >
        Retry
      </button>

    </div>

  </div>


  <script type="module">

    // =====================================================
    // AYNA BOOK
    // STARTUP CONTROLLER
    // =====================================================

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";


    // =====================================================
    // FIREBASE CONFIG
    // =====================================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyAIW4FK9Il2yct-tOSCKuSodso8KN2UsTA",

      authDomain:
        "ayna-book.firebaseapp.com",

      databaseURL:
        "https://ayna-book-default-rtdb.asia-southeast1.firebasedatabase.app",

      projectId:
        "ayna-book",

      storageBucket:
        "ayna-book.firebasestorage.app",

      messagingSenderId:
        "805601138500",

      appId:
        "1:805601138500:web:47acdc90cb0cb521626911",

      measurementId:
        "G-RKHHSKNB4B"
    };


    // =====================================================
    // ELEMENTS
    // =====================================================

    const statusElement =
      document.getElementById("status");

    const errorBox =
      document.getElementById("errorBox");

    const retryButton =
      document.getElementById("retryButton");


    // =====================================================
    // STATUS
    // =====================================================

    function setStatus(text) {

      if (statusElement) {
        statusElement.textContent = text;
      }

    }


    // =====================================================
    // ERROR
    // =====================================================

    function showError(message) {

      if (errorBox) {

        errorBox.textContent = message;

        errorBox.style.display = "block";
      }

      if (retryButton) {

        retryButton.style.display = "block";
      }

    }


    // =====================================================
    // NAVIGATION
    // =====================================================

    function goTo(page) {

      window.location.replace(page);

    }


    // =====================================================
    // START
    // =====================================================

    async function startAYNABook() {

      try {

        setStatus(
          "Connecting to secure platform..."
        );


        // -------------------------------------------------
        // INITIALIZE FIREBASE
        // -------------------------------------------------

        const app =
          initializeApp(firebaseConfig);


        setStatus(
          "Checking account..."
        );


        // -------------------------------------------------
        // INITIALIZE AUTH
        // -------------------------------------------------

        const auth =
          getAuth(app);


        let completed = false;


        // -------------------------------------------------
        // SAFETY TIMEOUT
        // -------------------------------------------------

        const timeout = setTimeout(
          function () {

            if (completed) return;

            completed = true;

            showError(
              "AYNA BOOK could not complete startup. Please check your internet connection and try again."
            );

          },
          8000
        );


        // -------------------------------------------------
        // AUTH STATE
        // -------------------------------------------------

        onAuthStateChanged(
          auth,
          function (user) {

            if (completed) return;

            completed = true;

            clearTimeout(timeout);


            // ---------------------------------------------
            // USER FOUND
            // ---------------------------------------------

            if (user) {

              setStatus(
                "Checking email verification..."
              );


              if (user.emailVerified) {

                setStatus(
                  "Opening AYNA BOOK..."
                );

                setTimeout(
                  function () {

                    goTo(
                      "home.html"
                    );

                  },
                  300
                );

              } else {

                setStatus(
                  "Email verification required..."
                );

                setTimeout(
                  function () {

                    goTo(
                      "verify-email.html"
                    );

                  },
                  300
                );

              }

              return;
            }


            // ---------------------------------------------
            // NO USER
            // ---------------------------------------------

            setStatus(
              "Opening secure sign in..."
            );


            setTimeout(
              function () {

                goTo(
                  "login.html"
                );

              },
              300
            );

          }
        );


      } catch (error) {

        console.error(
          "AYNA BOOK Startup Error:",
          error
        );


        showError(
          "Firebase startup failed: " +
          (error.message || "Unknown error")
        );

      }

    }


    // =====================================================
    // RETRY
    // =====================================================

    if (retryButton) {

      retryButton.addEventListener(
        "click",
        function () {

          window.location.reload();

        }
      );

    }


    // =====================================================
    // START AYNA BOOK
    // =====================================================

    startAYNABook();

  </script>

</body>
</html>
