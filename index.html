<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AYNA BOOK - 2000 Lines</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#050510;color:#fff;padding:14px}.header{display:flex;justify-content:space-between;padding:12px;background:rgba(20,10,60,0.8);border-bottom:1px solid #00d4ff33}.logo{font-weight:900;font-size:20px;background:linear-gradient(90deg,#ff5a8e,#00d4ff,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.card{background:rgba(255,255,255,0.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:22px;padding:20px;margin:12px 0}#homePic{width:160px;height:160px;border-radius:50%;object-fit:cover;border:3px solid #00d4ff;box-shadow:0 0 25px #00d4ff77;cursor:pointer;display:block;margin:15px auto;transition:0.4s}#homePic.big{width:300px;height:300px;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;border-color:#ffd700;box-shadow:0 0 80px #000}.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#ff5a8e,#7a00ff,#00d4ff);color:#fff;font-weight:700;margin:6px 0;cursor:pointer}.price{background:#ffd700;color:#000;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}</style></head><body>
