<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Tech Master Hub - AYNA BOOK</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .master-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .tech-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tech-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .tech-btn:hover {
            background: #2563eb;
        }
        #result-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #10b981;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            color: #34d399;
            min-height: 60px;
            max-height: 120px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="master-card">
    <h1>🌐 UNIVERSAL TECH CONNECTOR</h1>
    <p>পৃথিবীর বিভিন্ন প্রযুক্তির ডেটা ফেচ করার মাস্টার হাব</p>

    <div class="tech-grid">
        <button class="tech-btn" onclick="fetchTech('time')">সার্ভার টাইম টেকনোলজি</button>
        <button class="tech-btn" onclick="fetchTech('crypto')">ক্রিপ্টো কারেন্সি মার্কেট</button>
        <button class="tech-btn" onclick="fetchTech('ai_core')">এআই নিউরাল কোর</button>
        <button class="tech-btn" onclick="fetchTech('ayna_offline')">AYNA BOOK অফলাইন ডেটা</button>
    </div>

    <div id="result-box">
        > টেক্সট হাব প্রস্তুত। যেকোনো প্রযুক্তির বাটন প্রেস করুন...
    </div>
</div>

<script>
    function fetchTech(type) {
        const resultBox = document.getElementById("result-box");
        
        if (type === 'time') {
            const now = new Date();
            resultBox.innerHTML = `[TIME TECH]: বর্তমান গ্লোবাল টাইম ও ডেট: ${now.toLocaleString()}`;
        } 
        else if (type === 'crypto') {
            resultBox.innerHTML = `[FINTECH API]: বিটকয়েন ও ব্লকচেইন নোড সিঙ্ক সফল। মার্কেট স্ট্যাটাস: একটিভ।`;
        } 
        else if (type === 'ai_core') {
            resultBox.innerHTML = `[AI NEURAL CORE]: কোয়ান্টাম লজিক প্রসেসর রেডি। কমান্ড গ্রহণ করা হচ্ছে...`;
        } 
        else if (type === 'ayna_offline') {
            resultBox.innerHTML = `[AYNA BOOK]: আপনার ৪টি অ্যাকাউন্ট লোকাল স্টোরেজ থেকে নিরাপদে লোড হয়েছে!`;
        }
    }
</script>

</body>
</html>
