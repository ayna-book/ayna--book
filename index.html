<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Courier New',monospace;overflow:hidden;touch-action:none}
#uni{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#800000 0%,#300000 30%,#000 75%)}
h1{font-size:40px;font-weight:900;text-align:center;color:#fff;line-height:1;text-shadow:0 0 20px #ff0000,0 0 50px #ff0000,0 0 100px #ff0000,0 0 200px #ff0000;animation:boom 0.07s infinite}
@keyframes boom{0%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.08) rotate(0.5deg)}50%{transform:scale(1) rotate(0deg)}75%{transform:scale(1.08) rotate(-0.5deg)}}

.box{width:96%;max-width:550px;border:5px solid #ff0000;background:rgba(30,0,0,0.95);box-shadow:0 0 120px red,inset 0 0 40px rgba(255,0,0,0.3);padding:18px}
.l{display:flex;justify-content:space-between;padding:7px 0;font-size:12.5px;border-bottom:1px solid #440000}
.k{color:#999}.v{color:#fff;font-weight:bold}.vv{color:#ff0000;font-weight:900;text-shadow:0 0 10px red}
.crit{background:#ff0000;color:#000;padding:3px 6px;font-weight:900;font-size:11px;animation:blink 0.2s infinite}
@keyframes blink{0%,50%{opacity:1}100%{opacity:0.3}}
canvas{position:fixed;top:0;left:0;z-index:-1}
#warn{margin-top:10px;color:#ff0000;font-size:10px;text-align:center;border:1px solid red;padding:4px;background:rgba(255,0,0,0.1)}
</style>
</head>
