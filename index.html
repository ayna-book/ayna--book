<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYNA BOOK - Working Edition</title>
    <style>
        body { background: #070a12; color: #ffffff; font-family: Arial, sans-serif; padding: 20px; max-width: 480px; margin: auto; }
        .card { background: #131b2e; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px solid #334155; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #0b0f19; border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #38bdf8; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 5px; }
        .btn-logout { background: #ef4444; color: #fff; margin-top: 8px; }
        h3 { color: #38bdf8; margin-top: 0; font-size: 1.1rem; }
    </style>
</head>
<body>

    <h2 style="text-align:center; color:#38bdf8;">AYNA BOOK</h2>
    <p id="welcomeMsg" style="text-align:center; color:#94a3b8; font-size:0.9rem;">গেস্ট মোড</p>

    <!-- অ্যাকাউন্ট ও লগইন সেকশন -->
    <div class="card">
        <h3>👤 একাউন্ট ও লগইন</h3>
        <input type="email" id="userEmail" placeholder="জিমেইল বা ইমেইল লিখুন">
        <input type="password" id="userPass" placeholder="পাসওয়ার্ড লিখুন">
        <button onclick="saveLogin()">লগইন / সেভ করুন</button>
        <button class="btn-logout" onclick="logoutAcc()">লগআউট</button>
        <p id="statusText" style="font-size:0.85rem; margin-top:8px; text-align:center;"></p>
    </div>

    <!-- রেডিও ও মিডিয়া সেকশন -->
    <div class="card">
        <h3>📻 রেডিও ও মিডিয়া প্লেয়ার</h3>
        <audio id="audioPlayer" controls style="width:100%; margin-top:10px; display:none;"></audio>
        <button onclick="playRadioAudio()">অনলাইন রেডিও চালু করুন</button>
    </div>

    <!-- রাডার ও কম্পাস সেকশন -->
    <div class="card">
        <h3>📡 রাডার ও জিপিএস কম্পাস</h3>
        <button onclick="getDeviceLocation()">আমার বর্তমান লোকেশন দেখুন</button>
        <p id="locResult" style="font-size:0.85rem; margin-top:8px; color:#cbd5e1;"></p>
    </div>

<script>
    // পেজ লোড হলে সেভ করা ডাটা চেক করা
    window.onload = function() {
        const saved = localStorage.getItem('ayna_mail');
        if(saved) {
            document.getElementById('userEmail').value = saved;
            document.getElementById('welcomeMsg').textContent = "স্বাগতম, " + saved;
            document.getElementById('statusText').style.color = "#10b981";
            document.getElementById('statusText').textContent = "একাউন্ট একটিভ আছে।";
        }
    }

    // লগইন বা সেভ ফাংশন
    function saveLogin() {
        const mail = document.getElementById('userEmail').value.trim();
        const pass = document.getElementById('userPass').value;
        const status = document.getElementById('statusText');

        if(!mail || !pass) {
            status.style.color = "#ef4444";
            status.textContent = "ইমেইল এবং পাসওয়ার্ড উভয়ই দিন।";
            return;
        }

        localStorage.setItem('ayna_mail', mail);
        document.getElementById('welcomeMsg').textContent = "স্বাগতম, " + mail;
        status.style.color = "#10b981";
        status.textContent = "সফলভাবে সেভ হয়েছে!";
    }

    // লগআউট ফাংশন
    function logoutAcc() {
        localStorage.removeItem('ayna_mail');
        document.getElementById('userEmail').value = "";
        document.getElementById('userPass').value = "";
        document.getElementById('welcomeMsg').textContent = "গেস্ট মোড";
        document.getElementById('statusText').style.color = "#ef4444";
        document.getElementById('statusText').textContent = "লগআউট করা হয়েছে।";
    }

    // রেডিও প্লে করার ফাংশন
    function playRadioAudio() {
        const player = document.getElementById('audioPlayer');
        player.style.display = 'block';
        player.src = 'https://stream.zeno.fm/f3wvbbqmdg8uv';
        player.play().catch(err => {
            alert("ব্রাউজার পলিসির কারণে অডিও অটো-প্লে ব্লক হতে পারে। দয়া করে প্লেয়ারের প্লে বোতামে চাপ দিন।");
        });
    }

    // জিপিএস লোকেশন দেখার ফাংশন
    function getDeviceLocation() {
        const res = document.getElementById('locResult');
        if(!navigator.geolocation) {
            res.textContent = "আপনার ব্রাউজার লোকেশন সমর্থন করে না।";
            return;
        }
        res.textContent = "লোকেশন খোঁজা হচ্ছে...";
        navigator.geolocation.getCurrentPosition(pos => {
            res.textContent = `ল্যাটিটিউড: ${pos.coords.latitude.toFixed(4)}, লংজিটিউড: ${pos.coords.longitude.toFixed(4)}`;
        }, err => {
            res.textContent = "লোকেশন পারমিশন দেওয়া হয়নি বা পাওয়া যায়নি।";
        });
    }
</script>

</body>
</html>
