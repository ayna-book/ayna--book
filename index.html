<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYNA BOOK - Original Account System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
        }
        button {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background: #1d4ed8;
        }
        .account-list {
            margin-top: 25px;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
        .account-card {
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #10b981;
            font-size: 13px;
        }
        .account-card strong {
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AYNA BOOK</h2>
    <p class="subtitle">গ্লোবাল রিয়েল অ্যাকাউন্ট ম্যানেজমেন্ট সিস্টেম</p>

    <div class="form-group">
        <label>ব্যবহারকারীর নাম (Account Holder Name):</label>
        <input type="text" id="accName" placeholder="আপনার নাম লিখুন">
    </div>

    <div class="form-group">
        <label>অ্যাকাউন্টের ধরন ও ফি (Account Tier):</label>
        <select id="accTier">
            <option value="Personal (Free)">১. Personal Account - ফ্রি (Free)</option>
            <option value="Business ($10 / 1200 BDT)">২. Business Account - $10 / ১২০০ টাকা</option>
            <option value="VIP ($10 / 1200 BDT)">৩. VIP Account - $10 / ১২০০ টাকা</option>
            <option value="VVIP ($20 / 2400 BDT)">৪. VVIP Account - $20 / ২৪০০ টাকা</option>
        </select>
    </div>

    <button onclick="createAccount()">অ্যাকাউন্ট তৈরি ও সেভ করুন</button>

    <div class="account-list">
        <label>সংরক্ষিত অ্যাকাউন্টসমূহ (Saved Accounts):</label>
        <div id="savedAccountsBox">
            <p style="color: #64748b; font-size: 12px;">কোনো অ্যাকাউন্ট এখনো যোগ করা হয়নি।</p>
        </div>
    </div>
</div>

<script>
    // পেজ লোড হওয়ার সাথে সাথে আগের সেভ করা অ্যাকাউন্টগুলো দেখানো
    window.onload = function() {
        loadAccounts();
    };

    function createAccount() {
        const name = document.getElementById("accName").value.trim();
        const tier = document.getElementById("accTier").value;

        if (name === "") {
            alert("দয়া করে অ্যাকাউন্টধারীর নাম লিখুন!");
            return;
        }

        // নতুন অ্যাকাউন্ট অবজেক্ট তৈরি
        const newAccount = {
            name: name,
            tier: tier,
            date: new Date().toLocaleString()
        };

        // লোকাল স্টোরেজ থেকে আগের ডেটা আনা
        let accounts = JSON.parse(localStorage.getItem("ayna_accounts")) || [];
        
        // নতুন অ্যাকাউন্ট লিস্টে যোগ করা
        accounts.push(newAccount);

        // লোকাল স্টোরেজে আবার সেভ করা
        localStorage.setItem("ayna_accounts", JSON.stringify(accounts));

        // ইনপুট ফাকা করা এবং লিস্ট রিফ্রেশ করা
        document.getElementById("accName").value = "";
        loadAccounts();
        alert("অ্যাকাউন্ট সফলভাবে তৈরি এবং সংরক্ষিত হয়েছে!");
    }

    function loadAccounts() {
        const box = document.getElementById("savedAccountsBox");
        let accounts = JSON.parse(localStorage.getItem("ayna_accounts")) || [];

        if (accounts.length === 0) {
            box.innerHTML = `<p style="color: #64748b; font-size: 12px;">কোনো অ্যাকাউন্ট এখনো যোগ করা হয়নি।</p>`;
            return;
        }

        let html = "";
        accounts.forEach((acc, index) => {
            html += `<div class="account-card">
                        <strong>#${index + 1} - ${acc.name}</strong><br>
                        প্যাকেজ: ${acc.tier}<br>
                        সময়: ${acc.date}
                     </div>`;
        });

        box.innerHTML = html;
    }
</script>

</body>
</html>
