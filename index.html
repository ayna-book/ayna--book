:root{
  --bg:#050816;
  --surface:#0d1227;
  --surface-2:#151a36;
  --line:rgba(255,255,255,.11);
  --text:#f8fafc;
  --muted:#a7b0c8;
  --gold:#facc15;
  --cyan:#22d3ee;
  --pink:#f472b6;
  --red:#ef4444;
}

*{
  box-sizing:border-box
}

html{
  background:#02030a;
  color:var(--text);
  font-family:"Hind Siliguri",system-ui,sans-serif
}

body{
  margin:0;
  min-width:0
}

button,input,textarea,select{
  font:inherit
}

button{
  cursor:pointer
}

.app-shell{
  min-height:100vh;
  background:radial-gradient(circle at 50% -100px,#202a62 0,transparent 55%),#02030a;
  padding:var(--safe-area-inset-top) 0 0;
  display:flex;
  justify-content:center
}

.phone-frame{
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:linear-gradient(180deg,#071024 0,#050816 42%,#03040c 100%);
  position:relative;
  overflow-x:clip;
  box-shadow:0 0 80px rgba(0,0,0,.7);
  padding-bottom:86px
}

.topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:30;
  background:linear-gradient(120deg,#081b45,#33154d 52%,#07132e);
  border-bottom:1px solid var(--line);
  padding:14px 15px 0
}

.brand-row{
  display:flex;
  align-items:center;
  gap:10px
}

.logo{
  width:44px;
  height:44px;
  border-radius:50%;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  background:conic-gradient(from 200deg,#facc15,#f472b6,#22d3ee,#facc15);
  color:#071024;
  font-family:Outfit,sans-serif;
  font-weight:800;
  font-size:18px;
  box-shadow:0 0 0 3px #071024,0 0 0 4px #facc15
}

.brand-copy{
  min-width:0;
  flex:1
}

.brand-copy h1{
  font-family:Outfit,sans-serif;
  font-size:18px;
  line-height:1.05;
  margin:0;
  letter-spacing:.02em;
  background:linear-gradient(90deg,#fde68a,#f472b6,#67e8f9);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

.brand-copy h1 span{
  color:#facc15;
  -webkit-text-fill-color:#facc15
}

.brand-copy p{
  margin:4px 0 0;
  font-size:10px;
  color:#c8d0e4;
  line-height:1.25
}

.header-icons{
  display:flex;
  gap:5px
}

.header-icons button{
  width:34px;
  height:34px;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.08);
  border-radius:50%;
  color:#fff;
  display:grid;
  place-items:center;
  position:relative
}

.msg-btn b{
  position:absolute;
  top:-4px;
  right:-3px;
  background:#ef4444;
  border:2px solid #1a0b2d;
  width:18px;
  height:18px;
  border-radius:50%;
  font-size:10px;
  display:grid;
  place-items:center
}

.tabs{
  display:flex;
  gap:6px;
  margin-top:14px;
  padding-bottom:10px
}

.tabs button{
  border:0;
  background:rgba(255,255,255,.06);
  color:#b8c0d8;
  border-radius:999px;
  padding:8px 11px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap
}

.tabs button.active{
  background:linear-gradient(90deg,#facc15,#f472b6);
  color:#111827
}

main{
  padding:14px 13px 8px
}

.hero{
  border-radius:22px;
  padding:18px;
  background:linear-gradient(135deg,rgba(250,204,21,.18),rgba(244,114,182,.17) 50%,rgba(34,211,238,.18)),#111737;
  border:1px solid rgba(250,204,21,.25);
  box-shadow:0 18px 45px rgba(0,0,0,.28);
  overflow:hidden;
  position:relative
}

.hero-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#fde68a;
  font-size:11px;
  font-weight:700
}

.hero-top span{
  display:flex;
  gap:5px;
  align-items:center
}

.pill-live{
  color:#fda4af!important;
  border:1px solid rgba(239,68,68,.45);
  padding:4px 7px;
  border-radius:999px;
  background:rgba(239,68,68,.1)
}

.hero h2{
  font-family:Outfit,sans-serif;
  font-size:29px;
  line-height:1.04;
  margin:14px 0 7px;
  letter-spacing:-.02em
}

.hero h2 em{
  font-style:normal;
  color:var(--gold);
  text-shadow:0 0 28px rgba(250,204,21,.35)
}

.hero p{
  color:#cbd5e1;
  font-size:13px;
  line-height:1.5;
  margin:0
}

.hero-actions{
  display:flex;
  gap:8px;
  margin-top:16px
}

.cta{
  flex:1;
  border:0;
  border-radius:12px;
  padding:12px 10px;
  background:linear-gradient(90deg,#facc15,#fb7185);
  color:#111827;
  font-weight:700;
  font-size:12px;
  line-height:1.35;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  box-shadow:0 8px 24px rgba(251,113,133,.3)
}

.hero-ghost{
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);
  color:#fff;
  border-radius:12px;
  padding:0 13px;
  display:flex;
  align-items:center;
  gap:5px;
  font-weight:600
}

.hero-meta{
  display:flex;
  align-items:center;
  gap:9px;
  color:#9aa5c0;
  font-size:11px;
  margin-top:15px
}

.hero-meta b{
  color:#fff
}

.hero-meta i{
  width:1px;
  height:14px;
  background:rgba(255,255,255,.2)
}

.studio{
  margin-top:16px;
  border:1px solid var(--line);
  border-radius:22px;
  background:#0b1129;
  padding:14px;
  box-shadow:0 12px 32px rgba(0,0,0,.25)
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.section-head h3{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:19px;
  margin:3px 0 0
}

.eyebrow{
  font-family:Outfit,sans-serif;
  color:var(--cyan);
  font-size:10px;
  letter-spacing:.18em;
  font-weight:800
}

.studio-status{
  font-size:10px;
  font-weight:800;
  letter-spacing:.08em;
  display:flex;
  gap:6px;
  align-items:center;
  color:#94a3b8
}

.studio-status span{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#64748b
}

.studio-status.on{
  color:#fda4af
}

.studio-status.on span{
  background:#ef4444;
  box-shadow:0 0 0 4px rgba(239,68,68,.2);
  animation:pulse 1s infinite
}

.mode-pills{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
  margin:14px 0
}

.mode-pills button{
  border:1px solid var(--line);
  background:#151a36;
  color:#cbd5e1;
  border-radius:12px;
  padding:9px 4px;
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px
}

.mode-pills button span{
  width:18px;
  height:18px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  display:grid;
  place-items:center;
  font-size:10px
}

.mode-pills button.selected{
  background:linear-gradient(90deg,#db2777,#7c3aed);
  color:#fff;
  border-color:transparent;
  box-shadow:0 6px 18px rgba(219,39,119,.35)
}

.video-stage,.audio-stage,.chat-stage{
  animation:fade .2s ease
}

.preview{
  height:238px;
  border-radius:18px;
  position:relative;
  overflow:hidden;
  background:radial-gradient(circle at 50% 30%,#263168,#080c21 65%);
  border:1px solid rgba(255,255,255,.12);
  transition:.3s
}

.preview.filtered{
  filter:saturate(1.5) contrast(1.1) hue-rotate(18deg)
}

.preview.flipped .preview-center{
  transform:scaleX(-1)
}

.preview-grid{
  position:absolute;
  inset:0;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:32px 32px;
  opacity:.6
}

.preview-center{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-align:center
}

.big-avatar{
  width:78px;
  height:78px;
  border-radius:50%;
  background:linear-gradient(135deg,#facc15,#f472b6,#22d3ee);
  display:grid;
  place-items:center;
  color:#111827;
  font-family:Outfit,sans-serif;
  font-size:25px;
  font-weight:800;
  border:4px solid rgba(255,255,255,.24);
  box-shadow:0 0 45px rgba(34,211,238,.28)
}

.preview-center strong{
  font-size:16px
}

.preview-center small,.preview-center p{
  color:#cbd5e1;
  font-size:12px
}

.live-badge{
  position:absolute;
  left:12px;
  top:12px;
  background:#ef4444;
  color:white;
  border-radius:7px;
  padding:5px 8px;
  font-size:11px;
  font-weight:800;
  display:flex;
  gap:5px;
  align-items:center;
  letter-spacing:.08em
}

.live-badge span{
  width:7px;
  height:7px;
  background:#fff;
  border-radius:50%;
  animation:pulse 1s infinite
}

.viewer-chip{
  position:absolute;
  right:12px;
  top:12px;
  background:rgba(0,0,0,.55);
  border-radius:999px;
  padding:5px 8px;
  font-size:11px;
  display:flex;
  gap:5px;
  align-items:center
}

.duration{
  position:absolute;
  bottom:12px;
  left:12px;
  background:rgba(0,0,0,.6);
  padding:6px 9px;
  border-radius:7px;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  font-size:13px
}

.quality-tag{
  position:absolute;
  right:12px;
  bottom:12px;
  background:rgba(250,204,21,.9);
  color:#111827;
  border-radius:6px;
  padding:5px 7px;
  font-size:10px;
  font-weight:800
}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:10px
}

.controls button{
  border:1px solid var(--line);
  background:#151a36;
  color:#e2e8f0;
  border-radius:13px;
  padding:10px 3px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px
}

.controls button small{
  font-size:10px;
  line-height:1.2;
  color:#b7c0d5
}

.controls button.on{
  border-color:#22d3ee;
  color:#67e8f9;
  background:rgba(34,211,238,.1)
}

.controls button.off{
  color:#fda4af
}

.go-live{
  width:100%;
  border:0;
  border-radius:13px;
  background:linear-gradient(90deg,#dc2626,#ef4444);
  color:white;
  font-weight:800;
  font-size:16px;
  padding:13px;
  margin-top:10px;
  box-shadow:0 8px 22px rgba(239,68,68,.28)
}

.go-live.stop{
  background:#334155;
  box-shadow:none
}

.live-note{
  text-align:center;
  color:#94a3b8;
  font-size:11px;
  margin:8px 0 0
}

.audio-stage{
  text-align:center;
  padding:8px 3px 2px
}

.audio-visual{
  height:180px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:18px;
  background:radial-gradient(circle,#2c1850,#0a0f25 70%)
}

.pulse-ring{
  position:absolute;
  border:1px solid rgba(244,114,182,.45);
  border-radius:50%;
  animation:ping 2s infinite
}

.r1{
  width:130px;
  height:130px
}

.r2{
  width:170px;
  height:170px;
  animation-delay:.6s
}

.audio-avatar{
  width:72px;
  height:72px;
  border-radius:50%;
  background:linear-gradient(135deg,#f472b6,#7c3aed);
  display:grid;
  place-items:center;
  font-family:Outfit,sans-serif;
  font-size:23px;
  font-weight:800;
  z-index:2;
  border:4px solid rgba(255,255,255,.2)
}

.eq{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:4px;
  padding:0 18px
}

.eq i{
  display:block;
  width:7px;
  border-radius:4px 4px 0 0;
  background:linear-gradient(180deg,#facc15,#f472b6,#22d3ee);
  transition:height .3s;
  animation:eq 0.7s ease-in-out infinite alternate
}

.audio-stage h4{
  font-size:17px;
  margin:14px 0 3px
}

.audio-stage p{
  color:#94a3b8;
  font-size:12px;
  margin:0
}

.audio-controls{
  display:flex;
  gap:8px;
  margin-top:13px
}

.audio-controls button{
  flex:1;
  border:1px solid var(--line);
  background:#151a36;
  color:#fff;
  border-radius:11px;
  padding:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-weight:600
}

.audio-controls button.on{
  color:#67e8f9;
  border-color:#22d3ee
}

.toggle-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:13px 2px 3px
}

.toggle-row span{
  display:flex;
  gap:7px;
  align-items:center;
  font-size:13px
}

.switch{
  width:44px;
  height:25px;
  border:0;
  border-radius:999px;
  background:#334155;
  position:relative;
  padding:2px
}

.switch i{
  position:absolute;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#fff;
  left:2px;
  top:2px;
  transition:.2s
}

.switch.on{
  background:#22d3ee
}

.switch.on i{
  left:21px
}

.chat-stage{
  position:relative
}

.mini-preview{
  height:88px;
  border-radius:15px;
  background:linear-gradient(90deg,#1e2952,#351a58);
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  position:relative;
  overflow:hidden
}

.mini-avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#facc15,#f472b6);
  color:#111827;
  font-weight:800
}

.mini-preview strong{
  display:block;
  font-size:13px
}

.mini-preview span{
  font-size:11px;
  color:#aeb8d0
}

.mini-live{
  margin-left:auto;
  background:#ef4444;
  border-radius:6px;
  padding:4px 6px;
  font-size:10px;
  font-weight:800;
  display:flex;
  gap:4px;
  align-items:center
}

.mini-live i{
  width:6px;
  height:6px;
  background:#fff;
  border-radius:50%
}

.mini-view{
  position:absolute;
  bottom:8px;
  right:10px;
  font-size:10px;
  display:flex;
  gap:4px;
  align-items:center;
  color:#cbd5e1
}

.chat-list{
  height:192px;
  overflow-y:auto;
  padding:10px 2px;
  display:flex;
  flex-direction:column;
  gap:10px
}

.comment{
  display:flex;
  gap:8px;
  align-items:flex-start;
  animation:fade .2s
}

.c-avatar{
  width:30px;
  height:30px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#111827;
  font-weight:800;
  flex:0 0 auto;
  font-size:14px
}

.comment b{
  font-size:12px
}

.comment p{
  margin:1px 0 0;
  font-size:13px;
  color:#dbe2ef
}

.chat-actions{
  display:flex;
  gap:7px;
  margin-top:4px
}

.heart-btn,.gift-btn{
  border:1px solid var(--line);
  background:#151a36;
  color:#fff;
  border-radius:11px;
  padding:9px 11px;
  display:flex;
  align-items:center;
  gap:5px;
  font-weight:700
}

.heart-btn{
  color:#fb7185
}

.go-mini{
  flex:1;
  border:0;
  border-radius:11px;
  background:#ef4444;
  color:#fff;
  font-weight:800
}

.chat-input-row{
  display:flex;
  gap:7px;
  margin-top:9px
}

.chat-input-row input{
  flex:1;
  border:1px solid var(--line);
  background:#090f24;
  border-radius:999px;
  padding:11px 14px;
  color:#fff;
  outline:none;
  min-width:0
}

.chat-input-row input:focus{
  border-color:#22d3ee
}

.chat-input-row button{
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:linear-gradient(135deg,#db2777,#7c3aed);
  color:#fff;
  display:grid;
  place-items:center
}

.hearts-layer{
  position:absolute;
  right:5px;
  bottom:58px;
  pointer-events:none
}

.float-heart{
  position:absolute;
  animation:rise 1.4s ease-out forwards;
  font-size:22px
}

.composer{
  margin-top:14px;
  background:#0d1227;
  border:1px solid var(--line);
  border-radius:18px;
  padding:13px
}

.composer-top{
  display:flex;
  gap:9px
}

.mini-logo{
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(135deg,#facc15,#f472b6);
  color:#111827;
  display:grid;
  place-items:center;
  font-weight:800;
  flex:0 0 auto
}

.composer textarea{
  flex:1;
  border:0;
  background:transparent;
  color:#fff;
  outline:none;
  resize:none;
  height:62px;
  line-height:1.45;
  font-size:13px;
  min-width:0
}

.composer textarea::-moz-placeholder{
  color:#8d99b6
}

.composer textarea::placeholder{
  color:#8d99b6
}

.composer-btns{
  display:flex;
  flex-wrap:wrap;
  gap:6px;

  padding-top:11px
}

.composer-btns button{
  border:1px solid var(--line);
  background:#151a36;
  color:#cbd5e1;
  border-radius:999px;
  padding:8px 10px;
  display:flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:700
}

.composer-btns .live-btn{
  color:#fda4af;
  border-color:rgba(239,68,68,.4);
  background:rgba(239,68,68,.12)
}

.composer-btns .post-btn{
  margin-left:auto;
  background:linear-gradient(90deg,#facc15,#f472b6);
  color:#111827;
  border:0
}

.post-status{
  margin:9px 0 0;
  color:#86efac;
  font-size:12px
}

.settings{
  margin-top:14px;
  background:#0d1227;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px
}

.section-head.small h3{
  font-size:16px
}

.section-head.small span{
  color:#8d99b6;
  font-size:11px
}

.settings label{
  display:block;
  margin-top:13px;
  color:#cbd5e1;
  font-size:12px;
  font-weight:600
}

.settings input,.select-wrap{
  width:100%;
  margin-top:7px;
  border:1px solid var(--line);
  background:#090f24;
  color:#fff;
  border-radius:11px;
  padding:11px 12px;
  outline:none
}

.settings input:focus,.select-wrap:focus-within{
  border-color:#22d3ee
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.select-wrap{
  padding:0;
  display:flex;
  align-items:center
}

.select-wrap select{
  flex:1;
  background:transparent;
  border:0;
  color:#fff;
  outline:none;
  padding:11px 10px;

     -moz-appearance:none;
          appearance:none;
  min-width:0
}

.select-wrap select option{
  color:#111
}

.select-wrap svg{
  margin-right:8px;
  color:#94a3b8;
  transform:rotate(90deg)
}

.setting-summary{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:14px;
  background:#151a36;
  border-radius:12px;
  padding:11px
}

.setting-summary>div{
  flex:1
}

.setting-summary b{
  display:block;
  font-size:13px
}

.setting-summary span{
  font-size:11px;
  color:#94a3b8
}

.setting-summary .ready{
  color:#86efac;
  background:rgba(34,197,94,.14);
  padding:5px 8px;
  border-radius:999px;
  font-size:11px
}

.quick-strip{
  margin-top:14px;
  display:grid;
  gap:8px
}

.quick-strip button{
  border:1px solid var(--line);
  background:#0d1227;
  border-radius:14px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  color:#fff;
  text-align:left;
  width:100%
}

.quick-strip button>svg{
  color:var(--cyan)
}

.quick-strip button span{
  flex:1
}

.quick-strip b{
  display:block;
  font-size:13px
}

.quick-strip small{
  color:#94a3b8;
  font-size:11px
}

.footer-note{
  text-align:center;
  color:#68728c;
  font-size:11px;
  margin:16px 0 8px
}

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:430px;
  z-index:40;
  background:rgba(6,9,23,.96);
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(7,1fr);
  padding:7px 3px calc(8px + var(--safe-area-inset-bottom));
  backdrop-filter:blur(10px)
}

.bottom-nav button{
  position:relative;
  border:0;
  background:transparent;
  color:#8b96b1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  font-size:9px;
  font-weight:600;
  padding:3px 0
}

.bottom-nav button.active{
  color:#facc15
}

.bottom-nav button.active:after{
  content:"";
  width:18px;
  height:3px;
  border-radius:3px;
  background:#facc15
}

.bottom-nav b{
  position:absolute;
  top:-1px;
  right:2px;
  background:#ef4444;
  color:#fff;
  border-radius:50%;
  width:14px;
  height:14px;
  font-size:8px;
  display:grid;
  place-items:center
}

.toast{
  position:fixed;
  left:50%;
  bottom:96px;
  transform:translateX(-50%);
  z-index:60;
  background:#f8fafc;
  color:#111827;
  border-radius:999px;
  padding:10px 14px;
  font-size:12px;
  font-weight:700;
  box-shadow:0 12px 30px rgba(0,0,0,.45);
  max-width:calc(100vw - 32px);
  text-align:center
}

@keyframes pulse{
  0%{
    opacity:1
  }

  50%{
    opacity:.35
  }

  100%{
    opacity:1
  }
}

@keyframes ping{
  0%{
    transform:scale(.7);
    opacity:.9
  }

  100%{
    transform:scale(1.2);
    opacity:0
  }
}

@keyframes eq{
  from{
    transform:scaleY(.65)
  }

  to{
    transform:scaleY(1)
  }
}

@keyframes rise{
  from{
    transform:translateY(0) scale(.8);
    opacity:1
  }

  to{
    transform:translateY(-100px) scale(1.3);
    opacity:0
  }
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(3px)
  }

  to{
    opacity:1;
    transform:none
  }
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#050816;
    --text:#f8fafc
  }
}

@media (max-width:390px){
  .brand-copy h1{
    font-size:16px
  }

  .hero h2{
    font-size:27px
  }

  .tabs button{
    padding:8px 9px;
    font-size:11px
  }

  .hero-actions{
    flex-direction:column
  }

  .hero-ghost{
    justify-content:center;
    padding:11px
  }

  .mode-pills button{
    font-size:11px
  }

  .composer-btns .post-btn{
    margin-left:0
  }

  .bottom-nav button{
    font-size:8px
  }
}
