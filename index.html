*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#020210;
  color:#fff;
  font-family:'Hind Siliguri',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  background-image:
    radial-gradient(circle at 15% 25%,rgba(0,245,255,0.18) 0%,transparent 45%),
    radial-gradient(circle at 85% 75%,rgba(122,0,255,0.18) 0%,transparent 45%),
    radial-gradient(circle at 50% 50%,rgba(0,245,255,0.05) 0%,transparent 70%);
}
.header{
  text-align:center;
  padding:45px 20px 30px;
  position:relative;
}
.header::after{
  content:'';
  position:absolute;
  bottom:0;left:20%;right:20%;
  height:1px;
  background:linear-gradient(90deg,transparent,#00f5ff,transparent);
}
.logo-wrap{position:relative;display:inline-block}
.logo{
  width:120px;height:120px;
  border-radius:28px;
  border:2.5px solid #00f5ff;
  box-shadow:0 0 50px rgba(0,245,255,0.7),0 0 100px rgba(0,245,255,0.3);
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.title{
  font-family:'Orbitron',sans-serif;
  font-size:36px;
  font-weight:900;
  margin-top:18px;
  letter-spacing:4px;
  background:linear-gradient(90deg,#00f5ff,#7a00ff,#00f5ff);
  background-size:200% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 3s linear infinite;
}
@keyframes shine{to{background-position:200% center}}
.subtitle{opacity:0.6;font-size:13px;letter-spacing:3px;margin-top:6px;text-transform:uppercase}
