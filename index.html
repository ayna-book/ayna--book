<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AYNA BOOK</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #000;
      color: #d4af37;
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .splash {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
      padding: 30px;
    }

    .logo {
      width: 100px;
      height: 100px;

      border: 3px solid #d4af37;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
      font-weight: bold;

      margin-bottom: 25px;

      box-shadow:
        0 0 25px rgba(212, 175, 55, 0.35);
    }

    h1 {
      margin: 0;

      font-size: 34px;
      letter-spacing: 3px;

      color: #d4af37;
    }

    .tagline {
      margin-top: 10px;

      color: #aaa;

      font-size: 14px;
    }

    .loader {
      width: 42px;
      height: 42px;

      margin-top: 35px;

      border: 4px solid #333;
      border-top-color: #d4af37;

      border-radius: 50%;

      animation: spin 1s linear infinite;
    }

    @keyframes spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }

    #status {
      margin-top: 20px;

      color: #aaa;

      font-size: 14px;

      line-height: 1.5;
    }

    #errorBox {
      display: none;

      width: 100%;

      margin-top: 20px;

      padding: 15px;

      border: 1px solid #8b0000;

      border-radius: 8px;

      background: #160000;

      color: #ff6b6b;

      font-size: 14px;

      line-height: 1.5;
    }

    #retryButton {
      display: none;

      margin-top: 15px;

      padding: 12px 25px;

      border: 1px solid #d4af37;

      border-radius: 6px;

      background: #d4af37;

      color: #000;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;
    }

    #retryButton:hover {
      background: #f0cf68;
    }

  </style>

</head>


<body>

  <main class="splash">

    <div class="logo">
      AB
    </div>

    <h1>
      AYNA BOOK
    </h1>

    <div class="tagline">
      Global Social Platform
    </div>

    <div
      id="loader"
      class="loader">
    </div>

    <div id="status">
      Starting secure platform...
    </div>

    <div id="errorBox">
    </div>

    <button
      id="retryButton"
      type="button">
      Retry
    </button>

  </main>


  <script type="module">

    import {
      getCurrentUser,
      observeAuthState
    } from "./auth.js";


    const status =
      document.getElementById("status");

    const loader =
      document.getElementById("loader");

    const errorBox =
      document.getElementById("errorBox");

    const retryButton =
      document.getElementById("retryButton");


    let finished = false;


    // =====================================================
    // SHOW ERROR
    // =====================================================

    function showError(message) {

      if (finished) {
        return;
      }

      loader.style.display = "none";

      status.textContent =
        "Unable to start AYNA BOOK.";

      errorBox.textContent =
        message;

      errorBox.style.display =
        "block";

      retryButton.style.display =
        "inline-block";
    }


    // =====================================================
    // NAVIGATION
    // =====================================================

    function goTo(page) {

      if (finished) {
        return;
      }

      finished = true;

      window.location.replace(page);
    }


    // =====================================================
    // RETRY
    // =====================================================

    retryButton.addEventListener(
      "click",
      function () {

        window.location.reload();

      }
    );


    // =====================================================
    // STARTUP TIMEOUT
    // =====================================================

    const timeout =
      setTimeout(
        function () {

          showError(
            "AYNA BOOK is taking too long to start. Please check your internet connection and try again."
          );

        },
        8000
      );


    // =====================================================
    // FIREBASE AUTH STATE
    // =====================================================

    try {

      status.textContent =
        "Checking secure account...";


      observeAuthState(
        async function (user) {

          if (finished) {
            return;
          }

          clearTimeout(timeout);


          // =================================================
          // NO USER
          // =================================================

          if (!user) {

            status.textContent =
              "Opening Sign In...";

            setTimeout(
              function () {

                goTo("login.html");

              },
              300
            );

            return;
          }


          // =================================================
          // USER EXISTS
          // =================================================

          status.textContent =
            "Checking email verification...";


          try {

            await user.reload();

          } catch (error) {

            console.error(
              "User reload error:",
              error
            );

          }


          const currentUser =
            getCurrentUser();


          // =================================================
          // EMAIL NOT VERIFIED
          // =================================================

          if (
            currentUser &&
            !currentUser.emailVerified
          ) {

            status.textContent =
              "Email verification required...";

            setTimeout(
              function () {

                goTo(
                  "verify-email.html"
                );

              },
              300
            );

            return;
          }


          // =================================================
          // VERIFIED USER
          // =================================================

          status.textContent =
            "Opening AYNA BOOK...";


          setTimeout(
            function () {

              goTo("home.html");

            },
            300
          );

        }
      );


    } catch (error) {

      clearTimeout(timeout);

      console.error(
        "AYNA BOOK Startup Error:",
        error
      );

      showError(
        "Firebase could not be initialized. Please check your Firebase configuration and internet connection."
      );

    }

  </script>

</body>
</html>
