JavaScript

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 sendPasswordResetEmail,
 updateProfile,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 setDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAIW4FK9Il2yct-tOSCKuSodso8KN2UsTA",
 authDomain:"ayna-book.firebaseapp.com",
 databaseURL:"https://ayna-book-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"ayna-book",
 storageBucket:"ayna-book.firebasestorage.app",
 messagingSenderId:"805601138500",
 appId:"1:805601138500:web:81a9adacbedbc5f3626911",
 measurementId:"G-JWBYNXSBMZ"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const authScreen=document.getElementById("authScreen");
const dashboard=document.getElementById("dashboard");
const message=document.getElementById("message");

function say(text){
 message.textContent=text;
}

function errorText(error){
 const errors={
 "auth/email-already-in-use":"এই Gmail দিয়ে আগে অ্যাকাউন্ট তৈরি হয়েছে।",
 "auth/invalid-email":"সঠিক Gmail লিখুন।",
 "auth/weak-password":"পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।",
 "auth/invalid-credential":"Gmail অথবা পাসওয়ার্ড সঠিক নয়।",
 "auth/user-not-found":"অ্যাকাউন্ট পাওয়া যায়নি।",
 "auth/network-request-failed":"ইন্টারনেট পরীক্ষা করুন।",
 "auth/too-many-requests":"কিছুক্ষণ পরে চেষ্টা করুন।",
 "auth/operation-not-allowed":"Firebase Email/Password চালু করুন।"
 };
 return errors[error.code]||error.message||"সমস্যা হয়েছে।";
}

/* PASSWORD SHOW */
document.querySelectorAll("[data-eye]").forEach(button=>{
 button.addEventListener("click",()=>{
  const input=document.getElementById(button.dataset.eye);
  const showing=input.type==="password";
  input.type=showing?"text":"password";
  button.textContent=showing?"🙈":"👁";
 });
});

/* REGISTRATION */
document.getElementById("registerForm").addEventListener("submit",async event=>{
 event.preventDefault();

 const button=document.getElementById("registerBtn");
 const name=document.getElementById("name").value.trim();
 const phone=document.getElementById("phone").value.trim();
 const email=document.getElementById("regEmail").value.trim();
 const password=document.getElementById("regPass").value;
 const confirm=document.getElementById("confirmPass").value;

 if(password!==confirm){
  say("দুটি পাসওয়ার্ড এক নয়।");
  return;
 }

 button.disabled=true;
 say("অ্যাকাউন্ট তৈরি হচ্ছে...");

 try{
  const result=await createUserWithEmailAndPassword(auth,email,password);
  await updateProfile(result.user,{displayName:name});

  try{
   await setDoc(doc(db,"users",result.user.uid),{
    uid:result.user.uid,
    name:name,
    phone:phone,
    email:email,
    createdAt:serverTimestamp()
   });
  }catch(dbError){
   console.error(dbError);
   say("অ্যাকাউন্ট তৈরি হয়েছে, কিন্তু প্রোফাইল সংরক্ষণ হয়নি।");
  }

  say("AYNA BOOK অ্যাকাউন্ট তৈরি হয়েছে!");
 }catch(error){
  say(errorText(error));
 }finally{
  button.disabled=false;
 }
});

/* LOGIN */
document.getElementById("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();

 const button=document.getElementById("loginBtn");
 const email=document.getElementById("loginEmail").value.trim();
 const password=document.getElementById("loginPass").value;

 button.disabled=true;
 say("লগইন হচ্ছে...");

 try{
  await signInWithEmailAndPassword(auth,email,password);
  say("লগইন সফল হয়েছে!");
 }catch(error){
  say(errorText(error));
 }finally{
  button.disabled=false;
 }
});

/* PASSWORD RESET */
document.getElementById("forgotBtn").addEventListener("click",async()=>{
 const email=document.getElementById("loginEmail").value.trim();

 if(!email){
  say("প্রথমে লগইন ঘরে Gmail লিখুন।");
  return;
 }

 try{
  await sendPasswordResetEmail(auth,email);
  say("Gmail-এ Password Reset Link পাঠানো হয়েছে।");
 }catch(error){
  say(errorText(error));
 }
});

/* CLEAR FORM */
document.getElementById("clearBtn").addEventListener("click",()=>{
 document.getElementById("registerForm").reset();
 document.getElementById("loginForm").reset();
 say("ফর্ম পরিষ্কার হয়েছে।");
});

/* LOGOUT */
document.getElementById("logoutBtn").addEventListener("click",async()=>{
 try{
  await signOut(auth);
 }catch(error){
  say(errorText(error));
 }
});

/* AUTH STATE */
onAuthStateChanged(auth,user=>{
 if(user){
  authScreen.classList.add("hidden");
  dashboard.classList.remove("hidden");

  document.getElementById("profileName").textContent=
   user.displayName||"AYNA BOOK USER";

  document.getElementById("profileEmail").textContent=
   user.email||"";
 }else{
  dashboard.classList.add("hidden");
  authScreen.classList.remove("hidden");
 }
});
</script>
</body>
</html>
