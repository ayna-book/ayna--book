<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYNA BOOK - Global Cloud Hub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root{--bg:#070a13;--card:#111625;--cyan:#00ffcc;--blue:#2563eb;--border:#1f2937;--green:#10b981}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:var(--bg);color:#fff;display:flex;justify-content:center}
.app{width:100%;max-width:500px;background:var(--bg);min-height:100vh;padding-bottom:80px;position:relative}
.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:var(--card);border-bottom:1px solid var(--border)}
.logo-area{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:50%;border:2px solid var(--cyan);background:radial-gradient(circle,#2563eb,#070a13);display:flex;align-items:center;justify-content:center;animation:rotate1min 60s linear infinite}
@keyframes rotate1min{0%{transform:rotate(0deg)}2%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
.logo i{color:var(--cyan);font-size:18px}
.title{color:var(--cyan);font-weight:800;letter-spacing:1px;font-size:14px}
.content{padding:12px;display:flex;flex-direction:column;gap:12px}
.card{border:2px solid var(--cyan);border-radius:14px;padding:14px;background:var(--card)}
input,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--border);background:#070a
