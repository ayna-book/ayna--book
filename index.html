<!DOCTYPE html><html lang="bn"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {

</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AYNA BOOK ★ - All In One</title>
<style>*{box-sizing:border-box}body{margin:0;background:#050a18;color:#fff;font-family:Arial,"Noto Sans Bengali",sans-serif;font-size:30px;line-height:1.5;padding:16px}
.logo{color:#fff6b3;text-align:center;font-size:72px;font-weight:1000}h1{color:#fff6b3;text-align:center;font-size:52px}
.tabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.tab{background:#050b1c;color:#fff;border:3px solid #ffe64d;border-radius:10px;padding:14px 18px;font-size:28px;cursor:pointer}.tab.active{background:#ffe64d;color:#050a18;font-weight:1000}
.box{background:linear-gradient(155deg,#1a3575,#08122b);border:4px solid #ffe64d;border-radius:16px;padding:20px;margin:16px 0;text-align:center}
input,select{width:100%;background:#050b1c;color:#fff;border:3px solid #ffe64d;border-radius:10px;padding:16px;font-size:30px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:#050b1c;border:3px solid #ffe64d;border-radius:12px;padding:16px}.b{color:#fff6b3;font-weight:1000;font-size:34px}.m{color:#e6eeff}.btn{display:inline-block;background:#ffe64d;color:#050a18;font-weight:1000;padding:10px 18px;border-radius:8px;text-decoration:none;margin:6px}
iframe{width:100%;height:80vh;border:4px solid #ffe64d;border-radius:12px;background:#fff}
</style></head><body>
<div class="logo">AYNA BOOK ★</div><h1>সব একসাথে • All In One • আজীবন অটো-আপডেট ♾️</h1>
<div class="box"><b>অটো-আপডেট: আজীবন চালু ♾️</b> • শেষ আপডেট: <span id="last">এখন</span> • <button class="btn" onclick="autoUpdate(true)" style="border:0;cursor:pointer">🔄 এখনই অটো-আপডেট</button><br><span style="font-size:26px">ব্যক্তিগত ফোন/জিমেইল/ছবি কোথাও দেওয়া হয় না — শুধু অফিসিয়াল ওয়েবসাইট / অফিসিয়াল যোগাযোগ।</span></div>
<div class="tabs" id="tabs"></div>
<div id="content"></div>
<script>
const MODULES=[
{id:"home",label:"🏠 হোম / AYNA BOOK"},
{id:"leader",label:"🌍 ১৯৫ নেতা",file:"world-leader.html"},
{id:"grocery",label:"🛒 মুদি দাম",file:"world-grocery.html"},
{id:"farmer",label:"🌾 কৃষক + কীটনাশক",file:"world-farmers.html"},
{id:"mp",label:"🏛️ এমপি",file:"world-mps.html"},
{id:"official",label:"🏢 সরকারি দপ্তর",file:"world-officials.html"},
{id:"transport",label:"🚌🚆 বাস-রেল",file:"world-transport.html"},
{id:"airline",label:"✈️ বিমান",file:"world-airlines.html"},
];
let cur="home";
function show(id){
 cur=id;
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.id===id));
 const c=document.getElementById('content');
 if(id==="home"){
  c.innerHTML=`<div class="box"><h2>🚗 গাড়ির গতি / ✈️ বিমানের গতি + উচ্চতা</h2>
  <div>গাড়ির গতি: <b id="carSpeed">0</b> km/h • ১ ঘণ্টায় দূরত্ব: <b id="carDist">0</b> km</div>
  <div>বিমানের গতি: <b id="airSpeed">0</b> km/h • উচ্চতা: <b id="alt">0</b> ফুট • ১ ঘণ্টায়: <b id="airDist">0</b> km</div>
  <button class="btn" onclick="startSpeed()">▶️ গতি চালু করুন</button><button class="btn" onclick="stopSpeed()">⏹️ বন্ধ</button>
  <div style="font-size:26px">GPS অনুমতি দিলে আসল গতি দেখাবে। না দিলে ডেমো গতি দেখাবে।</div></div>
  <div class="box"><h2>🧭 কম্পাস / রাডার</h2><div id="compass" style="font-size:80px">🧭</div><div>দিক: <span id="dir">—</span></div><button class="btn" onclick="startCompass()">🧭 কম্পাস চালু</button></div>
  <div class="box"><h2>📷 QR কোড</h2><div>AYNA BOOK QR — <a class="btn" href="https://ayna-book.github.io/ayna--book/" target="_blank">🌐 AYNA BOOK খুলুন</a></div><img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https://ayna-book.github.io/ayna--book/" style="background:#fff;padding:10px;border-radius:10px"></div>
  <div class="box"><h2>📻📺 রেডিও / টিভি / ব্রেকিং নিউজ</h2><a class="btn" href="https://www.radio-browser.info" target="_blank">📻 রেডিও</a><a class="btn" href="https://www.youtube.com/results?search_query=live+tv+bangladesh" target="_blank">📺 লাইভ টিভি</a><a class="btn" href="https://www.bbc.com/bengali" target="_blank">📰 ব্রেকিং নিউজ</a></div>
  <div class="grid">${MODULES.slice(1).map(m=>`<div class="card"><div class="b">${m.label}</div><button class="btn" onclick="show('${m.id}')">খুলুন →</button></div>`).join('')}</div>`;
 } else {
  const mod=MODULES.find(m=>m.id===id);
  c.innerHTML=`<div class="box"><b>${mod.label}</b><br><span style="font-size:26px">এই মডিউল একই index-এর ভিতরে খুলছে। আলাদা ফাইল হিসেবেও আছে: ${mod.file}</span><br><a class="btn" href="${mod.file}" target="_blank">🌐 আলাদা ফাইলে খুলুন</a></div><iframe src="${mod.file}"></iframe>`;
 }
 window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('tabs').innerHTML=MODULES.map(m=>`<button class="tab ${m.id==='home'?'active':''}" data-id="${m.id}" onclick="show('${m.id}')">${m.label}</button>`).join('');
let watch=null, demo=null;
function startSpeed(){
 if('geolocation' in navigator){ watch=navigator.geolocation.watchPosition(p=>{const v=(p.coords.speed||0)*3.6; document.getElementById('carSpeed').textContent=v.toFixed(1); document.getElementById('carDist').textContent=v.toFixed(1); document.getElementById('airSpeed').textContent=(v*8).toFixed(0); document.getElementById('airDist').textContent=(v*8).toFixed(0); document.getElementById('alt').textContent=(p.coords.altitude||35000).toFixed(0);}); }
 let s=40; demo=setInterval(()=>{s=40+Math.random()*20; document.getElementById('carSpeed').textContent=s.toFixed(1); document.getElementById('carDist').textContent=s.toFixed(1);},2000);
}
function stopSpeed(){ if(watch!==null) navigator.geolocation.clearWatch(watch); clearInterval(demo); }
function startCompass(){ if('DeviceOrientationEvent' in window){ window.addEventListener('deviceorientation',e=>{document.getElementById('dir').textContent=Math.round(e.alpha||0)+'°';}); } else document.getElementById('dir').textContent='এই ডিভাইসে কম্পাস নেই'; }
function autoUpdate(m){const now=new Date().toLocaleString('bn-BD');localStorage.setItem('ayna_index_last',now);document.getElementById('last').textContent=now;if(m)alert('AYNA BOOK Index — অটো-আপডেট আজীবন চালু ♾️');}
const s=localStorage.getItem('ayna_index_last');if(s)document.getElementById('last').textContent=s;setInterval(()=>autoUpdate(false),6*60*60*1000);
show('home');
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
