<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AYNA BOOK - Login</title>
  <style>
    :root {
      --gold: #facc15;
      --gold-border: #d4af37;
      --bg-dark: #06080d;
      --card-bg: #10141f;
      --input-bg: #181e2e;
      --border-dim: #29324a;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      background: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
    }

    .login-page {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .top-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .top-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border-dim);
      background: #0d111a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      text-decoration: none;
    }

    .top-brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
    }

    .login-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.55);
      border-radius: 16px;
      padding: 26px 20px;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.1);
    }

    .login-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .login-header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #e5e7eb;
      margin-bottom: 7px;
    }

    .input-box {
      width: 100%;
      padding: 13px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border-dim);
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .input-box:focus {
      border-color: var(--gold);
    }

    .password-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .password-row .input-box {
      flex: 1;
    }

    .btn-show {
      padding: 13px 14px;
      background: #1f273b;
      border: 1px solid var(--border-dim);
      border-radius: 8px;
      color: #e5e7eb;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .forgot-wrap {
      text-align: right;
      margin-top: 8px;
    }

    .forgot-wrap a {
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }

    .forgot-wrap a:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: #090b10;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 18px;
      letter-spacing: 0.8px;
    }

    .register-line {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .register-line a {
      color: var(--gold);
      font-weight: 700;
      text-decoration: none;
    }

    .footer-note {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .status-msg {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      min-height: 18px;
    }

    @media (max-width: 520px) {
      .login-page {
        padding: 12px 0 0 0;
        justify-content: flex-start;
      }
      .top-bar {
        padding: 0 14px;
      }
      .login-card {
        max-width: 100%;
        flex: 1;
        border-radius: 16px 16px 0 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
        padding: 26px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="top-bar">
      <a href="dashboard.html" class="top-icon-btn" title="Modules">▦</a>
      <div class="top-brand">AYNA BOOK</div>
      <span class="top-icon-btn" style="color: var(--gold);">★</span>
    </div>

    <div class="login-card">
      <div class="login-header">
        <h1>LOGIN</h1>
        <p>আপনার AYNA BOOK অ্যাকাউন্টে নিরাপদে প্রবেশ করুন।</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Gmail Address</label>
          <input type="email" id="loginEmail" class="input-box" placeholder="example@gmail.com" required />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="password-row">
            <input type="password" id="loginPassword" class="input-box" placeholder="আপনার Password" required />
            <button type="button" class="btn-show" id="togglePassBtn">Show</button>
          </div>
          <div class="forgot-wrap">
            <a href="forgot-password.html">Forgot Password?</a>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">LOGIN</button>
        <div class="status-msg" id="statusMsg"></div>
      </form>

      <div class="register-line">
        নতুন AYNA BOOK অ্যাকাউন্ট তৈরি করতে <a href="signup.html">REGISTER</a>
      </div>

      <div class="footer-note">
        <div>AYNA BOOK - Secure Login</div>
        <div>আপনার Password কারো সাথে শেয়ার করবেন না।</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "ayna-book.firebaseapp.com",
      databaseURL: "https://ayna-book-default-rtdb.firebaseio.com",
      projectId: "ayna-book",
      storageBucket: "ayna-book.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const passInput = document.getElementById("loginPassword");
    const togglePassBtn = document.getElementById("togglePassBtn");
    const loginForm = document.getElementById("loginForm");
    const statusMsg = document.getElementById("statusMsg");
    const loginBtn = document.getElementById("loginBtn");

    togglePassBtn.addEventListener("click", () => {
      const isHidden = passInput.type === "password";
      passInput.type = isHidden ? "text" : "password";
      togglePassBtn.textContent = isHidden ? "Hide" : "Show";
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = passInput.value;

      loginBtn.disabled = true;
      loginBtn.textContent = "LOGGING IN...";
      statusMsg.style.color = "#facc15";
      statusMsg.textContent = "Verifying your credentials...";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        statusMsg.style.color = "#4ade80";
        statusMsg.textContent = "Login successful! Redirecting...";
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      } catch (error) {
        statusMsg.style.color = "#f87171";
        statusMsg.textContent = error.message;
        loginBtn.disabled = false;
        loginBtn.textContent = "LOGIN";
      }
    });
  </script>
</body>
</html>
