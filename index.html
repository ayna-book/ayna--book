
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b49">
  <title>AYNA BOOK</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #071b49;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      max-width: 420px;
      margin: 35px auto;
      padding: 24px;
      border: 1px solid #ffd700;
      border-radius: 18px;
      background: #10285a;
    }
    h1 { color: #ffd700; text-align: center; }
    input, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      border: 0;
      font-size: 16px;
    }
    button {
      background: #ffd700;
      color: #071b49;
      font-weight: bold;
      cursor: pointer;
    }
    #status { overflow-wrap: anywhere; }
  </style>
</head>

<body>
  <div class="card">
    <h1>👁️ AYNA BOOK</h1>
    <p>MY WORLD. MY STORY. MY AYNA BOOK.</p>

    <h3>নতুন অ্যাকাউন্ট</h3>
    <input id="name" placeholder="আপনার নাম">
    <input id="regEmail" type="email" placeholder="Gmail">
    <input id="regPassword" type="password" placeholder="পাসওয়ার্ড">
    <button id="registerBtn">অ্যাকাউন্ট তৈরি</button>

    <hr>

    <h3>লগইন</h3>
    <input id="loginEmail" type="email" placeholder="Gmail">
    <input id="loginPassword" type="password" placeholder="পাসওয়ার্ড">
    <button id="loginBtn">লগইন</button>
    <button id="resetBtn">পাসওয়ার্ড ভুলে গেছেন?</button>
    <button id="logoutBtn">লগআউট</button>

    <p id="status">Firebase সংযোগ প্রস্তুত হচ্ছে...</p>
    <p id="account"></p>
  </div>

  <script type="module">
    import {
      registerUser,
      loginUser,
      logoutUser,
      resetPassword,
      watchAuthState
    } from "./auth.js";

    const $ = id => document.getElementById(id);
    const status = message => $("status").textContent = message;

    $("registerBtn").addEventListener("click", async () => {
      try {
        status("অ্যাকাউন্ট তৈরি হচ্ছে...");
        await registerUser(
          $("name").value,
          $("regEmail").value,
          $("regPassword").value
        );
        status("অ্যাকাউন্ট তৈরি হয়েছে। Gmail যাচাই করুন।");
      } catch (error) {
        status("সমস্যা: " + (error.message || error.code));
      }
    });

    $("loginBtn").addEventListener("click", async () => {
      try {
        status("লগইন হচ্ছে...");
        await loginUser(
          $("loginEmail").value,
          $("loginPassword").value
        );
        status("লগইন সফল!");
      } catch (error) {
        status("লগইন সমস্যা: " + (error.message || error.code));
      }
    });

    $("resetBtn").addEventListener("click", async () => {
      try {
        await resetPassword($("loginEmail").value);
        status("পাসওয়ার্ড রিসেট ইমেইল পাঠানো হয়েছে।");
      } catch (error) {
        status("সমস্যা: " + (error.message || error.code));
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      try {
        await logoutUser();
        status("লগআউট সম্পন্ন হয়েছে।");
      } catch (error) {
        status("সমস্যা: " + (error.message || error.code));
      }
    });

    watchAuthState(user => {
      $("account").textContent = user
        ? "লগইন: " + (user.email || user.uid)
        : "কোনো অ্যাকাউন্ট লগইন করা নেই।";
    });
  </script>
</body>
</html>
