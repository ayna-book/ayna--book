<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AYNA BOOK QUANTUM GLOBAL - Original Core</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #070a13;
            --card-bg: #111625;
            --accent-glow: #00ffcc; /* Quantum Green */
            --accent-blue: #2563eb;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border: #1f2937;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text-primary); display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Main Container for PWA feel */
        .master-app { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 500px; margin: 0 auto; background-color: var(--bg-dark); border-right: 1px solid var(--border); border-left: 1px solid var(--border); position: relative; }

        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: var(--card-bg); border-bottom: 1px solid var(--border); sticky: top; z-index: 100; }
        .top-bar .title { font-size: 18px; font-weight: 800; color: var(--accent-glow); text-transform: uppercase; letter-spacing: 1px; }
        .top-bar .icons i { font-size: 18px; color: var(--text-secondary); margin-left: 15px; cursor: pointer; transition: 0.2s; }
        .top-bar .icons i:hover { color: var(--accent-glow); }

        /* Dashboard Body */
        .content { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 80px; } /* Space for bottom nav */
        
        /* Cards */
        .q-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .q-card-title { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: flex; align-items: center; }
        .q-card-title i { color: var(--accent-blue); margin-right: 8px; font-size: 14px; }
        .q-card-value { font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 5px; }
        
        /* Grid */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        /* Buttons */
        .q-btn { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--accent-blue), #1d4ed8); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(37,99,235,0.2); }
        .q-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(37,99,235,0.4); }
        .q-btn:active { transform: scale(0.97); }
        .q-btn i { margin-right: 8px; font-size: 16px; }
        .q-btn.quantum { background: linear-gradient(135deg, #0f766e, #0d9488); box-shadow: 0 4px 6px rgba(13,148,136,0.2); }
        .q-btn.quantum:hover { background: linear-gradient(135deg, #115e59, #14b8a6); box-shadow: 0 6px 12px rgba(13,148,136,0.4); }

        /* Input Form */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
        .form-control { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background-color: rgba(255,255,255,0.03); color: white; font-size: 14px; }
        .form-control::placeholder { color: #4b5563; }

        /* Terminal Display */
        .q-terminal { font-family: 'Courier New', monospace; font-size: 12px; color: #34d399; background: #020617; border-radius: 8px; border: 1px solid var(--border); border-left: 3px solid var(--accent-glow); padding: 10px; margin-top: 15px; min-height: 80px; max-height: 120px; overflow-y: auto; line-height: 1.5; }

        /* Bottom Nav Bar */
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; background-color: var(--card-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); text-decoration: none; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; transition: 0.2s; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: var(--accent-glow); }
        .nav-item:hover { color: var(--accent-glow); }
    </style>
</head>
<body>

<div class="master-app">
    <!-- Top Bar with Menu & Settings -->
    <div class="top-bar">
        <i class="fas fa-bars icons" style="margin-left:0;" onclick="toggleMenu('menu')"></i>
        <div class="title">AYNA BOOK QUANTUM</div>
        <div class="icons">
            <i class="fas fa-search"></i>
            <i class="fas fa-cog" onclick="toggleMenu('settings')"></i>
        </div>
    </div>

    <!-- Dashboard Content -->
    <div class="content" id="main-content">
        <!-- System Status Card -->
        <div class="q-card">
            <div class="q-card-title"><i class="fas fa-microchip"></i>কোয়ান্টাম সিস্টেম স্ট্যাটাস</div>
            <div class="q-card-value" style="color:var(--accent-glow);">লাইভ সক্রিয় (LIVE)</div>
            <div style="font-size: 11px; color:var(--text-secondary);">সার্ভার সিঙ্ক: সারা বিশ্বে সংযুক্ত ✅</div>
        </div>

        <!-- Create Account Form -->
        <div class="q-card">
            <div class="q-card-title"><i class="fas fa-user-plus"></i>নতুন অ্যাকাউন্ট রেজিস্ট্রেশন</div>
            <div class="form-group">
                <label>ব্যবহারকারীর নাম</label>
                <input type="text" id="accName" class="form-control" placeholder="আপনার নাম লিখুন">
            </div>
            <div class="form-group">
                <label>অ্যাকাউন্টের ধরন</label>
                <select id="accTier" class="form-control" style="background-color:var(--bg-dark); cursor:pointer;">
                    <option value="Personal">১. Personal (Free)</option>
                    <option value="Business ($10)">২. Business ($10)</option>
                    <option value="VIP ($10)">৩. VIP ($10)</option>
                    <option value="VVIP ($20)">৪. VVIP ($20)</option>
                </select>
            </div>
            <button class="q-btn" style="width:100%;" onclick="createAccount()"><i class="fas fa-plus"></i>তৈরি ও সেভ করুন</button>
        </div>

        <!-- Quantum Ops Grid -->
        <div class="grid-2">
            <button class="q-btn quantum" onclick="runOp('compute')"><i class="fas fa-infinity"></i>কোয়ান্টাম কম্পিউট</button>
            <button class="q-btn quantum" onclick="runOp('sync')"><i class="fas fa-globe"></i>গ্লোবাল সিঙ্ক</button>
            <button class="q-btn quantum" onclick="runOp('ai')"><i class="fas fa-brain"></i>AI কোর ২.০</button>
            <button class="q-btn quantum" onclick="runOp('secure')"><i class="fas fa-shield-alt"></i>জিরো-ট্রাস্ট</button>
        </div>

        <!-- Quantum Console -->
        <div class="q-terminal" id="console">
            > AYNA BOOK QUANTUM GLOBAL কোর প্রস্তুত...<br>
            > ব্যবহারকারীর অ্যাকশনের জন্য অপেক্ষা করছে।
        </div>
    </div>

    <!-- Bottom Navigation Bar with Dashboard, Settings, etc. -->
    <div class="bottom-nav">
        <a class="nav-item active" onclick="loadPage('dashboard')">
            <i class="fas fa-chart-line"></i>ড্যাশবোর্ড
        </div>
        <a class="nav-item" onclick="loadPage('accounts')">
            <i class="fas fa-users"></i>অ্যাকাউন্টস
        </div>
        <a class="nav-item" onclick="loadPage('ops')">
            <i class="fas fa-atom"></i>অপস হাব
        </div>
        <a class="nav-item" onclick="loadPage('settings')">
            <i class="fas fa-sliders-h"></i>সেটিংস
        </div>
    </div>
</div>

<script>
    // System Ops Simulator
    function runOp(op) {
        const consoleBox = document.getElementById("console");
        if (op === 'compute') {
            consoleBox.innerHTML = `> [COMPUTE OPERATING]: ৫ কুইবিট কোয়ান্টাম ফেজ সিমুলেশন সফল... ডেটা এনক্রিপ্টেড! ✅`;
        } else if (op === 'sync') {
            consoleBox.innerHTML = `> [GLOBAL SYNCING]: আমেরিকা, ইউরোপ ও এশিয়া সার্ভারে সিঙ্ক্রোনাইজেশন সম্পূর্ণ হয়েছে। 🌐`;
        } else if (op === 'ai') {
            consoleBox.innerHTML = `> [AI CORE RUNNING]: নিউরাল AI ইঞ্জিন ২.০ সক্রিয়। লোকাল ডেটা এনালাইসিস চলছে... 🧠`;
        } else if (op === 'secure') {
            consoleBox.innerHTML = `> [SECURITY CHECK]: জিরো-ট্রাস্ট এনক্রিপশন সক্রিয়। কোনো বাগ বা ঝুঁকি পাওয়া যায়নি! 🛡️`;
        }
    }

    // Create Account and Save to Local Storage
    function createAccount() {
        const name = document.getElementById("accName").value.trim();
        const tier = document.getElementById("accTier").value;
        const consoleBox = document.getElementById("console");

        if (name === "") {
            alert("দয়া করে নাম লিখুন!"); return;
        }

        const newAccount = { name: name, tier: tier, timestamp: new Date().toLocaleString() };

        // Save to localStorage
        let accounts = JSON.parse(localStorage.getItem("ayna_accounts")) || [];
        accounts.push(newAccount);
        localStorage.setItem("ayna_accounts", JSON.stringify(accounts));

        // Display Success and Clear Input
        consoleBox.innerHTML = `> [ACCOUNT CREATED]: "${newAccount.name}" এর জন্য ${newAccount.tier} অ্যাকাউন্ট সফলভাবে লোকাল কোরে সেভ হয়েছে।`;
        document.getElementById("accName").value = "";
    }

    // Navigation and Page Content Management
    function loadPage(page) {
        const contentBox = document.getElementById("main-content");
        
        // Remove active class from all nav items
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        
        // Find and add active class to clicked nav item
        const navItems = document.querySelectorAll('.nav-item');
        if (page === 'dashboard') navItems[0].classList.add('active');
        if (page === 'accounts') navItems[1].classList.add('active');
        if (page === 'ops') navItems[2].classList.add('active');
        if (page === 'settings') navItems[3].classList.add('active');

        // Render Page Content
        if (page === 'dashboard') {
            location.reload(); // Quick way to reload dashboard
        } else if (page === 'accounts') {
            contentBox.innerHTML = `
                <div class="q-card">
                    <div class="q-card-title"><i class="fas fa-users"></i>সংরক্ষিত অ্যাকাউন্টসমূহ</div>
                    <div id="accountList" style="font-size:13px; color:var(--text-secondary); line-height:1.6;">লোডিং হচ্ছে...</div>
                </div>
                <button class="q-btn" style="width:100%;" onclick="loadPage('dashboard')"><i class="fas fa-arrow-left"></i>ফিরে যান</button>
            `;
            displaySavedAccounts();
        } else if (page === 'ops') {
            contentBox.innerHTML = `
                <div class="q-card">
                    <div class="q-card-title"><i class="fas fa-atom"></i>কোয়ান্টাম অপারেশন হাব</div>
                    <p style="font-size:13px; color:var(--text-secondary); margin-bottom:15px;">সরাসরি কোয়ান্টাম প্রসেসরে অপারেশন পরিচালনা করুন।</p>
                    <div class="grid-2">
                        <button class="q-btn quantum" onclick="runOp('compute')"><i class="fas fa-infinity"></i>কোয়ান্টাম কম্পিউট</button>
                        <button class="q-btn quantum" onclick="runOp('sync')"><i class="fas fa-globe"></i>গ্লোবাল সিঙ্ক</button>
                    </div>
                </div>
                <button class="q-btn" style="width:100%;" onclick="loadPage('dashboard')"><i class="fas fa-arrow-left"></i>ফিরে যান</button>
            `;
        } else if (page === 'settings') {
            contentBox.innerHTML = `
                <div class="q-card">
                    <div class="q-card-title"><i class="fas fa-sliders-h"></i>গ্লোবাল সিস্টেম সেটিংস</div>
                    <div class="form-group">
                        <label>সিস্টেম মুড (Quantum Mode)</label>
                        <select class="form-control" style="background-color:var(--bg-dark);">
                            <option>কোয়ান্টাম সক্রিয় (ACTIVE)</option>
                            <option>সিমুলেশন মোড (SIMULATION)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>ডেটা এনক্রিপশন লেভেল</label>
                        <select class="form-control" style="background-color:var(--bg-dark);">
                            <option>কোয়ান্টাম AES-২৫৬ (GLOBAL)</option>
                            <option>লোকাল ২.০ (LOCAL)</option>
                        </select>
                    </div>
                    <button class="q-btn" style="width:100%;" onclick="saveSettings()"><i class="fas fa-save"></i>সেটিংস সেভ করুন</button>
                </div>
                <button class="q-btn" style="width:100%;" onclick="loadPage('dashboard')"><i class="fas fa-arrow-left"></i>ফিরে যান</button>
            `;
        }
    }

    // Function to show saved accounts in Accounts page
    function displaySavedAccounts() {
        const accountBox = document.getElementById("accountList");
        let accounts = JSON.parse(localStorage.getItem("ayna_accounts")) || [];
        if (accounts.length === 0) {
            accountBox.innerHTML = `কোনো অ্যাকাউন্ট এখনো যোগ করা হয়নি।`;
            return;
        }
        let html = "";
        accounts.forEach((acc, index) => {
            html += `<div style="border-bottom: 1px solid var(--border); padding:10px 0;"><strong>#${index+1} - ${acc.name}</strong><br>প্যাকেজ: ${acc.tier}<br>সময়: ${acc.timestamp}</div>`;
        });
        accountBox.innerHTML = html;
    }

    // Placeholder for save settings alert
    function saveSettings() { alert("কোয়ান্টাম সিস্টেম সেটিংস সফলভাবে আপডেট করা হয়েছে!"); }
    
    // Placeholder for top bar menu icons
    function toggleMenu(menu) { alert(`${menu} মেনু সক্রিয় করা হয়েছে (ডেমো)। আসল কানেকশন এপিআই দিয়ে সম্ভব।`); }
</script>

</body>
</html>
