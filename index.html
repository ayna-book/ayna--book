<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0A0F1E"
  >

  <meta
    name="description"
    content="AYNA BOOK — A modern, secure and global digital social platform."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <meta
    name="application-name"
    content="AYNA BOOK"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <title>AYNA BOOK</title>

  <style>

    /* =====================================================
       RESET
       ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    body {

      min-height: 100vh;

      background: #0A0F1E;

      color: #FFFFFF;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow-x: hidden;
    }


    /* =====================================================
       BACKGROUND
       ===================================================== */

    .background {

      position: fixed;

      inset: 0;

      z-index: 0;

      pointer-events: none;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(255, 215, 0, 0.07),
          transparent 38%
        );
    }


    .circle {

      position: absolute;

      width: 280px;
      height: 280px;

      border: 1px solid
        rgba(255, 215, 0, 0.08);

      border-radius: 50%;
    }


    .circle.one {

      top: -150px;
      left: -130px;

      animation:
        rotateOne 25s linear infinite;
    }


    .circle.two {

      right: -150px;
      bottom: -140px;

      animation:
        rotateTwo 30s linear infinite;
    }


    @keyframes rotateOne {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    @keyframes rotateTwo {

      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }
    }


    /* =====================================================
       PAGE
       ===================================================== */

    .page {

      position: relative;

      z-index: 1;

      width: 100%;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;
    }


    /* =====================================================
       CARD
       ===================================================== */

    .card {

      width: 100%;

      max-width: 500px;

      padding: 42px 26px;

      background: #0A0F1E;

      border: 1px solid #FFD700;

      border-radius: 26px;

      text-align: center;

      box-shadow:
        0 0 35px
        rgba(255, 215, 0, 0.08);
    }


    /* =====================================================
       LOGO
       ===================================================== */

    .logo {

      width: 82px;
      height: 82px;

      margin: 0 auto 24px;

      padding: 14px;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 7px;

      border:
        2px solid #FFD700;

      border-radius: 22px;

      box-shadow:
        0 0 22px
        rgba(255, 215, 0, 0.10);
    }


    .logo span {

      display: block;

      background: #FFFFFF;

      border-radius: 5px;
    }


    /* =====================================================
       TITLE
       ===================================================== */

    .title {

      color: #FFFFFF;

      font-size:
        clamp(30px, 8vw, 46px);

      font-weight: 800;

      letter-spacing: 4px;

      line-height: 1.2;

      margin-bottom: 12px;
    }


    .subtitle {

      max-width: 390px;

      margin: 0 auto 25px;

      color: #A9B0BC;

      font-size: 14px;

      line-height: 1.7;
    }


    /* =====================================================
       STAR
       ===================================================== */

    .star {

      width: 16px;
      height: 16px;

      margin:
        0 auto 30px;

      background: #FFFFFF;

      clip-path:
        polygon(
          50% 0%,
          61% 39%,
          100% 50%,
          61% 61%,
          50% 100%,
          39% 61%,
          0% 50%,
          39% 39%
        );

      animation:
        pulseStar 1s ease-in-out infinite;
    }


    @keyframes pulseStar {

      0%,
      100% {

        transform: scale(0.85);

        opacity: 0.55;
      }

      50% {

        transform: scale(1.3);

        opacity: 1;

        filter:
          drop-shadow(
            0 0 8px #FFFFFF
          );
      }
    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    .buttons {

      width: 100%;

      display: grid;

      gap: 14px;
    }


    .button {

      width: 100%;

      min-height: 58px;

      display: flex;

      align-items: center;

      justify-content: center;

      text-decoration: none;

      border-radius: 14px;

      font-size: 16px;

      font-weight: 800;

      letter-spacing: 2px;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }


    .button:active {

      transform: scale(0.97);
    }


    /* LOGIN */

    .login {

      background: #FFFFFF;

      color: #0A0F1E;

      border: 1px solid #FFFFFF;
    }


    .login:hover {

      transform: translateY(-2px);

      box-shadow:
        0 0 25px
        rgba(255, 255, 255, 0.18);
    }


    /* REGISTER */

    .register {

      background: transparent;

      color: #FFFFFF;

      border: 1px solid #FFD700;
    }


    .register:hover {

      transform: translateY(-2px);

      background:
        rgba(255, 215, 0, 0.08);

      box-shadow:
        0 0 25px
        rgba(255, 215, 0, 0.14);
    }


    /* =====================================================
       SECURITY
       ===================================================== */

    .security {

      margin-top: 27px;

      color: #A9B0BC;

      font-size: 12px;

      line-height: 1.7;
    }


    .security strong {

      color: #FFFFFF;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .footer {

      margin-top: 24px;

      color: #687080;

      font-size: 11px;

      line-height: 1.6;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 420px) {

      .page {

        padding: 14px;
      }


      .card {

        padding:
          34px 20px;

        border-radius: 22px;
      }


      .logo {

        width: 72px;
        height: 72px;

        padding: 12px;
      }


      .title {

        font-size: 30px;

        letter-spacing: 3px;
      }


      .subtitle {

        font-size: 13px;
      }


      .button {

        min-height: 56px;
      }

    }

  </style>

</head>


<body>


  <!-- ===================================================
       BACKGROUND
       =================================================== -->

  <div
    class="background"
    aria-hidden="true"
  >

    <div class="circle one"></div>

    <div class="circle two"></div>

  </div>


  <!-- ===================================================
       MAIN
       =================================================== -->

  <main class="page">

    <section
      class="card"
      aria-label="AYNA BOOK"
    >


      <!-- LOGO -->

      <div
        class="logo"
        aria-label="AYNA BOOK logo"
      >

        <span></span>
        <span></span>
        <span></span>
        <span></span>

      </div>


      <!-- TITLE -->

      <h1 class="title">
        AYNA BOOK
      </h1>


      <!-- DESCRIPTION -->

      <p class="subtitle">

        A modern, secure and global
        digital social platform designed
        to connect people, ideas and
        communities.

      </p>


      <!-- STAR -->

      <div
        class="star"
        aria-hidden="true"
      ></div>


      <!-- LOGIN / REGISTER -->

      <div class="buttons">


        <a
          href="./login.html"
          class="button login"
          aria-label="Login to AYNA BOOK"
        >
          LOGIN
        </a>


        <a
          href="./signup.html"
          class="button register"
          aria-label="Register for AYNA BOOK"
        >
          REGISTER
        </a>


      </div>


      <!-- SECURITY -->

      <p class="security">

        <strong>
          Privacy • Security • Global Connectivity
        </strong>

        <br>

        Secure account access powered by
        Firebase Authentication.

      </p>


      <!-- FOOTER -->

      <div class="footer">

        © 2026 AYNA BOOK

        <br>

        Building a future-ready digital world.

      </div>


    </section>

  </main>


  <!--
    Service Worker ইচ্ছাকৃতভাবে এখানে
    register করা হয়নি।

    প্রথমে index.html ঠিকভাবে দেখা যাচ্ছে
    কি না পরীক্ষা করা হবে।
  -->


</body>

</html>
