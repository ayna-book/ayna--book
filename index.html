  color: rgb(255 255 255 / 0.6);
}

.text-white\/70{
  color: rgb(255 255 255 / 0.7);
}

.text-white\/75{
  color: rgb(255 255 255 / 0.75);
}

.text-white\/80{
  color: rgb(255 255 255 / 0.8);
}

.text-white\/85{
  color: rgb(255 255 255 / 0.85);
}

.text-yellow-200{
  --tw-text-opacity: 1;
  color: rgb(254 240 138 / var(--tw-text-opacity, 1));
}

.text-yellow-300{
  --tw-text-opacity: 1;
  color: rgb(253 224 71 / var(--tw-text-opacity, 1));
}

.accent-cyan-400{
  accent-color: #22d3ee;
}

.shadow-2xl{
  --tw-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
  --tw-shadow-colored: 0 25px 50px -12px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-lg{
  --tw-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 10px 15px -3px var(--tw-shadow-color), 0 4px 6px -4px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-cyan-500\/40{
  --tw-shadow-color: rgb(6 182 212 / 0.4);
  --tw-shadow: var(--tw-shadow-colored);
}

.shadow-emerald-500\/30{
  --tw-shadow-color: rgb(16 185 129 / 0.3);
  --tw-shadow: var(--tw-shadow-colored);
}

.shadow-fuchsia-500\/30{
  --tw-shadow-color: rgb(217 70 239 / 0.3);
  --tw-shadow: var(--tw-shadow-colored);
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --bg:#000033;
  --surface:#0a0a4a;
  --surface-2:#12125e;
  --glass:rgba(255,255,255,.08);
  --glass-border:rgba(255,255,255,.18);
  --text:#ffffff;
  --muted:#c7c9ff;
  --neon:#00f0ff;
  --pink:#ff2ea6;
  --gold:#ffd700;
  --green:#00ff88;
  --violet:#8b5cf6;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#000022;
    --surface:#07073d;
  }
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Hind Siliguri',system-ui,sans-serif;
}

button,input,select,textarea{
  font-family:inherit;
}

.glass{
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(14px);
}

.neon{
  box-shadow:0 0 18px rgba(0,240,255,.45), 0 0 42px rgba(255,46,166,.22);
}

.gold-text{
  background:linear-gradient(90deg,#fff59d,#ffd700,#ff8a00);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.quantum-title{
  font-family:'Orbitron','Hind Siliguri',sans-serif;
  letter-spacing:.04em;
}

@keyframes ticker{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }
}

.ticker-track{
  animation:ticker 56s linear infinite;
  white-space:nowrap;
  display:inline-flex;
}

@keyframes pulseDot{
  0%,100%{
    transform:scale(1);
    opacity:1;
  }

  50%{
    transform:scale(1.55);
    opacity:.55;
  }
}

.live-dot{
  animation:pulseDot 1.1s ease-in-out infinite;
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-7px);
  }
}

.floaty{
  animation:floaty 3.2s ease-in-out infinite;
}

@keyframes shimmer{
  from{
    background-position:0% 50%;
  }

  to{
    background-position:200% 50%;
  }
}

.shimmer{
  background-size:200% auto;
  animation:shimmer 3s linear infinite;
}

@keyframes starBlink{
  0%,100%{
    opacity:1;
    transform:scale(1) rotate(0deg);
    color:#fffbe6;
    text-shadow:0 0 6px #fff7a8, 0 0 14px #ffd700, 0 0 26px #ffae00, 0 0 34px rgba(255,215,0,.85);
  }

  50%{
    opacity:.35;
    transform:scale(.82) rotate(12deg);
    color:#ffe97a;
    text-shadow:0 0 2px rgba(255,215,0,.55), 0 0 6px rgba(255,215,0,.35);
  }
}

.corner-star{
  font-size:18px;
  color:#fffbe6;
  animation:starBlink 1s ease-in-out infinite;
  text-shadow:0 0 6px #fff7a8, 0 0 14px #ffd700, 0 0 26px #ffae00;
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg);
  }
}

.spin-slow{
  animation:spinSlow 9s linear infinite;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

.no-scrollbar{
  scrollbar-width:none;
}

input,select,textarea{
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--neon)!important;
  box-shadow:0 0 0 3px rgba(0,240,255,.18);
}

.barcode-bar{
  display:inline-block;
  background:#fff;
  vertical-align:bottom;
}

.placeholder\:text-white\/40::-moz-placeholder{
  color: rgb(255 255 255 / 0.4);
}

.placeholder\:text-white\/40::placeholder{
  color: rgb(255 255 255 / 0.4);
}

.hover\:scale-\[1\.02\]:hover{
  --tw-scale-x: 1.02;
  --tw-scale-y: 1.02;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.hover\:border-cyan-300:hover{
  --tw-border-opacity: 1;
  border-color: rgb(103 232 249 / var(--tw-border-opacity, 1));
}

.hover\:bg-white\/20:hover{
  background-color: rgb(255 255 255 / 0.2);
}

.group:hover .group-hover\:text-cyan-200{
  --tw-text-opacity: 1;
  color: rgb(165 243 252 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px){
  .sm\:block{
    display: block;
  }

  .sm\:h-\[220px\]{
    height: 220px;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-7{
    padding: 1.75rem;
  }

  .sm\:px-5{
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:text-base{
    font-size: 1rem;
    line-height: 1.5rem;
  }

  .sm\:text-xs{
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
