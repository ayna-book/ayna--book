<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYNA BOOK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
body{margin:0;background:#070a13;color:#fff;font-family:sans-serif;display:flex;justify-content:center}
.box{width:100%;max-width:500px;background:#070a13;min-height:100vh;padding-bottom:80px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:#111625;border-bottom:1px solid #1f2937;position:sticky;top:0}
.logo{width:38px;height:38px;border-radius:50%;border:2px solid #00ffcc;display:flex;align-items:center;justify-content:center;animation:rot 60s linear infinite}
@keyframes rot{0%{transform:rotate(0deg)}1.5%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
.logo i{color:#00ffcc}
.card{margin:12px;border:2px solid #00ffcc;border-radius:14px;padding:12px;background:#111625}
input,select{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:1px solid #1f2937;background:#070a13;color:#fff}
.btn{width:100%;padding:12px;background:#2563eb;border:none;border-radius:8px;color:#fff;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px}
.g{background:#111625;border:1px solid #1f2937;border-radius:12px;padding:15px;text-align:center;cursor:pointer}
.g:active{border-color:#00ffcc;transform:scale(0.95)}
.g i{font-size:22px;color:#00ffcc;display:block;margin-bottom:5px}
.nav{position:fixed;bottom:0;width:100%;max-width:500px;background:#111625;border-top:1px solid #1f2937;display:flex;justify-content:space-around;padding:8px 0}
.nav div{font-size:10px;color:#94a3b8;text-align:center;cursor:pointer} .nav div
