<!-- ========================================== -->
<!-- AYNA BOOK MISSILE SPEED BUTTON ENGINE     -->
<!-- ========================================== -->
<style>
  /* মিসাইল স্পিড বাটন প্রেস ইফেক্ট */
  .supreme-card, .tech-card, button, a {
    transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s ease !important;
    will-change: transform;
    -webkit-tap-highlight-color: transparent;
  }
  
  .supreme-card:active, .tech-card:active, button:active {
    transform: scale(0.93) translateY(2px) !important;
    box-shadow: 0 0 50px #00ffcc, inset 0 0 15px #00ffcc !important;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    // ১. মাউস আনলেই পেজ প্রিলোড করা (Missile Preloader)
    const links = document.querySelectorAll('a[href^="./"]');
    links.forEach(link => {
      const preload = () => {
        const href = link.getAttribute('href');
        if (href && !document.querySelector(`link[rel="prefetch"][href="${href}"]`)) {
          const prefetchLink = document.createElement('link');
          prefetchLink.rel = 'prefetch';
          prefetchLink.href = href;
          document.head.appendChild(prefetchLink);
        }
      };

      // মাউস নিলে বা টাচ করলেই প্রিলোড শুরু হবে
      link.addEventListener('mouseenter', preload, { passive: true });
      link.addEventListener('touchstart', preload, { passive: true });
    });

    // ২. টাচ বা ক্লিকে ইনস্ট্যান্ট সাউন্ড ও ইনস্ট্যান্ট রেসপন্স
    document.querySelectorAll('.supreme-card, .tech-card, button').forEach(button => {
      button.addEventListener('click', function(e) {
        // রিয়েল-টাইম হ্যাপটিক ফিডব্যাক (মোবাইলে ভাইব্রেশন)
        if (navigator.vibrate) {
          navigator.vibrate(25); 
        }
      });
    });
  });
</script>
