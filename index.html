<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b49"><title>AYNA BOOK - FINAL INDEX</title><style>
:root{--navy:#071b49;--pink:#ff4fa3;--purple:#8b5cf6;--cyan:#35d9ef;--green:#28c78b;--bg:#f2f5fc;--card:#fff;--border:#e0e6f2;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#102047;font-family:system-ui;line-height:1.5}
.header{position:sticky;top:0;background:var(--navy);color:#fff;padding:12px;text-align:center;z-index:99}
.badge{background:#28c78b;color:#000;padding:5px 10px;border-radius:999px;font-weight:900;font-size:12px;margin:2px;display:inline-block}
.square{width:92vw;height:92vw;max-width:520px;max-height:520px;aspect-ratio:1/1;border-radius:28px;overflow:hidden;border:4px solid #28c78b;margin:16px auto;background:#0f172a}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}

.btn{width:100%;background:#28c78b;color:#000;border:0;padding:10px;border-radius:10px;font-weight:900;margin-top:6px;cursor:pointer}
.btn-blue{background:#35d9ef}.btn-red{background:#ff5b66;color:#fff}.btn-dark{background:var(--navy);color:#fff}
.section{margin:14px 10px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:14px}
.alert{border-left:5px solid #ffc857;background:#fff8e7;padding:10px;border-radius:10px;margin:8px 0;font-size:13px;text-align:left}
.compass{width:140px;height:140px;border:4px solid var(--navy);border-radius:50%;margin:10px auto;position:relative;background:radial-gradient(#fff,#e7efff)}
.needle{width:6px;height:70px;background:linear-gradient(red 50%,#071b49 50%);position:absolute;left:50%;top:8px;transform-origin:bottom center;border-radius:10px}
