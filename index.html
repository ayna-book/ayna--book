<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYNA BOOK - Real Working Platform</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #070a12;
            --card: #131b2e;
            --cyan: #38bdf8;
            --pink: #ec4899;
            --text: #ffffff;
            --sub: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
        .app { width: 100%; max-width: 480px; padding: 15px; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #1e293b; }
        .brand { font-size: 1.2rem; font-weight: bold; color: var(--cyan); }
        .brand span { color: var(--pink); }

        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-top: 15px; }
        h3 { margin-bottom: 10px; color: var(--cyan); font-size: 1rem; }
        
        .input-group { position: relative; margin-bottom: 10px; }
        input { width: 100%; padding: 10px; background: #0b0f19; border: 1px solid #334155; color: #fff; border-radius: 8px; }
        .toggle-pass { position: absolute; right: 10px; top: 10px; color: var(--sub); cursor: pointer; }

        button { width: 100%; padding: 10px; background: linear-gradient(45deg, var(--cyan), var(--pink)); border: none; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 5px; }

        /* Media Player */
        video, audio { width: 100%; border-radius: 8px; margin-top: 8px; }

        /* Compass & Radar Animation */
        .radar-box { width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--cyan); margin: 10px auto; position: relative; overflow: hidden; background: radial-gradient(circle, #0f172a 0%, #000 100%); }
        .radar-sweep { width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent 80%, rgba(56, 189, 248, 0.4) 100%); animation: spin 2s linear infinite; border-radius: 50%; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .compass-display { text-align: center; font-size: 1.2rem; font-weight: bold; color: var(--pink); }
    </style>
</head>
<body>

<div class="app">
    <header>
        <div class="brand">AYNA <span>BOOK</span></div>
        <div id="userInfo" style="font-size:0.8rem; color:var(--sub);">গেস্ট অ্যাকাউন্ট</div>
    </header>

    <!-- 1. AUTH SYSTEM -->
    <div class="card" id="authBox">
        <h3 id="authTitle">রেজিস্ট্রেশন / লগইন</h3>
        <div class="input-group">
            <input type="text" id="username" placeholder="ইউজারনেম">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="পাসওয়ার্ড">
            <i class="fa-solid fa-eye toggle-pass" onclick="togglePassword()"></i>
        </div>
        <button onclick="handleAuth()">অ্যাকাউন্ট সেভ/লগইন করুন</button>
        <p id="authMsg" style="font-size:0.8rem; margin-top:8px;"></p>
    </div>

    <!-- 2. MEDIA SYSTEM -->
    <div class="card">
        <h3>📺 লাইভ এইচডি ভিডিও ও সাউন্ড প্লেয়ার</h3>
        <video id="vPlayer" controls style="display:none;"></video>
        <audio id="aPlayer" controls style="display:none;"></audio>
        <button onclick="playTV()"><i class="fa-solid fa-tv"></i> লাইভ এইচডি ভিডিও প্লে করুন</button>
        <button onclick="playRadio()" style="margin-top:5px;"><i class="fa-solid fa-radio"></i> এইচডি সাউন্ড রেডিও শুনুন</button>
    </div>

    <!-- 3. RADAR & COMPASS -->
    <div class="card">
        <h3>📡 ডিজিটাল রাডার ও ওডি কম্পাস</h3>
        <div class="radar-box"><div class="radar-sweep"></div></div>
        <div class="compass-display" id="compassHead">0° N</div>
        <button onclick="startCompass()" style="margin-top:10px;">কম্পাস সেন্সর সক্রিয় করুন</button>
    </div>
</div>

<script>
    // Password Show/Hide
    function togglePassword() {
        const passInput = document.getElementById('password');
        const icon = document.querySelector('.toggle-pass');
        if (passInput.type === 'password') {
            passInput.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            passInput.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // Authentic Local Auth
    function handleAuth() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        const msg = document.getElementById('authMsg');

        if(!u || !p) { msg.textContent = "দয়া করে নাম ও পাসওয়ার্ড দিন।"; return; }

        localStorage.setItem('ayna_user', u);
        localStorage.setItem('ayna_pass', p);
        
        document.getElementById('userInfo').textContent = "স্বাগতম, " + u;
        msg.style.color = "#34d399";
        msg.textContent = "অ্যাকাউন্ট সফলভাবে ব্রাউজারে সংরক্ষিত হয়েছে!";
    }

    // Media Functions (Actual Working Stream Sources)
    function playTV() {
        const v = document.getElementById('vPlayer');
        const a = document.getElementById('aPlayer');
        a.style.display = 'none'; a.pause();
        
        v.style.display = 'block';
        v.src = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
        v.play();
    }

    function playRadio() {
        const v = document.getElementById('vPlayer');
        const a = document.getElementById('aPlayer');
        v.style.display = 'none'; v.pause();
        
        a.style.display = 'block';
        a.src = 'https://stream.zeno.fm/f3wvbbqmdg8uv';
        a.play();
    }

    // Compass Sensor logic
    function startCompass() {
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', function(e) {
                let heading = e.alpha ? Math.round(e.alpha) : 0;
                document.getElementById('compassHead').textContent = heading + "° " + getDirection(heading);
            });
        } else {
            alert("আপনার ডিভাইসে ডিরেকশন সেন্সর সাপোর্ট করছে না।");
        }
    }

    function getDirection(deg) {
        if (deg >= 337.5 || deg < 22.5) return 'N';
        if (deg >= 22.5 && deg < 67.5) return 'NE';
        if (deg >= 67.5 && deg < 112.5) return 'E';
        if (deg >= 112.5 && deg < 157.5) return 'SE';
        if (deg >= 157.5 && deg < 202.5) return 'S';
        if (deg >= 202.5 && deg < 247.5) return 'SW';
        if (deg >= 247.5 && deg < 292.5) return 'W';
        return 'NW';
    }
</script>
</body>
</html>
