<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AYNA BOOK ★ Super Quantum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Orbitron:wght@700&display=swap">
<style>
:root{--bg:#000033;--sf:#0a0a4a;--gl:rgba(255,255,255,.08);--bd:rgba(255,255,255,.18);--tx:#fff;--mu:#c7c9ff;--cy:#00f0ff;--pk:#ff2ea6;--go:#ffd700;--gr:#00ff88;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000022}}
:root[data-theme=dark]{--bg:#000022}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 20% -10%,rgba(139,92,246,.45),transparent),radial-gradient(700px 400px at 90% 10%,rgba(0,240,255,.28),transparent),var(--bg);color:var(--tx);font-family:'Hind Siliguri',system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
.w{max-width:1100px;margin:auto;padding:0 12px 80px}
.g{background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(14px);border-radius:24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--bd)}
.hd{max-width:1100px;margin:auto;padding:8px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.logo{font-family:Orbitron,sans-serif;font-size:clamp(18px,5vw,26px);font-weight:700}
.sub{font-size:11px;font-weight:700;color:var(--cy)}
.b{border:0;border-radius:99px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--gl);color:var(--tx)}
.b.c{background:var(--cy);color:#000}.b.p{background:var(--pk)}.b.r{background:#ef4444}.b.gn{background:var(--gr);color:#000}.b.y{background:var(--go);color:#000}.b.w{background:#fff;color:#000033}
.nav{display:flex;gap:8px;margin-top:8px}.nav .b{flex:1}
input,select,textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:16px;padding:11px;margin-top:8px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px rgba(0,240,255,.18)}
select option{background:var(--sf)}
.tick{overflow:hidden;background:rgba(0,0,0,.3);padding:8px 0;white-space:nowrap}
.tick div{display:inline-block;animation:tk 60s linear infinite;color:#fef08a;font-weight:600;font-size:14px}
@keyframes tk{to{transform:translateX(-50%)}}
.live{width:9px;height:9px;border-radius:50%;background:#ef4444;display:inline-block;animation:pl 1.1s infinite}
@keyframes pl{50%{transform:scale(1.6);opacity:.5}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0;scrollbar-width:none}.tabs .b{white-space:nowrap}
