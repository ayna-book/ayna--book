<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060d21">
<title>AYNA BOOK — World Leaders Directory</title>
<style>
  :root {
    --bg: #050a18;
    --navy-top: #1a3575;
    --navy-bottom: #08122b;
    --gold: #ffe64d;
    --gold-bright: #fff6b3;
    --gold-base: #8a6105;
    --cyan: #38f2ff;
    --white: #ffffff;
    --muted: #dce6fa;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--white);
    font-family: Arial, "Noto Sans Bengali", sans-serif;
    font-size: 20px;
    padding: 16px;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    background: linear-gradient(155deg, var(--navy-top) 0%, var(--navy-bottom) 100%);
    border: 3.5px solid var(--gold);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 0 18px rgba(255, 230, 77, 0.5), 0 8px 0 var(--gold-base);
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  h1 {
    margin: 0;
    font-size: 30px;
    color: var(--gold-bright);
  }

  .back-link {
    color: var(--gold-bright);
    text-decoration: none;
    font-weight: bold;
    border: 2px solid var(--gold);
    padding: 8px 14px;
    border-radius: 6px;
    background: #050b1c;
  }

  .search-input {
    width: 100%;
    padding: 14px 16px;
    font-size: 20px;
    border-radius: 8px;
    border: 2.5px solid var(--gold);
    background: #050b1c;
    color: var(--white);
    margin-bottom: 18px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .card {
    background: #050b1c;
    border: 2.5px solid var(--gold);
    border-radius: 8px;
    padding: 16px;
  }

  .country-head {
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1.5px solid rgba(255, 230, 77, 0.45);
    padding-bottom: 10px;
    margin-bottom: 12px;
  }

  .flag-img {
    width: 48px;
    height: 32px;
    object-fit: cover;
    border: 1.5px solid var(--gold);
    border-radius: 4px;
    background: #0b1633;
  }

  .leader-row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin-top: 10px;
  }

  .leader-photo {
    width: 72px;
    height: 72px;
    object-fit: cover;
    object-position: top center;
    border-radius: 6px;
    border: 2px solid var(--gold);
    background: #0b1633;
    flex-shrink: 0;
  }

  .meta {
    font-size: 16px;
    color: var(--muted);
    line-height: 1.45;
  }

  .meta strong {
    color: var(--gold-bright);
    font-size: 19px;
    display: block;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <h1>🌍 WORLD LEADERS FOLDER</h1>
      <a class="back-link" href="index.html">← হোমে ফিরুন</a>
    </div>

    <input type="search" id="leaderSearch" class="search-input" placeholder="দেশ বা নেতার নাম লিখে খুঁজুন...">
    <div id="leadersGrid" class="grid"></div>
  </div>

  <script src="world-leaders.js"></script>
</body>
</html>
