<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060d21">
<title>AYNA MESSENGER — High-Quality Audio, Video & Large File Transfer</title>
<style>
  :root {
    --bg: #050a18;
    --panel: #0b1633;
    --navy-top: #1a3575;
    --navy-bottom: #08122b;
    --gold: #ffe64d;
    --gold-bright: #fff6b3;
    --gold-base: #8a6105;
    --cyan: #38f2ff;
    --text: #ffffff;
    --muted: #dce6fa;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, "Noto Sans Bengali", sans-serif;
    font-size: 20px;
    padding: 16px;
    padding-bottom: 110px;
  }

  .msg-wrap {
    max-width: 1080px;
    margin: 0 auto;
    background: linear-gradient(155deg, var(--navy-top) 0%, var(--navy-bottom) 100%);
    border: 3.5px solid var(--gold);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 0 18px rgba(255, 230, 77, 0.55), 0 8px 0 var(--gold-base);
  }

  .msg-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    border-bottom: 2.5px solid var(--gold);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }

  .msg-title {
    margin: 0;
    font-size: 28px;
    color: var(--gold-bright);
  }

  .back-link {
    color: var(--gold-bright);
    text-decoration: none;
    font-weight: bold;
    border: 2px solid var(--gold);
    padding: 8px 14px;
    border-radius: 6px;
    background: #050b1c;
  }

  .top-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }

  .box-card {
    background: #050b1c;
    border: 2.5px solid var(--gold);
    border-radius: 8px;
    padding: 14px;
  }

  .box-card h3 {
    margin: 0 0 10px;
    font-size: 20px;
    color: var(--cyan);
  }

  select, input[type="text"], input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 18px;
    border-radius: 6px;
    border: 2px solid var(--gold);
    background: #0b1633;
    color: #ffffff;
    margin-bottom: 10px;
  }

  canvas#freqCanvas {
    width: 100%;
    height: 92px;
    background: #030712;
    border: 2px solid var(--gold);
    border-radius: 6px;
    display: block;
    margin-bottom: 10px;
  }

  video#callVideo {
    width: 100%;
    max-height: 240px;
    background: #030712;
    border: 2px solid var(--gold);
    border-radius: 6px;
    display: block;
    margin-bottom: 10px;
    object-fit: cover;
    object-position: top center;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .m-btn {
    padding: 10px 14px;
    font-size: 17px;
    font-weight: 900;
    border-radius: 6px;
    border: 2px solid var(--gold-bright);
    background: linear-gradient(180deg, #ffe64d 0%, #c99314 100%);
    color: #050a18;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--gold-base);
  }

  .m-btn:active {
    transform: translateY(3px);
  }

  .chat-box {
    background: #050b1c;
    border: 2.5px solid var(--gold);
    border-radius: 8px;
    padding: 16px;
    max-height: 460px;
    overflow-y: auto;
    margin-bottom: 16px;
  }

  .msg-item {
    background: #0b1633;
    border: 2px solid var(--gold);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 12px;
    overflow-wrap: anywhere;
  }

  .msg-meta {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    color: var(--cyan);
    margin-bottom: 6px;
  }

  .msg-text {
    font-size: 21px;
    white-space: pre-wrap;
  }

  .msg-media {
    max-width: 100%;
    max-height: 320px;
    border-radius: 6px;
    border: 2px solid var(--gold);
    margin-top: 8px;
    display: block;
  }

  .msg-file-link {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 14px;
    background: linear-gradient(180deg, #ffe64d 0%, #c99314 100%);
    color: #050a18;
    text-decoration: none;
    font-weight: 900;
    border-radius: 6px;
    font-size: 17px;
  }

  .progress-wrap {
    display: none;
    background: #050b1c;
    border: 2px solid var(--gold);
    border-radius: 6px;
    height: 24px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--gold));
    transition: width .2s ease;
  }

  .composer {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .composer input[type="text"] {
    flex: 1;
    min-width: 220px;
    margin-bottom: 0;
    padding: 14px;
    font-size: 20px;
  }

  .status-line {
    margin-top: 12px;
    font-size: 18px;
    color: var(--muted);
  }

  .bottom-nav {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:60;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:linear-gradient(180deg,#122659 0%,#060d21 100%);
    border-top:3.5px solid var(--gold);
    padding:10px 4px;
  }

  .bottom-nav a {
    color:white;
    text-decoration:none;
    text-align:center;
    font-size:18px;
    font-weight:bold;
  }

  .bottom-nav span {
    display:block;
    font-size:26px;
  }
</style>
</head>
<body>

<div class="msg-wrap">
  <div class="msg-header">
    <h1 class="msg-title">💬 AYNA MESSENGER</h1>
    <a class="back-link" href="index.html">← হোমে ফিরুন</a>
  </div>

  <div class="top-grid">
    <!-- হাই-কোয়ালিটি অডিও ফ্রিকোয়েন্সি ও রেকর্ডার -->
    <div class="box-card">
      <h3>🎙️ High-Quality Audio Frequency (48kHz / HD)</h3>
      <select id="audioQualitySelect" aria-label="Audio Quality">
        <option value="high">⚡ Ultra HD (48kHz • 192kbps Stereo)</option>
        <option value="balanced">🔄 High Speed Voice (44.1kHz • 128kbps)</option>
      </select>
      <canvas id="freqCanvas" width="420" height="92"></canvas>
      <div class="btn-row">
        <button type="button" class="m-btn" id="startMicFreqBtn">🎤 ফ্রিকোয়েন্সি চালু</button>
        <button type="button" class="m-btn" id="recordVoiceBtn">⏺ ভয়েস রেকর্ড</button>
        <button type="button" class="m-btn" id="stopVoiceBtn">■ স্টপ</button>
      </div>
    </div>

    <!-- লাইভ ভিডিও ও অডিও স্ট্রিম প্রিভিউ -->
    <div class="box-card">
      <h3>📹 Live Video & Audio Stream</h3>
      <video id="callVideo" autoplay muted playsinline></video>
      <div class="btn-row">
        <button type="button" class="m-btn" id="startVideoStreamBtn">📹 ভিডিও চালু</button>
        <button type="button" class="m-btn" id="stopVideoStreamBtn">⏹ বন্ধ করুন</button>
      </div>
    </div>

    <!-- রুম ও বড় ফাইল ট্রান্সফার -->
    <div class="box-card">
      <h3>📦 Large File Transfer (Up to 250MB)</h3>
      <label for="roomSelect" style="font-size:16px;color:#dce6fa;display:block;margin-bottom:4px;">চ্যাট রুম / চ্যানেল</label>
      <select id="roomSelect">
        <option value="quantum_global">🌐 AYNA Quantum Global Room</option>
        <option value="bd_community">🇧🇩 বাংলাদেশ কমিউনিটি রুম</option>
        <option value="media_transfer">📁 বড় ফাইল ও ভিডিও শেয়ার রুম</option>
      </select>

      <div class="btn-row">
        <button type="button" class="m-btn" id="pickBigFileBtn">📎 বড় ফাইল/ভিডিও/অডিও (250MB)</button>
      </div>
      <input type="file" id="bigFileInput" hidden>
      <div id="pickedFileInfo" style="margin-top:10px;font-size:17px;color:#ffe64d;">কোনো ফাইল নির্বাচিত নয়</div>
    </div>
  </div>

  <div class="progress-wrap" id="msgProgressWrap">
    <div class="progress-bar" id="msgProgressBar"></div>
  </div>

  <div class="chat-box" id="chatBox">
    <div style="text-align:center;color:#dce6fa;">মেসেজ ও ফাইল লোড হচ্ছে...</div>
  </div>

  <div class="composer">
    <input type="text" id="msgInput" placeholder="মেসেজ লিখুন বা বড় ফাইল/অডিও/ভিডিও পাঠান...">
    <button type="button" class="m-btn" id="sendMsgBtn">➤ পাঠান</button>
  </div>

  <div class="status-line" id="msgStatus">প্রস্তুত — হাই-কোয়ালিটি অডিও, ভিডিও ও বড় ফাইল আদান-প্রদান সক্রিয়।</div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="index.html#createPost"><span>➕</span>Post</a>
  <a href="messenger.html"><span>💬</span>Messenger</a>
  <a href="profile.html"><span>👤</span>Profile</a>
</nav>

<script type="module" src="messenger.js"></script>
</body>
</html>
