
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b50">
<title>AYNA BOOK Messenger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#edf2f8;color:#17243a}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:1100px;margin:auto;height:100dvh;background:white;display:flex;flex-direction:column}
header{background:#102b50;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:23px}
header small{color:#cbdcf2}
#newChatBtn{padding:11px;border:0;border-radius:10px;font-weight:bold}
main{display:grid;grid-template-columns:300px 1fr;flex:1;min-height:0}
aside{border-right:1px solid #ddd;display:flex;flex-direction:column;min-height:0}
aside h2{padding:15px}
#chatSearch,#userSearch{margin:0 12px 12px;padding:13px;border:1px solid #ccd5e1;border-radius:10px}
#chatList{overflow:auto}
.chat-item{width:100%;border:0;border-bottom:1px solid #eee;background:white;text-align:left;padding:15px;font-size:16px}
.chat-item.active{background:#e6f0ff}
.chat-item small{display:block;color:#667;margin-top:5px}
#chatPanel{display:flex;flex-direction:column;min-height:0;background:#f5f7fb}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px;background:white;border-bottom:1px solid #ddd}
#backBtn{display:none}
.chat-head h2{font-size:18px}
#chatStatus{font-size:13px;color:#16834a;margin-top:4px}
.head-info{flex:1;min-width:0}
.head-actions{display:flex;gap:6px}
.head-actions button{padding:10px;border:0;border-radius:10px;background:#e8f0fb;font-size:19px}
#messages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:12px;border-radius:14px;background:white;overflow-wrap:anywhere;line-height:1.5}
.msg.mine{align-self:flex-end;background:#dcecff}
.msg.other{align-self:flex-start}
.msg small{display:block;text-align:right;color:#667;font-size:11px;margin-top:5px}
.msg img,.msg video{max-width:100%;max-height:280px;border-radius:8px}
.composer{background:white;padding:10px;border-top:1px solid #ddd}
.tools{display:flex;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.tools button{padding:10px;border:0;border-radius:9px;background:#edf2f8;font-size:18px}
.sendrow{display:flex;gap:8px}
#messageInput{flex:1;min-width:0;padding:13px;border:1px solid #ccd5e1;border-radius:12px;font-size:16px}
#sendBtn{padding:0 19px;border:0;border-radius:12px;background:#1456a0;color:white;font-size:20px}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:15px;z-index:10}
.modal[hidden]{display:none}
.panel{width:100%;max-width:430px;background:white;border-radius:16px;padding:20px;max-height:85vh;overflow:auto}
.panel h2{margin-bottom:14px}
.panel button{padding:12px;border:0;border-radius:10px;background:#eaf1fa;margin:4px}
.user-result{display:block;width:100%;text-align:left}
#callScreen{background:#102b50;color:white;text-align:center}
#callScreen video{width:100%;max-height:45vh;background:#000;border-radius:12px;margin:8px 0;object-fit:cover}
#remoteVideo{min-height:180px}
#localVideo{max-width:140px}
.call-buttons button{font-size:18px;margin:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17243a;color:white;padding:12px 18px;border-radius:10px;display:none;z-index:30}
#toast.show{display:block}
@media(max-width:700px){
 main{display:block;position:relative}
 aside{height:100%}
 #chatPanel{display:none;height:100%}
 #chatPanel.open{display:flex}
 main.chatting aside{display:none}
 #backBtn{display:block;padding:9px;border:0;border-radius:8px}
}
</style>
</head>
<body>
<div class="app">
<header>
 <div><h1>AYNA BOOK</h1><small>REAL-TIME MESSENGER</small></div>
 <button id="newChatBtn">＋ নতুন চ্যাট</button>
</header>

<main id="main">
<aside>
 <h2>💬 মেসেজ</h2>
 <input id="chatSearch" placeholder="চ্যাট খুঁজুন">
 <div id="chatList">চ্যাট লোড হচ্ছে...</div>
</aside>

<section id="chatPanel">
 <div class="chat-head">
  <button id="backBtn">←</button>
  <div class="head-info">
   <h2 id="chatName">চ্যাট নির্বাচন করুন</h2>
   <div id="chatStatus">AYNA MESSENGER</div>
  </div>
  <div class="head-actions">
   <button id="audioCallBtn" title="অডিও কল">📞</button>
   <button id="videoCallBtn" title="ভিডিও কল">📹</button>
  </div>
 </div>

 <div id="messages">
  <p>চ্যাট তালিকা থেকে একজনকে নির্বাচন করুন।</p>
 </div>

 <div class="composer">
  <div class="tools">
   <button id="fileBtn">📎</button>
   <button id="recordBtn">🎤</button>
   <button id="emojiBtn">😊</button>
  </div>
  <div class="sendrow">
   <input id="messageInput" placeholder="মেসেজ লিখুন..." autocomplete="off">
   <button id="sendBtn">➤</button>
  </div>
 </div>
</section>
</main>
</div>

<input id="fileInput" type="file" accept="image/*,video/*,audio/*,.pdf,.txt" hidden>

<div class="modal" id="newChatModal" hidden>
 <div class="panel">
  <h2>নতুন চ্যাট</h2>
  <input id="userSearch" placeholder="নাম অথবা AYNA ID">
  <div id="searchStatus">ব্যবহারকারী খুঁজুন</div>
  <div id="searchResults"></div>
  <button id="closeSearch">বন্ধ করুন</button>
 </div>
</div>

<div class="modal" id="incomingModal" hidden>
 <div class="panel">
  <h2 id="incomingTitle">ইনকামিং কল</h2>
  <p id="incomingText">আপনাকে কল করা হচ্ছে</p>
  <button id="acceptCall">কল গ্রহণ</button>
  <button id="rejectCall">প্রত্যাখ্যান</button>
 </div>
</div>

<div class="modal" id="callModal" hidden>
 <div class="panel" id="callScreen">
  <h2 id="callTitle">AYNA কল</h2>
  <p id="callStatus">সংযোগ হচ্ছে...</p>
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay muted playsinline></video>
  <div class="call-buttons">
   <button id="muteBtn">🎙️ মাইক</button>
   <button id="cameraBtn">📷 ক্যামেরা</button>
   <button id="endCallBtn" style="background:#c62828;color:white">📵 কল শেষ</button>
  </div>
 </div>
</div>

<div id="toast" role="status"></div>

<script type="module" src="./messenger.js"></script>
</body>
</html>
