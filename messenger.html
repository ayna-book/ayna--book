
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#063b73">
<title>AYNA MESSENGER</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #edf3f9;
  color: #172b42;
}

body {
  overflow: hidden;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

#app {
  width: 100%;
  height: 100dvh;
  display: flex;
  background: white;
}

/* SIDEBAR */

.sidebar {
  width: 350px;
  min-width: 350px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #dce5ef;
  background: #f8fbff;
}

.sidebar-header {
  background: #063b73;
  color: white;
  padding: 16px;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.brand {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: .5px;
}

.top-btn {
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 14px;
  background: white;
  color: #063b73;
  font-size: 27px;
  font-weight: bold;
}

.chat-search {
  width: 100%;
  height: 52px;
  margin-top: 14px;
  padding: 0 16px;
  border: 0;
  outline: none;
  border-radius: 14px;
  font-size: 16px;
  background: white;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
}

.chat-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px;
  border-bottom: 1px solid #e6edf4;
  cursor: pointer;
  background: white;
}

.chat-item:active {
  background: #eaf3ff;
}

.chat-item img {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  object-fit: contain;
  background: #e6edf4;
}

.chat-item-info {
  flex: 1;
  min-width: 0;
}

.chat-item-name {
  font-size: 17px;
  font-weight: 800;
  color: #12375e;
}

.chat-item-last {
  font-size: 13px;
  color: #718096;
  margin-top: 5px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* CHAT PANEL */

.chat-panel {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: #eef4fa;
}

.chat-header {
  min-height: 75px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: #063b73;
  color: white;
}

.back-btn {
  display: none;
  border: 0;
  background: transparent;
  color: white;
  font-size: 27px;
}

.chat-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: contain;
  background: white;
}

.chat-person {
  flex: 1;
  min-width: 0;
}

.chat-person h2 {
  font-size: 19px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chat-person p {
  font-size: 12px;
  margin-top: 4px;
  color: #d4e7ff;
}

.call-actions {
  display: flex;
  gap: 8px;
}

.call-btn {
  width: 43px;
  height: 43px;
  border: 0;
  border-radius: 13px;
  background: #ffffff;
  color: #063b73;
  font-size: 21px;
}

/* MESSAGES */

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.empty-state {
  margin: auto;
  text-align: center;
  color: #70849a;
  line-height: 1.8;
  padding: 20px;
}

.empty-state strong {
  display: block;
  color: #063b73;
  font-size: 23px;
}

.message {
  max-width: 82%;
  padding: 12px 14px;
  border-radius: 16px;
  background: white;
  box-shadow: 0 2px 5px #0000000a;
  overflow-wrap: anywhere;
}

.message.mine {
  align-self: flex-end;
  background: #d9ebff;
  border-bottom-right-radius: 4px;
}

.message.theirs {
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}

.message-text {
  font-size: 16px;
  line-height: 1.55;
  white-space: pre-wrap;
}

.message-time {
  font-size: 10px;
  color: #73859a;
  text-align: right;
  margin-top: 6px;
}

.message img,
.message video {
  display: block;
  width: 100%;
  max-width: 300px;
  max-height: 350px;
  border-radius: 12px;
  object-fit: contain;
  background: #111;
}

.message audio {
  width: min(270px, 100%);
}

.message a {
  color: #075db5;
  font-weight: bold;
}

.location-link {
  display: inline-block;
  margin-top: 5px;
}

/* COMPOSER */

.composer {
  padding: 10px;
  background: white;
  border-top: 1px solid #dce5ef;
}

.composer-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.composer-input {
  flex: 1;
  min-width: 0;
  min-height: 49px;
  max-height: 130px;
  resize: none;
  border: 1px solid #d8e2ed;
  border-radius: 16px;
  padding: 13px;
  outline: none;
  font-size: 16px;
}

.action-btn {
  width: 45px;
  height: 45px;
  flex-shrink: 0;
  border: 0;
  border-radius: 14px;
  background: #eaf2fb;
  color: #06477f;
  font-size: 21px;
}

.send-btn {
  background: #0864ce;
  color: white;
  font-size: 20px;
}

.attach-menu {
  display: none;
  flex-wrap: wrap;
  gap: 9px;
  padding: 12px 4px;
}

.attach-menu.show {
  display: flex;
}

.attach-option {
  border: 0;
  background: #edf4fc;
  color: #16446e;
  padding: 11px 13px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: bold;
}

/* MODALS */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #071a30a8;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 470px;
  max-height: 85dvh;
  overflow-y: auto;
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 15px 50px #0004;
}

.modal-title {
  font-size: 22px;
  font-weight: 900;
  color: #063b73;
  margin-bottom: 18px;
}

.modal-input {
  width: 100%;
  height: 52px;
  padding: 0 15px;
  border: 1px solid #cad8e7;
  border-radius: 13px;
  outline: none;
  font-size: 16px;
}

.modal-btn {
  width: 100%;
  min-height: 48px;
  margin-top: 14px;
  border: 0;
  border-radius: 13px;
  background: #0864ce;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.modal-btn.secondary {
  background: #e8eef5;
  color: #26435f;
}

.user-search-status {
  font-size: 14px;
  color: #70849a;
  margin: 12px 2px;
}

.user-result {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 5px;
  border-bottom: 1px solid #e5edf5;
  cursor: pointer;
}

.user-result img {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  object-fit: contain;
  background: #edf3f9;
}

.user-result-info {
  flex: 1;
  min-width: 0;
}

.user-result-name {
  font-size: 16px;
  font-weight: bold;
  color: #12375e;
}

.user-result-id {
  font-size: 12px;
  margin-top: 4px;
  color: #68809a;
}

.user-result button {
  border: 0;
  border-radius: 10px;
  padding: 10px 12px;
  color: white;
  background: #0864ce;
  font-weight: bold;
}

/* CALL MODAL */

.call-icon {
  font-size: 55px;
  text-align: center;
  margin: 15px;
}

.call-description {
  text-align: center;
  color: #60758c;
  line-height: 1.7;
}

/* TOAST */

.toast {
  position: fixed;
  z-index: 2000;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  background: #102f50;
  color: white;
  padding: 13px 20px;
  border-radius: 14px;
  font-size: 14px;
  display: none;
  max-width: 90%;
  text-align: center;
}

.toast.show {
  display: block;
}

/* MOBILE */

@media(max-width:760px) {
  .sidebar {
    width: 100%;
    min-width: 0;
  }

  .chat-panel {
    display: none;
    width: 100%;
  }

  #app.chat-open .sidebar {
    display: none;
  }

  #app.chat-open .chat-panel {
    display: flex;
  }

  .back-btn {
    display: block;
  }

  .chat-header {
    padding: 10px;
  }

  .chat-person h2 {
    font-size: 16px;
  }

  .call-btn {
    width: 39px;
    height: 39px;
  }

  .message {
    max-width: 88%;
  }

  .brand {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- CHAT SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-header">

      <div class="brand-row">

        <div class="brand">
          AYNA MESSENGER
        </div>

        <button
          class="top-btn"
          id="newChatBtn"
          type="button"
          title="New Chat">＋</button>

      </div>

      <input
        class="chat-search"
        id="chatSearch"
        type="search"
        placeholder="চ্যাট খুঁজুন...">

    </div>

    <div class="chat-list" id="chatList">

      <div class="empty-state">
        <strong>AYNA MESSENGER</strong>
        আপনার Chat এখানে দেখা যাবে।
      </div>

    </div>

  </aside>


  <!-- CHAT PANEL -->

  <main class="chat-panel">

    <header class="chat-header">

      <button
        class="back-btn"
        id="mobileBack"
        type="button">‹</button>

      <img
        class="chat-avatar"
        id="chatAvatar"
        src="https://ui-avatars.com/api/?name=AYNA&background=0864ce&color=fff"
        alt="Profile">

      <div class="chat-person">

        <h2 id="chatName">
          AYNA MESSENGER
        </h2>

        <p id="chatStatus">
          একজন User নির্বাচন করুন
        </p>

      </div>

      <div class="call-actions">

        <button
          class="call-btn"
          id="voiceCallBtn"
          type="button"
          title="Voice Call">☎</button>

        <button
          class="call-btn"
          id="videoCallBtn"
          type="button"
          title="Video Call">▣</button>

      </div>

    </header>


    <!-- MESSAGES -->

    <section
      class="messages"
      id="messages">

      <div class="empty-state">

        <strong>AYNA BOOK</strong>

        আপনার বন্ধুদের সঙ্গে<br>
        মেসেজ আদান-প্রদান করুন।

      </div>

    </section>


    <!-- COMPOSER -->

    <footer class="composer">

      <div
        class="attach-menu"
        id="attachMenu">

        <button
          class="attach-option"
          id="imageBtn"
          type="button">📷 ছবি</button>

        <button
          class="attach-option"
          id="videoBtn"
          type="button">🎬 ভিডিও</button>

        <button
          class="attach-option"
          id="audioBtn"
          type="button">🎵 অডিও</button>

        <button
          class="attach-option"
          id="documentBtn"
          type="button">📄 ফাইল</button>

        <button
          class="attach-option"
          id="locationBtn"
          type="button">📍 লোকেশন</button>

      </div>


      <div class="composer-row">

        <button
          class="action-btn"
          id="attachBtn"
          type="button"
          title="Attachment">＋</button>

        <button
          class="action-btn"
          id="emojiBtn"
          type="button"
          title="Emoji">☺</button>

        <textarea
          class="composer-input"
          id="messageInput"
          rows="1"
          placeholder="মেসেজ লিখুন..."></textarea>

        <button
          class="action-btn"
          id="voiceBtn"
          type="button"
          title="Voice Record">🎙</button>

        <button
          class="action-btn send-btn"
          id="sendBtn"
          type="button"
          title="Send">➤</button>

      </div>

    </footer>

  </main>

</div>


<!-- HIDDEN FILE INPUTS -->

<input
  type="file"
  id="imageInput"
  accept="image/*"
  hidden>

<input
  type="file"
  id="videoInput"
  accept="video/*"
  hidden>

<input
  type="file"
  id="audioInput"
  accept="audio/*"
  hidden>

<input
  type="file"
  id="documentInput"
  accept=".pdf,.doc,.docx,.txt,.xls,.xlsx,.ppt,.pptx"
  hidden>


<!-- NEW CHAT MODAL -->

<div class="modal" id="newChatModal">

  <div class="modal-box">

    <div class="modal-title">
      👤 নতুন Chat
    </div>

    <input
      class="modal-input"
      id="userSearchInput"
      type="search"
      placeholder="AYNA ID অথবা নাম লিখুন...">

    <div
      class="user-search-status"
      id="userSearchStatus">
      ব্যবহারকারী খুঁজুন
    </div>

    <div id="userSearchResults"></div>

    <button
      class="modal-btn secondary"
      id="closeNewChatBtn"
      type="button">বন্ধ করুন</button>

  </div>

</div>


<!-- CALL MODAL -->

<div class="modal" id="callModal">

  <div class="modal-box">

    <div class="modal-title" id="callTitle">
      AYNA CALL
    </div>

    <div class="call-icon">
      📞
    </div>

    <div class="call-description" id="callText">
      কল শুরু করার প্রস্তুতি।
    </div>

    <button
      class="modal-btn"
      id="startCallBtn"
      type="button">কল শুরু করুন</button>

    <button
      class="modal-btn secondary"
      id="closeCallBtn"
      type="button">বন্ধ করুন</button>

  </div>

</div>


<!-- TOAST -->

<div class="toast" id="toast"></div>


<!-- FIREBASE MESSENGER SCRIPT -->

<script type="module" src="./messenger.js"></script>

</body>
</html>
