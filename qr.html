
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AYNA BOOK QR CODE</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #080808;
      color: #d4af37;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 450px;
      margin: 30px auto;
      padding: 22px;
      background: #171717;
      border: 1px solid #d4af37;
      border-radius: 15px;
    }

    h2 { margin-bottom: 20px; }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 220px;
      margin: 20px auto;
      padding: 12px;
      background: white;
      border-radius: 10px;
    }

    #qrcode img, #qrcode canvas {
      max-width: 100%;
      height: auto;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #d4af37;
      color: #080808;
      font-weight: bold;
      cursor: pointer;
    }

    #profileLink {
      color: white;
      overflow-wrap: anywhere;
    }

    #message {
      color: white;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>AYNA BOOK QR CODE</h2>

    <p id="userName">Loading...</p>
    <p id="aynaId"></p>

    <div id="qrcode"></div>

    <p id="profileLink"></p>

    <button id="downloadQR">Download QR Code</button>
    <button id="copyLink">Copy Profile Link</button>

    <p id="message"></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module" src="./qr.js"></script>
</body>
</html>
