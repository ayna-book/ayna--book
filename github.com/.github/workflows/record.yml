name: 2CRORE
on: workflow_dispatch
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p a
          for i in $(seq 1 200); do for j in $(seq 1 100000); do echo "log $j" >> a/m${i}.js; done; done
          git config user.name "a"
          git config user.email "a@a.com"
          git add .
          git commit -m "done" || true
          git push