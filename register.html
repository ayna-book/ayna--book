<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>AYNA BOOK - Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #071d16;
    }

    body {
      position: fixed;
      inset: 0;
    }

    .page {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      min-height: 100vh;

      background:
        radial-gradient(circle at top right, rgba(25,160,105,.25), transparent 35%),
        linear-gradient(145deg, #03130e, #08271d 55%, #03130e);

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .register-box {
      width: min(94%, 470px);
      max-height: 96dvh;

      background: rgba(10,35,27,.98);

      border: 1px solid rgba(67,211,145,.25);
      border-radius: 24px;

      padding: 24px 20px;

      box-shadow: 0 20px 60px rgba(0,0,0,.45);

      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }

    .register-box::-webkit-scrollbar {
      display: none;
    }

    .logo {
      width: 70px;
      height: 70px;

      margin: 0 auto 12px;

      border-radius: 20px;

      background: linear-gradient(
        145deg,
        #19a96b,
        #08734a
      );

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 23px;
      font-weight: 900;

      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0;

      text-align: center;

      color: white;

      font-size: 24px;
    }

    .subtitle {
      margin: 7px 0 20px;

      text-align: center;

      color: #9fc7b7;

      font-size: 14px;
    }

    label {
      display: block;

      margin: 13px 0 6px;

      color: #dff8ed;

      font-size: 14px;
      font-weight: 700;
    }

    .required {
      color: #ff7373;
    }

    input,
    select {
      width: 100%;
      height: 50px;

      border: 1px solid #285445;
      border-radius: 12px;

      outline: none;

      background: #071d16;

      color: white;

      padding: 0 14px;

      font-size: 16px;

      appearance: none;
      -webkit-appearance: none;
    }

    select {
      background-image:
        linear-gradient(45deg, transparent 50%, #69e2ae 50%),
        linear-gradient(135deg, #69e2ae 50%, transparent 50%);

      background-position:
        calc(100% - 18px) 21px,
        calc(100% - 12px) 21px;

      background-size: 6px 6px, 6px 6px;

      background-repeat: no-repeat;

      padding-right: 40px;
    }

    input:focus,
    select:focus {
      border-color: #25c987;

      box-shadow:
        0 0 0 3px rgba(37,201,135,.12);
    }

    .password-wrap {
      position: relative;
    }

    .password-input {
      padding-right: 75px;
    }

    .show-btn {
      position: absolute;

      right: 7px;
      top: 6px;

      height: 38px;

      padding: 0 10px;

      border: 0;
      border-radius: 9px;

      background: #123f30;

      color: #75e6b5;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;
    }

    .photo-box {
      border: 1px dashed #3b6d5a;
      border-radius: 13px;
      padding: 10px;
      background: #061a14;
    }

    .photo-box input {
      height: auto;
      border: 0;
      padding: 5px 0;
      background: transparent;
      font-size: 14px;
    }

    .terms {
      display: flex;
      align-items: flex-start;

      gap: 10px;

      margin-top: 17px;

      color: #a9cabe;

      font-size: 13px;

      line-height: 1.5;
    }

    .terms input {
      width: 20px;
      height: 20px;

      min-width: 20px;

      margin: 1px 0 0;

      accent-color: #20bd7b;
    }

    .terms a {
      color: #69e2ae;
      text-decoration: none;
      font-weight: 700;
    }

    #submitBtn {
      width: 100%;
      height: 54px;

      margin-top: 19px;

      border: 0;
      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #20bd7b,
          #087d50
        );

      color: white;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 9px 25px rgba(10,160,100,.25);
    }

    #submitBtn:active {
      transform: scale(.98);
    }

    #submitBtn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #statusMsg {
      min-height: 22px;

      margin-top: 12px;

      text-align: center;

      color: #ffb3b3;

      font-size: 13px;

      line-height: 1.5;
    }

    .login-link {
      margin-top: 17px;

      padding-top: 17px;

      border-top: 1px solid #214638;

      text-align: center;

      color: #9fc7b7;

      font-size: 14px;
    }

    .login-link a {
      color: #69e2ae;

      text-decoration: none;

      font-weight: 700;
    }

    .footer {
      margin-top: 17px;

      text-align: center;

      color: #668f80;

      font-size: 11px;
    }

    @media (max-height: 650px) {

      .register-box {
        max-height: 98dvh;
        padding-top: 15px;
        padding-bottom: 15px;
      }

      .logo {
        width: 55px;
        height: 55px;
        margin-bottom: 8px;
      }

      h1 {
        font-size: 21px;
      }

      .subtitle {
        margin-bottom: 12px;
      }

      label {
        margin-top: 9px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="register-box">

    <div class="logo">
      AB
    </div>

    <h1>
      AYNA BOOK
    </h1>

    <div class="subtitle">
      Create Your Account
    </div>

    <form id="registerForm">

      <!-- Full Name -->

      <label for="fullName">
        Full Name <span class="required">*</span>
      </label>

      <input
        id="fullName"
        name="fullName"
        type="text"
        placeholder="Enter your full name"
        autocomplete="name"
        maxlength="100"
        required
      >


      <!-- Email -->

      <label for="email">
        Email Address <span class="required">*</span>
      </label>

      <input
        id="email"
        name="email"
        type="email"
        placeholder="example@email.com"
        autocomplete="email"
        required
      >


      <!-- Country -->

      <label for="country">
        Country <span class="required">*</span>
      </label>

      <select
        id="country"
        name="country"
        autocomplete="country-name"
        required>

        <option value="">
          Select your country
        </option>

        <option value="Bangladesh">
          Bangladesh
        </option>

        <option value="India">
          India
        </option>

        <option value="Pakistan">
          Pakistan
        </option>

        <option value="Saudi Arabia">
          Saudi Arabia
        </option>

        <option value="United Arab Emirates">
          United Arab Emirates
        </option>

        <option value="United States">
          United States
        </option>

        <option value="United Kingdom">
          United Kingdom
        </option>

        <option value="Malaysia">
          Malaysia
        </option>

        <option value="Indonesia">
          Indonesia
        </option>

        <option value="Other">
          Other
        </option>

      </select>


      <!-- Phone -->

      <label for="phone">
        Phone Number
      </label>

      <input
        id="phone"
        name="phone"
        type="tel"
        placeholder="Enter phone number"
        autocomplete="tel"
      >


      <!-- Profile Photo -->

      <label for="photo">
        Profile Photo <span class="required">*</span>
      </label>

      <div class="photo-box">

        <input
          id="photo"
          name="photo"
          type="file"
          accept="image/jpeg,image/png,image/webp"
          required
        >

      </div>


      <!-- Password -->

      <label for="password">
        Password <span class="required">*</span>
      </label>

      <div class="password-wrap">

        <input
          id="password"
          name="password"
          class="password-input"
          type="password"
          placeholder="Minimum 6 characters"
          minlength="6"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          id="togglePassword"
          class="show-btn">
          Show
        </button>

      </div>


      <!-- Confirm Password -->

      <label for="confirmPassword">
        Confirm Password <span class="required">*</span>
      </label>

      <div class="password-wrap">

        <input
          id="confirmPassword"
          name="confirmPassword"
          class="password-input"
          type="password"
          placeholder="Enter password again"
          minlength="6"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          id="toggleConfirmPassword"
          class="show-btn">
          Show
        </button>

      </div>


      <!-- Terms -->

      <div class="terms">

        <input
          id="terms"
          name="terms"
          type="checkbox"
          required
        >

        <div>

          I agree to the AYNA BOOK
          <a href="#" onclick="return false;">
            Terms and Conditions
          </a>
          and
          <a href="#" onclick="return false;">
            Privacy Policy
          </a>.

        </div>

      </div>


      <!-- Submit -->

      <button
        id="submitBtn"
        type="submit">
        Create Account
      </button>


      <!-- Status -->

      <div id="statusMsg"></div>

    </form>


    <!-- Login -->

    <div class="login-link">

      Already have an account?

      <a href="./login.html">
        Login
      </a>

    </div>


    <div class="footer">
      © AYNA BOOK
    </div>

  </div>

</div>

<script type="module" src="./register.js"></script>

</body>
</html>
