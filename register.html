
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>AYNA BOOK - Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #111;
      border: 1px solid #d4af37;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 0 25px #d4af3720;
    }

    .logo {
      text-align: center;
      color: #d4af37;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      color: #d4af37;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      color: #e5c76b;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      background: #1b1b1b;
      color: white;
      border: 1px solid #555;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #d4af37;
    }

    input[type="file"] {
      font-size: 13px;
    }

    .password-wrap {
      display: flex;
      gap: 7px;
    }

    .password-wrap input {
      flex: 1;
      min-width: 0;
    }

    .toggle-password {
      width: 48px;
      background: #242014;
      color: #d4af37;
      border: 1px solid #d4af37;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      color: #ccc;
      font-size: 13px;
      margin: 18px 0;
      line-height: 1.5;
    }

    .terms input {
      width: 17px;
      height: 17px;
      margin-top: 2px;
      accent-color: #d4af37;
    }

    a {
      color: #d4af37;
    }

    .submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(135deg, #f4d36b, #a77b18);
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #bbb;
      font-size: 14px;
    }

    .required {
      color: #e5b83d;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">AYNA BOOK</div>
    <h2>Create Your Account</h2>

    <form id="registerForm">

      <div class="form-group">
        <label for="fullName">Full Name <span class="required">*</span></label>
        <input id="fullName" type="text"
          minlength="2" maxlength="100"
          autocomplete="name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input id="email" type="email"
          autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="country">Country <span class="required">*</span></label>
        <input id="country" type="text"
          maxlength="100" autocomplete="country-name" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input id="phone" type="tel"
          maxlength="30" autocomplete="tel">
      </div>

      <div class="form-group">
        <label for="photo">Profile Photo <span class="required">*</span></label>
        <input id="photo" type="file"
          accept="image/jpeg,image/png,image/webp" required>
        <small style="color:#aaa;">
          JPG, PNG or WEBP — Maximum 5 MB
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <div class="password-wrap">
          <input id="password" type="password"
            minlength="6" autocomplete="new-password" required>
          <button class="toggle-password" type="button"
            data-target="password">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">
          Confirm Password <span class="required">*</span>
        </label>
        <div class="password-wrap">
          <input id="confirmPassword" type="password"
            minlength="6" autocomplete="new-password" required>
          <button class="toggle-password" type="button"
            data-target="confirmPassword">👁</button>
        </div>
      </div>

      <label class="terms">
        <input id="terms" type="checkbox" required>
        <span>
          I agree to the
          <a href="terms.html">Terms & Conditions</a>
          and
          <a href="privacy.html">Privacy Policy</a>.
        </span>
      </label>

      <button class="submit" id="registerButton" type="submit">
        CREATE ACCOUNT
      </button>

      <div id="message" role="status" aria-live="polite"></div>

    </form>

    <div class="login-link">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </main>

  <script type="module" src="./register.js"></script>

</body>
</html>
