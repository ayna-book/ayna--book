<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0A0F1E"
  >

  <meta
    name="description"
    content="AYNA BOOK — Create your account"
  >

  <title>AYNA BOOK — Register</title>

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icon-192.png"
  >

  <link
    rel="stylesheet"
    href="./styles.css"
  >

  <link
    rel="stylesheet"
    href="./ayna-ui-patch.css"
  >

</head>


<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="site-header">

    <div class="header-inner">

      <div class="header-left">

        <a
          href="./index.html"
          class="dashboard-icon"
          aria-label="AYNA BOOK Home"
          title="Home"
        >
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </a>

      </div>


      <div class="header-center">

        <a
          href="./index.html"
          class="brand"
          aria-label="AYNA BOOK"
        >
          AYNA BOOK
        </a>

      </div>


      <div class="header-right">

        <span
          class="glowing-star"
          aria-hidden="true"
        >
          ★
        </span>

      </div>

    </div>


    <nav
      class="main-nav"
      aria-label="Main Navigation"
    >

      <a href="./index.html">
        Home
      </a>

      <a href="./login.html">
        Login
      </a>

      <a
        href="./register.html"
        class="active"
      >
        Register
      </a>

      <a href="./profile.html">
        Profile
      </a>

      <a href="./chat.html">
        Messages
      </a>

    </nav>

  </header>


  <!-- =====================================================
       NETWORK STATUS
       ===================================================== -->

  <div
    id="network-status-badge"
    aria-live="polite"
  >
    Checking...
  </div>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="app-container">

    <section class="form-container">

      <h1>
        Create AYNA BOOK Account
      </h1>

      <p class="text-muted">
        নতুন AYNA BOOK অ্যাকাউন্ট তৈরি করুন।
      </p>


      <!-- =================================================
           MESSAGE
           ================================================= -->

      <div
        id="message"
        class="message"
        aria-live="polite"
      ></div>


      <!-- =================================================
           REGISTRATION FORM
           ================================================= -->

      <form
        id="registrationForm"
        novalidate
      >

        <!-- NAME -->

        <div class="form-group">

          <label
            for="fullname"
          >
            👤 পূর্ণ নাম
          </label>

          <input
            id="fullname"
            name="fullname"
            type="text"
            class="form-control"
            placeholder="আপনার পূর্ণ নাম লিখুন"
            maxlength="100"
            autocomplete="name"
            required
          >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

          <label
            for="email"
          >
            ✉️ Gmail / Email Address
          </label>

          <input
            id="email"
            name="email"
            type="email"
            class="form-control"
            placeholder="example@gmail.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label
            for="password"
          >
            🔐 Password
          </label>

          <div style="position:relative;">

            <input
              id="password"
              name="password"
              type="password"
              class="form-control"
              placeholder="কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড"
              minlength="6"
              autocomplete="new-password"
              required
              style="padding-right:50px;"
            >

            <button
              id="togglePassword"
              type="button"
              aria-label="Show password"
              title="Show password"
              style="
                position:absolute;
                right:10px;
                top:50%;
                transform:translateY(-50%);
                background:transparent;
                border:0;
                color:#A9B0BC;
                cursor:pointer;
                font-size:18px;
              "
            >
              👁
            </button>

          </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

          <label
            for="confirm-password"
          >
            🔐 Confirm Password
          </label>

          <div style="position:relative;">

            <input
              id="confirm-password"
              name="confirm-password"
              type="password"
              class="form-control"
              placeholder="পাসওয়ার্ড আবার লিখুন"
              minlength="6"
              autocomplete="new-password"
              required
              style="padding-right:50px;"
            >

            <button
              id="toggleConfirmPassword"
              type="button"
              aria-label="Show password"
              title="Show password"
              style="
                position:absolute;
                right:10px;
                top:50%;
                transform:translateY(-50%);
                background:transparent;
                border:0;
                color:#A9B0BC;
                cursor:pointer;
                font-size:18px;
              "
            >
              👁
            </button>

          </div>

        </div>


        <!-- TERMS -->

        <div class="form-group">

          <label
            style="
              display:flex;
              align-items:flex-start;
              gap:10px;
              cursor:pointer;
            "
          >

            <input
              id="terms"
              type="checkbox"
              required
              style="
                margin-top:4px;
              "
            >

            <span>
              আমি AYNA BOOK-এর
              নিরাপত্তা ও ব্যবহারবিধি
              মেনে চলতে সম্মত।
            </span>

          </label>

        </div>


        <!-- REGISTER BUTTON -->

        <button
          id="registerButton"
          type="submit"
          class="btn"
          style="width:100%;"
        >
          📝 Create Account
        </button>


        <!-- LOGIN -->

        <div
          class="text-center"
          style="margin-top:20px;"
        >

          <p class="text-muted">
            ইতিমধ্যে অ্যাকাউন্ট আছে?
          </p>

          <a
            href="./login.html"
            class="btn btn-secondary"
            style="
              display:inline-block;
              margin-top:10px;
            "
          >
            🔑 Login
          </a>

        </div>

      </form>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="site-footer">

    <strong>
      AYNA BOOK
    </strong>

    <br>

    Connect • Share • Create

    <br><br>

    © 2026 AYNA BOOK. All rights reserved.

  </footer>


  <!-- =====================================================
       REGISTRATION SCRIPT
       ===================================================== -->

  <script type="module">

    import {
      registerUser
    } from "./auth.js";


    const registrationForm =
      document.getElementById(
        "registrationForm"
      );

    const nameInput =
      document.getElementById(
        "fullname"
      );

    const emailInput =
      document.getElementById(
        "email"
      );

    const passwordInput =
      document.getElementById(
        "password"
      );

    const confirmPasswordInput =
      document.getElementById(
        "confirm-password"
      );

    const termsInput =
      document.getElementById(
        "terms"
      );

    const registerButton =
      document.getElementById(
        "registerButton"
      );

    const message =
      document.getElementById(
        "message"
      );


    function showMessage(
      text,
      type = "error"
    ) {

      if (!message) {
        return;
      }

      message.textContent =
        text;

      message.className =
        "message " + type;
    }


    function setLoading(
      loading
    ) {

      if (!registerButton) {
        return;
      }

      registerButton.disabled =
        loading;

      registerButton.textContent =
        loading
          ? "অ্যাকাউন্ট তৈরি হচ্ছে..."
          : "📝 Create Account";
    }


    function setupPasswordToggle(
      buttonId,
      inputId
    ) {

      const button =
        document.getElementById(
          buttonId
        );

      const input =
        document.getElementById(
          inputId
        );

      if (!button || !input) {
        return;
      }

      button.addEventListener(
        "click",
        () => {

          const isPassword =
            input.type ===
            "password";

          input.type =
            isPassword
              ? "text"
              : "password";

          button.textContent =
            isPassword
              ? "🙈"
              : "👁";

          button.setAttribute(
            "aria-label",
            isPassword
              ? "Hide password"
              : "Show password"
          );

        }
      );
    }


    setupPasswordToggle(
      "togglePassword",
      "password"
    );


    setupPasswordToggle(
      "toggleConfirmPassword",
      "confirm-password"
    );


    if (registrationForm) {

      registrationForm.addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();


          const name =
            nameInput?.value
              .trim() || "";

          const email =
            emailInput?.value
              .trim()
              .toLowerCase() || "";

          const password =
            passwordInput?.value ||
            "";

          const confirmPassword =
            confirmPasswordInput?.value ||
            "";


          if (!name) {

            showMessage(
              "আপনার পূর্ণ নাম লিখুন।",
              "error"
            );

            nameInput?.focus();

            return;
          }


          if (name.length > 100) {

            showMessage(
              "নাম সর্বোচ্চ ১০০ অক্ষরের হতে পারবে।",
              "error"
            );

            return;
          }


          if (!email) {

            showMessage(
              "আপনার ইমেইল লিখুন।",
              "error"
            );

            emailInput?.focus();

            return;
          }


          if (!emailInput.checkValidity()) {

            showMessage(
              "সঠিক ইমেইল ঠিকানা লিখুন।",
              "error"
            );

            emailInput?.focus();

            return;
          }


          if (!password) {

            showMessage(
              "আপনার পাসওয়ার্ড লিখুন।",
              "error"
            );

            passwordInput?.focus();

            return;
          }


          if (password.length < 6) {

            showMessage(
              "পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।",
              "error"
            );

            passwordInput?.focus();

            return;
          }


          if (
            password !==
            confirmPassword
          ) {

            showMessage(
              "দুটি পাসওয়ার্ড একই নয়।",
              "error"
            );

            confirmPasswordInput?.focus();

            return;
          }


          if (
            termsInput &&
            !termsInput.checked
          ) {

            showMessage(
              "অ্যাকাউন্ট তৈরি করতে শর্তে সম্মতি দিন।",
              "error"
            );

            termsInput.focus();

            return;
          }


          setLoading(true);


          showMessage(
            "আপনার AYNA BOOK অ্যাকাউন্ট তৈরি করা হচ্ছে...",
            "success"
          );


          try {

            const result =
              await registerUser(
                name,
                email,
                password
              );


            if (
              result &&
              result.success
            ) {

              if (
                result.profileSaved
              ) {

                showMessage(
                  "AYNA BOOK অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে।",
                  "success"
                );

                setTimeout(
                  () => {
                    window.location.replace(
                      "./index.html"
                    );
                  },
                  800
                );

              } else {

                showMessage(
                  "অ্যাকাউন্ট তৈরি হয়েছে, কিন্তু Profile তথ্য সংরক্ষণ করা যায়নি। আপনি Login করতে পারবেন।",
                  "error"
                );

                setTimeout(
                  () => {
                    window.location.replace(
                      "./login.html"
                    );
                  },
                  2500
                );
              }

              return;
            }


            showMessage(
              result?.message ||
              "অ্যাকাউন্ট তৈরি করা যায়নি।",
              "error"
            );


          } catch (error) {

            console.error(
              "AYNA BOOK Registration Error:",
              error
            );

            showMessage(
              error?.message ||
              "Registration-এর সময় একটি সমস্যা হয়েছে।",
              "error"
            );

          } finally {

            setLoading(false);

          }

        }
      );
    }


    console.log(
      "AYNA BOOK — register.html loaded successfully."
    );

  </script>


  <!-- =====================================================
       NETWORK MONITOR
       ===================================================== -->

  <script
    type="module"
    src="./connectivity.js"
  ></script>


  <!-- =====================================================
       UPDATE MANAGER
       ===================================================== -->

  <script
    type="module"
    src="./update.js"
  ></script>


</body>

</html>
