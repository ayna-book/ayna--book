
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>AYNA BOOK — Registration</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #101827;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #1b2638;
      border: 1px solid #34445c;
      border-radius: 18px;
      padding: 25px 20px;
      box-shadow: 0 12px 35px #0008;
    }

    .logo {
      text-align: center;
      color: #e8bd55;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    h2 {
      text-align: center;
      margin-bottom: 22px;
      font-size: 21px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      color: #e8bd55;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #52627a;
      border-radius: 9px;
      background: #101827;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #e8bd55;
    }

    input[type="file"] {
      padding: 10px;
    }

    .password-box {
      display: flex;
      gap: 7px;
    }

    .password-box input {
      flex: 1;
      min-width: 0;
    }

    .password-box button {
      padding: 0 12px;
      background: #34445c;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 18px 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .terms input {
      width: auto;
      margin-top: 3px;
    }

    .terms label {
      color: white;
      margin: 0;
    }

    #submitBtn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #e8bd55;
      color: #101827;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #submitBtn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #statusMsg {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .login-link a {
      color: #e8bd55;
      text-decoration: none;
    }

    .required {
      color: #ff7373;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">AYNA BOOK</div>
    <h2>Create Your Account</h2>

    <form id="registerForm">

      <div class="form-group">
        <label for="fullName">
          Full Name <span class="required">*</span>
        </label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          placeholder="Enter your full name"
          maxlength="100"
          autocomplete="name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">
          Email Address <span class="required">*</span>
        </label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@email.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="country">
          Country <span class="required">*</span>
        </label>
        <select id="country" name="country" required>
          <option value="">Select your country</option>
          <option value="Bangladesh">Bangladesh</option>
          <option value="India">India</option>
          <option value="Pakistan">Pakistan</option>
          <option value="Nepal">Nepal</option>
          <option value="Bhutan">Bhutan</option>
          <option value="Sri Lanka">Sri Lanka</option>
          <option value="Saudi Arabia">Saudi Arabia</option>
          <option value="United Arab Emirates">United Arab Emirates</option>
          <option value="United States">United States</option>
          <option value="United Kingdom">United Kingdom</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="Enter phone number"
          autocomplete="tel"
        >
      </div>

      <div class="form-group">
        <label for="photo">
          Profile Photo <span class="required">*</span>
        </label>
        <input
          type="file"
          id="photo"
          name="photo"
          accept="image/jpeg,image/png,image/webp"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">
          Password <span class="required">*</span>
        </label>
        <div class="password-box">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Minimum 6 characters"
            minlength="6"
            autocomplete="new-password"
            required
          >
          <button type="button" id="togglePassword">Show</button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">
          Confirm Password <span class="required">*</span>
        </label>
        <div class="password-box">
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Enter password again"
            minlength="6"
            autocomplete="new-password"
            required
          >
          <button type="button" id="toggleConfirmPassword">Show</button>
        </div>
      </div>

      <div class="terms">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">
          I agree to the AYNA BOOK Terms and Conditions and Privacy Policy.
        </label>
      </div>

      <button type="submit" id="submitBtn">
        Create Account
      </button>

      <div id="statusMsg" role="status" aria-live="polite"></div>

    </form>

    <div class="login-link">
      Already have an account?
      <a href="./login.html">Login</a>
    </div>

  </main>

  <script>
    document.getElementById("togglePassword").addEventListener("click", function () {
      const field = document.getElementById("password");
      const visible = field.type === "password";
      field.type = visible ? "text" : "password";
      this.textContent = visible ? "Hide" : "Show";
    });

    document.getElementById("toggleConfirmPassword").addEventListener("click", function () {
      const field = document.getElementById("confirmPassword");
      const visible = field.type === "password";
      field.type = visible ? "text" : "password";
      this.textContent = visible ? "Hide" : "Show";
    });
  </script>

  <script type="module" src="./register.js"></script>

</body>
</html>
