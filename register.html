<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AYNA BOOK — Create Account</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #0b0b0b;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 30px 24px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.08);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      border-radius: 50%;
      border: 2px solid #d4af37;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #d4af37;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 {
      text-align: center;
      margin: 0;
      color: #d4af37;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin: 8px 0 28px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #151515;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.12);
    }

    .required {
      color: #d4af37;
    }

    .password-note {
      margin-top: 6px;
      color: #777;
      font-size: 12px;
    }

    #registerButton {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: #d4af37;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #registerButton:hover {
      background: #e5c04b;
    }

    #registerButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #ffb4b4;
      background: rgba(180, 0, 0, 0.15);
      border: 1px solid rgba(255, 80, 80, 0.25);
    }

    .message.success {
      color: #b9f6c5;
      background: rgba(0, 150, 50, 0.12);
      border: 1px solid rgba(80, 220, 110, 0.25);
    }

    .bottom-text {
      margin-top: 22px;
      text-align: center;
      color: #999;
      font-size: 14px;
    }

    .bottom-text a {
      color: #d4af37;
      text-decoration: none;
      font-weight: bold;
    }

    .bottom-text a:hover {
      text-decoration: underline;
    }

    .security {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #222;
      text-align: center;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">AB</div>

      <h1>Create Account</h1>

      <div class="subtitle">
        Join AYNA BOOK
      </div>

      <form id="registerForm">

        <!-- DISPLAY NAME -->
        <div class="form-group">
          <label for="displayName">
            Name
          </label>

          <input
            id="displayName"
            name="displayName"
            type="text"
            autocomplete="name"
            maxlength="100"
            placeholder="Enter your name"
          >
        </div>

        <!-- EMAIL -->
        <div class="form-group">
          <label for="email">
            Email
            <span class="required">*</span>
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            placeholder="Enter your email address"
            required
          >
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label for="password">
            Password
            <span class="required">*</span>
          </label>

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="6"
            placeholder="Create a password"
            required
          >

          <div class="password-note">
            Password must contain at least 6 characters.
          </div>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="form-group">
          <label for="confirmPassword">
            Confirm Password
            <span class="required">*</span>
          </label>

          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            placeholder="Enter password again"
            required
          >
        </div>

        <button
          id="registerButton"
          type="submit"
        >
          Create Account
        </button>

      </form>

      <!-- MESSAGE -->
      <div
        id="message"
        class="message"
        role="alert"
      ></div>

      <!-- LOGIN LINK -->
      <div class="bottom-text">
        Already have an account?
        <a href="login.html">Sign In</a>
      </div>

      <div class="security">
        A verification email will be sent after registration.
      </div>

    </div>

  </div>

  <!-- REGISTER JAVASCRIPT -->
  <script
    type="module"
    src="./register.js"
  ></script>

</body>
</html>
