<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYNA BOOK - World Class Registration</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1c2541;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #3a506b;
        }
        .logo-title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #ff007f;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #8d99ae;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: #0b132b;
            border: 1px solid #48cae4;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .form-control:focus {
            border-color: #ff007f;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.3);
        }
        .password-container {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #8d99ae;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .btn-save {
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            color: white;
        }
        .btn-save:hover {
            background: linear-gradient(135deg, #3a0ca3, #4361ee);
        }
        .btn-login {
            background: linear-gradient(135deg, #2ec4b6, #25a18e);
            color: white;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #25a18e, #2ec4b6);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-title">AYNA BOOK</div>
    <form id="registrationForm" action="dashboard.php" method="POST" enctype="multipart/form-data">
        
        <!-- প্রোফাইল ছবি আপলোড -->
        <div class="form-group">
            <label><i class="fa-solid fa-camera"></i> প্রোফাইল ছবি আপলোড</label>
            <input type="file" name="profile_pic" class="form-control" accept="image/*">
        </div>

        <!-- নাম -->
        <div class="form-group">
            <label><i class="fa-solid fa-user"></i> পূর্ণ নাম</label>
            <input type="text" name="fullname" class="form-control" placeholder="আপনার নাম লিখুন" required>
        </div>

        <!-- ফোন নম্বর -->
        <div class="form-group">
            <label><i class="fa-solid fa-phone"></i> মোবাইল নম্বর</label>
            <input type="tel" name="phone" class="form-control" placeholder="০১৭xxxxxxxx" pattern="[0-1][0-9]{10}" required>
        </div>

        <!-- জিমেইল -->
        <div class="form-group">
            <label><i class="fa-solid fa-envelope"></i> জিমেইল অ্যাড্রেস</label>
            <input type="email" name="email" class="form-control" placeholder="example@gmail.com" required>
        </div>

        <!-- পাসওয়ার্ড -->
        <div class="form-group">
            <label><i class="fa-solid fa-lock"></i> পাসওয়ার্ড (কমপক্ষে ১১ সংখ্যা)</label>
            <div class="password-container">
                <input type="password" name="password" id="password" class="form-control" placeholder="১১ সংখ্যার পাসওয়ার্ড" minlength="11" required>
                <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
            </div>
        </div>

        <!-- রি-পাসওয়ার্ড -->
        <div class="form-group">
            <label><i class="fa-solid fa-lock"></i> পাসওয়ার্ড নিশ্চিত করুন (Re-type Password)</label>
            <div class="password-container">
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="পুনরায় পাসওয়ার্ড দিন" minlength="11" required>
                <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('confirm_password', this)"></i>
            </div>
        </div>

        <!-- বাটনসমূহ -->
        <div class="btn-container">
            <button type="submit" class="btn btn-save"><i class="fa-solid fa-check"></i> সেভ করুন</button>
            <button type="button" class="btn btn-login" onclick="window.location.href='login.php'"><i class="fa-solid fa-key"></i> লগইন</button>
        </div>

    </form>
</div>

<script>
    // পাসওয়ার্ড দেখানো ও লুকানোর জাভাস্ক্রিপ্ট ফাংশন
    function togglePassword(fieldId, icon) {
        const field = document.getElementById(fieldId);
        if (field.type === "password") {
            field.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            field.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }
</script>

</body>
</html>
