
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYNA BOOK - Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #050505;
      color: #fff;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .auth-container {
      width: 100%;
      max-width: 480px;
      margin: auto;
    }

    .brand {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-logo {
      width: 58px;
      height: 58px;
      border: 2px solid #d4af37;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto auto 10px;
      color: #d4af37;
      font-size: 22px;
      font-weight: bold;
    }

    .brand-name {
      color: #d4af37;
      font-size: 23px;
      letter-spacing: 4px;
      font-weight: bold;
    }

    .brand-subtitle {
      color: #777;
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 7px;
    }

    .auth-box {
      background: #101010;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 26px 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }

    .auth-title {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .auth-description {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      color: #d4af37;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      min-height: 48px;
      background: #080808;
      color: #fff;
      border: 1px solid #333;
      border-radius: 9px;
      padding: 12px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #d4af37;
    }

    .form-group input[type="file"] {
      padding: 10px;
      font-size: 12px;
    }

    .form-group input[type="file"]::file-selector-button {
      background: #d4af37;
      color: #111;
      border: none;
      border-radius: 5px;
      padding: 7px 10px;
      margin-right: 10px;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 12px;
      color: #aaa;
      margin: 18px 0;
    }

    .terms input {
      margin-top: 2px;
      accent-color: #d4af37;
    }

    .register-button {
      width: 100%;
      min-height: 52px;
      background: #d4af37;
      color: #111;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .register-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      font-size: 13px;
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    .login-link {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 20px;
    }

    .login-link a {
      color: #d4af37;
      text-decoration: none;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 10px;
      margin-top: 22px;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 14px;
      }

      .auth-box {
        padding: 22px 18px;
      }

      .brand-name {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <main class="auth-container">

    <header class="brand">
      <div class="brand-logo">AB</div>
      <div class="brand-name">AYNA BOOK</div>
      <div class="brand-subtitle">
        CONNECT · SHARE · DISCOVER
      </div>
    </header>

    <section class="auth-box">

      <h1 class="auth-title">Create Account</h1>

      <p class="auth-description">
        Join AYNA BOOK and connect with the world
      </p>

      <form id="registerForm">

        <div class="form-group">
          <label for="fullName">Full Name *</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Enter your full name"
            minlength="2"
            maxlength="100"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <label for="country">Country *</label>
          <select id="country" name="country" required>
            <option value="">Select your country</option>
            <option value="Bangladesh">Bangladesh</option>
            <option value="India">India</option>
            <option value="Pakistan">Pakistan</option>
            <option value="United States">United States</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="Saudi Arabia">Saudi Arabia</option>
            <option value="United Arab Emirates">United Arab Emirates</option>
            <option value="Canada">Canada</option>
            <option value="Australia">Australia</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter phone number"
            maxlength="30"
          >
        </div>

        <div class="form-group">
          <label for="photo">Profile Photo *</label>
          <input
            type="file"
            id="photo"
            name="photo"
            accept="image/jpeg,image/png,image/webp"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Minimum 8 characters"
            minlength="8"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password *</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm your password"
            minlength="8"
            required
          >
        </div>

        <label class="terms">
          <input type="checkbox" id="terms" required>
          <span>
            I agree to the AYNA BOOK Terms & Conditions
            and Privacy Policy.
          </span>
        </label>

        <button
          type="submit"
          id="registerButton"
          class="register-button"
        >
          CREATE ACCOUNT
        </button>

        <div id="message" class="message" role="status"></div>

      </form>

      <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </section>

    <footer class="footer">
      © 2026 AYNA BOOK. All Rights Reserved.
    </footer>

  </main>

  <script type="module" src="./register.js"></script>

</body>
</html>
