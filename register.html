
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AYNA BOOK - Create Account</title>

<meta name="theme-color" content="#101010">

<style>
/* =====================================
   AYNA BOOK REGISTER PAGE
===================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #101010;
    color: #ffffff;
    font-family: Arial, sans-serif;
    padding: 20px 15px 35px;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 40px;
}

.logo {
    color: #d4af37;
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 18px;
}

.header h2 {
    color: #d4af37;
    font-size: 30px;
    margin-bottom: 5px;
}

/* FORM */

.form-group {
    margin-bottom: 26px;
}

.form-group label {
    display: block;
    color: #e4cf86;
    font-size: 19px;
    margin-bottom: 11px;
}

.required {
    color: #d4af37;
}

.form-control {
    width: 100%;
    height: 68px;
    padding: 0 20px;
    background: #e8f0fe;
    border: 2px solid #555;
    border-radius: 12px;
    color: #111;
    font-size: 19px;
    outline: none;
}

.form-control:focus {
    border-color: #d4af37;
}

/* FILE INPUT */

.file-input {
    width: 100%;
    min-height: 74px;
    padding: 18px;
    background: #1b1b1b;
    border: 2px solid #444;
    border-radius: 12px;
    color: white;
    font-size: 17px;
}

.help-text {
    display: block;
    color: #aaa;
    font-size: 16px;
    margin-top: 7px;
}

/* PASSWORD */

.password-wrapper {
    display: flex;
    gap: 10px;
    align-items: stretch;
}

.password-wrapper .form-control {
    flex: 1;
    min-width: 0;
    background: #1b1b1b;
    color: white;
    border-color: #444;
}

.toggle-btn {
    width: 72px;
    min-width: 72px;
    background: #242018;
    border: 2px solid #b99a36;
    border-radius: 12px;
    color: white;
    font-size: 25px;
    cursor: pointer;
}

/* TERMS */

.terms {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin: 30px 0;
    color: #ddd;
    font-size: 16px;
    line-height: 1.6;
}

.terms input {
    width: 25px;
    height: 25px;
    accent-color: #d4af37;
    flex-shrink: 0;
    margin-top: 2px;
}

.terms a {
    color: #d4af37;
    text-decoration: underline;
}

/* SUBMIT */

.submit-btn {
    width: 100%;
    min-height: 72px;
    background: linear-gradient(120deg, #c7aa51, #927022);
    border: none;
    border-radius: 13px;
    color: #111;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

/* STATUS */

#statusMsg {
    display: none;
    margin-top: 20px;
    padding: 16px;
    border-radius: 10px;
    font-size: 17px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

/* LOGIN */

.login-link {
    text-align: center;
    margin-top: 30px;
    color: #aaa;
    font-size: 19px;
    padding-bottom: 20px;
}

.login-link a {
    color: #d4af37;
    font-weight: bold;
}

/* MOBILE */

@media (max-width: 480px) {

    body {
        padding: 20px 11px 25px;
    }

    .logo {
        font-size: 37px;
    }

    .header h2 {
        font-size: 27px;
    }

    .form-group {
        margin-bottom: 26px;
    }

    .form-control {
        height: 68px;
        font-size: 18px;
    }

    .file-input {
        font-size: 15px;
        padding: 17px;
    }

    .submit-btn {
        min-height: 72px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header class="header">

        <h1 class="logo">AYNA BOOK</h1>

        <h2>Create Your Account</h2>

    </header>

    <!-- REGISTER FORM -->

    <form id="registerForm">

        <!-- FULL NAME -->

        <div class="form-group">

            <label for="fullName">
                Full Name <span class="required">*</span>
            </label>

            <input
                class="form-control"
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

        </div>

        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email Address <span class="required">*</span>
            </label>

            <input
                class="form-control"
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>

        <!-- COUNTRY -->

        <div class="form-group">

            <label for="country">
                Country <span class="required">*</span>
            </label>

            <input
                class="form-control"
                type="text"
                id="country"
                name="country"
                placeholder="Enter your country"
                value="Bangladesh"
                required
            >

        </div>

        <!-- PHONE -->

        <div class="form-group">

            <label for="phone">
                Phone Number
            </label>

            <input
                class="form-control"
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter phone number"
                autocomplete="tel"
            >

        </div>

        <!-- PROFILE PHOTO -->

        <div class="form-group">

            <label for="photo">
                Profile Photo <span class="required">*</span>
            </label>

            <input
                class="file-input"
                type="file"
                id="photo"
                name="photo"
                accept="image/jpeg,image/png,image/webp"
                required
            >

            <small class="help-text">
                JPG, PNG or WEBP — Maximum 5 MB
            </small>

        </div>

        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password <span class="required">*</span>
            </label>

            <div class="password-wrapper">

                <input
                    class="form-control"
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-btn"
                    id="togglePassword"
                    aria-label="Show or hide password"
                >👁️</button>

            </div>

        </div>

        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password <span class="required">*</span>
            </label>

            <div class="password-wrapper">

                <input
                    class="form-control"
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-btn"
                    id="toggleConfirmPassword"
                    aria-label="Show or hide confirm password"
                >👁️</button>

            </div>

        </div>

        <!-- TERMS -->

        <div class="terms">

            <input
                type="checkbox"
                id="terms"
                name="terms"
                required
            >

            <label for="terms">

                I agree to the

                <a href="./terms.html" target="_blank">
                    Terms &amp; Conditions
                </a>

                and

                <a href="./privacy.html" target="_blank">
                    Privacy Policy
                </a>.

            </label>

        </div>

        <!-- SUBMIT BUTTON -->

        <button
            type="submit"
            class="submit-btn"
            id="submitBtn"
        >
            CREATE ACCOUNT
        </button>

        <!-- STATUS MESSAGE -->

        <div
            id="statusMsg"
            role="status"
            aria-live="polite"
        ></div>

    </form>

    <!-- LOGIN LINK -->

    <div class="login-link">

        Already have an account?

        <a href="./login.html">
            Login
        </a>

    </div>

</div>

<!-- FIREBASE REGISTRATION JS -->

<script type="module" src="./register.js"></script>

</body>
</html>
