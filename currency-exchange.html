<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কারেন্সি এক্সচেঞ্জ - AYNA UTILITIES</title>
    <style>
        body { background: #090a0f; color: #fff; font-family: sans-serif; padding: 20px; border: 3px solid #ffd700; min-height: 100vh; margin: 0; font-size: 18px; text-align: center; }
        .card { background: rgba(255,255,255,0.08); border: 2px solid #ffd700; border-radius: 14px; padding: 20px; margin-top: 20px; }
        select, input { padding: 12px; margin: 10px; background: #111; border: 1.5px solid #ffd700; color: #fff; border-radius: 8px; font-size: 1rem; width: 80%; }
        .rate-result { font-size: 1.3rem; color: #00ffcc; margin-top: 15px; font-weight: bold; }
        a.back { color: #ffd700; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← হোমে ফিরে যান</a>
    <div class="card">
        <h2 style="color: #ffd700;">💱 কারেন্সি এক্সচেঞ্জ রেট</h2>
        <input type="number" id="amount" value="1" placeholder="পরিমাণ লিখুন">
        <select id="currency">
            <USD to BDT>USD থেকে BDT</select>
            <EUR to BDT>EUR থেকে BDT</select>
        </select>
        <div class="rate-result" id="result">১ USD ≈ ১১৭.৫০ BDT</div>
    </div>
</body>
</html>
