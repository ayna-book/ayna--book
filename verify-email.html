
<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#0A0F1E">

  <meta
    name="description"
    content="AYNA BOOK - Verify your Gmail address."
  >

  <title>AYNA BOOK — Verify Email</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #0A0F1E;
      color: #FFFFFF;

      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 28px;

      background: #1A2233;
      border: 1px solid #303B50;
      border-radius: 16px;

      text-align: center;
    }

    h1 {
      color: #FFD700;
      margin-bottom: 8px;
      font-size: 28px;
    }

    h2 {
      margin-top: 12px;
      font-size: 21px;
    }

    p {
      color: #A9B0BC;
      line-height: 1.7;
      font-size: 14px;
    }

    .email {
      color: #FFD700;
      overflow-wrap: anywhere;
      font-weight: bold;
      margin: 20px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;

      border: none;
      border-radius: 8px;

      background: #FFD700;
      color: #0A0F1E;

      font-weight: bold;
      font-size: 15px;

      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary {
      background: #303B50;
      color: #FFFFFF;
    }

    #statusMessage {
      min-height: 48px;
      margin-top: 18px;
      padding: 10px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    #statusMessage.success {
      color: #9FF0B7;
      background: rgba(60, 170, 100, 0.12);
    }

    #statusMessage.error {
      color: #FFAAAA;
      background: rgba(210, 70, 70, 0.12);
    }

    #statusMessage.warning {
      color: #F5D76E;
      background: rgba(212, 175, 55, 0.12);
    }

    #statusMessage.info {
      color: #C9DDFF;
      background: rgba(70, 120, 180, 0.12);
    }

    @media (max-width: 480px) {
      .container {
        padding: 24px 18px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>AYNA BOOK</h1>

    <h2>Email Verification</h2>

    <p>
      আপনার Gmail ঠিকানাটি Verify করুন।
      আপনার Email Inbox-এ পাঠানো Verification
      Link খুলুন।
    </p>

    <p
      class="email"
      id="userEmail"
    >
      Checking account...
    </p>

    <button
      id="checkButton"
      type="button"
    >
      Check Verification
    </button>

    <button
      id="resendButton"
      class="secondary"
      type="button"
    >
      Resend Verification Email
    </button>

    <button
      id="logoutButton"
      class="secondary"
      type="button"
    >
      Logout
    </button>

    <p
      id="statusMessage"
      class="info"
      role="status"
      aria-live="polite"
    >
      Verification Status পরীক্ষা হচ্ছে...
    </p>

  </main>

  <script
    type="module"
    src="./verify-email.js"
  ></script>

</body>

</html>
