<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AYNA BOOK — Verify Email</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #0b0b0b;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.08);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 2px solid #d4af37;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d4af37;
      font-size: 25px;
      font-weight: bold;
    }

    .icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      color: #d4af37;
      font-size: 27px;
    }

    .subtitle {
      margin: 10px 0 24px;
      color: #aaa;
      font-size: 14px;
      line-height: 1.6;
    }

    .email-box {
      padding: 13px;
      margin-bottom: 20px;
      background: #151515;
      border: 1px solid #333;
      border-radius: 10px;
      color: #d4af37;
      font-size: 14px;
      word-break: break-word;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #checkButton {
      background: #d4af37;
      color: #000;
    }

    #resendButton {
      background: #1b1b1b;
      color: #d4af37;
      border: 1px solid #444;
    }

    #logoutButton {
      background: transparent;
      color: #aaa;
      border: 1px solid #333;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #ffb4b4;
      background: rgba(180, 0, 0, 0.15);
      border: 1px solid rgba(255, 80, 80, 0.25);
    }

    .message.success {
      color: #b9f6c5;
      background: rgba(0, 150, 50, 0.12);
      border: 1px solid rgba(80, 220, 110, 0.25);
    }

    .info {
      margin-top: 20px;
      color: #777;
      font-size: 12px;
      line-height: 1.6;
    }

    .login-link {
      display: block;
      margin-top: 20px;
      color: #d4af37;
      text-decoration: none;
      font-size: 14px;
    }

    .login-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">
        AB
      </div>

      <div class="icon">
        ✉
      </div>

      <h1>Verify Your Email</h1>

      <div class="subtitle">
        We sent a verification link to your email address.
        Please open your email and click the verification link.
      </div>

      <!-- DEFAULT / EXPECTED EMAIL -->
      <div
        id="emailBox"
        class="email-box"
      >
        aynabookofficeal@gmail.com
      </div>

      <button
        id="checkButton"
        type="button"
      >
        I've Verified My Email
      </button>

      <button
        id="resendButton"
        type="button"
      >
        Resend Verification Email
      </button>

      <button
        id="logoutButton"
        type="button"
      >
        Sign Out
      </button>

      <div
        id="message"
        class="message"
        role="alert"
      ></div>

      <div class="info">
        Didn't receive the email?
        Check your Spam/Junk folder and make sure
        the email address is correct.
      </div>

      <a
        href="login.html"
        class="login-link"
      >
        Back to Sign In
      </a>

    </div>

  </div>

  <script
    type="module"
    src="./verify-email.js"
  ></script>

</body>
</html>
