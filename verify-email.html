
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0f">
  <title>AYNA BOOK — Verify Email</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090a0f;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 30px;
      background: #101116;
      border: 1px solid #b99a45;
      border-radius: 15px;
      text-align: center;
    }

    h1 {
      color: #e3c46d;
      letter-spacing: 3px;
    }

    .description {
      color: #ccc;
      line-height: 1.7;
    }

    .email {
      color: #e3c46d;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 1px solid #d6b65c;
      border-radius: 7px;
      background: #b8953e;
      color: #090a0f;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      color: #e3c46d;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #statusMessage {
      min-height: 45px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>✦ AYNA BOOK</h1>

    <h2>Verify Your Gmail</h2>

    <p class="description">
      A verification email has been sent to:
    </p>

    <p id="emailAddress" class="email">
      Loading account...
    </p>

    <p class="description">
      Open your Gmail inbox, click the verification link,
      then return here and confirm your email.
    </p>

    <button id="checkButton" type="button">
      I HAVE VERIFIED MY EMAIL
    </button>

    <button id="resendButton" class="secondary" type="button">
      RESEND VERIFICATION EMAIL
    </button>

    <p id="statusMessage" role="status" aria-live="polite"></p>

    <button id="loginButton" class="secondary" type="button">
      GO TO LOGIN
    </button>

  </main>

  <script type="module" src="./verify-email.js"></script>
</body>
</html>
