<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#090a0f"
  >

  <title>AYNA BOOK — Verify Email</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #090a0f;
      color: #ffffff;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      border: 1px solid #c9a227;
      border-radius: 18px;
      padding: 30px 24px;
      text-align: center;
      background: #101116;
      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.45);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border: 1px solid #c9a227;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d8b33d;
      font-size: 28px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 12px;
      color: #d8b33d;
      font-size: 26px;
    }

    p {
      line-height: 1.6;
      color: #d0d0d0;
    }

    .email {
      margin: 16px 0;
      padding: 12px;
      border: 1px solid #5d501e;
      border-radius: 10px;
      word-break: break-word;
      color: #ffffff;
    }

    button {
      width: 100%;
      border: 1px solid #c9a227;
      border-radius: 10px;
      padding: 13px;
      margin-top: 10px;
      background: #c9a227;
      color: #090a0f;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      color: #d8b33d;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      min-height: 24px;
      margin-top: 16px;
      color: #d8b33d;
    }

    .hidden {
      display: none;
    }

  </style>

</head>

<body>

  <main class="card">

    <div class="logo">
      AB
    </div>

    <h1>
      Gmail Verification
    </h1>

    <p>
      আপনার AYNA BOOK অ্যাকাউন্ট সক্রিয় করতে
      Gmail verification সম্পন্ন করুন।
    </p>

    <div
      id="email"
      class="email"
    >
      যাচাই করা হচ্ছে...
    </div>

    <button
      id="checkButton"
      type="button"
    >
      আমি Email Verify করেছি
    </button>

    <button
      id="resendButton"
      class="secondary"
      type="button"
    >
      Verification Email আবার পাঠান
    </button>

    <button
      id="logoutButton"
      class="secondary"
      type="button"
    >
      Logout
    </button>

    <div id="status"></div>

  </main>

  <script
    type="module"
    src="./verify-email.js"
  ></script>

</body>

</html>
