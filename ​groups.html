<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYNA BOOK &amp; AYNA MESSENGER Groups</title>
<style>
  :root {
    --bg:#050a18;
    --navy-top:#1a3575;
    --navy-bottom:#08122b;
    --gold:#ffe64d;
    --gold-bright:#fff6b3;
    --gold-base:#8a6105;
    --cyan:#38f2ff;
    --white:#ffffff;
    --muted:#e6eeff;
  }

  * { box-sizing:border-box; }

  body {
    margin:0;
    background:var(--bg);
    color:var(--white);
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    font-size:34px;
    line-height:1.5;
    padding-bottom:130px;
  }

  .wrap { max-width:1360px; margin:auto; padding:20px; }

  .box {
    background:linear-gradient(155deg,var(--navy-top),var(--navy-bottom));
    border:4px solid var(--gold);
    border-radius:10px;
    padding:24px;
    margin-bottom:24px;
    box-shadow:0 0 18px rgba(255,230,77,.6), 0 8px 0 var(--gold-base);
  }

  h1, h2 {
    margin:0 0 14px;
    color:var(--gold-bright);
    font-weight:1000;
  }

  h1 { font-size:46px; }
  h2 { font-size:38px; }

  .top-nav {
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:14px;
  }

  .nav-link {
    text-decoration:none;
    color:var(--gold-bright);
    background:#060e24;
    border:3px solid var(--gold);
    border-radius:8px;
    padding:10px 18px;
    font-size:28px;
    font-weight:bold;
  }

  input, select, textarea, button {
    font:inherit;
    border-radius:8px;
    border:3px solid var(--gold);
  }

  input, select, textarea {
    width:100%;
    background:#050b1c;
    color:var(--white);
    padding:16px 18px;
    font-size:32px;
    margin-top:12px;
    outline:none;
  }

  textarea { min-height:140px; resize:vertical; }

  .btn-gold {
    width:100%;
    margin-top:16px;
    padding:16px 20px;
    background:linear-gradient(180deg,#ffe64d 0%,#c99314 100%);
    color:#050a18;
    font-size:34px;
    font-weight:1000;
    border-color:var(--gold-bright);
    box-shadow:0 6px 0 #664604;
    cursor:pointer;
  }

  .btn-navy {
    padding:12px 18px;
    background:linear-gradient(155deg,#1d3b7e,#08122b);
    color:var(--white);
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
  }

  .filter-row {
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }

  .group-card {
    background:#060e24;
    border:3px solid var(--gold);
    border-radius:10px;
    padding:20px;
    margin-bottom:18px;
  }

  .group-badge {
    display:inline-block;
    background:rgba(56,242,255,.12);
    color:var(--cyan);
    border:2px solid var(--cyan);
    border-radius:6px;
    padding:4px 12px;
    font-size:24px;
    font-weight:bold;
    margin-bottom:8px;
  }

  .group-title {
    font-size:36px;
    font-weight:1000;
    color:var(--gold-bright);
  }

  .msg-list {
    margin-top:14px;
    padding-top:12px;
    border-top:2px solid rgba(255,230,77,.45);
  }

  .msg-item {
    background:#0a1738;
    border:2px solid rgba(255,230,77,.7);
    border-radius:8px;
    padding:12px 16px;
    margin-top:10px;
    font-size:30px;
    overflow-wrap:anywhere;
  }

  .msg-meta {
    font-size:22px;
    color:var(--muted);
    margin-top:4px;
  }

  #statusBanner {
    display:none;
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:200;
    background:#0a1636;
    color:var(--gold-bright);
    border:3.5px solid var(--gold-bright);
    border-radius:8px;
    padding:14px 24px;
    font-size:30px;
    font-weight:bold;
    max-width:92%;
    text-align:center;
  }
</style>
</head>
<body>
<div id="statusBanner"></div>

<div class="wrap">
  <div class="box">
    <h1>👥 AYNA BOOK &amp; AYNA MESSENGER GROUPS</h1>
    <div style="font-size:28px;color:var(--muted);">
      নতুন গ্রুপ তৈরি করুন, AYNA BOOK গ্রুপ ও AYNA MESSENGER গ্রুপ আলাদা দেখুন এবং সরাসরি গ্রুপ বার্তা পাঠান।
    </div>
    <div class="top-nav">
      <a href="index.html" class="nav-link">🏠 Home</a>
      <a href="messenger.html" class="nav-link">💬 Messenger</a>
      <a href="profile.html" class="nav-link">👤 Profile</a>
    </div>
  </div>

  <!-- নতুন গ্রুপ তৈরি -->
  <div class="box">
    <h2>➕ নতুন গ্রুপ তৈরি করুন</h2>
    <select id="groupPlatformSelect">
      <option value="AYNA BOOK">AYNA BOOK গ্রুপ</option>
      <option value="AYNA MESSENGER">AYNA MESSENGER গ্রুপ</option>
    </select>
    <input type="text" id="newGroupNameInput" placeholder="গ্রুপের নাম লিখুন...">
    <button type="button" id="createGroupBtn" class="btn-gold">✅ গ্রুপ তৈরি করুন</button>
  </div>

  <!-- গ্রুপে বার্তা বা ঘোষণা পাঠান -->
  <div class="box">
    <h2>✉️ নির্বাচিত গ্রুপে বার্তা পাঠান</h2>
    <select id="targetGroupSelect"></select>
    <textarea id="groupMessageInput" placeholder="গ্রুপে বার্তা বা ঘোষণা লিখুন..."></textarea>
    <button type="button" id="sendGroupMsgBtn" class="btn-gold">🚀 গ্রুপে বার্তা পাঠান</button>
  </div>

  <!-- গ্রুপ তালিকা ও বার্তাসমূহ -->
  <div class="box">
    <h2>📋 সক্রিয় গ্রুপসমূহ</h2>
    <div class="filter-row">
      <button type="button" class="btn-navy group-filter-btn" data-platform="all">সব গ্রুপ</button>
      <button type="button" class="btn-navy group-filter-btn" data-platform="AYNA BOOK">AYNA BOOK গ্রুপ</button>
      <button type="button" class="btn-navy group-filter-btn" data-platform="AYNA MESSENGER">AYNA MESSENGER গ্রুপ</button>
    </div>
    <div id="groupsContainer"></div>
  </div>
</div>

<script type="module">
import { AynaGroups } from "./ayna-quantum-engine.js";

const MSG_KEY = "ayna_group_messages_v1";
let currentPlatformFilter = "all";

function showStatus(text) {
  const el = document.getElementById("statusBanner");
  el.textContent = text;
  el.style.display = "block";
  clearTimeout(showStatus.timer);
  showStatus.timer = setTimeout(() => {
    el.style.display = "none";
  }, 3000);
}

function getAllGroupMessages() {
  try {
    return JSON.parse(localStorage.getItem(MSG_KEY) || "{}");
  } catch {
    return {};
  }
}

function saveAllGroupMessages(map) {
  localStorage.setItem(MSG_KEY, JSON.stringify(map));
}

function populateGroupSelect(groups) {
  const select = document.getElementById("targetGroupSelect");
  if (!select) return;
  const prev = select.value;
  select.innerHTML = groups
    .map(g => `<option value="${g.id}">[${g.platform}] ${g.name}</option>`)
    .join("");
  if (prev && groups.some(g => g.id === prev)) {
    select.value = prev;
  }
}

function renderGroups() {
  const allGroups = AynaGroups.getGroups();
  populateGroupSelect(allGroups);

  const msgMap = getAllGroupMessages();
  const visible = currentPlatformFilter === "all"
    ? allGroups
    : allGroups.filter(g => g.platform === currentPlatformFilter);

  const container = document.getElementById("groupsContainer");
  if (!visible.length) {
    container.innerHTML = '<div style="font-size:30px;color:#e6eeff;">এই ক্যাটাগরিতে কোনো গ্রুপ নেই।</div>';
    return;
  }

  container.innerHTML = visible.map(g => {
    const msgs = Array.isArray(msgMap[g.id]) ? msgMap[g.id] : [];
    const msgsHtml = msgs.length
      ? msgs.map(m => `
          <div class="msg-item">
            <div>${m.text}</div>
            <div class="msg-meta">${m.sender} • ${new Date(m.time).toLocaleString("bn-BD")}</div>
          </div>
        `).join("")
      : '<div class="msg-meta" style="margin-top:10px;">এখনও কোনো গ্রুপ বার্তা নেই।</div>';

    return `
      <div class="group-card">
        <span class="group-badge">${g.platform}</span>
        <div class="group-title">${g.name}</div>
        <div class="msg-list">${msgsHtml}</div>
      </div>
    `;
  }).join("");
}

document.getElementById("createGroupBtn").addEventListener("click", () => {
  const platform = document.getElementById("groupPlatformSelect").value;
  const nameInput = document.getElementById("newGroupNameInput");
  const name = nameInput.value.trim();
  if (!name) {
    showStatus("গ্রুপের নাম লিখুন");
    return;
  }
  const created = AynaGroups.createGroup(platform, name);
  if (created) {
    nameInput.value = "";
    renderGroups();
    showStatus(`"${created.name}" (${created.platform}) তৈরি হয়েছে`);
  }
});

document.getElementById("sendGroupMsgBtn").addEventListener("click", () => {
  const groupId = document.getElementById("targetGroupSelect").value;
  const msgInput = document.getElementById("groupMessageInput");
  const text = msgInput.value.trim();
  if (!groupId || !text) {
    showStatus("গ্রুপ নির্বাচন করে বার্তা লিখুন");
    return;
  }

  const map = getAllGroupMessages();
  if (!Array.isArray(map[groupId])) map[groupId] = [];
  map[groupId].unshift({
    text,
    sender: "AYNA Member",
    time: Date.now()
  });
  saveAllGroupMessages(map);
  msgInput.value = "";
  renderGroups();
  showStatus("গ্রুপে বার্তা পাঠানো হয়েছে");
});

document.querySelectorAll(".group-filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentPlatformFilter = btn.getAttribute("data-platform") || "all";
    renderGroups();
  });
});

renderGroups();
</script>
</body>
</html>
