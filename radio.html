
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>AYNA BOOK — Radio Live</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #b89535;
    }

    header h1 {
      color: #d4af37;
      margin: 0;
    }

    .container {
      width: 92%;
      max-width: 600px;
      margin: 30px auto;
    }

    .player {
      padding: 25px;
      background: #171717;
      border: 1px solid #b89535;
      border-radius: 18px;
      text-align: center;
    }

    .radio-icon {
      font-size: 75px;
      margin: 20px;
    }

    h2 { color: #d4af37; }

    select {
      width: 100%;
      padding: 15px;
      background: #222;
      color: white;
      border: 1px solid #d4af37;
      border-radius: 10px;
      margin: 15px 0;
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 30px;
      background: #d4af37;
      color: black;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    audio {
      width: 100%;
      margin-top: 20px;
    }

    #status {
      color: #d4af37;
      min-height: 24px;
    }
  </style>
</head>

<body>

<header>
  <h1>AYNA BOOK</h1>
  <p>GLOBAL RADIO LIVE</p>
</header>

<main class="container">

  <section class="player">

    <div class="radio-icon">📻</div>

    <h2 id="stationName">AYNA Radio</h2>

    <p>Select Your Radio Station</p>

    <select id="stationSelect">
      <option value="">Select Station</option>
    </select>

    <div>
      <button id="playButton">▶ PLAY</button>
      <button id="stopButton">■ STOP</button>
    </div>

    <p id="status">Ready to play</p>

    <audio id="radioPlayer" controls
      preload="none"></audio>

  </section>

</main>

<script type="module" src="./radio.js"></script>

</body>
</html>
