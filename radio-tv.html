
<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AYNA Radio TV</title>
<style>
body{margin:0;padding:18px;background:#071b49;color:white;font-family:Arial}main{max-width:750px;margin:auto}h1,h2{color:#ffd700}.card{padding:15px;margin:12px 0;border:1px solid #ffd700;border-radius:13px;background:#142d5d}a{color:#ffd700}input,button{padding:13px;border:0;border-radius:8px;margin:5px}button{background:#ffd700;font-weight:bold}iframe{width:100%;height:230px;border:0;border-radius:12px}
</style></head><body><main>
<h1>📻 AYNA RADIO & TV</h1><p>বাংলাদেশ ও বিশ্বের রেডিও-টিভি</p>
<div class="card"><h2>লাইভ প্লেয়ার</h2><video id="player" controls playsinline style="width:100%;max-height:250px"></video><p id="msg">অনুমোদিত MP4/HLS স্ট্রিম URL যোগ করুন।</p>
<input id="url" type="url" placeholder="স্ট্রিম URL লিখুন"><button id="play">চালু করুন</button></div>
<div class="card"><h2>চ্যানেলের অফিসিয়াল ওয়েবসাইট</h2>
<ul>
<li><a href="https://www.btv.gov.bd/" target="_blank" rel="noopener">বাংলাদেশ টেলিভিশন (BTV)</a></li>
<li><a href="https://www.betar.gov.bd/" target="_blank" rel="noopener">বাংলাদেশ বেতার</a></li>
<li><a href="https://www.bbc.com/bengali" target="_blank" rel="noopener">BBC বাংলা</a></li>
<li><a href="https://www.dw.com/bn" target="_blank" rel="noopener">DW বাংলা</a></li>
<li><a href="https://www.aljazeera.com/" target="_blank" rel="noopener">Al Jazeera</a></li>
</ul></div>
<p><a href="index.html" style="color:#ffd700">← AYNA BOOK হোম</a></p>
</main><script>
play.onclick=()=>{let u=url.value.trim();if(!/^https:\/\//i.test(u)){msg.textContent="নিরাপদ HTTPS স্ট্রিম URL দিন।";return}player.src=u;player.play().then(()=>msg.textContent="প্লে হচ্ছে").catch(()=>msg.textContent="এই লিংকটি সরাসরি প্লে নাও হতে পারে; চ্যানেলের ওয়েবসাইট ব্যবহার করুন।")};
</script></body></html>
