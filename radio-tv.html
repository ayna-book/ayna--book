<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYNA BOOK - Global Live TV & Radio Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #030712;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .square-box {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #0b132b;
            border: 2px solid #1e293b;
            border-radius: 1rem;
            padding: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="min-h-screen p-6">

    <div class="max-w-4xl mx-auto text-center mb-8">
        <h1 class="text-3xl font-extrabold text-sky-400">📺 AYNA BOOK — লাইভ টেলিভিশন ও মিডিয়া নেটওয়ার্ক</h1>
        <p class="text-slate-400 text-sm mt-1">বিশ্বের সমস্ত নিউজ, বিনোদন ও শিক্ষা চ্যানেল সরাসরি সম্প্রচার</p>
    </div>

    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- টেলিভিশন প্লেয়ার বক্স (1:1 Aspect Ratio) -->
        <div class="square-box">
            <h3 class="text-lg font-bold text-sky-400 border-b border-slate-700 pb-2">🔴 লাইভ টিভি স্ট্রিম প্লেয়ার</h3>
            <div class="flex-grow flex flex-col justify-center items-center bg-slate-950 rounded border border-slate-800 p-2 my-2">
                <select id="tv-channel-select" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white mb-3">
                    <option value="btv">বাংলাদেশ টেলিভিশন (BTV National)</option>
                    <option value="ekattor">একাত্তর টিভি (Ekattor TV News)</option>
                    <option value="cnn">CNN International News (USA)</option>
                    <option value="nasa">NASA Live Space TV</option>
                </select>
                <div id="tv-screen" class="w-full h-32 bg-slate-900 rounded flex items-center justify-center text-xs text-emerald-400 font-mono">
                    সরাসরি সম্প্রচার লোড হচ্ছে...
                </div>
            </div>
            <button id="btn-play-tv" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-2 rounded text-sm transition">▶️ টিভি চালু করুন</button>
        </div>

        <!-- রেডিও ও অডিও স্ট্রিম বক্স (1:1 Aspect Ratio) -->
        <div class="square-box">
            <h3 class="text-lg font-bold text-sky-400 border-b border-slate-700 pb-2">📻 লাইভ রেডিও স্ট্রিম</h3>
            <div class="flex-grow flex flex-col justify-center items-center bg-slate-950 rounded border border-slate-800 p-2 my-2">
                <select id="radio-channel-select" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white mb-3">
                    <option value="betar">বাংলাদেশ বেতার (Bangladesh Betar)</option>
                    <option value="foorti">রেডিও ফুর্তি (Radio Foorti 89.6 FM)</option>
                    <option value="bbc">BBC World Service Radio</option>
                </select>
                <div id="radio-screen" class="w-full h-32 bg-slate-900 rounded flex items-center justify-center text-xs text-purple-300 font-mono">
                    ফ্রিকোয়েন্সি: 89.6 MHz FM (Ready)
                </div>
            </div>
            <button id="btn-play-radio" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded text-sm transition">▶️ রেডিও শুনুন</button>
        </div>

    </div>

    <script>
        document.getElementById('btn-play-tv')?.addEventListener('click', () => {
            const channel = document.getElementById('tv-channel-select').value;
            document.getElementById('tv-screen').innerText = `স্ট্রিমিং চলছে: ${channel.toUpperCase()}`;
            alert("সরাসরি টেলিভিশন সম্প্রচার শুরু হয়েছে!");
        });

        document.getElementById('btn-play-radio')?.addEventListener('click', () => {
            const channel = document.getElementById('radio-channel-select').value;
            document.getElementById('radio-screen').innerText = `রেডিও প্লে হচ্ছে: ${channel.toUpperCase()}`;
            alert("রেডিও লাইভ অডিও স্ট্রিম চালু হয়েছে!");
        });
    </script>
</body>
</html>
