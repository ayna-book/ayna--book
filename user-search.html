
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AYNA BOOK - User Search</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #080808;
      color: #d4af37;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    h2 { text-align: center; }

    input, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #d4af37;
      border-radius: 8px;
      background: #171717;
      color: white;
    }

    button {
      background: #d4af37;
      color: #080808;
      font-weight: bold;
      cursor: pointer;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      margin-top: 12px;
      background: #171717;
      border: 1px solid #555;
      border-radius: 10px;
    }

    .user-card img {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      background: #333;
    }

    .user-info { flex: 1; }

    .user-info p { margin: 5px 0; }

    .user-info a {
      color: #d4af37;
    }

    #message {
      text-align: center;
      color: white;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>🔎 AYNA BOOK USER SEARCH</h2>

    <input
      id="searchInput"
      type="search"
      placeholder="নাম অথবা AYNA ID লিখুন"
    >

    <button id="searchButton">SEARCH</button>

    <p id="message"></p>

    <div id="searchResults"></div>
  </div>

  <script type="module" src="./user-search.js"></script>
</body>
</html>
