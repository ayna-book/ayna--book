name: AYNA BOOK - 2 CRORE WORLD RECORD

on:
  workflow_dispatch:

jobs:
  generate-2crore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: GENERATE 2 CRORE LINES - WORLD RECORD
        run: node generator-2crore.js
        
      - name: COMMIT 2 CRORE TO GITHUB - MOHAMMAD MAHABUB ALAM
        run: |
          git config user.name "ayna-book"
          git config user.email "ayna-book@github.com"
          git add .
          git commit -m "WORLD RECORD - 2 CRORE = 20000000 LINES DONE - 200 MODULES - AYNA BOOK - MOHAMMAD MAHABUB ALAM" || echo "No changes"
          git push