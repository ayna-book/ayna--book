<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYNA BOOK — Moderation Review Trigger</title>
<style>
  :root {
    --bg: #050a18;
    --navy-top: #1a3575;
    --navy-bottom: #08122b;
    --gold: #ffe64d;
    --gold-bright: #fff6b3;
    --gold-base: #8a6105;
    --cyan: #38f2ff;
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--white);
    font-family: Arial, "Noto Sans Bengali", sans-serif;
    font-size: 28px;
    line-height: 1.45;
    padding: 24px;
  }

  .container {
    max-width: 920px;
    margin: 0 auto;
  }

  .panel {
    background: linear-gradient(155deg, var(--navy-top), var(--navy-bottom));
    border: 4px solid var(--gold);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 0 18px rgba(255, 230, 77, 0.45), 0 8px 0 var(--gold-base);
  }

  h1 {
    margin: 0 0 12px;
    color: var(--gold-bright);
    font-size: 40px;
    font-weight: 900;
  }

  .auth-note {
    color: var(--cyan);
    font-size: 20px;
    margin-bottom: 14px;
    word-break: break-word;
  }

  label {
    display: block;
    margin-top: 16px;
    margin-bottom: 6px;
    color: var(--gold-bright);
    font-size: 24px;
    font-weight: 700;
  }

  input, select {
    width: 100%;
    background: #050b1c;
    color: var(--white);
    border: 3px solid var(--gold);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 24px;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
    font-size: 22px;
  }

  .checkbox-row input[type="checkbox"] {
    width: 28px;
    height: 28px;
  }

  button {
    margin-top: 22px;
    width: 100%;
    padding: 16px 22px;
    background: linear-gradient(180deg, #ffe64d 0%, #c99314 100%);
    color: var(--bg);
    border: 3px solid var(--gold-bright);
    border-radius: 10px;
    font-size: 26px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 5px 0 #664604;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .status-box {
    margin-top: 20px;
    background: #060e24;
    border: 3px solid var(--cyan);
    border-radius: 10px;
    padding: 16px;
    font-size: 22px;
    color: var(--gold-bright);
    word-break: break-word;
  }
</style>
</head>
<body>
<div class="container">
  <div class="panel">
    <h1>🛡️ AYNA BOOK — Review Post Report</h1>
    <div id="adminAuthStatus" class="auth-note">Checking sign-in and admin permissions...</div>

    <label for="apiBaseInput">Backend API Base URL (optional if same origin)</label>
    <input id="apiBaseInput" type="text" placeholder="http://localhost:3000">

    <label for="postIdInput">Post ID</label>
    <input id="postIdInput" type="text" placeholder="-Oabc123">

    <label for="reportIdInput">Report ID</label>
    <input id="reportIdInput" type="text" placeholder="-Orep456">

    <label for="decisionSelect">Moderation Decision</label>
    <select id="decisionSelect">
      <option value="warned">warned</option>
      <option value="dismissed">dismissed</option>
      <option value="removed">removed</option>
    </select>

    <label for="noteInput">Moderator Note</label>
    <input id="noteInput" type="text" placeholder="Optional review note">

    <label class="checkbox-row">
      <input id="notifyReporterCheckbox" type="checkbox">
      <span>Notify reporter via FCM</span>
    </label>

    <button id="reviewSubmitBtn" type="button" disabled>🚀 Submit Moderation Review</button>

    <div id="reviewStatusBox" class="status-box">Waiting for admin verification...</div>
  </div>
</div>

<script type="module">
import {
  isCurrentUserAdmin,
  resolveAynaFirebase,
  submitModerationReview
} from "./ayna-report-review-client.js";

const submitBtn = document.getElementById("reviewSubmitBtn");
const statusBox = document.getElementById("reviewStatusBox");
const adminAuthStatus = document.getElementById("adminAuthStatus");

let isAdminVerified = false;

async function syncAdminButtonState() {
  try {
    const { auth, authMod } = await resolveAynaFirebase();

    const applyState = async user => {
      if (!user) {
        isAdminVerified = false;
        submitBtn.disabled = true;
        adminAuthStatus.textContent = "Not signed in • Review button disabled";
        statusBox.textContent = "Sign in with an admin account to enable moderation review.";
        return;
      }

      adminAuthStatus.textContent = `Signed in as ${user.email || user.uid} • Verifying admin role...`;
      isAdminVerified = await isCurrentUserAdmin();

      if (!isAdminVerified) {
        submitBtn.disabled = true;
        adminAuthStatus.textContent = `Signed in as ${user.email || user.uid} • Non-Admin`;
        statusBox.textContent = "Review submit button disabled: account is not listed under admins/$uid.";
        return;
      }

      submitBtn.disabled = false;
      adminAuthStatus.textContent = `Signed in as ${user.email || user.uid} • Verified Admin`;
      statusBox.textContent = "Admin verified. Ready to submit review.";
    };

    await applyState(auth?.currentUser || null);
    authMod.onAuthStateChanged(auth, applyState);
  } catch (err) {
    isAdminVerified = false;
    submitBtn.disabled = true;
    adminAuthStatus.textContent = "Auth check unavailable";
    statusBox.textContent = err?.message || "Unable to verify admin status.";
  }
}

submitBtn.addEventListener("click", async () => {
  if (!isAdminVerified) {
    submitBtn.disabled = true;
    statusBox.textContent = "Action blocked: only verified admins can submit reviews.";
    return;
  }

  submitBtn.disabled = true;
  statusBox.textContent = "Fetching Firebase ID token and submitting review...";

  try {
    const result = await submitModerationReview({
      apiBaseUrl: document.getElementById("apiBaseInput").value,
      postId: document.getElementById("postIdInput").value,
      reportId: document.getElementById("reportIdInput").value,
      decision: document.getElementById("decisionSelect").value,
      note: document.getElementById("noteInput").value,
      notifyReporter: document.getElementById("notifyReporterCheckbox").checked
    });

    statusBox.textContent = `Reviewed (${result.decision}) • Post: ${result.postId} • Author FCM sent: ${result.notifications?.author?.sentCount ?? 0}`;
  } catch (err) {
    statusBox.textContent = `Error: ${err?.message || "Unable to review report"}`;
  } finally {
    submitBtn.disabled = !isAdminVerified;
  }
});

syncAdminButtonState();
</script>
</body>
</html>
