<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>V42 • AYNA BOOK • SUPER ULTRA</title>
<link rel="icon" href="icon.png">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020210;color:#fff;font-family:'Segoe UI',Hind Siliguri,sans-serif;min-height:100vh}
.bg{position:fixed;inset:0;z-index:-1;background:
radial-gradient(800px at 10% 20%,rgba(0,245,255,0.18),transparent),
radial-gradient(600px at 90% 80%,rgba(122,0,255,0.25),transparent),
radial-gradient(500px at 50% 50%,rgba(255,0,170,0.12),transparent)}
.header{position:sticky;top:0;z-index:100;background:rgba(2,2,16,0.8);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,245,255,0.15);padding:12px 16px;display:flex;align-items:center;gap:12px}
.back{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);display:grid;place-items:center;text-decoration:none;color:#fff;font-size:20px}
.search-wrap{flex:1;position:relative}
.search-wrap input{width:100%;padding:12px 16px 12px 40px;border-radius:50px;background:rgba(255,255,255,0.07);border:1px solid rgba(0,245,255,0.25);color:#fff;outline:none}
.search-wrap input:focus{border-color:#00f5ff;box-shadow:0 0 20px rgba(0,245,255,0.3)}
.search-wrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:0.5}
.container{max-width:800px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,rgba(0,245,255,0.15),rgba(122,0,255,0.15));border:1px solid rgba(0,245,255,0.3);border-radius:28px;padding:24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.4);margin-top:10px}
.hero h1{font-size:28px;background:linear-gradient(90deg,#00f5ff,#ff00aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{opacity:0.7;font-size:13px;margin-top:6px;letter-spacing:1px}
.stats{display:flex;gap:8px;margin-top:16px}
.stat{flex:1;background:rgba(0,0,0,0.3);border-radius:14px;padding:10px;border:1px solid rgba(255,255,255,0.08)}
.stat b{color:#00f5ff;font-size:16px}
.stat i{font-style:normal;font-size:10px;opacity:0.6;display:block;text-transform:uppercase}
.tools{display:flex;gap:8px;margin:16px 0}
.tool{flex:1;padding:10px;border-radius:50px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:#fff;font-size:13px;text-align:center;cursor:pointer}
.tool.active{background:#00f5ff;color:#000;border-color:#00f5ff;font-weight:700}
.book-list{display:grid;gap:10px;margin-top:10px}
.book{background:linear-gradient(135deg,rgba(255,255,255,0.07),rgba(255,255,255,0.03));backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;transition:0.2s;cursor:pointer}
.book:hover{transform:translateY(-2px);border-color:rgba(0,245,255,0.4);box-shadow:0 10px 30px rgba(0,245,255,0.15)}
.num{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#00f5ff,#7000ff);display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0}
.info{flex:1;text-align:left}
.info b{display:block;font-size:15px}
.info span{font-size:11px;opacity:0.6}
